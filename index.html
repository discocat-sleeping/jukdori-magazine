<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해외축구 팬 매거진</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 읽는 칼럼 하나 위에 탭 띠가 붙어 있다. 탭 하나가 커뮤니티 하나의 보고다. 틀은 원본의 축구 시험 보고에서 왔다 */
:root {
  --bg: #f5f7f3;
  --paper: #ffffff;
  --ink: #1c231e;
  --muted: #5c675f;
  --rule: #dde3dc;
  --accent: #2c6b3f;
  --accent-soft: #e1eee4;
  --quote: #eff2ee;
  --warn: #9a5b12;
  --warn-soft: #f6ecdc;
  --f-display: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Gowun Batang", "AppleMyungjo", "Batang", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131815; --paper: #1a201c; --ink: #e3e9e4; --muted: #98a59c; --rule: #2d3630;
    --accent: #7cc893; --accent-soft: #1f3325; --quote: #212923; --warn: #e0a85a; --warn-soft: #33291b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131815; --paper: #1a201c; --ink: #e3e9e4; --muted: #98a59c; --rule: #2d3630;
  --accent: #7cc893; --accent-soft: #1f3325; --quote: #212923; --warn: #e0a85a; --warn-soft: #33291b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.8; margin: 0; }
.wrap { max-width: 46rem; margin: 0 auto; padding-inline: 16px; }
header.top { padding-block: 2.2rem 1.2rem; }
.eyebrow { font-family: var(--f-mono); font-size: 0.75rem; letter-spacing: 0.08em; color: var(--muted); }
h1.name { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.7rem, 4.5vw, 2.3rem); line-height: 1.25; margin: 0.3rem 0 0.4rem; text-wrap: balance; }
.lede { color: var(--muted); font-size: 0.98rem; margin: 0; }
.dates { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; margin-top: 0.9rem; }
.dates select, .dates button { font-family: var(--f-mono); font-size: 0.8rem; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 0.25rem 0.55rem; }
.dates button { cursor: pointer; }
.dates button:disabled { opacity: 0.4; cursor: default; }
nav.tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--rule); }
nav.tabs .wrap { position: relative; display: flex; gap: 0.25rem; overflow-x: auto; padding-block: 0.5rem; scrollbar-width: thin; }
nav.tabs button {
  font-family: var(--f-display); font-size: 0.9rem; font-weight: 600; white-space: nowrap;
  border: 1px solid transparent; background: none; color: var(--muted); padding: 0.4rem 0.75rem; border-radius: 999px; cursor: pointer;
  display: inline-flex; align-items: baseline; gap: 0.4rem;
}
nav.tabs button .where { font-family: var(--f-mono); font-size: 0.7rem; font-weight: 400; }
nav.tabs button[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-soft); }
nav.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { padding-block: 1.5rem 4rem; }
article { min-width: 0; }
article h1 { font-family: var(--f-display); font-size: 1.55rem; line-height: 1.35; margin: 0 0 0.2rem; text-wrap: balance; }
article h1 + p { font-family: var(--f-mono); font-size: 0.82rem; color: var(--muted); margin-top: 0; }
article h3 { font-family: var(--f-display); font-size: 1.18rem; margin: 2.4rem 0 0.6rem; text-wrap: balance; }
article h4 { font-family: var(--f-display); font-size: 1rem; margin: 1.4rem 0 0.4rem; }
article p { margin: 0 0 1.05rem; }
article ul { padding-left: 1.2rem; margin: 0 0 1.2rem; }
article li { margin: 0 0 0.45rem; }
article strong { font-family: var(--f-display); font-weight: 600; }
article hr { border: 0; border-top: 1px solid var(--rule); margin: 2rem 0; }
article a { color: var(--accent); overflow-wrap: anywhere; }
article blockquote { margin: 0 0 1.05rem; padding: 0.6rem 1rem; background: var(--quote); border-radius: 6px; }
article blockquote p { margin: 0; }
article code { font-family: var(--f-mono); font-size: 0.85em; background: var(--quote); padding: 0.05rem 0.3rem; border-radius: 4px; overflow-wrap: anywhere; }
article details { margin-top: 1.5rem; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); padding: 0.4rem 1rem; font-size: 0.92rem; }
article details summary { font-family: var(--f-display); font-weight: 600; cursor: pointer; padding: 0.4rem 0; color: var(--muted); }
article details[open] summary { margin-bottom: 0.5rem; }
.scope { font-size: 0.95rem; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 0.9rem 1.1rem; margin-bottom: 1.6rem; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; font-family: var(--f-display); }
.tbl { overflow-x: auto; margin: 0 0 1.4rem; }
th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 0.8rem; letter-spacing: 0.03em; }
td.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip { display: inline-block; font-family: var(--f-mono); font-size: 0.72rem; line-height: 1.5; padding: 0.1rem 0.5rem; border-radius: 999px; white-space: nowrap; }
.chip.ok { background: var(--accent-soft); color: var(--accent); }
.chip.stop { background: var(--warn-soft); color: var(--warn); }
.intro h2 { font-family: var(--f-display); font-size: 1.15rem; margin: 2rem 0 0.6rem; }
.empty { color: var(--muted); }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="eyebrow" id="when"></div>
    <h1 class="name">해외축구 팬 매거진</h1>
    <p class="lede">여러 나라 축구 커뮤니티를 대신 읽고 곳마다 탭 하나씩 한국어로 들려줍니다.</p>
    <div class="dates">
      <button id="prev" type="button" aria-label="이전 보고">‹ 이전</button>
      <select id="pick" aria-label="보고일"></select>
      <button id="next" type="button" aria-label="다음 보고">다음 ›</button>
    </div>
  </div>
</header>

<nav class="tabs" aria-label="커뮤니티">
  <div class="wrap" role="tablist" id="tabs"></div>
</nav>

<main>
  <div class="wrap"><article id="doc"><p class="empty">아직 보고가 없어요.</p></article></div>
</main>

const REPORTS = [{"id": "2026-11-07_120325", "label": "2026년 11월 7일", "md": "# 해외축구 팬 매거진 · 2026년 11월 7일\n\n이번에 들른 곳은 영국의 Not606·FootballForums와 폴란드의 Wykop #mecz다. 각각 두 글타래의 새 글 10개와 5개, 축구 태그 한 곳의 새 글 40개를 읽었다. 앞의 두 곳은 11월 6일의 짧은 경기 수다와 오래 이어진 논쟁의 하루치 단면이고, Wykop은 크라쿠프 더비가 중심인 짧은 수집 구간이다. 포럼 전체의 여론보다, 이번에 잡힌 대화의 온도를 따라가면 좋겠다.\n\n**오늘의 큰 줄기**\n\n가장 뜨거운 곳은 크라쿠프다. 비스와의 더비 2–1 승리와 리그 홈 7연승을 두고 도시의 주인을 자처하는 환호와 ‘홈에서는 늘 두 골’이라는 농담이 나왔다. 그러나 Wykop에서 연이어 도마에 오른 것은 크라코비아의 베테랑 마테우시 클리흐가 한 골 뒤진 막판에 퇴장당한 장면이었다. 책임을 묻고 출전 정지를 요구하는 목소리 사이로, 더 큰 참패를 걱정했던 크라코비아 팬 한 명은 ‘품위 있는 패배’라며 안도했다. 승리의 크기와 패배의 무게가 서로 다르게 읽히는 대목이다. 팬들의 징계 요구를 확정 처분으로 읽지는 말자.\n\n영국 쪽에서는 긴 계약 뒤의 마음을 짐작하는 말들이 눈에 띈다. FootballForums는 홀란의 2034년까지 계약을 놓고 잔류 의지와 이탈 가능성이 함께 성립할 수 있는지 따진다. 계약 기간은 확인됐지만, 거론된 탈출 조항과 이적료는 확인된 내용이 아니다. 시티의 재정 규정 위반 판단과 별도 제재 심리도 구분해야 이 대화의 가정이 보인다. 프리미어리그나 챔피언스리그에서 빠지는 상황은 이번 글들에서 상정한 미래다. Not606에서는 2029년까지 재계약한 케인의 복귀설에 시큰둥한 농담이 붙었다. 두 선수의 계약 이야기는 각기 다른 글타래에서 나온 별개의 화제다.\n\n가볍게 경기장을 옮겨 다니고 싶다면 Not606의 수다가 어울린다. 더비의 반등을 보며 승리를 바라는 이유가 ‘감독이 안 잘렸으면 해서’로 흐르고, 에버턴 경기를 즐기던 한 사람은 올 시즌 리버풀을 적어도 한 번 잡으리라 내다본다. 코너킥이 그대로 골이 된 장면도 있다. 여기서 옥스퍼드는 유나이티드가 아니라 시티다. 짧은 예상과 농담이 어디까지 한 사람의 말인지 구분해 읽는 재미가 있는 구간이다.\n\n## 읽은 곳과 읽은 양\n\n| 곳 | 나라 | 글타래 | 새 글 | 결과 |\n|---|---|---|---|---|\n| Not606 | 영국 | 2 | 10 | 글 적음 |\n| FootballForums | 영국 | 2 | 5 | 글 적음 |\n| Wykop #mecz | 폴란드 | 1 | 40 | 읽음 |\n\n## Not606 | 영국\n\n이번에는 Not606의 경기일 종합 글타래와 ‘PGMOL apology league’, 두 곳에서 새 글 10개를 읽었다. 한국 시각 11월 7일 새벽부터 아침까지, 영국에서는 11월 6일 금요일 저녁과 밤에 오간 짧은 수다다. 수집 집계상 작성자는 5명이다. 긴 논쟁보다는 여러 경기를 번갈아 보며 한마디씩 얹는 장면이 잡혔다.\n\n**개관**\n\n- 더비의 뜻밖의 반등에는 놀라움과 다음 상대의 계산이 함께 붙었다. 승리를 바라는 이유가 “감독이 안 잘렸으면 해서”라는 대화다. 더비의 볼턴전 승리는 구단 경기 보고로 확인했다.\n- 에버턴 경기를 재미있게 보던 흐름에서 “이번 시즌 리그에서 리버풀을 적어도 한 번은 이길 것”이라는 전망이 나왔다. 수집분에서는 한 사람의 예상이다.\n- 케인의 바이에른 재계약 소식에는 복귀설을 시큰둥하게 받는 연예계 비유가 달렸다. 계약 기간은 구단 발표상 2029년까지다.\n- 옥스퍼드의 코너킥 직접 득점은 실제로 확인된다. 옥스퍼드 유나이티드가 아니라 옥스퍼드 시티의 레스터전 장면이다. 심판 글타래의 새 글은 말꼬리를 받는 짧은 답변 하나여서, 특정 오심이나 사과 논쟁까지는 복원할 수 없다.\n\n---\n\n### 더비가 이겼으면 좋겠다. 감독이 그대로 있었으면 하니까\n\n이번 수집분에서 가장 길게 이어진 것은 더비 이야기다. 그렇다고 장문의 전술 토론이 벌어진 것은 아니다. 두 사람이 세 차례 주고받은 말 안에서, 같은 반등을 보는 서로 다른 이해관계가 드러났다.\n\n시작은 “더비가 이렇게 살아날 줄은 몰랐네”라는 감탄이었다. 바로 다음 답변도 “정말 갑자기 나왔다”며 놀라움에 동의했다. 그런데 이어지는 문장이 응원의 방향을 바꿨다.\n\n> “우리가 다음에 저 팀이랑 하니까, 이겨서 감독을 안 잘랐으면 좋겠어.”\n\n승리해 자신감을 얻은 상대를 만나겠다는 말이면서, 그보다 감독 교체 없이 만나고 싶다는 계산이 앞선다. 적어도 이 댓글 안에서는 더비의 반등을 반기면서도 현재 체제가 계속되는 편이 자기 팀에 낫다고 보는 셈이다. 상대의 좋은 장면을 인정하는 것과 그 팀을 얼마나 위협적으로 보는지는 별개였다.\n\n이 말은 감독 교체가 예정됐다는 소식도, 새 감독이 오면 반드시 강해진다는 분석도 아니다. 곧 만날 상대가 승리로 한숨 돌렸으면 좋겠다는 팬의 바람이다. 수집된 글에는 어느 구단을 응원하는지 직접 밝힌 문장이 없으므로, 여기서 ‘우리’의 소속까지 정해 읽을 필요는 없다.\n\n그 뒤 처음 놀라움을 표현했던 쪽이 돌아왔다. “그리고 정말 이겼네”라고 결과를 받아 적고, 등을 돌렸던 열성팬들은 아마 충격을 받았을 것이라고 덧붙였다. 첫 감탄의 대상이 경기의 반등이었다면, 마지막 문장은 그 경기를 보며 생각을 바꿔야 했을 사람들까지 건드린다. 예상 밖의 승리는 기쁨을 주는 동시에, 이미 실망을 굳힌 사람에게는 당혹스러운 소식일 수도 있다는 농담이다.\n\n여기서 ‘등을 돌린 팬들’은 댓글 작성자가 묘사한 대상이다. 실제로 얼마나 많은 더비 팬이 감독에게서 마음을 돌렸는지, 그들이 승리 뒤 무슨 말을 했는지는 이 자료에 없다. 이번에 직접 들리는 것은 더비 팬들의 집단 반응이 아니라, 그들을 떠올리며 한마디 보탠 두 사람의 대화다. 그 차이를 남겨 두어야 이 장면의 짓궂음도 과장 없이 전달된다.\n\n경기 쪽의 배경은 분명하다. 더비 구단의 볼턴전 보고 본문에 따르면, 더비는 전반 막판 먼저 실점한 뒤 후반 시작 직후 라이언 니암베와 잭 로빈슨의 골로 흐름을 뒤집었고, 추가시간 리안 브루스터의 골까지 보태 3–1로 이겼다. 구단 페이지 제목에는 2–1이 남아 있지만 본문은 세 번째 골과 최종 3–1을 명시한다. 따라서 이 원고는 본문의 경기 전개를 기준으로 삼았다. 팬들이 짧게 부른 ‘부활’에는 실제로 경기 도중의 급격한 반전이 있었다. [더비 카운티 경기 보고](https://www.dcfc.co.uk/news/2026/11/report-derby-county-vs-bolton-wanderers)\n\n그렇다고 이 세 댓글이 더비의 시즌 전체를 새로 평가한 것은 아니다. 한쪽은 눈앞의 반전에 놀랐고, 다른 쪽은 벌써 다음 맞대결의 조건을 생각했다. “잘하네”라는 감상에서 “그 감독 그대로 만나자”까지 넘어가는 속도가 이 짧은 대화의 재미다.\n\n### 에버턴을 보다 보니, 이야기는 리버풀까지 간다\n\n다른 화면에서는 에버턴 경기가 흘러가고 있었다. 새벽 6시 19분에 남은 말은 간단했다. “에버턴 경기 좋네.” 무엇이 좋았는지, 어느 장면에서 쓴 것인지는 설명하지 않았다. 이런 종합 경기일 글타래에서는 그 한 줄만으로도 지금 함께 볼 만한 경기가 어디인지 신호가 된다.\n\n약 35분 뒤 다른 사람이 한발 더 나갔다.\n\n> “내 생각엔 에버턴이 이번 시즌 리그에서 리버풀을 적어도 한 번은 이길 거야.”\n\n원문의 ‘Pool’은 리버풀을 줄인 말이고, 끝의 ‘imo’는 ‘내 생각에는’이다. 확정적인 우열 선언보다는 개인 전망으로 내놓은 문장이다. 그래도 범위는 제법 구체적이다. 컵대회까지 넓히지 않고 리그를 짚었고, 두 번 다 이긴다고 하지도 않았다. 시즌 중 적어도 한 번은 이웃 라이벌을 잡을 만하다는 기대다.\n\n에버턴이 금요일 홈에서 상대한 팀은 코번트리였다. 에버턴 공식 홈페이지의 경기 후 기록에는 3–1 승리가 올라 있다. 그러므로 앞의 댓글은 이미 리버풀을 꺾은 경기의 감상이 아니라, 다른 상대와 벌이는 경기를 보다가 앞으로의 머지사이드 맞대결까지 기대를 넓힌 말로 읽어야 한다. [에버턴 공식 경기 후 안내](https://www.evertonfc.com/?gw=1)\n\n재미있는 것은 “좋은 경기”라는 관전평과 “리버풀을 이길 것”이라는 예상 사이의 거리다. 첫 문장은 지금 보고 있는 경기의 재미를 말한다. 두 번째 문장은 그 경기에서 받은 인상을 시즌의 다른 승부에 옮긴다. 두 사람이 같은 이유로 에버턴을 높이 평가했는지는 알 수 없지만, 수집분의 대화는 이렇게 한 경기에서 라이벌전으로 건너갔다.\n\n이에 대한 반박이나 맞장구는 이번 범위에 없다. 리버풀 팬이 발끈했다거나 에버턴 팬들이 일제히 자신감을 되찾았다고 덧붙일 만한 근거도 없다. 남아 있는 온도는 조금 더 소박하다. 경기 하나를 재미있게 보았다는 한 줄, 그리고 그 팀이라면 라이벌도 한 번 잡겠다는 한 사람의 예감이다. 더비를 보며 다음 상대의 감독을 계산하던 대화와 나란히 놓으면, 타 팀 경기를 보는 팬의 관심이 얼마나 빨리 자기 관심사로 옮겨 가는지도 보인다.\n\n### 케인의 복귀 불발? 놀라울 것도 없다는 농담\n\n시간을 조금 앞당기면 케인이 나온다. “토트넘 복귀는 없다, 어제 바이에른과 2029년까지 새 계약을 맺었다”는 문장을 인용한 뒤, 답변은 축구 밖으로 튀었다. 케이티 페리도 러셀 브랜드와 다시 결혼하지 않기로 했다니, 똑같이 놀라운 소식이라는 농담이었다.\n\n표면상으로는 ‘놀라운 뉴스’ 둘을 나란히 놓았지만, 말하려는 것은 그 반대다. 돌아갈 것이라고 기대하지도 않았는데 복귀 불발을 새삼 뉴스처럼 말하느냐는 시큰둥함이다. ‘옛 관계로 돌아가지 않는다’는 구조를 빌려, 케인의 토트넘 복귀 가능성을 대하는 낮은 기대를 드러냈다. 연예인들의 실제 최신 발언을 전한 기사로 읽을 대목은 아니다.\n\n축구 쪽 사실은 구분해 둘 수 있다. 바이에른은 11월 5일 케인과 2029년 6월 30일까지 계약을 연장했다고 공식 발표했다. 수집 시각을 영국 현지의 11월 6일 저녁으로 놓으면, 인용문이 ‘어제’라고 부른 시점과도 맞는다. 재계약 자체는 확인된 소식이다. [바이에른 공식 발표](https://fcbayern.com/en/news/2026/11/harry-kane-extends-with-fc-bayern-until-2029)\n\n그 위에 붙은 “복귀는 없다”는 표현과 농담은 팬 대화의 층위다. 이 댓글 한 개로 토트넘 팬들이 모두 복귀를 포기했다거나, 애초에 누구도 원하지 않았다고 말할 수는 없다. 수집된 것은 복귀 가능성을 크게 보지 않는 한 사람의 반응이다. 누군가에게는 재계약 발표가 미련을 정리하는 소식일 수 있지만, 이 답변을 쓴 쪽은 그 소식에서 놀랄 이유부터 찾지 못했다.\n\n이번에는 실제 이적 협상이나 복귀 조건을 두고 말이 길어지지 않았다. 구체적인 조건을 따져 반박하는 대신, 짧은 비교 하나로 관심의 크기를 표현하고 다음 경기 이야기로 넘어갔다. 자료 속 케인 화제는 그만큼 건조하게 끝난다.\n\n### ‘옥스퍼드가 코너킥으로 동점’이라는 한 줄의 주인공\n\n경기일 수다에는 긴 평가보다 즉석 알림에 가까운 글도 있다. “옥스퍼드가 레스터 상대로 코너킥을 직접 넣어서 동점을 만들었다.” 원문은 레스터를 ‘Lesta’라고 썼다. 표준 표기를 따지기보다 입말처럼 빠르게 적은 문장이다.\n\n이 한 줄에는 구단명이 짧게 잘려 있어 확인이 필요했다. 실제 장면은 옥스퍼드 시티와 레스터 시티의 FA컵 1라운드에서 나왔다. 옥스퍼드 시티 공식 보고에 따르면 스콧 폴록이 전반 31분 코너킥을 그대로 골문에 넣어 1–1을 만들었다. 보고는 그가 어린 시절 응원했던 팀을 상대로 넣은 골이라고도 설명한다. 단순한 동점골 알림에, 공식 기록을 통해 작은 개인적 맥락이 하나 더 붙는 셈이다. [옥스퍼드 시티 경기 보고](https://www.oxfordcityfc.co.uk/match-report-oxford-city-2-4-leicester-city)\n\n최종 결과는 레스터의 4–2 승리였다. 따라서 게시판의 한 줄은 경기 전체의 결말이 아니라, 옥스퍼드가 승부를 다시 원점으로 돌린 순간을 붙잡은 것이다. 레스터가 결국 이겼다는 결과를 먼저 알고 읽으면 지나치기 쉽지만, 실시간으로 남겨진 댓글에서는 아직 동점골의 뜻밖의 방식이 가장 중요한 정보다.\n\n수집분에는 이 골을 두고 이어진 놀림이나 추가 토론은 없다. 그래도 여러 경기가 섞이는 글타래의 시야를 보여 주는 장면으로는 충분하다. 케인의 계약 소식에서 FA컵 코너킥 골로, 다시 더비와 에버턴으로 옮겨 간다. 프리미어리그 이야기가 모이는 자리에서도 그날 눈에 띈 장면은 대회 경계를 넘어 들어왔다.\n\n### 이제 주말에는 남의 고통을 구경하면 된다는 사람\n\n아침 8시 28분, 영국에서는 금요일 밤 11시 28분에 올라온 글은 주말의 나머지를 향했다.\n\n> “축구로는 주말 출발이 아주 좋네. 이제 편히 앉아서 앞으로 이틀 동안 고통과 비참함을 구경하면 되겠어…”\n\n뒤에는 ‘may the odds…’라는 미완의 문구와 웃음 표시가 따라붙었다. 좋은 출발을 했다는 만족감과, 아직 경기가 남은 다른 사람들의 주말을 짓궂게 바라보는 여유가 한 문장에 함께 있다. 앞으로 이틀이라는 말도 금요일 밤이라는 현지 시각에 놓으면 자연스럽다. 토요일과 일요일의 승부는 이제 남의 긴장으로 즐기겠다는 태도다.\n\n어느 팀의 어떤 결과 덕분에 이렇게 편해졌는지는 밝히지 않았다. 바로 앞에 더비와 에버턴 이야기가 있다고 해서 그중 한 팀의 승리를 자기 일처럼 기뻐했다고 단정할 수는 없다. 확실히 전해지는 것은 남은 경기를 기다리는 방식이다. 결과가 필요한 사람에게는 주말의 본편이 아직 시작되지 않았는데, 이 사람은 이미 한숨을 돌리고 다른 경기의 희비를 구경할 준비를 마쳤다.\n\n그 뒤 같은 사람이 “꽤 인상적인데…”라는 짧은 말을 남겼다. 무엇을 가리키는지 수집 자료와 source.json 어디에도 나오지 않아, 앞선 경기의 평가로 이어 붙이지 않았다. 주말을 즐길 채비를 한 말과 대상이 잘린 감탄은 여기서는 따로 남는다.\n\n### 사과 리그에서 들린 말은 “그럼 해 봐”\n\n별도 글타래 ‘PGMOL apology league’에서는 새 글 하나가 잡혔다. 제목은 심판 기구를 향하지만, 이번에 실제로 들어온 문장은 특정 판정 이야기가 아니다. 앞선 발언의 인용은 “맞아. 내가 표현을 좀 더 잘할 수 있었겠네”라는 취지였고, 답변은 “그럼 해 봐…”에 휘파람 표시를 붙인 것이었다.\n\n표현이 미흡했다는 인정을 받자, 그러면 더 나은 표현을 내놓아 보라는 식으로 받는다. 문장만 보면 가벼운 재촉이나 도발에 가깝다. 어느 구단에 유리한 판정이었는지, 누가 어떤 사과를 해야 한다고 다퉜는지까지는 보이지 않는다. 제목의 ‘사과’를 곧바로 공식 오심 인정 소식으로 바꿔 전할 수 없는 이유다.\n\n두 글타래의 규모는 크다. 수집 메타데이터상 종합 경기일 글타래에는 누적 답글 34만 개, 사과 리그에는 71개가 표시돼 있다. 하지만 오늘 읽은 것은 각각 새 글 9개와 1개다. 이번 조각에서 생생했던 것은 대규모 분노의 물결보다 짧은 말들의 방향 전환이었다. 뜻밖의 승리에 놀라다가 상대 감독의 유임을 바라고, 재미있는 경기를 보다가 라이벌전 승리를 예상하고, 자기 주말이 잘 풀리자 남의 경기를 기다린다. 이 금요일 밤에는 그런 작은 이해관계들이 번갈아 얼굴을 내밀었다.\n\n<details><summary>범위와 근거<\/summary>\n\n- 실행: 2026-11-07_120325. 제공 수집 자료와 현재 작업 폴더 source.json의 해당 두 글타래만 읽었다. 이전 원고·완성본·프로젝트 문서·폴더 밖 자료는 참고하지 않았다.\n- 팬 대화의 범위: [General matchday thread](https://not606.com/threads/general-matchday-thread.350971/) 새 글 9개, [PGMOL apology league](https://not606.com/threads/pgmol-apology-league.424823/) 새 글 1개. 제공 발췌는 약 1,237자, 수집 집계상 작성자 5명이며 최다 작성자의 비중은 30%다. 누적 답글 수는 이번에 읽은 분량이나 의견의 지지 규모를 뜻하지 않는다. 글타래 사이의 작성자 번호도 같은 사람을 뜻하지 않는다.\n- 시간: 자료의 한국 시각 11월 7일 02:21~08:45는 영국 GMT 기준 11월 6일 17:21~23:45다. 본문에서 새벽·아침으로 적은 게시 시각은 한국 시각이다.\n- 사실 확인: [바이에른 11월 5일 발표](https://fcbayern.com/en/news/2026/11/harry-kane-extends-with-fc-bayern-until-2029)로 케인의 2029년 6월 말까지 계약 연장을 확인했다. [더비 구단의 11월 6일 볼턴전 보고](https://www.dcfc.co.uk/news/2026/11/report-derby-county-vs-bolton-wanderers)는 제목과 본문 점수가 달라, 후반 두 골과 추가시간 골을 설명하며 최종 3–1을 명시한 본문을 사용했다. [에버턴 공식 홈페이지](https://www.evertonfc.com/?gw=1)의 경기 후 결과·하이라이트 표기로 코번트리전 3–1을 확인했다. [옥스퍼드 시티 11월 6일 경기 보고](https://www.oxfordcityfc.co.uk/match-report-oxford-city-2-4-leicester-city)로 팀의 정체, 전반 31분 코너킥 직접 동점골, 레스터의 최종 4–2 승리를 확인했다. 외부 자료는 수집 대화의 사실과 필요한 배경을 확인하는 데 사용했으며, 외부 댓글은 팬 반응으로 추가하지 않았다.\n- 에버턴의 리버풀전 전망, 감독 유임을 바라는 계산, 등을 돌린 팬들에 대한 묘사는 팬의 말로만 다뤘다. 연예계 비교는 농담이며 실제 최신 발언으로 확인한 내용이 아니다. ‘Pretty impressive…’의 대상과 심판 글타래의 선행 논쟁은 자료에 없어 복원하지 않았다. 인용 안의 이용자 호칭은 제외했다.\n\n<\/details>\n\n## FootballForums | 영국\n\n이번에는 FootballForums의 두 글타래에서 11월 6일 올라온 새 글 다섯 개를 읽었다. 맨체스터 시티 관련 네 글과 이적시장 관련 한 글이다. 오래 이어진 논쟁의 하루치 단면으로, 포럼 전체의 반응을 대표하는 표본은 아니다.\n\n**개관**\n\n- **홀란의 긴 계약을 어떻게 읽을까.** 시티가 중징계를 받을 경우 바르셀로나가 홀란을 데려갈 수 있다는 가정에서 출발해, 장기 재계약이 잔류 의지인지 이탈 조건과 양립할 수 있는지를 두고 말이 오갔다. 2034년 여름까지의 계약은 구단 발표로 확인되지만, 이 글들이 거론한 탈출 조항과 이적료는 확인된 계약 내용이 아니다.\n- **시티 사건의 판정과 처벌은 구분할 필요가 있다.** 프리미어리그는 9월 29일 독립위원회의 재정 규정 위반 판단을 발표하면서 제재는 별도 심리에서 다룬다고 밝혔다. 따라서 이번 대화에 나온 프리미어리그·챔피언스리그 부재는 이 글 안에서의 가정으로 읽는다.\n- **랭크셔 이적설에는 문워크 한 번.** 한 글은 더 선의 뉴캐슬 관심설을 전한 뒤, 원한다고 뜻대로 되는 것은 아니라는 농담을 붙였다. 이번 확인으로 뉴캐슬의 공식 제안이나 협상은 입증되지 않았다.\n\n---\n\n### 시티가 벌을 받으면, 홀란의 가격은 누가 정할까\n\n‘맨시티의 특별 대우’라는 제목의 글타래에 이날 들어온 첫 이야기는 처벌의 정당성 자체보다 그다음 이적시장을 향했다. 시티가 정말 프리미어리그나 챔피언스리그에 나서지 못할 정도의 처벌을 받는다면, 홀란을 데려오는 데 필요한 돈은 바르셀로나도 충분히 감당할 수준이 될 것이라는 주장이다.\n\n이 한 문장에는 여러 단계가 접혀 있다. 시티에 그 정도 제재가 내려지고, 그 결과 홀란의 거취가 흔들리며, 이적료까지 낮아진다는 순서다. 글쓴이는 그 끝에서 바르셀로나를 떠올린다. 시티의 처분을 논하는 자리에서 다른 구단의 영입 가능성을 계산하는 쪽으로 화제가 옮겨 간 셈이다. 그러나 제재의 종류나 홀란의 가격을 뒷받침하는 수치가 제시된 글은 아니다. ‘만약 그렇게 된다면’이라는 상상이 출발점이다.\n\n실제 사건의 배경은 짧게 짚고 넘어갈 만하다. 프리미어리그는 2026년 9월 29일, 독립위원회가 2009/10시즌부터 2017/18시즌까지 시티의 중대한 재정 규정 위반 관련 혐의를 인정했다고 발표했다. 같은 발표는 제재 문제를 별도의 심리로 남겨 두었다. 시티는 판단을 다투며 항소했다. 규정 위반에 관한 판단이 나왔다는 것과, 어느 대회에서 뛰지 못하게 됐다는 것은 서로 다른 단계다. 이번 팬의 말은 후자의 결과를 가정해 이적시장까지 내다본 것이다. [프리미어리그 발표](https://www.premierleague.com/en/news/4727779/premier-league-statement-manchester-city-fc), [시티의 항소를 전한 구단 성명 인용 보도](https://www.thenationalnews.com/sport/football/2026/10/02/manchester-city-lodge-appeal-against-premier-league-commission-decision/)\n\n이날 제공된 네 글만으로는 바르셀로나행 전망에 동조가 얼마나 붙었는지 알 수 없다. 더 흥미로운 움직임은 뒤의 글들이 홀란의 재계약을 해석하는 방식에서 나온다. 처벌 때문에 선수를 싸게 데려올 수 있다는 상상 옆에, 그렇다면 그 선수는 왜 그렇게 긴 계약에 서명했느냐는 문제가 놓인다.\n\n### “처음 영입할 때가 아니라, 연장 계약 얘기다”\n\n다음 글에는 먼저 대화의 초점을 바로잡는 인용문이 붙어 있다. “처음 영입한 계약이 아니라 연장 계약 얘기를 하고 있었다”는 문장이다. 앞선 대화 전체는 제공되지 않았지만, 적어도 이 답글이 어느 선택을 따지는지는 선명하다. 홀란이 시티에 처음 온 일보다, 이미 그곳에서 뛴 뒤 장기간 더 남기로 한 선택이 쟁점이다.\n\n답글은 선택지를 두 개 더 꺼낸다. 음바페를 예로 들어 계약 만료를 기다리며 행선지를 저울질할 수도 있었고, 연장하더라도 1~2년만 더할 수도 있었다는 것이다. 그런데 홀란은 그 대신 ‘9년’이라는 유례없이 긴 계약으로 자신의 경력을 시티에 맡겼다고 강조한다. 이 글에서 음바페는 별도의 논쟁 대상이 아니라, 선수가 선택권을 오래 쥐고 있는 경로를 설명하는 비교 사례로 등장한다.\n\n계약의 긴 시간 자체는 확인 가능한 사실이다. 시티의 공식 발표는 홀란과 2034년 여름까지 계약했다고 밝히며 이를 ‘10년 계약’이라고 소개했다. 게시물의 ‘9년’이라는 표현과 계산 방식은 다르지만, 여기서 논쟁의 무게를 만드는 것은 몇 개월의 차이가 아니다. 당장의 몇 시즌을 넘어서는 약속을 홀란이 스스로 선택했다는 점이다. [맨체스터 시티의 계약 발표](https://www.mancity.com/news/mens/erling-haaland-10-year-manchester-city-contract-63872694)\n\n그 말을 받는 다음 답글은 아주 짧다.\n\n> “나갈 수 있는 조건이 있을 수도 있고, 시티도 큰돈을 받을 수 있지! 다 좋은 거네.”\n\n앞선 글이 계약 기간을 통해 선수의 결심을 읽었다면, 이 답글은 계약서 안에 있을지 모를 조건을 떠올린다. 긴 계약을 맺었다고 이적의 모든 길이 막히는 것은 아니지 않겠느냐는 반응이다. 선수는 나갈 길을 확보하고 구단은 큰 이적료를 받는다면 양쪽 모두 만족할 수 있다는 계산도 붙는다.\n\n여기서 ‘있을 수도 있다’는 말의 크기를 유지해야 한다. 이 답글은 탈출 조항을 확인해 공개한 것이 아니다. 공식 계약 발표 역시 이 대화가 상상하는 특정 상황의 이탈 조건이나 금액을 밝혀 주지 않는다. 따라서 장기계약이 존재한다는 사실과, 특정 제재가 내려지면 쉽게 떠날 수 있다는 추정은 함께 묶을 수 없다. 게시판에서는 바로 그 공개되지 않은 부분을 놓고 서로 다른 해석이 나란히 나온다.\n\n짧은 공방이지만 두 글의 관심 차이는 분명하다. 한쪽은 선수가 굳이 길게 서명했다는 행동에 의미를 둔다. 다른 쪽은 그렇게 서명하면서도 선택지를 남겨 두었을 가능성에 의미를 둔다. 어느 쪽도 이 발췌 안에서는 계약의 세부 조건을 내놓지 않는다. 같은 계약 기간을 보고도 한 사람에게는 잔류의 무게가, 다른 사람에게는 협상의 여지가 먼저 보인다.\n\n### “다 좋다”는 계산에서 빠지는 사람들\n\n네 번째 글은 이적료 계산을 더 이어 가지 않는다.\n\n> “한 가지는 확실하다. 축구선수와 에이전트는 좀처럼 손해를 보지 않는다. 어느 구단이든 손해를 보는 쪽은 팬들이다.”\n\n앞의 “다 좋은 거네” 뒤에 이 말이 놓이면서, 좋다는 평가의 대상이 달라진다. 선수에게 나갈 길이 있고 구단이 큰돈을 받아도, 그 결말을 기다리는 팬의 사정까지 해결되는 것은 아니라는 시선이다. 홀란이 실제로 떠날지에 대한 예측보다 누가 이런 거래에서 보호받는가에 대한 불만에 가깝다.\n\n특히 끝에 붙인 ‘어느 구단이든’이 대화의 범위를 넓힌다. 글타래 제목은 시티의 특별 대우를 묻고, 첫 글은 바르셀로나가 얻을 수 있는 기회를 이야기했다. 마지막 글은 특정 구단을 응원하는 편 가르기에서 한 발 물러나 팬이라는 처지를 앞세운다. 시티 팬을 비난하거나 바르셀로나 팬의 기대를 반박하는 문장은 없다. 선수와 에이전트는 출구를 마련할 수 있다는 냉소를, 구단을 가리지 않는 팬의 손실과 대비한다.\n\n그렇다고 이것을 네 사람이 도달한 합의라고 부를 수는 없다. 마지막 문장에 다른 사람들이 어떤 반응을 보였는지는 이번 자료에 없다. 확인되는 것은 네 글의 짧은 이동이다. 제재를 가정한 영입 계산이 나왔고, 긴 계약에 담긴 의지가 거론됐으며, 계약상 출구의 가능성이 제시된 뒤, 팬은 그 계산에서 무엇을 얻느냐는 탄식이 붙었다. 법적 사건을 이야기하던 자리에 이적시장의 상상과 응원하는 사람의 피로가 함께 들어온다.\n\n### 뉴캐슬은 랭크셔를 원한다는데, 나는 문워크가 하고 싶다\n\n‘다음 이적시장’ 글타래에서 이번에 들어온 새 글은 단 한 개다. 내용도 빠르다. 더 선이 뉴캐슬의 1월 윌 랭크셔 영입 관심을 보도했다는 소식을 전한 다음, 곧장 이렇게 덧붙인다.\n\n> “나도 문워크 하고 싶다, 친구야. 하지만 인생은 엿 같잖아.”\n\n이 농담이 받아치는 단어는 ‘원한다’다. 구단이 선수를 원한다는 보도를, 자신도 문워크를 하고 싶다는 소원과 같은 자리에 놓는다. 의향을 전하는 기사 한 줄과 실제로 일이 성사되는 사이의 거리를 춤 이야기로 벌려 놓은 것이다. 영입을 점치는 긴 논증 대신, 바람만으로 되는 일이냐는 한숨을 짧게 웃어넘긴다.\n\n다만 이 한 문장이 누구의 기대를 대변하는지는 정해져 있지 않다. 제공된 발췌에는 글쓴이의 응원 구단이나 이 농담에 붙은 후속 반응이 없다. 뉴캐슬의 영입 가능성을 비웃는 것인지, 선수를 원하는 마음과 현실의 간극을 자조하는 것인지, 보도 자체를 못 미더워하는 것인지까지 하나로 확정할 수는 없다. 분명한 것은 관심설을 반가운 소식으로 곧장 소비하지 않았다는 말투다.\n\n선수의 소속 배경은 확인할 수 있다. 토트넘은 2026년 7월 22일 랭크셔의 미들즈브러 이적 합의를 발표했다. 따라서 이 관심설을 토트넘 유망주를 뉴캐슬이 곧장 데려간다는 이야기로 읽어서는 앞뒤가 어긋난다. 여름에 미들즈브러로 옮긴 선수의 다음 겨울 거취를 거론하는 소문이다. 공식 발표가 확인해 주는 것은 그 여름 이적까지이며, 뉴캐슬의 제안이나 협상이 아니다. [토트넘의 랭크셔 이적 발표](https://www.tottenhamhotspur.com/news/1079320/lankshear-on-the-move-to-boro)\n\n외부 검색에서도 더 선을 출처로 삼은 관심설의 재전달은 확인됐다. 그러나 같은 보도가 다른 곳에 반복됐다는 사실을 별개의 구단 확인으로 셀 수는 없다. 이번 원고에서는 ‘더 선의 보도라고 한 팬이 전한 이적설’이라는 수준으로 남긴다. 게시물에는 매체 이름을 ‘S*n’으로 표기했지만, 왜 그렇게 썼는지 설명은 없다. 그 철자 하나를 근거로 글쓴이의 소속이나 동기를 추정하지 않는다.\n\n이번에 읽은 두 글타래는 규모가 크다. 시티 글타래에는 전체 답글 5,363개, 이적시장 글타래에는 47,359개가 달려 있다고 수집 자료에 표시돼 있다. 그 큰 숫자와 오늘 읽은 분량은 구별해야 한다. 여기서 들은 것은 네 사람의 계약 해석과 한 사람의 문워크 농담이다. 그중 한 사람은 장기계약을 무겁게 읽고, 다른 사람은 나갈 조건이 있을 가능성을 말하며, 또 한 사람은 결국 팬이 손해라고 말한다. 한 사건을 보면서도 서로 다른 대목에서 마음이 걸리는 모습이, 이번 짧은 발췌가 남긴 읽을거리다.\n\n<details><summary>범위와 근거<\/summary>\n\n- 실행: 2026-11-07_120325. 누적 맥락 없음. 제공된 FootballForums 수집 자료의 두 글타래, 11월 6일 새 글 다섯 개만을 팬 반응의 근거로 사용했다. 자료에 표시된 작성 시각의 시간대는 별도로 확인되지 않았다.\n- ‘Man City's Special Treatment’ 네 글·네 명, ‘Next Transfer Window’ 한 글·한 명. 제공 발췌는 약 1,115자다. 전체 답글 수는 글타래의 누적 규모이며 이번에 읽은 댓글 수나 특정 의견의 지지 수가 아니다. 과거 완성본·프로젝트 문서·다른 로컬 파일은 참고하지 않았다.\n- 계약 확인: [맨체스터 시티 공식 홀란 재계약 발표](https://www.mancity.com/news/mens/erling-haaland-10-year-manchester-city-contract-63872694). 2034년 여름까지의 계약을 확인했다. 이번 팬들이 추정한 특정 이탈 조항·바르셀로나의 지불 가능액은 확인되지 않았다.\n- 사건 확인: [프리미어리그 2026년 9월 29일 공식 발표](https://www.premierleague.com/en/news/4727779/premier-league-statement-manchester-city-fc). 위반 판단과 제재의 별도 절차를 확인했다. 항소는 [The National의 10월 2일 보도에 실린 시티 성명](https://www.thenationalnews.com/sport/football/2026/10/02/manchester-city-lodge-appeal-against-premier-league-commission-decision/)으로 확인했다. 이는 11월 7일 현재 모든 절차의 상태를 포괄적으로 확인했다는 뜻은 아니다. 이번 게시물의 대회 불참 가정을 확정 제재로 서술하지 않았다.\n- 선수 배경 확인: [토트넘 2026년 7월 22일 공식 발표](https://www.tottenhamhotspur.com/news/1079320/lankshear-on-the-move-to-boro). 랭크셔의 미들즈브러 이적 합의를 확인했다. [더 선을 인용한 관심설 재전달 기사](https://sports.yahoo.com/articles/newcastle-united-eyeing-middlesbrough-striker-000000825.html)는 존재하나 더 선 원기사와 구단의 공식 제안·협상은 이번 확인에서 확보하지 못했다. 해당 재전달 기사의 성적·부상 등 부가 주장은 원고의 사실 근거로 사용하지 않았다.\n- 직접 인용은 제공된 영어 게시물의 번역이다. 게시자의 계정·닉네임은 기재하지 않았다. 자료가 적어 다른 날짜의 반응이나 외부 커뮤니티 반응으로 분량을 보충하지 않았다.\n\n<\/details>\n\n## Wykop #mecz | 폴란드\n\n이번에는 Wykop의 축구 태그 **#mecz**에서 수집한 새 글 40개를 읽었다. 작성자는 35명이며, 제공된 본문은 약 4,586자다. 한국 시각 11월 7일 06:32~09:34의 글들로, 중심은 폴란드 현지 11월 6일 금요일에 열린 비스와 크라쿠프–크라코비아 더비다. 아래의 분위기는 이 짧은 수집 구간에서 드러난 반응이다.\n\n**개관**\n\n- **크라쿠프의 승자는 비스와.** 더비 2–1 승리와 리그 홈 7연승은 구단 공식 보도로 확인했다. 이긴 쪽에서는 도시의 주인이 누구인지 외치는 구호와 ‘홈에서는 늘 두 골’이라는 농담이 나왔다.\n- **대화의 중심은 마테우시 클리흐의 막판 퇴장.** 크라코비아의 한 골 차 열세에서 나온 행동에 베테랑의 책임을 묻는 글이 연이어 올라왔다. 몇 경기 쉬게 해야 한다는 말은 팬들의 징계 요구이며, 확정 처분이 아니다.\n- **패배했다고 모두 무너진 것은 아니다.** 크라코비아 팬 한 명은 더 큰 참패를 걱정했던 만큼 이번 결과를 ‘품위 있는 패배’로 받아들였다. 승자의 환호와 패자의 안도가 같은 화면에 놓였다.\n- **곁가지에는 중계진, 대표팀, 다른 경기.** 방송의 말실수와 더비 응원가를 둘러싼 반응, 아우구스티니아크 발탁 요구 등이 섞였다. 대상이나 앞뒤가 빠진 글은 사건의 전말로 확대하지 않았다.\n\n---\n\n### 동점까지 남은 시간에, 가장 경험 많은 선수가\n\n처음 화면을 채우는 것은 골 세리머니가 아니다. 클리흐의 이름, 웃음을 뜻하는 ‘XD’, 누군가를 걷어찼다는 짧은 말이 거의 같은 시간에 몰려 있다. 폴란드 대표팀 출신이라는 경력도 이때는 칭찬이 아니라 비꼼의 재료다. 무슨 장면을 봤는지 서로 길게 설명할 필요조차 없다는 듯, 이름 하나만 쓰고 웃는 글도 있다.\n\n경기의 뼈대부터 놓자. 비스와는 크라코비아를 2–1로 이겼고, 클리흐는 경기 종료 직전 상대 선수 제레미 기유므노를 향한 비신사적 행동으로 퇴장했다. 크라코비아 공식 보고서는 이를 후반 추가시간의 일로 기록한다. 게시판에서는 상대를 걷어찬 행동으로 받아들이며 비난이 이어졌다. 퇴장의 정확한 분 표기는 보도에 따라 추가시간 3분 또는 4분으로 갈리므로, 여기서는 막판 추가시간으로만 적는다. [크라코비아 공식 경기 보고](https://www.cracovia.pl/posts/derby-krakowa-nie-dla-pasow-cracovia-przegrywa-przy-reymonta/6513)\n\n이 구간에서 가장 많은 공감, 41개를 받은 글은 화려한 욕설보다 앞의 경력 나열이 더 날카롭다. 가장 경험 많은 선수, 전 국가대표, 프리미어리그에서도 뛰었던 선수. 그런 사람이 최대 라이벌과의 경기에서, 동점을 위해 아직 몇 분을 쓸 수 있는 순간에 왜 저런 일을 하느냐는 것이다. 글에 등장하는 ‘아직 5분’은 작성자가 당시 남은 기회를 표현한 말이지, 이 원고에서 별도로 확정한 잔여시간 수치는 아니다.\n\n이 글의 불만은 퇴장당한 선수가 약해서도, 더비를 가볍게 여겨서도 아니다. 오히려 그 경력 때문에 더 참기 어렵다는 쪽이다. 힘든 순간을 가장 많이 겪어 본 선수가 남은 공격을 정리해 줘야 할 때, 팀이 쓸 수 있는 인원부터 줄여 버렸다. 한 골 차로 지는 경기의 추가시간에는 우연한 세컨드볼 하나도 희망이다. 팬이 화를 내는 지점은 그 희망을 상대 수비가 아니라 자기 팀 선수가 깎아 먹었다는 데 있다.\n\n클리흐를 좋아한다고 먼저 밝힌 글도 같은 대목에서 멈췄다. 어깨를 맞대고 싸우는 것은 이해하지만, 한 골 뒤진 상태에서 이런 행동을 하는 것은 자기 구단을 방해하는 일이라는 취지다. 공감은 10개. 선수에 대한 호감과 그날 행동에 대한 판단을 따로 두려는 글이다. 좋아하니까 감싸야 한다는 문장도 아니고, 한 번의 잘못으로 그동안의 호감을 모두 취소한다는 선언도 아니다. 지금 이 장면은 도저히 변호할 수 없다는 실망이다.\n\n그 옆에는 “교체될 때까지도 못 기다렸네”라는 짧은 비꼼이 붙었다. 막판 파울이 정말 아무 의미 없었다는 글도 뒤따랐다. 이 둘을 실제 교체 계획이나 벤치 내부 사정의 증거로 읽을 수는 없다. 다만 글쓴이들이 느낀 허무함은 선명하다. 경기가 끝나 가는데 끝까지 남아 있지도 못했다는 것. 이 수집분의 클리흐 비판은 대체로 ‘투지가 부족하다’가 아니라 ‘투지를 어디에 썼느냐’에 가까웠다.\n\n### ‘몇 경기 쉬어라’와 ‘대표팀에 뽑아라’ 사이\n\n분노는 곧 다음 경기로 넘어간다. 생각할 시간을 갖도록 몇 경기 쉬었으면 좋겠다는 글이 공감 29개를 받았다. 약 네 경기를 쉬게 하자는 별도 글에는 15개가 붙었다. 처음부터 출전정지가 나올 것이라며 웃은 글도 있었다. 여기서 ‘몇 경기’는 규정 해설이 아니라 팬이 바라는 처분의 크기다. 이번에 확인한 자료에서는 이 사건의 최종 징계 공지를 확보하지 못했으며, 네 경기라는 숫자를 이미 결정된 징계처럼 옮길 근거도 없다.\n\n특징적인 것은 처벌을 요구하는 말이 단순한 상대 팀 조롱으로만 흘러가지 않는다는 점이다. 가장 공감이 많이 붙은 글부터가 남아 있던 동점 가능성을 아쉬워한다. 한쪽에서는 우스운 장면을 소비하고, 다른 쪽에서는 실제로 잃어버린 공격 시간을 따진다. 같은 ‘XD’가 붙어 있어도 웃음의 내용은 하나가 아니다. 어이가 없어서 웃는 것과 남의 실수를 즐기는 것이 이 화면에서는 나란히 보인다. 개별 작성자의 응원 팀이 모두 밝혀진 것은 아니므로, 어느 진영이 얼마나 비난했다고 나눌 수는 없다.\n\n대표팀을 끌어들인 농담은 이 불만을 다른 방향으로 꺾는다. 한 글은 ‘야네크’에게 클리흐를 뽑으라며, 전사가 필요하다는 식의 말을 하면 되겠다고 비꼰다. 공감 11개다. 실제 대표팀 발탁설을 전하는 글이 아니다. 통제되지 않은 행동에도 ‘싸울 줄 아는 선수’라는 포장을 씌울 수 있느냐는 조롱이다. 선수의 거친 행동과 대표팀의 정신력 담론을 한 문장 안에 겹쳐 놓은 셈이다.\n\n야체크 구랄스키의 이름을 불러낸 글도 있다. 클리흐가 점점 그를 닮아 간다면서, 얼마 전 상대 페널티지역에서도 비슷한 일을 했던 것 같다고 덧붙였다. 여기서 앞선 사건은 글쓴이 자신의 기억에 기대고 있으며 구체적인 경기나 장면이 제시되지 않았다. 따라서 반복 전력으로 확정할 수는 없다. 이 글에서 읽을 수 있는 것은 행동 하나가 선수의 이미지까지 바꾸고 있다는 반응이다. 잘 아는 이름을 하나 던지면 어떤 유형의 선수 이야기를 하는지 통할 것이라고 기대하는, 현지 게시판의 압축된 대화이기도 하다.\n\n퇴장 논쟁 옆에서 주심 시몬 마르치니아크에게도 화살이 갔다. 한 글은 왜 그 일에 끼어들었느냐고 불평하면서도 곧바로 클리흐를 비난한다. 이 한 문장만으로 판정에 반대하는 흐름이 컸다고 말할 수는 없다. 무엇에 개입한 것을 문제 삼는지도 본문에서는 명확하지 않다. 오히려 심판에게 불만이 있어도 선수 행동까지 정당화하지는 않는 반응이 함께 있었다는 정도가 이 글이 보여 주는 범위다.\n\n잠시 뒤에는 ‘두 번째 퇴장’이 에르틀탈러의 얼굴을 잡거나 때려서 나온 것 같다는 추측도 등장한다. 그러나 해당 글은 누구의 어떤 퇴장을 말하는지 충분히 밝히지 않고, 문장 자체도 ‘아마’라는 추정이다. 이를 클리흐 사건에 합쳐 추가 폭행의 전말로 만들지는 않았다. 경기 여러 개가 겹치는 공용 태그에서는 화면상 이웃한 문장이 반드시 같은 사건의 다음 장면은 아니다.\n\n### 화를 가라앉히려면 브라티슬라바까지 걸어야 한다\n\n축구 게시판의 분노는 곧 농담의 거리 단위로도 바뀐다. 비스와 태그를 함께 단 한 글은 클리흐의 그 어처구니없는 파울을 걷기로 풀려면 아마 브라티슬라바까지 걸어가야겠다고 했다. 이것은 실제 여행 계획이 아니라, 잠깐 산책하는 정도로는 그 장면이 머리에서 빠지지 않을 것이라는 과장이다. 몇 줄 전의 ‘몇 경기 반성하라’와 같은 불쾌감이지만, 여기서는 긴 도보 여행의 형태를 얻었다.\n\n더 뒤에는 클리흐를 변호하겠다며 운을 뗀 글이 있다.\n\n> “클리흐를 변호하자면, 나도 그와 동갑인데 지금처럼 어리석었던 적이 없다.”\n\n변호하겠다는 첫머리와 마지막 자기 고백이 충돌하는 농담이다. 나이를 먹으면 반드시 판단도 나아지리라는 기대를 자기 쪽에서 먼저 무너뜨린다. 선수를 감싸는 근거가 경험이나 인품이 아니라 ‘나도 요즘 이렇다’라니, 변호의 형식을 빌린 체념에 가깝다. 공감 4개의 작은 곁가지지만, 처음 몇 분 동안의 날 선 비난과는 문장의 온도가 달라졌다.\n\n한편 수집 시각 14:54에는 퇴장 장면 GIF를 가진 사람이 있느냐는 요청이 올라온다. 14:59에는 다른 글이 클리흐가 대체 무슨 일을 했기에 그렇게 비판받느냐고 묻는다. 앞에서는 모두가 같은 장면을 본 것처럼 이름과 웃음만 주고받았지만, 뒤늦게 들어온 사람에게는 정작 사건이 빠져 있다. 누군가는 이미 판단을 끝내고, 누군가는 이제 영상을 찾는다. 실시간 태그가 늘 같은 속도로 움직이는 집단은 아니라는 것이 이 두 글에서 드러난다.\n\n초반의 웃음 표기도 그런 환경에서 읽어야 한다. ‘XD’가 여러 번 나온다고 해서 게시판이 모두 즐거웠다는 뜻은 아니다. 경기력에 대한 비평을 길게 적기 전에 당혹감부터 표시하는 글, 상대의 기행에 웃는 글, 선수에게 실망한 글이 같은 부호를 쓴다. 이 구간에서는 그 뒤에 붙는 구체적인 이유, 특히 남은 시간과 베테랑의 경력을 말하는 문장이 감정을 가려 준다.\n\n### 이긴 쪽의 축배는 ‘정확히 두 골’\n\n클리흐 이야기가 이어지는 사이, 비스와 쪽에서는 더비 승리의 문장이 올라왔다.\n\n> “누구나 말할 거야, 크라쿠프는 비스와가 지배한다고!”\n\n원문은 대문자로 적혔고 공감 12개를 받았다. ‘KAŻDY TO POWIE, WISŁA RZĄDZI W KRAKOWIE’는 여기서 경기 분석보다 도시의 승자를 선언하는 말이다. 몇 분 전까지는 경험 많은 선수가 왜 그랬는지 따졌다면, 이 글에서는 한 경기의 결과를 도시 전체의 이름으로 확장한다. 더비를 이긴 쪽이 누릴 수 있는 과장이다. 이를 실제 지역 전체의 지지 분포나 장기적인 세력 판정으로 받아들일 필요는 없다.\n\n확인된 경기 맥락도 이 환호에 무게를 준다. 비스와 공식 보도에 따르면 이번 경기는 204번째 크라쿠프 더비였고, 두 팀의 리그 더비는 4년여 만에 돌아왔다. 비스와는 마르크 카르보와 마르코 보지치의 골로 이겼으며, 이 승리로 이번 리그 홈경기 7연승을 이어 갔다. 오래 기다린 맞대결과 계속되는 홈 승리가 겹친 날이었다. [비스와 공식 경기 보도](https://wislakrakow.com/en/news/derby-sa-nasze-wisla-krakow-pokonala-cracovie-2-1)\n\n그 좋은 기분을 가장 생활감 있게 표현한 것은 압도적인 전력 자랑보다 숫자 농담이었다. 홈에서는 다 이기는 데다 늘 두 골씩 넣는다며, 더도 덜도 없이 이게 바로 안정감이라는 글이다. 공감 10개. 매번 다른 드라마를 치르는 경기들을 자기 팀만의 익숙한 규칙으로 묶어 즐긴다. 여기서 ‘두 골’은 팬이 자기 팀의 흐름을 말하는 방식이며, 이번 원고에서 모든 홈경기의 개별 스코어를 대조해 새 통계를 만든 것은 아니다.\n\n더비에서는 원래 상대보다 한 골 더 넣으면 충분하지만, 이 팬이 좋아하는 것은 그 충분함이 반복된다는 감각이다. 승리를 기다리는 시간이 불안 일변도로만 느껴지지 않고, 자기 팀에 기대해 볼 만한 결말이 생겼다. 클리흐 비판의 핵심이 남아 있던 기회를 스스로 없앴다는 것이었다면, 이쪽 농담의 핵심은 홈에서 기대한 보상을 또 받았다는 데 있다. 한 경기의 끝에서 두 팀의 팬이 들여다보는 시간이 다르다.\n\n다른 글은 지금 크라쿠프를 지배하는 것은 비스와라면서 그젤라크는 오늘 짐을 쌀 수도 있겠다고 붙였다. 앞부분은 승리 선언이고 뒷부분은 감독 거취에 대한 팬의 예상이다. 이 글 하나를 경질 소식으로 읽을 수는 없다. 더비가 끝나자마자 상대 팀의 다음 날까지 입에 올리는, 승부 뒤의 거친 대화로 남겨 두는 편이 맞다.\n\n### 진 쪽의 긴 글: 나는 무너지지 않았다\n\n그런데 크라코비아 쪽에서 나온 가장 긴 반응은 예상과 조금 다르다. 이 팬은 자신이 낙담하지 않았다고 시작한다. 매우 힘든 시기에 R22 원정을 치렀고, 이번을 ‘품위 있는 패배’로 본다는 것이다. R22는 글 안에 함께 나오는 레이몬타, 즉 비스와 홈구장 쪽을 가리키는 현지의 짧은 표기다. 낯선 한국 독자에게는 원정 장소를 암호처럼 줄여 썼다고 생각하면 읽기 쉽다.\n\n그가 경기 전에 두려워한 것은 그냥 패배가 아니었다. 비스와의 기세가 좋고, 홈 관중도 유난히 단단히 뭉쳤다고 느꼈으며, 자기 팀은 어려운 때를 보내고 있었다. 그래서 역사에 남을 만큼 크게 질 수도 있겠다고 걱정했다고 썼다. 외국인 선수가 많은 팀이 이 더비의 무게에 걸맞은 동기를 느낄지, 주도권을 완전히 넘겨 버리지는 않을지도 불안했다고 한다.\n\n이 대목은 외국인 선수들이 실제로 덜 뛰었다는 판정이 아니다. 어디까지나 이 팬이 경기를 앞두고 품었던 우려다. 지역 라이벌전의 중요성을 오래 축적해 온 관중과, 각자 다른 경로를 거쳐 온 선수들이 같은 감각으로 공유할 수 있을까 하는 질문이다. 그리고 정작 경기 뒤의 첫 결론은 그 우려가 모두 실현됐다는 비난이 아니라, 자신은 이 패배를 받아들일 수 있다는 말이었다.\n\n한 골 차로 졌다는 결과도 사람마다 다른 출발점과 만난다. 동점을 잡을 수 있다고 믿으며 마지막 몇 분을 기다린 팬에게 클리흐의 퇴장은 자기 팀이 버린 기회다. 반대로 크게 무너질 가능성부터 걱정했던 이 팬에게는 끝까지 결과를 다툰 경기가 예상보다 견딜 만하다. 둘 중 어느 쪽이 더 충성스러운 팬인지 고를 일은 아니다. 같은 스코어를 보고도 기대치가 달랐고, 따라서 경기 뒤 확인하고 싶은 것도 달랐다.\n\n그렇다고 이 긴 글이 경기 내용을 훌륭했다고 칭찬하는 것은 아니다. 축구의 수준을 이야기하는 대목에서는 양쪽 다 엑스트라클라사답다는 식의 쓴웃음을 던진다. 이어 레흐, 어쩌면 구르니크와의 사이에 간격이 벌어진다고 적다가 제공된 본문이 끊긴다. 누구와 누구의 격차를 어떤 기준으로 더 설명하려 했는지는 확인할 수 없다. 잘린 뒤를 채워 리그 판도를 논한 완결된 주장으로 만들지는 않았다.\n\n이 글에도 공감 10개가 붙었다. ‘홈에서는 늘 두 골’ 농담과 같은 표시 수다. 양쪽 팬의 규모나 동의율이 같다는 뜻은 아니지만, 이 수집 화면에 승자의 자기 확신만 있었던 것은 아니라는 정도는 보여 준다. 더비 패배를 차분히 받아들이는 말 역시 읽혔다. 수십 개의 짧은 클리흐 반응 사이에서 이 긴 글은, 패배 이후에도 자기 팀의 사정을 설명하고 싶은 팬의 자리를 남긴다.\n\n### 화면 밖에서도 말이 꼬였다\n\n경기가 끝나면 선수들만 평가받는 것이 아니다. 한 글은 방송에서 나왔다는 말을 옮긴 뒤 상대를 부르는 말과 함께 제발 그러지 말라는 반응을 보였다. 인용된 문장은 ‘선수들이 뛰고 싶어 했고 계획도 있었다’는 취지인데, 폴란드어 원문에서는 남성 선수들을 가리키는 문법 형태가 어색하게 쓰였다. 한국어 번역으로 내용만 옮기면 왜 웃음거리가 됐는지 사라지는 대목이다.\n\n제공된 것은 짧은 인용과 반응뿐이어서, 방송 전체를 듣고 발언자의 분석이 맞았는지 평가할 수는 없다. 다만 이 글은 팬들의 주의가 경기 내용에서 중계의 말투까지 옮겨 갔음을 보여 준다. 분석이 뻔하다고 비웃은 것인지, 문법이 꼬인 데 반응한 것인지, 두 가지가 함께 작용했는지는 단정하지 않는다. 게시판에는 별도로 C+ 인터뷰 담당자를 언급하는 짧은 글도 있지만, 대상 영상 없이 구체적인 방송 사고를 덧붙일 근거는 없다.\n\n응원가에 대한 반응도 한 건 있다. 어떤 방송 관계자가 크라쿠프 더비를 처음 보느냐며, 매 경기 같은 노래를 부르는데 왜 그러느냐는 취지다. 여기서 확인되는 것은 한 작성자가 방송 쪽 반응을 낯설어했다는 사실이다. 정작 어떤 노래가 문제였는지, 방송에서는 무슨 말을 했는지, 수위에 대한 지적이었는지는 자료에 담기지 않았다.\n\n그래서 이 짧은 글을 응원가의 내용이나 적절성에 관한 판결로 바꿀 수는 없다. 현장에서 반복되는 일을 늘 봐 온 사람의 감각과 그것을 문제 삼거나 새롭게 다루는 방송의 감각 사이에 마찰이 있었다는 흔적 정도다. 이 수집분에서는 가사를 재현할 자료도, 그럴 필요도 없다. 축구장 안의 일이 끝나도 중계가 무엇에 놀라고 무엇을 익숙하게 넘기는지까지 대화가 이어진다는 점이 남는다.\n\n### 오폴레의 한 줄, 대표팀의 한마디, 다음 경기\n\n더비 반응 사이로 오폴레에서 대체 무슨 일이 일어났느냐는 한 줄이 끼어든다. 그 한 줄만으로 이 게시판에서 별도의 큰 논쟁이 벌어졌다고 할 수는 없다. 다만 질문이 가리키는 경기의 결과는 확인할 수 있었다. 오드라 오폴레는 우니아 스키에르니에비체에 3–5로 졌다. 전반을 1–0으로 마쳤다가 1–3으로 뒤집혔고, 후반 막판 3–3을 만들었지만 추가시간에 다시 두 골을 내줬다. [우니아를 출처로 명시한 경기 보고](https://www.polskapilka.net/aktualnosci/57409/1-liga-osiem-goli-w-meczu-odra-unia/)\n\n이 정도의 흐름이면 짧은 놀람이 나온 배경은 이해된다. 84분과 86분에 따라잡고도 승점이 남지 않았다. 다만 제공된 반응은 그 놀람 한 건이므로, 오드라 팬들이 누구에게 책임을 돌렸는지나 우니아 팬들이 어떻게 환호했는지는 덧붙일 수 없다. 다른 경기의 결말이 공용 태그로 잠깐 들어와 더비 사이를 가로지른 장면이다.\n\n이탈리아 쪽으로 눈을 돌린 글도 하나 있다. 우디네세의 경기와 ‘코스타’를 연결하며, 감독이 떠난 뒤에도 싸우는 모습 없이 졌다는 취지로 거칠게 불평한다. 최하위가 됐다는 말까지 붙지만, 이번 원고에서는 그 감독 거취와 순위 주장을 원출처로 확인하지 못했다. 이 한 건은 우디네세를 향한 팬의 불만으로만 남긴다. 폴란드 리그 더비를 이야기하던 태그라고 해서 사람들의 시선까지 한 리그에 고정된 것은 아니었다.\n\n대표팀 이야기는 뒤늦게 다시 나타난다. 클리흐를 뽑으라는 앞선 비꼼과 달리, 여기서는 아우구스티니아크가 뽑히지 않은 것이야말로 가장 큰 문제라는 짧은 불만이다. 해당 명단과 선발 사유를 이 자료에서 확인한 것은 아니므로 실제 누락의 평가까지 확대하지 않는다. 앞의 글이 ‘투지’라는 명분을 조롱한다면, 이 글은 선발에 대한 자기 불만을 더 큰 사안으로 끌어올린다. 그 사이의 시간이 있다고 두 글을 서로 주고받은 논쟁으로 묶을 수는 없다.\n\n마지막으로 남는 것은 다음 경기를 기다리는 가벼운 기분이다. 한 글은 이런 금요일에는 불평할 수 없다며, 내일은 코로나와 라도미아크 경기부터 시작한다고 썼다. 축구의 신들이 요즘 자비롭다는 말도 붙였다. 다음 경기 일정은 이 글이 표현한 당시의 기대이며, 여기서 최신 일정 안내로 제시하는 것은 아니다. 공감 6개가 붙은 이 문장에는 더비의 승패와 별개로 볼거리를 충분히 받았다는 만족이 있다.\n\n누군가는 베테랑이 버린 몇 분을 계속 곱씹고, 누군가는 두 골짜리 홈 승리의 익숙함을 즐기며, 또 누군가는 생각보다 버틴 패배를 받아들인다. 그러는 동안 새로 들어온 사람은 퇴장 GIF부터 찾는다. 이번 #mecz에서 가장 생생한 것은 이 서로 다른 속도다. 경기 종료 휘슬 하나로 대화가 한 감정에 도착하지 않았고, 그 틈에서 이미 다음 경기까지 기다리는 사람이 있었다.\n\n<details><summary>범위와 근거<\/summary>\n\n- 실행: `2026-11-07_120325`. Wykop `#mecz` 피드 1개에서 새 글 40개, 작성자 35명. 제공된 본문 약 4,586자이며 최다 작성자의 비중은 5%다. 이번 수집문과 문맥 확인을 위한 현재 폴더의 `source.json` 해당 피드만 읽었다. 잘린 크라코비아 팬의 글은 원본에도 같은 지점까지만 들어 있었다. 이전 원고·완성본·프로젝트 문서는 참고하지 않았다.\n- 시각: 원본은 `+09:00`으로 2026년 11월 7일 14:32:54~17:34:57을 표시한다. 팬들은 경기를 ‘금요일’로 부르며, 구단 보도상 경기는 폴란드 현지 11월 6일이다. 수집 시각을 경기의 실제 발생 시각과 동일시하지 않았다.\n- 표본: 공감 수는 수집 당시 각 글에 표시된 값이다. 인용한 수치는 태그 전체의 지지율·구단별 팬 수·서로 겹치지 않는 동의자 수가 아니다. 성인 인증 안내만 표시된 두 글, 해시태그나 링크만 남은 글에서는 내용을 복원하지 않았다.\n- [비스와 공식 보도 — Derby są nasze!](https://wislakrakow.com/en/news/derby-sa-nasze-wisla-krakow-pokonala-cracovie-2-1): 2026년 11월 7일자 검색 제공 본문에서 현지 경기일, 2–1 결과, 득점자, 더비 회차, 리그 더비의 복귀와 홈 7연승을 확인했다. 페이지 직접 열기는 오류가 나 검색에서 확인된 본문 범위만 사용했다.\n- [크라코비아 공식 경기 보고](https://www.cracovia.pl/posts/derby-krakowa-nie-dla-pasow-cracovia-przegrywa-przy-reymonta/6513): 패배 결과와 클리흐의 추가시간 퇴장, 상대 선수 및 비신사적 행동이라는 기록을 확인했다. [TVP 경기 보도](https://sport.tvp.pl/96346602/wisla-lepsza-w-204-derbach-krakowa-biala-gwiazda-wciaz-niepokonana-na-wlasnym-stadionie) 등과 추가시간 분 표기에 차이가 있어 본문에서는 분을 확정하지 않았다.\n- [PolskaPilka의 오드라–우니아 보고](https://www.polskapilka.net/aktualnosci/57409/1-liga-osiem-goli-w-meczu-odra-unia/): 출처를 우니아 구단으로 명시한 자료에서 3–5 결과와 득점 흐름을 확인했다. 구단 원문 자체를 확보한 것과는 구분한다.\n- 확정하지 않은 것: 클리흐의 최종 출전정지 기간, 그젤라크의 거취, 특정 과거 파울, 대상이 불명확한 두 번째 퇴장, 우디네세 관련 감독·순위 주장, 대표팀 명단 관련 주장. 모두 팬의 요구·기억·예상·불만 범위로 귀속했다. 응원가와 방송 발언도 제공된 단편 이상으로 재구성하지 않았다.\n- 직접 인용은 제공된 폴란드어의 번역이다. 욕설과 개인에 대한 비하는 문맥에 필요한 수준으로 풀어 썼고, 이용자 닉네임과 계정은 싣지 않았다.\n\n<\/details>\n"}];
const pick = document.getElementById("pick");
const doc = document.getElementById("doc");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const tabsEl = document.getElementById("tabs");
const when = document.getElementById("when");
let current = null;

// 보고 원고를 탭으로 가른다. `## 이름 | 나라`가 커뮤니티 탭이고, 나머지는 전부 안내 탭이다.
function parseReport(md) {
  const intro = [];
  const tabs = [];
  md.split(/^(?=## )/m).forEach((part) => {
    const m = part.match(/^## ([^|\n]+?)[ \t]*\|[ \t]*([^\n]+?)[ \t]*(?:\n|$)/);
    if (!m) { intro.push(part); return; }
    tabs.push({ k: "s" + tabs.length, name: m[1], where: m[2], md: part.slice(m[0].length).replace(/\n-{3,}\s*$/, "") });
  });
  return { intro: intro.join("\n").replace(/^# .*\n/, "").replace(/\n-{3,}\s*(?=\n## |$)/g, "\n"), tabs };
}

// 원고에는 포럼 글이 옮겨져 있으니, 글자로만 보이게 하고 스크립트가 될 만한 것은 뺀다.
function toHtml(md) {
  const t = document.createElement("template");
  t.innerHTML = marked.parse(md, { mangle: false, headerIds: false });
  const safeTags = new Set("P BR A EM STRONG BLOCKQUOTE UL OL LI H1 H2 H3 H4 H5 H6 HR PRE CODE DETAILS SUMMARY TABLE THEAD TBODY TR TH TD DEL SPAN".split(" "));
  t.content.querySelectorAll("*").forEach((e) => {
    if (!safeTags.has(e.tagName)) { e.remove(); return; }
    [...e.attributes].forEach((a) => {
      const link = e.tagName === "A" && a.name === "href" && /^(https?:|#)/i.test(a.value.trim());
      if (!link && a.name !== "title") e.removeAttribute(a.name);
    });
  });
  return t.content;
}

function decorate(root) {
  root.querySelectorAll("table").forEach((t) => {
    const box = document.createElement("div");
    box.className = "tbl";
    t.replaceWith(box);
    box.appendChild(t);
    const heads = [...t.querySelectorAll("th")].map((h) => h.textContent.trim());
    const result = heads.indexOf("결과");
    t.querySelectorAll("tbody tr").forEach((tr) => {
      [...tr.children].forEach((td, i) => {
        const text = td.textContent.trim();
        if (/^약?\s*[\d,]+$/.test(text)) td.classList.add("num");
        if (i === result) {
          const c = document.createElement("span");
          c.className = "chip " + (/못|막|멈|보류|없음|쉼|실패/.test(text) ? "stop" : "ok");
          c.textContent = text;
          td.replaceChildren(c);
        }
      });
    });
  });
  root.querySelectorAll("a[href^='http']").forEach((a) => { a.target = "_blank"; a.rel = "noopener"; });
}

function setHash(id, k) {
  const h = k === "intro" ? id : id + "/" + k;
  if (location.hash.slice(1) !== h) history.replaceState(null, "", "#" + h);
}

function showTab(k) {
  const r = current;
  const tab = r.parsed.tabs.find((t) => t.k === k);
  const key = tab ? k : "intro";
  doc.className = tab ? "" : "intro";
  doc.replaceChildren();
  if (tab) {
    const frag = toHtml("# " + tab.name + "\n\n" + tab.where + " · " + r.label + "\n\n" + tab.md);
    doc.appendChild(frag);
    const first = doc.querySelector("h1 + p + p");
    if (first) first.classList.add("scope");
  } else {
    doc.appendChild(toHtml(r.parsed.intro));
    const first = doc.firstElementChild;
    if (first && first.tagName === "P") first.classList.add("scope");
  }
  decorate(doc);
  tabsEl.querySelectorAll("button").forEach((b) => {
    const on = b.dataset.k === key;
    b.setAttribute("aria-selected", on ? "true" : "false");
    if (on) tabsEl.scrollLeft = b.offsetLeft - (tabsEl.clientWidth - b.offsetWidth) / 2;
  });
  setHash(r.id, key);
  window.scrollTo(0, 0);
}

function tabButton(k, name, where) {
  const b = document.createElement("button");
  b.type = "button";
  b.setAttribute("role", "tab");
  b.dataset.k = k;
  b.textContent = name;
  if (where) {
    const w = document.createElement("span");
    w.className = "where";
    w.textContent = where;
    b.appendChild(w);
  }
  b.addEventListener("click", () => {
    showTab(k);
    const top = document.querySelector("nav.tabs").offsetTop;
    if (window.scrollY > top) window.scrollTo(0, top);
  });
  return b;
}

// 날짜를 바꿔도 보던 커뮤니티에 머문다. 그날 없는 곳이면 안내 탭으로 간다.
function showReport(id, wantName) {
  const i = Math.max(0, REPORTS.findIndex((r) => r.id === id));
  const r = REPORTS[i];
  if (!r) return;
  r.parsed = r.parsed || parseReport(r.md);
  current = r;
  pick.value = r.id;
  prev.disabled = i >= REPORTS.length - 1;
  next.disabled = i <= 0;
  when.textContent = r.label;
  tabsEl.replaceChildren(tabButton("intro", "안내"));
  r.parsed.tabs.forEach((t) => tabsEl.appendChild(tabButton(t.k, t.name, t.where)));
  const same = wantName && r.parsed.tabs.find((t) => t.name === wantName || t.k === wantName);
  showTab(same ? same.k : "intro");
}

function currentName() {
  if (!current) return null;
  const on = tabsEl.querySelector('button[aria-selected="true"]');
  const t = on && current.parsed.tabs.find((x) => x.k === on.dataset.k);
  return t ? t.name : null;
}

REPORTS.forEach((r, i) => {
  const o = document.createElement("option");
  o.value = r.id;
  o.textContent = r.label + (i === 0 ? " (최신)" : "");
  pick.appendChild(o);
});
function go(step) {
  const i = REPORTS.findIndex((r) => r.id === current.id) + step;
  if (REPORTS[i]) showReport(REPORTS[i].id, currentName());
}
pick.addEventListener("change", () => showReport(pick.value, currentName()));
prev.addEventListener("click", () => go(1));
next.addEventListener("click", () => go(-1));
function fromHash() {
  const [id, k] = location.hash.slice(1).split("/");
  showReport(id || (REPORTS[0] && REPORTS[0].id), k);
}
window.addEventListener("hashchange", fromHash);
if (REPORTS.length) fromHash();
</script>
</body>
</html>
