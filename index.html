본·프로젝트 문서·다른 로컬 파일은 참고하지 않았다.\n- 계약 확인: [맨체스터 시티 공식 홀란 재계약 발표](https://www.mancity.com/news/mens/erling-haaland-10-year-manchester-city-contract-63872694). 2034년 여름까지의 계약을 확인했다. 이번 팬들이 추정한 특정 이탈 조항·바르셀로나의 지불 가능액은 확인되지 않았다.\n- 사건 확인: [프리미어리그 2026년 9월 29일 공식 발표](https://www.premierleague.com/en/news/4727779/premier-league-statement-manchester-city-fc). 위반 판단과 제재의 별도 절차를 확인했다. 항소는 [The National의 10월 2일 보도에 실린 시티 성명](https://www.thenationalnews.com/sport/football/2026/10/02/manchester-city-lodge-appeal-against-premier-league-commission-decision/)으로 확인했다. 이는 11월 7일 현재 모든 절차의 상태를 포괄적으로 확인했다는 뜻은 아니다. 이번 게시물의 대회 불참 가정을 확정 제재로 서술하지 않았다.\n- 선수 배경 확인: [토트넘 2026년 7월 22일 공식 발표](https://www.tottenhamhotspur.com/news/1079320/lankshear-on-the-move-to-boro). 랭크셔의 미들즈브러 이적 합의를 확인했다. [더 선을 인용한 관심설 재전달 기사](https://sports.yahoo.com/articles/newcastle-united-eyeing-middlesbrough-striker-000000825.html)는 존재하나 더 선 원기사와 구단의 공식 제안·협상은 이번 확인에서 확보하지 못했다. 해당 재전달 기사의 성적·부상 등 부가 주장은 원고의 사실 근거로 사용하지 않았다.\n- 직접 인용은 제공된 영어 게시물의 번역이다. 게시자의 계정·닉네임은 기재하지 않았다. 자료가 적어 다른 날짜의 반응이나 외부 커뮤니티 반응으로 분량을 보충하지 않았다.\n\n<\/details>\n\n## Wykop #mecz | 폴란드\n\n이번에는 Wykop의 축구 태그 **#mecz**에서 수집한 새 글 40개를 읽었다. 작성자는 35명이며, 제공된 본문은 약 4,586자다. 한국 시각 11월 7일 06:32~09:34의 글들로, 중심은 폴란드 현지 11월 6일 금요일에 열린 비스와 크라쿠프–크라코비아 더비다. 아래의 분위기는 이 짧은 수집 구간에서 드러난 반응이다.\n\n**개관**\n\n- **크라쿠프의 승자는 비스와.** 더비 2–1 승리와 리그 홈 7연승은 구단 공식 보도로 확인했다. 이긴 쪽에서는 도시의 주인이 누구인지 외치는 구호와 ‘홈에서는 늘 두 골’이라는 농담이 나왔다.\n- **대화의 중심은 마테우시 클리흐의 막판 퇴장.** 크라코비아의 한 골 차 열세에서 나온 행동에 베테랑의 책임을 묻는 글이 연이어 올라왔다. 몇 경기 쉬게 해야 한다는 말은 팬들의 징계 요구이며, 확정 처분이 아니다.\n- **패배했다고 모두 무너진 것은 아니다.** 크라코비아 팬 한 명은 더 큰 참패를 걱정했던 만큼 이번 결과를 ‘품위 있는 패배’로 받아들였다. 승자의 환호와 패자의 안도가 같은 화면에 놓였다.\n- **곁가지에는 중계진, 대표팀, 다른 경기.** 방송의 말실수와 더비 응원가를 둘러싼 반응, 아우구스티니아크 발탁 요구 등이 섞였다. 대상이나 앞뒤가 빠진 글은 사건의 전말로 확대하지 않았다.\n\n---\n\n### 동점까지 남은 시간에, 가장 경험 많은 선수가\n\n처음 화면을 채우는 것은 골 세리머니가 아니다. 클리흐의 이름, 웃음을 뜻하는 ‘XD’, 누군가를 걷어찼다는 짧은 말이 거의 같은 시간에 몰려 있다. 폴란드 대표팀 출신이라는 경력도 이때는 칭찬이 아니라 비꼼의 재료다. 무슨 장면을 봤는지 서로 길게 설명할 필요조차 없다는 듯, 이름 하나만 쓰고 웃는 글도 있다.\n\n경기의 뼈대부터 놓자. 비스와는 크라코비아를 2–1로 이겼고, 클리흐는 경기 종료 직전 상대 선수 제레미 기유므노를 향한 비신사적 행동으로 퇴장했다. 크라코비아 공식 보고서는 이를 후반 추가시간의 일로 기록한다. 게시판에서는 상대를 걷어찬 행동으로 받아들이며 비난이 이어졌다. 퇴장의 정확한 분 표기는 보도에 따라 추가시간 3분 또는 4분으로 갈리므로, 여기서는 막판 추가시간으로만 적는다. [크라코비아 공식 경기 보고](https://www.cracovia.pl/posts/derby-krakowa-nie-dla-pasow-cracovia-przegrywa-przy-reymonta/6513)\n\n이 구간에서 가장 많은 공감, 41개를 받은 글은 화려한 욕설보다 앞의 경력 나열이 더 날카롭다. 가장 경험 많은 선수, 전 국가대표, 프리미어리그에서도 뛰었던 선수. 그런 사람이 최대 라이벌과의 경기에서, 동점을 위해 아직 몇 분을 쓸 수 있는 순간에 왜 저런 일을 하느냐는 것이다. 글에 등장하는 ‘아직 5분’은 작성자가 당시 남은 기회를 표현한 말이지, 이 원고에서 별도로 확정한 잔여시간 수치는 아니다.\n\n이 글의 불만은 퇴장당한 선수가 약해서도, 더비를 가볍게 여겨서도 아니다. 오히려 그 경력 때문에 더 참기 어렵다는 쪽이다. 힘든 순간을 가장 많이 겪어 본 선수가 남은 공격을 정리해 줘야 할 때, 팀이 쓸 수 있는 인원부터 줄여 버렸다. 한 골 차로 지는 경기의 추가시간에는 우연한 세컨드볼 하나도 희망이다. 팬이 화를 내는 지점은 그 희망을 상대 수비가 아니라 자기 팀 선수가 깎아 먹었다는 데 있다.\n\n클리흐를 좋아한다고 먼저 밝힌 글도 같은 대목에서 멈췄다. 어깨를 맞대고 싸우는 것은 이해하지만, 한 골 뒤진 상태에서 이런 행동을 하는 것은 자기 구단을 방해하는 일이라는 취지다. 공감은 10개. 선수에 대한 호감과 그날 행동에 대한 판단을 따로 두려는 글이다. 좋아하니까 감싸야 한다는 문장도 아니고, 한 번의 잘못으로 그동안의 호감을 모두 취소한다는 선언도 아니다. 지금 이 장면은 도저히 변호할 수 없다는 실망이다.\n\n그 옆에는 “교체될 때까지도 못 기다렸네”라는 짧은 비꼼이 붙었다. 막판 파울이 정말 아무 의미 없었다는 글도 뒤따랐다. 이 둘을 실제 교체 계획이나 벤치 내부 사정의 증거로 읽을 수는 없다. 다만 글쓴이들이 느낀 허무함은 선명하다. 경기가 끝나 가는데 끝까지 남아 있지도 못했다는 것. 이 수집분의 클리흐 비판은 대체로 ‘투지가 부족하다’가 아니라 ‘투지를 어디에 썼느냐’에 가까웠다.\n\n### ‘몇 경기 쉬어라’와 ‘대표팀에 뽑아라’ 사이\n\n분노는 곧 다음 경기로 넘어간다. 생각할 시간을 갖도록 몇 경기 쉬었으면 좋겠다는 글이 공감 29개를 받았다. 약 네 경기를 쉬게 하자는 별도 글에는 15개가 붙었다. 처음부터 출전정지가 나올 것이라며 웃은 글도 있었다. 여기서 ‘몇 경기’는 규정 해설이 아니라 팬이 바라는 처분의 크기다. 이번에 확인한 자료에서는 이 사건의 최종 징계 공지를 확보하지 못했으며, 네 경기라는 숫자를 이미 결정된 징계처럼 옮길 근거도 없다.\n\n특징적인 것은 처벌을 요구하는 말이 단순한 상대 팀 조롱으로만 흘러가지 않는다는 점이다. 가장 공감이 많이 붙은 글부터가 남아 있던 동점 가능성을 아쉬워한다. 한쪽에서는 우스운 장면을 소비하고, 다른 쪽에서는 실제로 잃어버린 공격 시간을 따진다. 같은 ‘XD’가 붙어 있어도 웃음의 내용은 하나가 아니다. 어이가 없어서 웃는 것과 남의 실수를 즐기는 것이 이 화면에서는 나란히 보인다. 개별 작성자의 응원 팀이 모두 밝혀진 것은 아니므로, 어느 진영이 얼마나 비난했다고 나눌 수는 없다.\n\n대표팀을 끌어들인 농담은 이 불만을 다른 방향으로 꺾는다. 한 글은 ‘야네크’에게 클리흐를 뽑으라며, 전사가 필요하다는 식의 말을 하면 되겠다고 비꼰다. 공감 11개다. 실제 대표팀 발탁설을 전하는 글이 아니다. 통제되지 않은 행동에도 ‘싸울 줄 아는 선수’라는 포장을 씌울 수 있느냐는 조롱이다. 선수의 거친 행동과 대표팀의 정신력 담론을 한 문장 안에 겹쳐 놓은 셈이다.\n\n야체크 구랄스키의 이름을 불러낸 글도 있다. 클리흐가 점점 그를 닮아 간다면서, 얼마 전 상대 페널티지역에서도 비슷한 일을 했던 것 같다고 덧붙였다. 여기서 앞선 사건은 글쓴이 자신의 기억에 기대고 있으며 구체적인 경기나 장면이 제시되지 않았다. 따라서 반복 전력으로 확정할 수는 없다. 이 글에서 읽을 수 있는 것은 행동 하나가 선수의 이미지까지 바꾸고 있다는 반응이다. 잘 아는 이름을 하나 던지면 어떤 유형의 선수 이야기를 하는지 통할 것이라고 기대하는, 현지 게시판의 압축된 대화이기도 하다.\n\n퇴장 논쟁 옆에서 주심 시몬 마르치니아크에게도 화살이 갔다. 한 글은 왜 그 일에 끼어들었느냐고 불평하면서도 곧바로 클리흐를 비난한다. 이 한 문장만으로 판정에 반대하는 흐름이 컸다고 말할 수는 없다. 무엇에 개입한 것을 문제 삼는지도 본문에서는 명확하지 않다. 오히려 심판에게 불만이 있어도 선수 행동까지 정당화하지는 않는 반응이 함께 있었다는 정도가 이 글이 보여 주는 범위다.\n\n잠시 뒤에는 ‘두 번째 퇴장’이 에르틀탈러의 얼굴을 잡거나 때려서 나온 것 같다는 추측도 등장한다. 그러나 해당 글은 누구의 어떤 퇴장을 말하는지 충분히 밝히지 않고, 문장 자체도 ‘아마’라는 추정이다. 이를 클리흐 사건에 합쳐 추가 폭행의 전말로 만들지는 않았다. 경기 여러 개가 겹치는 공용 태그에서는 화면상 이웃한 문장이 반드시 같은 사건의 다음 장면은 아니다.\n\n### 화를 가라앉히려면 브라티슬라바까지 걸어야 한다\n\n축구 게시판의 분노는 곧 농담의 거리 단위로도 바뀐다. 비스와 태그를 함께 단 한 글은 클리흐의 그 어처구니없는 파울을 걷기로 풀려면 아마 브라티슬라바까지 걸어가야겠다고 했다. 이것은 실제 여행 계획이 아니라, 잠깐 산책하는 정도로는 그 장면이 머리에서 빠지지 않을 것이라는 과장이다. 몇 줄 전의 ‘몇 경기 반성하라’와 같은 불쾌감이지만, 여기서는 긴 도보 여행의 형태를 얻었다.\n\n더 뒤에는 클리흐를 변호하겠다며 운을 뗀 글이 있다.\n\n> “클리흐를 변호하자면, 나도 그와 동갑인데 지금처럼 어리석었던 적이 없다.”\n\n변호하겠다는 첫머리와 마지막 자기 고백이 충돌하는 농담이다. 나이를 먹으면 반드시 판단도 나아지리라는 기대를 자기 쪽에서 먼저 무너뜨린다. 선수를 감싸는 근거가 경험이나 인품이 아니라 ‘나도 요즘 이렇다’라니, 변호의 형식을 빌린 체념에 가깝다. 공감 4개의 작은 곁가지지만, 처음 몇 분 동안의 날 선 비난과는 문장의 온도가 달라졌다.\n\n한편 수집 시각 14:54에는 퇴장 장면 GIF를 가진 사람이 있느냐는 요청이 올라온다. 14:59에는 다른 글이 클리흐가 대체 무슨 일을 했기에 그렇게 비판받느냐고 묻는다. 앞에서는 모두가 같은 장면을 본 것처럼 이름과 웃음만 주고받았지만, 뒤늦게 들어온 사람에게는 정작 사건이 빠져 있다. 누군가는 이미 판단을 끝내고, 누군가는 이제 영상을 찾는다. 실시간 태그가 늘 같은 속도로 움직이는 집단은 아니라는 것이 이 두 글에서 드러난다.\n\n초반의 웃음 표기도 그런 환경에서 읽어야 한다. ‘XD’가 여러 번 나온다고 해서 게시판이 모두 즐거웠다는 뜻은 아니다. 경기력에 대한 비평을 길게 적기 전에 당혹감부터 표시하는 글, 상대의 기행에 웃는 글, 선수에게 실망한 글이 같은 부호를 쓴다. 이 구간에서는 그 뒤에 붙는 구체적인 이유, 특히 남은 시간과 베테랑의 경력을 말하는 문장이 감정을 가려 준다.\n\n### 이긴 쪽의 축배는 ‘정확히 두 골’\n\n클리흐 이야기가 이어지는 사이, 비스와 쪽에서는 더비 승리의 문장이 올라왔다.\n\n> “누구나 말할 거야, 크라쿠프는 비스와가 지배한다고!”\n\n원문은 대문자로 적혔고 공감 12개를 받았다. ‘KAŻDY TO POWIE, WISŁA RZĄDZI W KRAKOWIE’는 여기서 경기 분석보다 도시의 승자를 선언하는 말이다. 몇 분 전까지는 경험 많은 선수가 왜 그랬는지 따졌다면, 이 글에서는 한 경기의 결과를 도시 전체의 이름으로 확장한다. 더비를 이긴 쪽이 누릴 수 있는 과장이다. 이를 실제 지역 전체의 지지 분포나 장기적인 세력 판정으로 받아들일 필요는 없다.\n\n확인된 경기 맥락도 이 환호에 무게를 준다. 비스와 공식 보도에 따르면 이번 경기는 204번째 크라쿠프 더비였고, 두 팀의 리그 더비는 4년여 만에 돌아왔다. 비스와는 마르크 카르보와 마르코 보지치의 골로 이겼으며, 이 승리로 이번 리그 홈경기 7연승을 이어 갔다. 오래 기다린 맞대결과 계속되는 홈 승리가 겹친 날이었다. [비스와 공식 경기 보도](https://wislakrakow.com/en/news/derby-sa-nasze-wisla-krakow-pokonala-cracovie-2-1)\n\n그 좋은 기분을 가장 생활감 있게 표현한 것은 압도적인 전력 자랑보다 숫자 농담이었다. 홈에서는 다 이기는 데다 늘 두 골씩 넣는다며, 더도 덜도 없이 이게 바로 안정감이라는 글이다. 공감 10개. 매번 다른 드라마를 치르는 경기들을 자기 팀만의 익숙한 규칙으로 묶어 즐긴다. 여기서 ‘두 골’은 팬이 자기 팀의 흐름을 말하는 방식이며, 이번 원고에서 모든 홈경기의 개별 스코어를 대조해 새 통계를 만든 것은 아니다.\n\n더비에서는 원래 상대보다 한 골 더 넣으면 충분하지만, 이 팬이 좋아하는 것은 그 충분함이 반복된다는 감각이다. 승리를 기다리는 시간이 불안 일변도로만 느껴지지 않고, 자기 팀에 기대해 볼 만한 결말이 생겼다. 클리흐 비판의 핵심이 남아 있던 기회를 스스로 없앴다는 것이었다면, 이쪽 농담의 핵심은 홈에서 기대한 보상을 또 받았다는 데 있다. 한 경기의 끝에서 두 팀의 팬이 들여다보는 시간이 다르다.\n\n다른 글은 지금 크라쿠프를 지배하는 것은 비스와라면서 그젤라크는 오늘 짐을 쌀 수도 있겠다고 붙였다. 앞부분은 승리 선언이고 뒷부분은 감독 거취에 대한 팬의 예상이다. 이 글 하나를 경질 소식으로 읽을 수는 없다. 더비가 끝나자마자 상대 팀의 다음 날까지 입에 올리는, 승부 뒤의 거친 대화로 남겨 두는 편이 맞다.\n\n### 진 쪽의 긴 글: 나는 무너지지 않았다\n\n그런데 크라코비아 쪽에서 나온 가장 긴 반응은 예상과 조금 다르다. 이 팬은 자신이 낙담하지 않았다고 시작한다. 매우 힘든 시기에 R22 원정을 치렀고, 이번을 ‘품위 있는 패배’로 본다는 것이다. R22는 글 안에 함께 나오는 레이몬타, 즉 비스와 홈구장 쪽을 가리키는 현지의 짧은 표기다. 낯선 한국 독자에게는 원정 장소를 암호처럼 줄여 썼다고 생각하면 읽기 쉽다.\n\n그가 경기 전에 두려워한 것은 그냥 패배가 아니었다. 비스와의 기세가 좋고, 홈 관중도 유난히 단단히 뭉쳤다고 느꼈으며, 자기 팀은 어려운 때를 보내고 있었다. 그래서 역사에 남을 만큼 크게 질 수도 있겠다고 걱정했다고 썼다. 외국인 선수가 많은 팀이 이 더비의 무게에 걸맞은 동기를 느낄지, 주도권을 완전히 넘겨 버리지는 않을지도 불안했다고 한다.\n\n이 대목은 외국인 선수들이 실제로 덜 뛰었다는 판정이 아니다. 어디까지나 이 팬이 경기를 앞두고 품었던 우려다. 지역 라이벌전의 중요성을 오래 축적해 온 관중과, 각자 다른 경로를 거쳐 온 선수들이 같은 감각으로 공유할 수 있을까 하는 질문이다. 그리고 정작 경기 뒤의 첫 결론은 그 우려가 모두 실현됐다는 비난이 아니라, 자신은 이 패배를 받아들일 수 있다는 말이었다.\n\n한 골 차로 졌다는 결과도 사람마다 다른 출발점과 만난다. 동점을 잡을 수 있다고 믿으며 마지막 몇 분을 기다린 팬에게 클리흐의 퇴장은 자기 팀이 버린 기회다. 반대로 크게 무너질 가능성부터 걱정했던 이 팬에게는 끝까지 결과를 다툰 경기가 예상보다 견딜 만하다. 둘 중 어느 쪽이 더 충성스러운 팬인지 고를 일은 아니다. 같은 스코어를 보고도 기대치가 달랐고, 따라서 경기 뒤 확인하고 싶은 것도 달랐다.\n\n그렇다고 이 긴 글이 경기 내용을 훌륭했다고 칭찬하는 것은 아니다. 축구의 수준을 이야기하는 대목에서는 양쪽 다 엑스트라클라사답다는 식의 쓴웃음을 던진다. 이어 레흐, 어쩌면 구르니크와의 사이에 간격이 벌어진다고 적다가 제공된 본문이 끊긴다. 누구와 누구의 격차를 어떤 기준으로 더 설명하려 했는지는 확인할 수 없다. 잘린 뒤를 채워 리그 판도를 논한 완결된 주장으로 만들지는 않았다.\n\n이 글에도 공감 10개가 붙었다. ‘홈에서는 늘 두 골’ 농담과 같은 표시 수다. 양쪽 팬의 규모나 동의율이 같다는 뜻은 아니지만, 이 수집 화면에 승자의 자기 확신만 있었던 것은 아니라는 정도는 보여 준다. 더비 패배를 차분히 받아들이는 말 역시 읽혔다. 수십 개의 짧은 클리흐 반응 사이에서 이 긴 글은, 패배 이후에도 자기 팀의 사정을 설명하고 싶은 팬의 자리를 남긴다.\n\n### 화면 밖에서도 말이 꼬였다\n\n경기가 끝나면 선수들만 평가받는 것이 아니다. 한 글은 방송에서 나왔다는 말을 옮긴 뒤 상대를 부르는 말과 함께 제발 그러지 말라는 반응을 보였다. 인용된 문장은 ‘선수들이 뛰고 싶어 했고 계획도 있었다’는 취지인데, 폴란드어 원문에서는 남성 선수들을 가리키는 문법 형태가 어색하게 쓰였다. 한국어 번역으로 내용만 옮기면 왜 웃음거리가 됐는지 사라지는 대목이다.\n\n제공된 것은 짧은 인용과 반응뿐이어서, 방송 전체를 듣고 발언자의 분석이 맞았는지 평가할 수는 없다. 다만 이 글은 팬들의 주의가 경기 내용에서 중계의 말투까지 옮겨 갔음을 보여 준다. 분석이 뻔하다고 비웃은 것인지, 문법이 꼬인 데 반응한 것인지, 두 가지가 함께 작용했는지는 단정하지 않는다. 게시판에는 별도로 C+ 인터뷰 담당자를 언급하는 짧은 글도 있지만, 대상 영상 없이 구체적인 방송 사고를 덧붙일 근거는 없다.\n\n응원가에 대한 반응도 한 건 있다. 어떤 방송 관계자가 크라쿠프 더비를 처음 보느냐며, 매 경기 같은 노래를 부르는데 왜 그러느냐는 취지다. 여기서 확인되는 것은 한 작성자가 방송 쪽 반응을 낯설어했다는 사실이다. 정작 어떤 노래가 문제였는지, 방송에서는 무슨 말을 했는지, 수위에 대한 지적이었는지는 자료에 담기지 않았다.\n\n그래서 이 짧은 글을 응원가의 내용이나 적절성에 관한 판결로 바꿀 수는 없다. 현장에서 반복되는 일을 늘 봐 온 사람의 감각과 그것을 문제 삼거나 새롭게 다루는 방송의 감각 사이에 마찰이 있었다는 흔적 정도다. 이 수집분에서는 가사를 재현할 자료도, 그럴 필요도 없다. 축구장 안의 일이 끝나도 중계가 무엇에 놀라고 무엇을 익숙하게 넘기는지까지 대화가 이어진다는 점이 남는다.\n\n### 오폴레의 한 줄, 대표팀의 한마디, 다음 경기\n\n더비 반응 사이로 오폴레에서 대체 무슨 일이 일어났느냐는 한 줄이 끼어든다. 그 한 줄만으로 이 게시판에서 별도의 큰 논쟁이 벌어졌다고 할 수는 없다. 다만 질문이 가리키는 경기의 결과는 확인할 수 있었다. 오드라 오폴레는 우니아 스키에르니에비체에 3–5로 졌다. 전반을 1–0으로 마쳤다가 1–3으로 뒤집혔고, 후반 막판 3–3을 만들었지만 추가시간에 다시 두 골을 내줬다. [우니아를 출처로 명시한 경기 보고](https://www.polskapilka.net/aktualnosci/57409/1-liga-osiem-goli-w-meczu-odra-unia/)\n\n이 정도의 흐름이면 짧은 놀람이 나온 배경은 이해된다. 84분과 86분에 따라잡고도 승점이 남지 않았다. 다만 제공된 반응은 그 놀람 한 건이므로, 오드라 팬들이 누구에게 책임을 돌렸는지나 우니아 팬들이 어떻게 환호했는지는 덧붙일 수 없다. 다른 경기의 결말이 공용 태그로 잠깐 들어와 더비 사이를 가로지른 장면이다.\n\n이탈리아 쪽으로 눈을 돌린 글도 하나 있다. 우디네세의 경기와 ‘코스타’를 연결하며, 감독이 떠난 뒤에도 싸우는 모습 없이 졌다는 취지로 거칠게 불평한다. 최하위가 됐다는 말까지 붙지만, 이번 원고에서는 그 감독 거취와 순위 주장을 원출처로 확인하지 못했다. 이 한 건은 우디네세를 향한 팬의 불만으로만 남긴다. 폴란드 리그 더비를 이야기하던 태그라고 해서 사람들의 시선까지 한 리그에 고정된 것은 아니었다.\n\n대표팀 이야기는 뒤늦게 다시 나타난다. 클리흐를 뽑으라는 앞선 비꼼과 달리, 여기서는 아우구스티니아크가 뽑히지 않은 것이야말로 가장 큰 문제라는 짧은 불만이다. 해당 명단과 선발 사유를 이 자료에서 확인한 것은 아니므로 실제 누락의 평가까지 확대하지 않는다. 앞의 글이 ‘투지’라는 명분을 조롱한다면, 이 글은 선발에 대한 자기 불만을 더 큰 사안으로 끌어올린다. 그 사이의 시간이 있다고 두 글을 서로 주고받은 논쟁으로 묶을 수는 없다.\n\n마지막으로 남는 것은 다음 경기를 기다리는 가벼운 기분이다. 한 글은 이런 금요일에는 불평할 수 없다며, 내일은 코로나와 라도미아크 경기부터 시작한다고 썼다. 축구의 신들이 요즘 자비롭다는 말도 붙였다. 다음 경기 일정은 이 글이 표현한 당시의 기대이며, 여기서 최신 일정 안내로 제시하는 것은 아니다. 공감 6개가 붙은 이 문장에는 더비의 승패와 별개로 볼거리를 충분히 받았다는 만족이 있다.\n\n누군가는 베테랑이 버린 몇 분을 계속 곱씹고, 누군가는 두 골짜리 홈 승리의 익숙함을 즐기며, 또 누군가는 생각보다 버틴 패배를 받아들인다. 그러는 동안 새로 들어온 사람은 퇴장 GIF부터 찾는다. 이번 #mecz에서 가장 생생한 것은 이 서로 다른 속도다. 경기 종료 휘슬 하나로 대화가 한 감정에 도착하지 않았고, 그 틈에서 이미 다음 경기까지 기다리는 사람이 있었다.\n\n<details><summary>범위와 근거<\/summary>\n\n- 실행: `2026-11-07_120325`. Wykop `#mecz` 피드 1개에서 새 글 40개, 작성자 35명. 제공된 본문 약 4,586자이며 최다 작성자의 비중은 5%다. 이번 수집문과 문맥 확인을 위한 현재 폴더의 `source.json` 해당 피드만 읽었다. 잘린 크라코비아 팬의 글은 원본에도 같은 지점까지만 들어 있었다. 이전 원고·완성본·프로젝트 문서는 참고하지 않았다.\n- 시각: 원본은 `+09:00`으로 2026년 11월 7일 14:32:54~17:34:57을 표시한다. 팬들은 경기를 ‘금요일’로 부르며, 구단 보도상 경기는 폴란드 현지 11월 6일이다. 수집 시각을 경기의 실제 발생 시각과 동일시하지 않았다.\n- 표본: 공감 수는 수집 당시 각 글에 표시된 값이다. 인용한 수치는 태그 전체의 지지율·구단별 팬 수·서로 겹치지 않는 동의자 수가 아니다. 성인 인증 안내만 표시된 두 글, 해시태그나 링크만 남은 글에서는 내용을 복원하지 않았다.\n- [비스와 공식 보도 — Derby są nasze!](https://wislakrakow.com/en/news/derby-sa-nasze-wisla-krakow-pokonala-cracovie-2-1): 2026년 11월 7일자 검색 제공 본문에서 현지 경기일, 2–1 결과, 득점자, 더비 회차, 리그 더비의 복귀와 홈 7연승을 확인했다. 페이지 직접 열기는 오류가 나 검색에서 확인된 본문 범위만 사용했다.\n- [크라코비아 공식 경기 보고](https://www.cracovia.pl/posts/derby-krakowa-nie-dla-pasow-cracovia-przegrywa-przy-reymonta/6513): 패배 결과와 클리흐의 추가시간 퇴장, 상대 선수 및 비신사적 행동이라는 기록을 확인했다. [TVP 경기 보도](https://sport.tvp.pl/96346602/wisla-lepsza-w-204-derbach-krakowa-biala-gwiazda-wciaz-niepokonana-na-wlasnym-stadionie) 등과 추가시간 분 표기에 차이가 있어 본문에서는 분을 확정하지 않았다.\n- [PolskaPilka의 오드라–우니아 보고](https://www.polskapilka.net/aktualnosci/57409/1-liga-osiem-goli-w-meczu-odra-unia/): 출처를 우니아 구단으로 명시한 자료에서 3–5 결과와 득점 흐름을 확인했다. 구단 원문 자체를 확보한 것과는 구분한다.\n- 확정하지 않은 것: 클리흐의 최종 출전정지 기간, 그젤라크의 거취, 특정 과거 파울, 대상이 불명확한 두 번째 퇴장, 우디네세 관련 감독·순위 주장, 대표팀 명단 관련 주장. 모두 팬의 요구·기억·예상·불만 범위로 귀속했다. 응원가와 방송 발언도 제공된 단편 이상으로 재구성하지 않았다.\n- 직접 인용은 제공된 폴란드어의 번역이다. 욕설과 개인에 대한 비하는 문맥에 필요한 수준으로 풀어 썼고, 이용자 닉네임과 계정은 싣지 않았다.\n\n<\/details>\n"}];
const pick = document.getElementById("pick");
const doc = document.getElementById("doc");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const tabsEl = document.getElementById("tabs");
const when = document.getElementById("when");
let current = null;

// 보고 원고를 탭으로 가른다. `## 이름 | 나라`가 커뮤니티 탭이고, 나머지는 전부 안내 탭이다.
function parseReport(md) {
  const intro = [];
  const tabs = [];
  md.split(/^(?=## )/m).forEach((part) => {
    const m = part.match(/^## ([^|\n]+?)[ \t]*\|[ \t]*([^\n]+?)[ \t]*(?:\n|$)/);
    if (!m) { intro.push(part); return; }
    tabs.push({ k: "s" + tabs.length, name: m[1], where: m[2], md: part.slice(m[0].length).replace(/\n-{3,}\s*$/, "") });
  });
  return { intro: intro.join("\n").replace(/^# .*\n/, "").replace(/\n-{3,}\s*(?=\n## |$)/g, "\n"), tabs };
}

// 원고에는 포럼 글이 옮겨져 있으니, 글자로만 보이게 하고 스크립트가 될 만한 것은 뺀다.
function toHtml(md) {
  const t = document.createElement("template");
  t.innerHTML = marked.parse(md, { mangle: false, headerIds: false });
  const safeTags = new Set("P BR A EM STRONG BLOCKQUOTE UL OL LI H1 H2 H3 H4 H5 H6 HR PRE CODE DETAILS SUMMARY TABLE THEAD TBODY TR TH TD DEL SPAN".split(" "));
  t.content.querySelectorAll("*").forEach((e) => {
    if (!safeTags.has(e.tagName)) { e.remove(); return; }
    [...e.attributes].forEach((a) => {
      const link = e.tagName === "A" && a.name === "href" && /^(https?:|#)/i.test(a.value.trim());
      if (!link && a.name !== "title") e.removeAttribute(a.name);
    });
  });
  return t.content;
}

function decorate(root) {
  root.querySelectorAll("table").forEach((t) => {
    const box = document.createElement("div");
    box.className = "tbl";
    t.replaceWith(box);
    box.appendChild(t);
    const heads = [...t.querySelectorAll("th")].map((h) => h.textContent.trim());
    const result = heads.indexOf("결과");
    t.querySelectorAll("tbody tr").forEach((tr) => {
      [...tr.children].forEach((td, i) => {
        const text = td.textContent.trim();
        if (/^약?\s*[\d,]+$/.test(text)) td.classList.add("num");
        if (i === result) {
          const c = document.createElement("span");
          c.className = "chip " + (/못|막|멈|보류|없음|쉼|실패/.test(text) ? "stop" : "ok");
          c.textContent = text;
          td.replaceChildren(c);
        }
      });
    });
  });
  root.querySelectorAll("a[href^='http']").forEach((a) => { a.target = "_blank"; a.rel = "noopener"; });
}

function setHash(id, k) {
  const h = k === "intro" ? id : id + "/" + k;
  if (location.hash.slice(1) !== h) history.replaceState(null, "", "#" + h);
}

function showTab(k) {
  const r = current;
  const tab = r.parsed.tabs.find((t) => t.k === k);
  const key = tab ? k : "intro";
  doc.className = tab ? "" : "intro";
  doc.replaceChildren();
  if (tab) {
    const frag = toHtml("# " + tab.name + "\n\n" + tab.where + " · " + r.label + "\n\n" + tab.md);
    doc.appendChild(frag);
    const first = doc.querySelector("h1 + p + p");
    if (first) first.classList.add("scope");
  } else {
    doc.appendChild(toHtml(r.parsed.intro));
    const first = doc.firstElementChild;
    if (first && first.tagName === "P") first.classList.add("scope");
  }
  decorate(doc);
  tabsEl.querySelectorAll("button").forEach((b) => {
    const on = b.dataset.k === key;
    b.setAttribute("aria-selected", on ? "true" : "false");
    if (on) tabsEl.scrollLeft = b.offsetLeft - (tabsEl.clientWidth - b.offsetWidth) / 2;
  });
  setHash(r.id, key);
  window.scrollTo(0, 0);
}

function tabButton(k, name, where) {
  const b = document.createElement("button");
  b.type = "button";
  b.setAttribute("role", "tab");
  b.dataset.k = k;
  b.textContent = name;
  if (where) {
    const w = document.createElement("span");
    w.className = "where";
    w.textContent = where;
    b.appendChild(w);
  }
  b.addEventListener("click", () => {
    showTab(k);
    const top = document.querySelector("nav.tabs").offsetTop;
    if (window.scrollY > top) window.scrollTo(0, top);
  });
  return b;
}

// 날짜를 바꿔도 보던 커뮤니티에 머문다. 그날 없는 곳이면 안내 탭으로 간다.
function showReport(id, wantName) {
  const i = Math.max(0, REPORTS.findIndex((r) => r.id === id));
  const r = REPORTS[i];
  if (!r) return;
  r.parsed = r.parsed || parseReport(r.md);
  current = r;
  pick.value = r.id;
  prev.disabled = i >= REPORTS.length - 1;
  next.disabled = i <= 0;
  when.textContent = r.label;
  tabsEl.replaceChildren(tabButton("intro", "안내"));
  r.parsed.tabs.forEach((t) => tabsEl.appendChild(tabButton(t.k, t.name, t.where)));
  const same = wantName && r.parsed.tabs.find((t) => t.name === wantName || t.k === wantName);
  showTab(same ? same.k : "intro");
}

function currentName() {
  if (!current) return null;
  const on = tabsEl.querySelector('button[aria-selected="true"]');
  const t = on && current.parsed.tabs.find((x) => x.k === on.dataset.k);
  return t ? t.name : null;
}

REPORTS.forEach((r, i) => {
  const o = document.createElement("option");
  o.value = r.id;
  o.textContent = r.label + (i === 0 ? " (최신)" : "");
  pick.appendChild(o);
});
function go(step) {
  const i = REPORTS.findIndex((r) => r.id === current.id) + step;
  if (REPORTS[i]) showReport(REPORTS[i].id, currentName());
}
pick.addEventListener("change", () => showReport(pick.value, currentName()));
prev.addEventListener("click", () => go(1));
next.addEventListener("click", () => go(-1));
function fromHash() {
  const [id, k] = location.hash.slice(1).split("/");
  showReport(id || (REPORTS[0] && REPORTS[0].id), k);
}
window.addEventListener("hashchange", fromHash);
if (REPORTS.length) fromHash();
</script>
</body>
