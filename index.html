미에 맞춰 번역했고, 나머지는 요약했다. 개인 식별·추적 정보와 혐오 표현은 싣지 않았다.\n\n경기 결과·공식 명단·계약은 본문에 연결한 구단·협회·리그 자료로 확인했다. 감독 발언은 구단 공식 기자회견 또는 기자회견을 직접 취재한 보도를 함께 사용했다. 외부 확인은 수집 자료 속 주장의 확인을 위한 것이며, 외부 팬 반응을 새로 섞지 않았다. 기사에 등장하는 ‘현재’와 ‘이번 시즌’은 이 실행의 수집 시점에 맞췄다.\n\n구보의 거액 제안설·겨울 이적 전망·경영진 개입설, 스즈키의 빅클럽 관심설, 맨유 감독 후보 관련 주장과 유망주 거취는 공식 합의나 결정으로 확인하지 않았다. 사토의 컵대회 안내는 제공 자료 안에서 날짜와 상대가 엇갈려 구체적인 일정으로 재전달하지 않았다. 미토마의 복귀일과 유럽대항전 등록 관련 대화도 확정된 복귀 약속으로 바꾸지 않았다.\n\n<\/details>\n\n## Wykop #mecz | 폴란드\n\n이번에는 Wykop의 공용 축구 태그 **#mecz**에서 수집된 새 글 1,166개 가운데 제공된 990개분의 텍스트를 읽었다. 표기 시각은 11월 5일부터 7일 아침까지다. 목요일 유럽대항전의 실망이 금요일 대표팀 명단 논쟁으로 이어졌고, 저녁에는 모토르의 극적인 승리와 크라쿠프 더비가 그 대화를 가져갔다.\n\n**개관**\n\n- **대표팀에서는 없는 이름이 더 시끄러웠다.** 바르토시 노바크와 카롤 추바크를 원하는 글이 반복됐고, 시비데르스키를 미드필더로 분류했다는 조롱이 특히 큰 호응을 얻었다. 발탁 발표와 감독의 공개 설명은 확인했으며, 감독의 고집이나 차기 행선지에 관한 이야기는 팬들의 해석이다.\n- **목요일은 야기엘로니아 0–1, 레흐 1–3 패배.** 두 결과는 구단 공식 기록으로 확인했다. 게시판에서는 실수한 선수에 대한 불만이 곧 폴란드 리그의 발전과 UEFA 계수 논쟁으로 번졌다.\n- **모토르는 비스와 프워츠크를 3–2로 이겼다.** 추가시간 7분 추바크의 결승골은 리그 공식 기록으로 확인된다. 경기 중에는 남는 공이 들어온 상황과 득점 취소를 둘러싸고 서로 반대 방향의 판정 불만이 나왔다.\n- **크라쿠프 더비는 관중석과 그라운드의 평점이 달랐다.** 비스와의 2–1 승리는 공식 확인됐다. 이번 제공분의 현장 반응은 경기 도중까지여서, 종료 뒤의 총평과 뒤섞지 않았다.\n\n---\n\n### 명단에서 시비데르스키를 숨길 수는 없다\n\n대표팀 명단이 나오자 가장 먼저 시작된 일은 새 얼굴 찾기가 아니었다. 노바크가 어디 있느냐는 글이 올라왔고, 이어 카롤 시비데르스키의 이름이 어느 칸에 들어갔는지를 두고 웃음이 터졌다.\n\n“시비데르스키를 미드필더로 옮기면 우리가 뽑힌 걸 못 알아볼 줄 알았나?”\n\n이 글에는 수집 당시 공감 329개가 붙었다. 제공된 텍스트에서 수치가 드러난 글 가운데 유독 큰 반응이다. 비슷한 농담도 바로 생겼다. 그렇다면 노바크를 수비수 명단에 넣어 추가 발탁하면 되지 않겠느냐, 감독도 같은 수법에 속을 것이라는 식이다. 스트라이커가 골을 못 넣으면 미드필더로 적으면 된다는 가상의 감독 문답도 나왔다. 명단의 포지션 표기가 이미 쌓여 있던 선발 불신을 한 줄로 표현할 소재가 됐다.\n\n노바크를 지지하는 글들의 요구가 모두 같았던 것은 아니다. 당장 루마니아전 선발로 써야 한다는 강한 주장도 있었지만, 앞으로 대표팀을 그를 중심으로 만들라는 뜻은 아니라며 한 번은 현재의 활약을 인정해 달라는 글도 있었다. GKS 카토비체에서 좋은 숫자를 쌓는 선수가 계속 바깥에 서 있는데, 익숙한 이름은 다시 들어오는 장면이 불공평하다는 감정이다. 노바크의 이번 명단 제외는 별도 보도로도 확인된다. [카날 스포르토비의 발탁 보도](https://kanalsportowy.pl/pilka-nozna/reprezentacja-polski/bartosz-nowak-bez-powolania-gks-katowice-z-wymowna-reakcja/)\n\n그래서 이 논쟁은 곧 나이 문제로 옮겨갔다. 독일 대표팀의 늦은 발탁 사례를 끌어오는 글이 있었고, 레반도프스키는 젊고 노바크는 늙었느냐는 비꼼도 나왔다. 여기서 팬들이 따지는 것은 장기 계획의 존재 자체보다 그 계획을 적용하는 기준이었다. 어떤 선수에게는 경험과 신뢰가 장점인데, 다른 선수에게는 나이가 문을 닫는 이유가 되는 것처럼 보인다는 것이다.\n\n반대편 목소리도 있었다. 전날 폴란드 구단들이 유럽에서 보여 준 경기를 보고도 국내 리그에서 잘하는 선수가 대표팀을 바꿀 것이라고 믿느냐는 글이다. 한 작성자는 카미인스키가 레흐를 상대로도 출전하지 못한 상황을 끌어와, 리그에서 돋보인다는 이유만으로 국제 수준의 답을 찾았다고 볼 수 없다고 주장했다. 이 글의 공감은 1개였다. 반론이 존재했다는 것과 노바크 요구만큼 호응을 얻었다는 것은 다른 이야기다.\n\n시비데르스키를 옹호한 글도 하나 있었다. 최근 네 경기 세 골이라는 기록을 근거로, 더 적은 기회를 만드는 팀에서 득점한 선수를 추바크보다 아래에 놓을 이유가 있느냐고 물었다. 이 수치는 여기서는 해당 작성자가 제시한 근거로 남겨 둔다. 적어도 명단 반대 글들 사이에, 최근 경기력으로도 발탁을 설명할 수 있다는 주장이 들어와 있었다.\n\n얀 우르반 감독의 공식 설명은 익숙한 선수에 대한 신뢰와 역할의 유연성이었다. 시비데르스키가 공격과 수비에서 팀을 위해 일하며, 최근에는 리그에서 득점도 하고 있어 10번 자리와 최전방, 시스템에 따라 측면에서도 쓸 수 있다고 밝혔다. 스코룹스키 제외에 대해서는 더 젊은 선수들에게 기회를 주려는 뜻을 설명했다. 게시판의 불화설과 별개로 확인되는 감독의 공개 근거는 이쪽이다. [폴란드축구협회의 우르반 발언 정리](https://pzpn.pl/reprezentacje/reprezentacja-a/aktualnosci/2026-11-06/jan-urban-o-powolaniach-na-listopadowe-mecze-chcemy-zobaczyc-innych-zawodnikow)\n\n하지만 이 설명을 듣는 팬들의 언어는 이미 굳어 있었다. 반복된 단어는 **beton**, 콘크리트였다. 여기서는 생각을 바꾸지 않는 감독을 가리킨다. 우르반을 ‘정상적인 야네크’라고 부르는 표현도 칭찬보다 반어로 쓰였다. 정상적인 명단, 정상적인 선택이라는 말이 붙을수록 실제 문장의 온도는 내려갔다.\n\n일부는 인터넷이 원하면 오히려 반대로 하는 것이냐고 감독의 심리를 추측했다. 다음 소집 뒤 떠날 것이니 지금 바꾸자는 글, 후임이 이미 정해졌다는 풍문, 다시 국내 구단으로 돌아갈 것이라는 상상도 섞였다. 이 대목들은 인선 소식이 아니라 분노한 팬들이 만든 설명이다. 이번 표본에서 반복적으로 보이는 불만은 훨씬 단순했다. 잘하는 선수를 뽑으라는 요구에 감독이 납득할 만한 답을 주고 있느냐는 것이었다.\n\n그리고 몇 시간 뒤, 그 요구를 다시 꺼내기 좋은 골이 루블린에서 들어갔다.\n\n### 추바크를 기다리다, 추바크를 의심하다, 결국 추바크\n\n모토르 루블린–비스와 프워츠크를 기다리는 글에는 처음부터 대표팀 이야기가 따라붙었다. 추바크가 해트트릭을 해서 감독에게 답했으면 좋겠다는 소망이었다. 모토르가 일찍 득점하자 기뻐하면서도 추바크의 골이 아니라 아쉽다는 반응이 나왔다.\n\n리그 공식 기록상 모토르는 베레신스키의 2분 골로 앞섰다. 그러나 전반 31분 아폰수 실바, 33분 코바츠키에게 연속 실점했고, 후반 54분 은디아예가 동점을 만들었다. 마지막은 90+7분 추바크였다. 모토르의 3–2 승리다. [에크스트라클라사 공식 경기 기록](https://ekstraklasa.org/mecz/64038d89-b0b3-4f04-9c18-fd9df7c01d1f/motor-lublin-wisla-plock/przeglad/)\n\n게시판에서 이 스코어가 만들어지는 과정은 득점표보다 훨씬 분주했다. 모토르가 3–0, 4–0으로 앞서야 한다는 글이 여러 차례 나왔다. 기회를 계속 놓치니 반드시 대가를 치를 것이라는 예고도 반복됐다. 정말로 경기가 뒤집히자 한 줄이 올라왔다.\n\n“4–0으로 이길 수 있는데 왜 1–2로 지고 있지.”\n\n이 문장에 공감 14개가 붙었다. 앞서 기회를 세던 사람들에게는 실점 자체보다 또 그 순서로 흘러갔다는 점이 허탈했다. 한 모토르 팬은 마리우시 미시우라 감독 아래에서 경기가 대체로 이렇다고 썼다. 주도하고, 못 넣고, 상대는 드문 전진으로 골을 넣는다. 그 작성자가 나열한 과거 경기들을 전부 이번 경기의 증거로 삼을 수는 없지만, 이날 왜 팬들이 좋은 공격을 보면서도 안심하지 못했는지는 분명해진다.\n\n그렇다고 모두가 추바크에게 무조건 좋은 점수를 준 것은 아니었다. 경기 도중에는 대표팀이 뽑지 않는다고 놀릴 수는 있어도 오늘 추바크가 잘하는 것은 아니라고 짚는 글이 있었다. 다른 공격수를 칭찬하면서 감독이 추바크를 뺄 배짱은 없다고 쓰기도 했다. 대표팀 명단에서 빠진 선수를 응원하는 마음과, 당장 눈앞의 플레이에 대한 평가는 함께 움직이지 않았다.\n\n판정 논쟁도 한쪽으로만 흐르지 않았다. 전반에는 그라운드의 두 번째 공이 화제였다. 공격 중 남는 공을 건드리기까지 했는데 어떻게 골을 인정하느냐는 항의가 나왔고, 다른 작성자는 영어로 경기 규정을 가져왔다. IFAB의 2026/27 규정은 여분의 공이 들어왔다는 이유만으로 무조건 중단하라고 하지 않는다. 플레이를 방해하는지가 기준이다. 이 규정은 확인되지만, 해당 장면의 방해 여부에 관한 최종 판정 평가는 여기서 확정하지 않는다. [IFAB 2026/27 경기 규칙, 제5조](https://downloads.theifab.com/downloads/laws-of-the-game-202627-single-pages?l=en)\n\n후반에는 비스와 프워츠크 쪽에 불리한 휘슬을 지적하는 글들이 붙었다. 정상적인 골인데 왜 불었느냐, 수비수끼리 엉킨 것을 공격수 파울로 봤다는 식이었다. 경기 막바지의 긴 글은 전반의 ‘두 번째 공’만 널리 퍼지고 뒤의 프워츠크 불만은 묻힐 것이라고 걱정했다. 다른 글 역시 종료 뒤 프워츠크가 손해를 본 느낌이라고 남겼다. 누군가는 모토르가 더 좋은 팀이었으니 이길 만했다고 했고, 누군가는 그 말로 판정까지 덮을 수는 없다는 쪽에 서 있었다.\n\n그 와중에도 경기의 재미에는 여러 글이 합류했다. 절대적인 영화라는 반응, 너무 흥미로워서 옆에서 하던 트럭 운전 게임에서 사고를 냈다는 고백, 이제 심장이 버티지 못하겠다는 외침이 이어졌다. 전날 유럽대항전에서는 리그 수준을 한탄하던 태그가 이날은 그 리그의 혼란을 즐겼다.\n\n추바크의 결승골이 들어간 뒤에는 대표팀 명단 이야기가 곧바로 돌아왔다. 이제도 이 선수를 무시하겠느냐는 글이 올라왔고, 시비데르스키는 공격도 수비도 열심히 한다는 감독의 논리를 가져와 비꼬는 반응도 붙었다. 경기 내내 추바크를 의심한 문장들은 사라지지 않았지만, 마지막 장면의 주인공은 그였다.\n\n모토르 팬의 마지막 농담은 이 팀이 일부러 서사를 위해 이러는 것 같다는 말이었다. 공감 12개. 공격은 좋지만 중원에서 너무 많이 잃고 수비는 손봐야 한다는 차분한 총평도 남았다. 세 점을 가져온 밤에도 다음 경기의 걱정거리는 그대로였고, 그래서 더 모토르다운 승리로 읽혔다.\n\n### 야기엘로니아가 넣지 못하는 동안, 게시판은 결말을 먼저 썼다\n\n목요일 소피아에서는 다른 종류의 반복이 있었다. 야기엘로니아가 기회를 만들고도 득점하지 못하자, 결국 이상한 골 하나를 먹고 질 것이라는 글이 경기 초반부터 올라왔다.\n\n‘야가’는 야기엘로니아의 줄임말이다. 이날 야가를 보던 글들의 불만은 상대가 너무 강하다는 쪽보다, 이 정도 상대를 이렇게 상대하느냐는 쪽에 쏠렸다. 패스를 상대 발밑에 주지 않고 결정만 조금 빨리 하면 될 텐데, 짧게 후방에서 풀어 나오는 과정까지 불안하게 만든다는 것이다. 아그보니포를 하프타임에 빼 달라는 요구가 여러 글에서 반복됐고, 몬토이아의 수비와 공격진의 선택도 비판받았다.\n\n“유로파리그여야 했는데, 에크스트라클라사와 함께하는 목요일이 됐다.”\n\n이 한 줄이 당시의 실망을 잘 담는다. 유럽대항전을 켰는데 익숙한 국내 리그의 실수들이 보인다는 뜻이다. 누군가는 체육시간 같다고 했고, 또 다른 글은 양쪽 중 누가 어느 골문을 공격하는지 모르겠다고 썼다. 상대를 압도하지 못한 답답함과 양 팀 모두 매끄럽지 않다는 감상이 포개졌다.\n\n그라운드보다 더 자주 비판받은 대상은 중계 목소리였다. 평범한 전개에도 너무 흥분한다는 불만이 초반부터 끝까지 반복됐다. 중원에서 공이 움직일 뿐인데 소리를 지른다거나, AC/DC 보컬인 줄 아느냐는 반응까지 있었다. 경기 내용의 밋밋함과 중계의 높은 음량이 맞지 않는다는 것이다. 야가가 골을 먹으면 해설진이 더 크게 충격받을 것 같다는 농담도 나왔다.\n\n로만추크와 심판이 엉키는 장면을 가리키는 글들이 한꺼번에 올라온 순간에는, 심판 관련 소동이 오늘 가장 재미있는 대목이라는 냉소가 붙었다. 골 영상 대신 그 장면을 공유하는 제목도 보였다. 경기가 얼마나 답답하게 받아들여졌는지 보여 주는 작은 우회로였다.\n\n실제 승부는 83분 스티반 스토얀초프의 골로 갈렸다. 야기엘로니아 공식 보고는 레프스키 원정 0–1 패배와 함께, 초반부터 있었던 야가의 기회들도 기록했다. 게시판의 ‘넣을 때 못 넣었다’는 불만에 대응하는 경기의 뼈대다. [야기엘로니아 공식 경기 보고](https://jagiellonia.pl/aktualnosci/levski-sofia-jagiellonia-biaystok-10-1793916539353/)\n\n득점 직후 태그에는 **Niestety**, ‘안타깝게도’라는 한 단어가 줄줄이 올라왔다. 길게 화낼 필요도 없다는 듯 같은 말이 반복됐다. 냉장고에서 맥주를 꺼내기도 전에 실점했다는 종류의 농담이 뒤 경기에도 이어지지만, 야가를 보던 사람들은 그 골을 훨씬 오래 기다린 셈이었다. 오지 않기를 바라면서도 곧 올 것이라고 여러 번 적어 놓은 골이었다.\n\n종료 뒤에도 아쉬움은 상대를 인정하는 방식보다 이길 수 있었던 경기를 흘렸다는 방식으로 남았다. 한 글은 최소한의 판단력만 있었어도 행운에 기대지 않고 이겼을 것이라고 했다. 다른 글은 레프스키라도 잘했으면 모르겠는데 양 팀 모두 좋지 않았다고 정리했다.\n\n그 사이 레프스키를 이름값만으로 약체 취급하는 시선에 이의를 제기하는 글도 있었다. 리그 선두와 폴란드 리그 중위권 팀의 경기라는 식으로 봐야 한다는 주장, 예전의 레프스키로 생각하면 안 된다는 반응이다. 이 순위와 구단 변화는 해당 팬들이 제시한 반박으로 남지만, 논쟁의 갈림길은 선명했다. 같은 패배를 두고 한쪽은 당연히 잡았어야 할 상대를 놓쳤다고 했고, 다른 쪽은 애초의 기대부터 지나쳤다고 본 것이다.\n\n### 리스가 공을 잡느냐는 질문으로 시작해, 2–0의 위험성을 논하다\n\n리스본 경기를 기다리던 레흐 팬들과 구경꾼들의 기대치는 낮았다. 세 골 차보다 덜 지면 성공이라는 글이 여럿 있었고, 아직 시작하지 않았으니 0–0을 지키고 있다는 농담도 나왔다. 경기 전 연출은 콘서트 같다는 반응을 불렀다. 잠시 뒤 샤키라라도 나오겠다는 글까지 있었다.\n\n그 분위기는 첫 실점 뒤 곧바로 익숙한 선수 비판으로 바뀌었다. 벤피카 공식 기록상 하파의 골은 6분이었다. 이후 프레스티아니가 67분, 벵트손이 73분에 득점했고, 90분 수다코우의 골로 벤피카가 3–1 승리를 확정했다. [벤피카 공식 경기 기록](https://www.slbenfica.pt/pt-pt/futebol/match-center/benfica-lech-poznan-5-novembro-2026)\n\n첫 골 뒤 글들에서 가장 많이 눈에 들어오는 질문은 골키퍼 마테우시 리스가 공을 잡을 줄 아느냐는 것이었다. 왜 계속 튕겨 내느냐는 비판에, 그 공을 보던 수비수들은 왜 서 있었느냐는 불만이 따라붙었다. 테리 예그베는 특히 자주 지목됐다.\n\n“공이네, 예그베는 생각했다. 예그베네, 공은 생각했다.”\n\n서로 쳐다보기만 했다는 조롱이다. 이 글에는 공감 10개가 붙었다. 선수 이름을 변형한 농담과 스카우팅을 탓하는 글도 이어졌다. 일부 반응은 경기력 비판을 넘어 인종 비하로 흘렀지만, 그 표현을 옮기지 않아도 불만의 대상은 충분히 드러난다. 골키퍼의 처리와 수비수의 반응이 맞물려 너무 쉽게 실점한다는 것이었다.\n\n예그베의 골문 앞 처리 장면을 두고도 글이 몰렸다. 거의 자책골을 넣을 뻔했다는 반응, 크로스바를 이용해 공을 걷어 내는 것이 현대 수비냐는 농담, 코너킥을 주기 싫어서 영리하게 처리했다는 반어가 나왔다. 실제로 누가 더 못했느냐는 평가와 별개로, 이날 예그베를 바라보던 태그의 시선은 이미 작은 동작에도 반응할 만큼 날카로워져 있었다.\n\n전반을 0–1로 마친 뒤부터는 다른 감정이 들어왔다. 생각보다 스코어가 버티자, 벤피카도 문전에서 별로이니 무승부가 가능하다는 글이 나왔다. 레흐가 공격을 창의적으로 풀어 가는 점은 좋다는 감상도 있었다. 반면 상대가 느슨하게 하고 있을 뿐, 속도를 올리면 다시 갇힐 것이라는 글도 붙었다. 같은 몇 분의 전진을 보고 누군가는 회복을, 누군가는 상대가 허락한 여유를 읽었다.\n\n그래서 두 번째 실점은 이미 말다툼하던 사람들에게 서로 다른 증거가 됐다. 기대를 품은 쪽에는 좋은 흐름을 또 개인 실수로 날린 장면이었고, 회의적인 쪽에는 상대가 한 번 제대로 가속하면 이렇게 된다는 장면이었다. 페레이라가 돌파를 허용한 방식과 리스의 대응을 비판하는 글이 다시 몰렸다.\n\n그런데 2–0이 된 뒤 얼마 지나지 않아 벵트손이 만회했다. 태그는 곧바로 다른 축구 격언을 호출했다. **2–0은 위험한 스코어.**\n\n벤피카는 왜 굳이 두 번째 골을 넣었느냐, 미흐니에비치의 축구 사상을 공부하지 않았느냐는 농담이 이어졌다. ‘기관차가 움직였다’, ‘다시 좋은 선로로 돌아왔다’는 말도 나왔다. 레흐의 철도 이미지를 가져온 반응들이다. 조금 전까지 리스와 예그베를 붙잡고 있던 게시판이 이제는 3–2 역전을 예고했다.\n\n한 글은 레흐가 평소에 먹히던 종류의 골을 이번에는 넣었다고 썼다. 다른 글은 아그네로가 골키퍼에게 압박을 가해 실수를 유도한 몫을 인정했다. 경기 내내 공격수에게도 비난이 쏟아졌다는 점을 생각하면, 이 작은 공로 인정은 눈에 띈다. 좋아진 선수로 갑자기 재평가한 것은 아니어도, 적어도 그 득점에서 한 일은 보겠다는 반응이었다.\n\n막판에는 “부끄러울 정도는 아니다, 끝부분은 꽤 괜찮다”는 글이 나왔다. 동시에 리스가 또 좋은 선방을 했는데 왜 이렇게 비난하느냐는 반론도 있었다. 그러나 세 번째 실점 뒤에는 골키퍼 비판이 다시 앞에 섰고, 이제야 공을 잡았다는 냉소도 붙었다. 경기 중 칭찬과 비난이 번갈아 올라온 것을 한쪽만 지워 읽으면 이 밤의 피로가 잘 보이지 않는다.\n\n종료 뒤 가장 산뜻하게 비튼 글은 가상의 대패와 실제 패배를 계산했다. 9–1로 질 수도 있었는데 3–1로 졌으니 사실상 6–0으로 이겼다는 주장이다. ‘명예로운 패배’를 넘어 패배에서 성과를 찾아내는 말 자체가 웃음의 대상이 된 밤이었다.\n\n### 계수는 오르는데, 왜 우리는 더 불행해졌나\n\n두 패배가 끝나자 대화는 곧 UEFA 계수로 넘어갔다. 이날 자주 등장한 **rankingorze·rankingarze**는 계수와 국가 순위를 열심히 챙기는 사람들을 가리키는 놀림말이다. 구단의 승패를 넘어 다른 나라 팀의 결과까지 계산하는 팬들이 표적이 됐다.\n\n비판의 논리는 이랬다. 콘퍼런스리그에서 쌓은 점수가 폴란드 구단들을 더 높은 무대로 밀어 올렸는데, 정작 유로파리그에서는 그 수준을 감당하지 못한다는 것이다. 다시 콘퍼런스리그로 가자는 글이 여러 번 나왔다. 약한 상대를 이기며 즐거웠는데 왜 더 큰 도전을 원했느냐는 자조였다. 할인점 이름을 붙여 유럽대항전을 낮춰 부르는 농담도 이때 함께 쓰였다.\n\n이 반응 속에서도 욕망은 갈렸다. 어떤 글은 더 높은 순위와 챔피언스리그를 바라던 낙관론을 비웃었다. 다른 글은 이제 큰 기대는 없으니 출전권 수를 지킬 수 있는 순위만 유지했으면 좋겠다고 했다. 목표를 줄여서라도 다음 기회를 남기려는 쪽이다. 선수 한 명의 실수에서 시작한 대화가 어느새 국가 전체의 유럽 일정과 출전권 걱정으로 커졌다.\n\n계수 팬들이 특정 구단의 진출을 선호하는 태도에 대한 반감도 보였다. 컵대회에서 하부리그 팀이 올라와 그 계산을 깨 버렸으면 좋겠다는 글이다. 이날 시아르카 타르노브제크나 아비아 시비드니크를 유럽에 보내자는 말이 나온 것도 실제 전력 평가로 읽을 일은 아니다. 늘 나가던 팀들이 이러니 아예 다른 얼굴을 보자는 짜증과 장난이 섞여 있었다.\n\n그렇다고 ‘폴란드 리그는 전부 이 수준’이라는 결론에 모두가 동의하지는 않았다. 한 글은 레흐의 결과를 리그 전체에 확대하는 것이 짜증난다고 했다. 국내에서 우승하는 능력과 강팀을 만나 상대 장점을 지우는 능력은 다르며, 닐스 프레데릭센 감독이 이 경기들을 풀어내지 못한다는 주장이다. 다른 구단이었다면 더 나았을 것이라는 대목은 가정이지만, 실패의 원인을 리그 전체에서 찾을지 현재 감독과 팀 운영에서 찾을지는 실제로 갈렸다.\n\n또 다른 작성자는 조기 탈락 팀들의 편안함을 꼬집었다. 여름 예선에서 조용히 사라지면 금방 잊히고, 리그에서 몇 번 이기면 다시 칭찬받는다. 반면 계속 남아 비싼 상대와 붙는 팀들은 매주 공개적으로 평가받는다는 것이다. 이 글에는 공감 7개가 붙었다. 레흐와 야가를 잘했다고 감싸는 말은 아니었지만, 오래 살아남을수록 조롱받을 기회도 늘어난다는 불균형을 지적했다.\n\n그 틈으로 레기아가 유럽에서 아직 무패라는 글이 올라와 공감 49개를 받았다. 다른 구단 팬의 실망을 자기 구단의 농담으로 바꾸는 #mecz의 방식이다. 여러 경기를 함께 보는 태그인 만큼, 공동의 계수 걱정과 국내 라이벌을 놀리는 즐거움은 한 화면 안에서 공존했다.\n\n### 크라쿠프에서는 연기가 걷히자 경기력이 보였다\n\n모토르 경기가 끝날 무렵, 다음 순서인 크라쿠프 더비에는 묘한 부담이 붙었다. 이렇게 재미있는 경기를 봤으니 이제는 지루한 0–0이 올 차례라는 예고였다. 비스와와 크라코비아를 기다리던 사람들은 거대한 분위기를 기대했고, 방금 루블린의 소동을 본 구경꾼들은 그만한 축구까지 나올지를 의심했다.\n\n실제 전반에는 골도 판정도 바쁘게 움직였다. 비스와가 먼저 앞섰고, 크라코비아는 페널티킥 상황에서 동점을 만들었다. 마르치니아크가 처음에는 시뮬레이션으로 판단했다가 VAR 뒤 페널티킥을 선언한 과정, 하시치가 막힌 킥을 직접 밀어 넣은 장면이 공식 보고에 기록돼 있다. 비스와는 전반 추가시간 다시 앞섰고 결국 2–1로 이겼다. [크라코비아 공식 더비 보고](https://www.cracovia.pl/posts/derby-krakowa-nie-dla-pasow-cracovia-przegrywa-przy-reymonta/6513)\n\n게시판에서는 페널티킥 판정이 바뀌는 동안에도 입장이 움직였다. 처음에는 넘어지는 연기로 보였지만 리플레이를 보니 접촉이 있었다는 글이 올라왔다. 페널티킥을 안 줄 수는 있어도 경고까지 주는 것은 이상하다는 반응도 있었다. 마르치니아크가 자기 실수를 인정했다며 놀리는 글까지 붙었다. 심판에 대한 오래된 불신은 있었지만, 첫 화면과 반복 화면을 보고 판단을 달리하는 문장도 남아 있었다.\n\n동점골 뒤에는 골키퍼 우비크에게 왜 공을 옆으로 쳐내지 않고 앞에 줬느냐는 불만이 향했다. 전날 리스본에서 리스에게 했던 질문과 닮은 대목이다. 다만 이번에는 공이 들어가자마자 경기를 계속 따라갈 틈도 없이 관중석이 화면의 주인공이 됐다.\n\n양쪽 응원석의 연막과 불꽃을 두고 반응이 쏟아졌다. 크라쿠프다운 스모그라는 농담, 수분 섭취 시간에 빗댄 **smoking break**, 게임의 시야를 가리는 ‘전장의 안개’라는 표현이 나왔다. 한쪽이 피웠으니 다른 쪽도 이제 피워 또 멈추겠다는 글 뒤로, 실제로 다시 연기가 난다는 실시간 반응이 이어졌다. 게시판에서는 이것을 일종의 번갈아 하는 공연처럼 보고 있었다.\n\n연출을 즐긴 팬도 있었다. 양쪽 응원석 모두 훌륭하며, 이 정도 감정을 만드는 경기는 다른 곳에서 찾기 어렵다는 긴 글이다. 반대로 응원 연출에 큰돈을 써 놓고 정작 축구를 못 보게 만든다는 비판도 나왔다. 불꽃을 허용할 거라면 중계라도 그 장면을 제대로 보여 줘야 하는 것 아니냐는 반응도 있었다. 현장 분위기를 보고 싶은 사람, 경기를 계속 보고 싶은 사람, 텔레비전이 무엇을 보여 줘야 하는지를 따지는 사람이 각기 다른 데서 답답해했다.\n\n비스와 응원석의 **gniazdowy**, 응원 리더도 별도의 화제였다. 응원가는 선율이 괜찮은데 그 위로 거칠게 들리는 목소리가 모든 것을 망친다는 글이 반복됐다. 해설을 꺼서 관중석 소리를 더 듣고 싶다는 사람 옆에, 응원 리더만 음소거할 수 없느냐는 사람이 있었다. 축구 중계에서 무엇을 듣고 싶은지조차 이날은 일치하지 않았다.\n\n눈에 보이는 연출의 방식도 웃음거리가 됐다. 흰 별에 금지선을 그은 모양을 단순히 카드를 들고 만든 줄 알았는데, 사람들이 색깔 망토를 입은 채 앉아 있는 것이라는 관찰이 나왔다. 상대 팀 상징을 지우는 데 들인 수고를 뒤늦게 알아본 반응이다. 한편 다른 글은 첨단 기술과 우주 계획을 이야기하는 시대에도 여전히 남의 목도리를 빼앗아 태우고 있다며 응원 문화의 오래된 의식을 비꼬았다.\n\n이렇게 관중석에 대해서는 할 말이 많았지만, 후반 축구에 대한 평은 점점 짧아졌다. 몇 초도 공을 지키지 못한다는 글, 열 번의 패스를 잇는 것도 어려워 보인다는 반응이 나왔다. 어떤 시청자는 너무 졸려서 이제야 동점이 아니라 2–1이라는 것을 알아챘다고 했다. 다른 사람은 지루한 김에 비고스에 케첩을 얼마나 넣느냐고 물었다. 양배추와 고기를 끓이는 음식 이야기로 빠질 만큼 집중이 풀린 것이다.\n\n그 사이 오늘 경기는 같은 도시의 두 팀이 만나므로 더비라는 ‘축구 상식’을 올리고, 더 많은 정보를 원하면 커피를 사 달라고 덧붙인 글이 공감 165개를 받았다. 누구나 아는 사실을 유료 정보처럼 포장하는 축구 콘텐츠를 한 번 흉내 낸 농담이었다. 더비의 역사와 열기를 길게 늘어놓지 않아도 그 자리의 구경꾼들에게는 통했다.\n\n이번 제공분의 끝에서는 여전히 비스와가 앞서고 있었고, 이기는데 왜 이렇게 조용하냐는 글이 남았다. 양쪽 응원석의 분위기를 높게 평가한 문장과, 잠이 더 중요하다며 중계를 끈다는 문장이 같은 밤에 올라왔다. 크라쿠프 더비는 어떤 팬에게는 오래 기다린 도시의 행사였고, 다른 시청자에게는 모토르 경기 뒤에 놓인 답답한 축구였다. 이날 #mecz에서는 두 감상이 어느 쪽도 다른 쪽을 밀어내지 못했다.\n\n<details><summary>범위와 근거<\/summary>\n\n이번 실행은 2026-11-07_153938이다. 수집 집계는 글타래 1개, 새 글 1,166개, 익명 작성표시 282종이며, 본문은 그중 제공된 990개분의 텍스트를 바탕으로 작성했다. 익명 표시의 종류는 실제 이용자 수가 아니다. 공감 수는 수집 당시 해당 글의 반응이며, 팬 전체의 찬반 비율로 해석하지 않았다. 이미지·영상 내용이 제시되지 않은 글은 내용을 추정하지 않았다.\n\n경기 날짜는 공식 기록의 현지 날짜를 따랐다. 유럽대항전 두 경기는 11월 5일, 모토르 경기와 크라쿠프 더비는 11월 6일이다. 수집 글에 붙은 날짜·시각과 경기의 현지 날짜를 같은 것으로 취급하지 않았다.\n\n주요 경기 결과와 득점 순서는 본문에 연결한 구단·리그 기록에서 확인했다. 대표팀 일정과 감독의 공개 설명은 PZPN 자료를 사용했다. 노바크 제외는 이를 별도로 보도한 카날 스포르토비 기사로 교차 확인했다. 시비데르스키의 명단상 포지션 분류에 대한 반응은 수집 글의 주장으로 전했으며, 공식 발표 페이지에서 해당 분류 자체를 독립적으로 확인했다고 서술하지 않았다. 감독 교체·불화에 관한 게시물은 확정 소식으로 취급하지 않았다.\n\n모토르 경기의 두 번째 공과 후반 휘슬에 대한 설명은 제공된 실시간 반응의 내용이다. IFAB 규정의 일반 원칙은 확인했지만, 영상 검토나 공식 심판 평가 없이 개별 판정의 정오를 확정하지 않았다. 크라쿠프 더비는 최종 결과를 확인하되, 이번 제공분 밖에 있는 종료 후 반응을 보태지 않았다.\n\n<\/details>\n\n## BigSoccer | 미국\n\n이번에는 BigSoccer의 아스널·맨체스터 유나이티드 구단 판을 중심으로, 수집 표기상 11월 5~7일에 올라온 13개 글타래의 새 글 55개를 읽었다. 경기를 앞둔 기대와 주중 경기의 뒷말, 다른 구단을 둘러싼 설전, 미국에서 유럽 축구를 따라가는 팬들의 일상까지 담았다.\n\n**개관**\n\n- **아스널은 승리 다음을 이야기한다.** 슬라비아전 이후에는 리드를 지키는 방식이, 헐전을 앞두고는 대승과 휴식의 양립이 쟁점이다. 선수 기용은 팬들의 희망이며, 콘사·사카 관련 내용은 아르테타의 기자회견 보도와 대조했다.\n- **밀란을 아약스에 비유하자 대화가 뜨거워졌다.** 페렌츠바로시전 홈 0-2 패배는 구단 공식 기록으로 확인했다. 논쟁은 역사적 위상에서 최근 유럽 성적, 구단주 책임으로 번졌다.\n- **맨유에서는 캐릭에게 시간을 더 줄 이유를 찾는다.** 첼시전 내용에 대한 짧은 옹호가 나왔고, 발레바의 수주 결장은 기자회견을 전한 통신 보도로 확인됐다. 조기 복귀가 원인이었는지는 팬의 의문이다.\n- **옛 얼굴들은 다른 온도로 등장한다.** 퍼거슨 부임 40주년에는 짧은 감사가, 호날두의 대표팀 은퇴에는 아쉬움과 수긍이 함께했다. 런던 식당 예약과 카솔라의 뉴욕 방문 이야기도 오갔다.\n\n---\n\n### 골득실을 벌릴 기회라는데, 벌써 2-1이 보인다\n\n헐전 글타래는 미국 팬들에게 반가운 시간표부터 내걸었다. 토요일 영국 시각 오후 3시, 미국 동부 오전 10시, 중부 오전 9시. 중계는 피콕. 글을 연 팬은 모처럼 오후 3시 경기라며, 헐이 얼마나 좋지 않은 팀인지 숫자로 보태고 싶지만 언더스탯이 접속되지 않는다고 했다. 상대를 낮게 평가하는 자신감과, 그 자신감을 뒷받침할 통계 사이트를 찾는 습관이 한 문단에 들어 있었다.\n\n곧바로 “골득실을 쌓기 좋은 때”라는 기대가 나왔다. 그런데 같은 글의 다음 줄이 스스로 찬물을 끼얹었다.\n\n> “그러고는 조마조마한 2-1 승리겠지…”\n\n답글은 짧은 웃음이었다. 다른 팬은 헐의 별명인 타이거스를 떠올리게 하는 말로 제발 물어뜯기지만 말자고 했고, 또 다른 글은 단 두 단어, “이겨 줘”로 끝났다. 상대가 약하다는 평가를 공유하면서도 경기 전부터 편안해지지는 못하는 분위기다. 대승을 점치는 말에 대승의 확신보다 익숙한 불안이 먼저 붙는다.\n\n이 글타래에서 흥미로운 것은 예상 스코어보다 승리의 모양이다. 한 팬은 2-0이나 1-0도 가능하겠지만 이번만큼은 크게 이겼으면 좋겠다고 했다. 동시에 데클런 라이스가 쉬기를 바랐고, 아마 그렇게 되지는 않을 것이라고 덧붙였다. 쉬운 승리를 원하는 마음과 핵심 선수의 출전 시간을 아끼고 싶은 마음이 같은 글에 있었다.\n\n수비진 선택도 그 계산에 들어간다. 처음에는 에즈리 콘사의 상태를 걱정하며 모스케라를 쓸지, 살리바에게 시간을 줄지 묻는 글이 나왔다. 둘 다 약간의 위험을 안고 있다는 판단이었다. 다른 팬은 모스케라와 수비멘디의 선발을 원했다. 이에 모스케라가 이제는 해내야 한다는 짧은 주문도 붙었다. 유망주에게 기회를 주자는 기대가 곧바로 무조건적인 신뢰로 이어지지는 않는다.\n\n이후 아르테타의 기자회견을 가져온 글은 앞선 걱정보다 긍정적이었다. 콘사는 예방 차원에서 교체했고 상태가 좋아졌다는 설명이었다. 반면 사카는 수주 단위의 결장이 남아 있으며, 대표팀 휴식기 이후 운동장 활동을 늘리면서 상태를 보겠다는 내용이었다. 11월 6일 기자회견을 전한 AFP 보도에서도 콘사는 헐전 출전이 가능한 상태로, 사카는 당분간 결장이 이어지는 것으로 확인된다. 휴식기 뒤 활동 재개라는 말이 곧 경기 복귀일을 뜻하지는 않는다. [AFP 기자회견 보도](https://www.thedailystar.net/sports/football/news/arteta-confirms-saka-out-weeks-4317206)\n\n따라서 팬들이 그리는 편안한 토요일에도 할 일은 많다. 수비수의 부담을 조절하고, 모스케라에게 필요한 출전 시간을 주고, 라이스까지 쉴 수 있으면 좋다. 그러면서 골득실도 벌리고 싶다. “헐이니까 이겨야 한다”는 단순한 요구 안에 여러 바람이 겹쳐 있다.\n\n마지막에 올라온 긴 글은 대승이 자주 나오지 않는 이유를 팀의 경기 습관에서 찾았다. 이 팬이 보기에 아스널은 상대 수준에 맞춰 경기력을 올리거나 내린다. 일찍 골을 넣으면 대개 2단 기어에 머물고, 네다섯 골 차가 나려면 헐 쪽이 먼저 무너져야 한다. 두 골 앞선 뒤에는 평소 덜 뛰던 공격수들이 들어와 자기 골을 노릴 수도 있지만, 그대로 경기를 닫아 버리는 모습도 봤다는 것이다. 그 선택이 아르테타의 지시일 수 있다는 추측도 덧붙였다.\n\n앞의 “조마조마한 2-1”이 웃음 섞인 예감이었다면, 이 글은 왜 그런 예감이 드는지를 설명하는 쪽이었다. 헐전은 아직 시작하지 않았지만, 주중 경기 뒤에 남은 질문이 이미 다음 경기 예상에 들어와 있었다.\n\n### 리드를 지켰나, 골키퍼가 지켜 줬나\n\n슬라비아전 글타래에서 이어진 논쟁은 바로 그 지점이었다. 승점을 가져온 경기에서 후반이 답답했다는 데에는 접점이 있었지만, 그것을 아스널의 반복되는 운영 방식으로 볼지를 두고 갈렸다.\n\n한쪽은 매번 같은 지루한 흐름이 나타난다는 주장에 동의하지 않았다. 뮌헨전과 첼시전을 잘 마무리한 사례로 들었고, 릴전은 처음부터 끝까지 편안했다고 기억했다. 리즈전은 오히려 초반 대부분이 좋지 않다가 60분쯤부터 살아난 경기였다. 슬라비아전 후반이 나빴다는 평가는 받아들이지만, 서로 다른 경기들을 하나의 패턴으로 묶기는 어렵다는 반론이다.\n\n반대쪽은 같은 경기들을 다시 꺼내 전혀 다른 장면에 밑줄을 그었다. 뮌헨·첼시·리즈전에는 뒤진 상황에서 따라가야 했던 시간이 있었다는 것이다. 뮌헨전 마지막 30분은 추격 중이었고, 첼시전에서는 두 번째 골을 넣은 뒤 거의 기회를 만들지 못했다고 봤다. 특히 첼시전 승리를 설명하면서는 골키퍼 라야의 이름을 동사처럼 썼다. 에스테방을 상대로 한 선방, 다만 선수 이름에 대한 본인의 기억은 확실하지 않다고 덧붙이면서, 사실상 라야 덕에 승리를 건졌다는 뜻이었다.\n\n이 표현 덕분에 두 입장의 거리가 또렷해진다. 한쪽이 보는 것은 필요한 순간을 버티며 결과를 확보한 팀이고, 다른 쪽이 보는 것은 주도권을 놓친 뒤 골키퍼에게 마지막 부담을 넘긴 팀이다. 두 팬 모두 좋은 결과를 원한다. 다만 좋은 마무리로 인정할 장면이 다르다.\n\n제공된 인용에는 수비를 미식축구의 ‘프리벤트 디펜스’에 빗댄 말도 남아 있다. 큰 플레이를 내주지 않으려 뒤를 두껍게 지키고, 뛰어난 수비진이 끝까지 버텨 주기를 바라는 운영이라는 불만이다. 아스널의 막판 경기력을 논하다가 자연스럽게 미식축구 수비 용어가 나오는 대목은 이곳의 미국적 감각을 보여 준다.\n\n이 논쟁을 헐전 기대와 나란히 놓으면 “일찍 득점하면 편해질 것”이라는 말도 두 가지로 들린다. 누군가에게는 경기를 통제할 조건이고, 다른 누군가에게는 다시 공격의 속도가 떨어질 출발점이다. 그래서 약체를 상대로 한 홈경기인데도 대승 예상과 작은 점수 차 예상이 어색하지 않게 공존한다.\n\n여기에 길게 끼어들지 않는 답도 있었다.\n\n> “중요한 건 승점 3점뿐.”\n\n이번에 수집된 슬라비아전 새 글은 여덟 개다. 아스널 팬 전체가 경기 운영을 놓고 둘로 갈렸다고 말할 규모는 아니다. 그래도 몇 차례의 구체적인 공방만으로, 승리 뒤의 불만이 단순히 더 많은 골을 보고 싶다는 요구만은 아니라는 점은 드러난다. 팬들은 리드를 잡은 뒤 팀이 무엇을 선택하는지 서로 다르게 보고 있었다.\n\n그리고 경기 이야기가 늘 경기 안에 머물지는 않았다. 리버풀의 튀르키예 원정을 놀리는 글에 이스티클랄 거리에서 전날 너무 즐긴 것 아니냐는 농담이 붙자, 다음 답은 그 거리에는 언제 가는 게 좋으냐는 여행 질문이었다. 여름에 갔어도 밤에는 서늘했다는 경험담이 돌아왔다. 다른 팬은 이스탄불의 그 유명한 하룻밤이라면 원정 전적쯤은 바꿀 만하지 않겠느냐고 받아쳤다. 상대 팀을 놀리던 대화가 여행 정보와 오래된 결승전 기억으로 옆길을 냈다.\n\n### “밀란을 아약스와 비교한다고?”\n\n다른 팀들을 이야기하는 아스널 글타래에서는 AC 밀란이 가장 긴 설전을 만들었다. 시작은 유로파리그 홈경기에서 페렌츠바로시에 0-2로 졌다는 소식이었다. 상대 이름의 발음과 철자를 확인하는 시늉까지 덧붙인 글은, 유럽의 거물이 여기까지 내려왔다는 놀라움을 드러냈다. 이어 원인이 아모링이냐고 물었다. 해당 패배와 아모링의 지휘는 밀란 구단 공식 경기 기록에서도 확인된다. [밀란 공식 경기 보고서](https://www.acmilan.com/en/news/articles/europa-league/2026-11-05/rossoneri-lose-on-uel-matchday-four)\n\n첫 답변은 감독 한 명으로 설명할 일이 아니라는 쪽이었다. 밀란의 쇠퇴는 아모링 이전부터 진행됐고, 그렇지 않았다면 애초에 유로파리그에 있지도 않았을 것이라는 말이다. 이탈리아 축구의 낡은 기반 시설까지 원인으로 들더니, 최근 유럽 무대에서 밀란이 차지하는 위치를 아약스에 견줬다.\n\n그 비교가 대화를 달궜다.\n\n> “뭐라고? 레알 마드리드 말고 밀란보다 유럽 트로피를 많이 딴 구단이 어디 있는데.”\n\n돌아온 답은 짧았다.\n\n> “지난 세기 말고, 지금 얘기하는 거야.”\n\n다른 팬도 원래 글을 다시 읽어 보라며, 쟁점은 통산 트로피가 아니라고 거들었다. 여기서 논쟁은 밀란이 위대한 구단이냐는 질문과, 지금도 유럽 최상위 경쟁력을 가진 구단이냐는 질문 사이를 오갔다. 밀란을 방어한 팬에게 아약스라는 비교는 축적된 위상을 지나치게 낮추는 말처럼 들렸다. 비교를 꺼낸 팬은 그 위상과 최근의 실제 성과를 나눠 보려 했다.\n\n2023년 챔피언스리그 준결승도 양쪽의 근거가 됐다. 밀란을 옹호하는 쪽에서는 불과 몇 년 전에도 준결승에 갔다고 했다. 반대쪽에서는 아약스도 2019년에 준결승에 갔다며, 바로 그런 이유로 비교 대상으로 골랐다고 답했다. 한 번의 깊은 진출이 아직 강팀이라는 증거인지, 오랜 정체 속에 튄 예외인지가 갈린 것이다. 밀란의 2022/23시즌 준결승과 아약스의 2019년 준결승은 UEFA 기록으로도 확인된다. [밀란의 챔피언스리그 기록](https://www.uefa.com/uefachampionsleague/history/clubs/50058--milan/), [UEFA 준결승 진출 기록](https://editorial.uefa.com/resources/0282-184079e97393-127f15886394-1000/ucl_202223_facts_md13.pdf)\n\n논쟁이 더 진행되자 밀란을 방어하던 쪽의 무게중심은 구단주 비판으로 옮겨 갔다. 새 소유주들이 축구단을 투자 대상으로 다루며 좋은 선수를 팔고, 임금이 낮은 더 싼 선수로 대체했다고 주장했다. 재무 모델로는 좋을 수 있어도 축구단 운영 모델로는 끔찍하다는 평가였다. 축구를 모르는 사람들이 지원 조직의 인재도 제대로 고르지 못한다는 불만까지 이어졌다. 이는 게시자의 경영 평가이며, 이번 자료만으로 실제 매각과 대체 영입의 성과를 판정할 수 있는 내용은 아니다.\n\n상대는 다시 시간표를 짚었다. 구단주 변경은 2023년 준결승 이후가 아니라 그 이전이었다는 지적이다. 원글에는 2022년 6월이 언급됐지만, 구단의 공식 인수 완료 발표는 2022년 8월 31일이다. 어느 날짜를 기준으로 삼아도 2023년 준결승보다 앞선다. 그러자 답은 “알고 있다, 그 뒤 좋은 선수들을 팔기 시작했다”는 쪽으로 좁혀졌다. [레드버드의 밀란 인수 완료 발표](https://www.acmilan.com/en/news/articles/club/2022-08-31/redbird-capital-partners-completes-acquisition-of-ac-milan)\n\n이 날짜 공방이 구단주 책임론 전체를 끝내지는 않았다. 한쪽은 이미 진행 중이던 장기 하락을 말하고, 다른 쪽은 최근에 다시 올라갈 기회를 소유주가 망쳤다고 보는 셈이다. 또 다른 참여자는 칼초폴리와 베를루스코니 시대까지 거슬러 올라가 이탈리아 축구 전반의 문제를 거론했다. 이 부분 역시 이번 대화에 등장한 쇠퇴론의 범위이지, 검증된 단일 원인으로 받아들일 설명은 아니다.\n\n아스널 팬들의 다른 팀 글타래에서 밀란 이야기가 이렇게 길어진 것은, 이번 패배의 이변성만으로 설명되지 않는다. 역사적인 강호를 현재의 어느 선반에 놓을 것인가. 최근 몇 년의 성적표만 볼 것인가, 축적된 이름값과 다시 올라갈 능력까지 볼 것인가. 아약스라는 이름 하나가 그 평가 기준의 차이를 드러냈다.\n\n맨유 판에서도 아모링은 따로 소환됐다. 다른 팀 글타래에 경기할 준비, 특히 정신적인 준비가 되지 않았다는 그의 발언이 인용되자 붙은 말은 “익숙하게 들리나?”였다. 수집된 새 글은 하나뿐이지만, 이전 감독의 말을 다른 구단 기사에서 다시 만났을 때 나오는 씁쓸한 반응은 분명했다. 아스널 쪽이 밀란의 긴 하락을 논하는 동안, 맨유 쪽에서는 감독의 설명 방식이 먼저 눈에 들어왔다.\n\n### 잘나가는 본머스 옆에서, 판정에는 한숨\n\n같은 다른 팀 글타래의 출발점은 밀란보다 넓었다. 유럽대항전에 나선 잉글랜드 팀들의 대비였다. 한 팬은 본머스가 날아다닌다며 모든 대회 일곱 경기 연승, 그동안 19득점 1실점이라는 수치를 적었다. 유로파리그와 리그 순위가 함께 올라갔다고 들뜬 뒤, 다음 입스위치 원정도 이길 것이라고 내다봤다.\n\n여기서는 게시자가 제시한 당시 성적과 전망으로 읽는 편이 맞다. 특히 다음 경기 승리는 아직 결과가 아닌 기대다. 이 글에서 본머스가 맡은 역할은 그날 유럽 무대를 보고 받은 인상을 가장 밝게 보여 주는 팀이었다. 반대편에는 선덜랜드를 놓았다. 디나모 자그레브를 상대로 꽤 강한 선발을 내고도 홈에서 밀렸다는 관전평이었다. 본머스의 상승감과 선덜랜드에 대한 거친 실망을 한 글 안에 붙여, 같은 유럽대항전 밤도 팀마다 얼마나 다르게 남는지 비교했다.\n\n이후 에버턴과 코번트리 이야기가 들어오자 말의 온도는 감탄에서 피로로 바뀌었다. 한 팬은 에버턴 득점에 마지막 손 터치가 분명히 포함된 것처럼 보였다며 “이젠 모르겠다”고 썼다. 경기를 빠르게 돌려 봤다는 다른 팬도 의문을 보탰다. 득점자 본인도 손에 맞았음을 웃으며 인정하는 듯 보였다는 관찰이었다.\n\n두 번째 팬은 거기서 멈추지 않았다. 타코스키가 전반에 상대의 머리카락을 잡아당긴 장면이 더 문제라고 봤고, 페널티킥이나 퇴장 가능성을 거론했다. 이 대목은 두 게시자의 영상 해석이다. 공식 판정 설명을 확보한 것은 아니므로 반칙과 징계가 확정된 사건처럼 옮길 수는 없다.\n\n짧은 두 글이 전하는 감정은 그래도 구체적이다. 한 장면만 틀렸다는 분노보다, 손에 맞은 것처럼 보이는 골과 머리카락을 잡아당긴 것처럼 보이는 행동을 이어 보며 적용 기준을 따라가기 어렵다는 한숨에 가깝다. 두 번째 글도 프리미어리그 VAR이 제각각 적용되는 것 같다는 불만으로 향했다. 밀란을 놓고는 서로의 기준을 캐물었지만, 판정 이야기에서는 두 글이 같은 방향으로 고개를 저었다.\n\n### 캐릭에게 필요한 것은 일단 이번 달\n\n맨유 경기 글타래의 새 글은 두 개뿐이었다. 하나의 의견과 그에 대한 동의였다. 따라서 감독을 향한 지지가 되살아났다고 크게 말할 수는 없다. 대신 캐릭을 조금 더 지켜볼 이유가 어떤 모양으로 나오는지는 볼 수 있다.\n\n첫 글은 첼시전 전술 자체는 나쁘지 않았다고 평가했다. 팀이 기회를 마무리하지 못했고, 첼시 득점에는 행운이 있었으며, 어리석은 퇴장이 더해졌다는 해석이었다. 그 팬은 주말에도 그 정도 경기 내용이 이어지면 캐릭이 이번 달 말까지는 시간을 벌 수 있을 것이라고 했다. 다음 답글은 간단한 동의 표시였다.\n\n이번 달 말이라는 시한이 눈에 남는다. 거창한 재건을 약속하거나 시즌 전체를 맡기자는 이야기가 아니다. 결과가 좋지 않았던 경기에서도 내용상 변호할 부분을 골라, 다음 몇 경기를 볼 여지를 만들고 있다. 득점 실패와 퇴장을 감독의 전술과 분리해 보려는 시도이기도 하다. 첼시의 골이 운이 좋았다는 말 역시 이 팬의 평가로 남겨 두어야 한다.\n\n그 시간을 버티는 데 필요한 선수는 또 빠졌다. 시즌 전망 글타래에는 캐릭이 카를로스 발레바의 수주 결장을 확인했다는 소식이 올라왔다. 이어진 문장은 “너무 빨리 복귀시킨 걸까?”였다. 캐릭이 11월 6일 기자회견에서 햄스트링 부상으로 발레바가 수주간 결장한다고 밝힌 내용은 로이터 보도로 확인된다. 그러나 조기 복귀 때문에 이번 부상이 생겼다는 인과관계까지 확인된 것은 아니다. [로이터의 발레바 부상 보도](https://www.channelnewsasia.com/sport/baleba-out-few-weeks-due-hamstring-injury-says-carrick-6531666)\n\n짧은 질문 하나에는 결장 소식에 대한 실망과 선수 관리에 대한 의심이 같이 담겼다. 감독에게 주말의 경기 내용을 이어 가라고 바라는데, 정작 그 내용을 만들 선수 구성이 다시 흔들린다. 이 회차의 맨유 글들은 장문의 전술 논쟁보다 이런 작은 근심으로 흩어져 있었다.\n\n재정 글타래에서는 다른 종류의 피로가 보였다. 아브람 글레이저가 투자자들 앞에서 맨유 같은 구단의 상업적 힘은 경기 성적에 좌우되지 않는다고 말했다는 보도가 인용됐다. 뉴욕 양키스와의 비교도 함께였다. 게시자가 붙인 말은 “우리 구단주들”이라는 짧은 한마디였다. 발언 전체의 원문을 확보하지 못했으므로 글레이저의 뜻을 더 넓혀 단정할 수는 없지만, 게시자가 그 보도를 불편하게 받아들였다는 맥락은 명료하다.\n\n밀란 논쟁에서는 좋은 재무 모델과 좋은 축구단 운영이 양립하는지를 길게 따졌다. 맨유 재정 글타래에서는 비슷한 불만이 설명보다 인용 하나에 실렸다. 팬들이 매주 성적에 매달리는 동안 구단의 상업적 가치는 그 성적과 별개로 남는다는 말. 이 글에서는 그 간극을 더 풀어 쓸 필요도 없다는 듯했다.\n\n### 40년의 기억에는 두 문장, 대표팀 은퇴에는 한숨\n\n맨유 판의 오래된 퍼거슨 은퇴 글타래에는 새로운 은퇴 소식 대신 부임 40주년을 맞는 글이 올라왔다. 퍼거슨이 맨유에 온 날은 1986년 11월 6일이다. 이번 회차의 11월 6일은 정확히 40년 뒤이며, 구단도 공식적으로 그 기념일을 다뤘다. [맨유의 부임 40주년 기념 기사](https://www.manutd.com/en/news/tributes-to-sir-alex-ferguson-on-40th-anniversary-at-united)\n\n팬의 글은 짧았다.\n\n> “오늘로 꼭 40년. 언제나 감사하다.”\n\n다른 답글도 길지 않았다.\n\n> “우리가 얼마나 즐거웠던가…”\n\n우승 횟수도, 최고의 경기 목록도 나오지 않았다. 사진과 두 문장으로 그 시절을 공유했다. 캐릭이 이번 달 말까지 시간을 벌 수 있겠느냐는 글 옆에 놓고 읽으면, 같은 구단 판 안에서 시간이 얼마나 다른 단위로 흐르는지 느껴진다. 현재 감독에게는 다음 몇 주가 걸려 있고, 옛 감독에게는 40년을 묶는 감사가 돌아간다.\n\n전직 선수 글타래에는 크리스티아누 호날두의 포르투갈 대표팀 은퇴 소식이 올라왔다. 이는 풍문으로만 떠도는 이야기가 아니다. FIFA는 11월 5일 대표팀 은퇴를 전하며 234경기 146골이라는 기록을 확인했다. 클럽 선수 생활은 계속한다. [FIFA의 호날두 대표팀 은퇴 발표 기사](https://www.fifa.com/en/tournaments/mens/worldcup/articles/cristiano-ronaldo-portugal-retirement)\n\n이번에 수집된 반응은 하나였다. 그 팬은 계속 뛸 줄 알았으며, 적어도 제대로 된 작별 인사는 할 줄 알았다고 아쉬워했다. 그러면서도 슬픈 마무리지만 아마 이편이 최선일 것이라고 적었다.\n\n짧은 글 안에서 두 마음이 함께 남았다. 더 좋은 마지막 장면을 보고 싶었다는 바람과, 이제 끝내는 선택을 받아들이려는 마음이다. 이것을 맨유 팬들의 일치된 평가로 확대할 수는 없다. 다만 한때 자기 팀의 선수였던 인물의 국가대표 경력까지 챙겨 보는 오래된 구단 판에서, 거대한 기록보다 작별의 방식이 먼저 이야깃거리가 됐다는 점은 인상적이다.\n\n### 기자회견을 켠 팬, 예약 사이트를 켠 팬\n\n아스널 여자팀 글타래에서는 리버풀 원정을 앞두고 감독에게 압박이 크다는 글이 하나 올라왔다. 작성자는 이번 시즌 기자회견을 거의 보지 않았다가 그날 영상을 직접 찾아봤다고 했다. 질문들에는 감독이 처한 압박이 묻어났지만, 답하는 모습은 예상보다 침착하고 차분하며 자신감 있게 느껴졌다는 감상이었다. 때로는 신중한 관리자식 답변으로 흐르기도 했다고 덧붙였다.\n\n이 글이 전하는 것은 경질이 임박했다는 확인된 소식이 아니다. 팀을 빨리 바로잡지 못하면 자리를 잃을 수 있다고 느끼던 팬이, 정작 기자회견을 보니 생각보다 안정적인 모습을 발견한 순간이다. 감독의 경기 성과에 대한 걱정과 공개석상에서의 인상을 한꺼번에 지우지 않고 함께 적었다.\n\n반면 잡담 글타래에서는 기자회견 대신 런던 식당이 검색 대상이 됐다. 정치인을 둘러싼 말장난이 샤와르마 이야기로 번지더니, 추수감사절 주말에 런던에 가니 먹을 곳을 찾아봐야겠다는 말이 나왔다. 다른 팬도 같은 시기에 간다고 답했다. 미국 달력에 맞춘 런던행 일정이 자연스럽게 등장하는 곳이다.\n\n추천은 꽤 구체적이었다. 어퍼 스트리트의 갈리폴리에서 제대로 앉아 튀르키예 음식을 먹으라는 답이 있었고, 지하철역에서 웸블리로 걸어가는 길의 작은 샤와르마 가게를 떠올리는 글도 있었다. 다만 경기 보러 갈 일이 없으면 굳이 웸블리까지 갈 이유는 없다는 동선 조언이 붙었다.\n\n다른 답은 “여기서 늘 나오는 디슘 추천을 넣으시오”라는 투로 시작했다. 익숙한 질문에 익숙한 답이 돌아온다는 걸 스스로 알고 하는 농담이다. 마블 아치역 근처 샤와르마 가게, 비앙비앙면을 먹을 마스터 웨이, 예약할 수 있으면 짐카나도 언급됐다. 그리고 실제 여행 예정자의 답은 이미 늦었다는 것이었다. 머무는 날짜에 다섯 명이 앉을 자리가 없었다.\n\n식당 이름을 나열하는 것보다 이 마지막 답이 대화를 생활에 붙인다. 추천을 받아 꿈꾸는 단계에서, 일행 다섯 명의 테이블을 구해야 하는 현실로 넘어간 것이다. 경기 판의 단골들이 축구 밖에서도 서로의 여행 준비를 조금씩 돕는다.\n\n그 사이 산티 카솔라 이야기가 들어왔다. 한 팬은 그가 멋져 보인다며, 다음 날 브루클린에 가서 보거나 만날 수 없는 것이 아쉽다고 했다. 여전히 각별한 애정이 있다는 말도 덧붙였다. 뒤이어 뉴욕 레인저스가 올린 것으로 표시된 카솔라의 아이스링크 영상이 공유됐다. 제공 자료에는 영상 내용 전체나 행사 일정이 없지만, 이 팬이 느낀 가까움과 아쉬움은 읽힌다. 유럽에서 뛰던 옛 선수가 뉴욕까지 왔는데, 이번에는 자신이 갈 수 없다.\n\n헐전 글타래에도 잠깐 다른 시간이 열렸다. 한 팬은 1930년 헐과의 경기를 다룬 역사 글을 공유한 뒤, 기사 속 관중 사진에 눈길을 줬다. 거의 모두 남성처럼 보이고 모자를 쓰고 있다는 관찰, 지붕 없는 관중석에서는 모자가 실용적인 장비였겠다는 추측이 이어졌다. 사진 자체를 확인한 것은 아니므로 그 묘사는 게시자의 인상으로 남긴다. 그래도 다가오는 상대 이름 하나로 96년 전 관중석까지 이야기가 뻗었다는 사실은 이 오래된 포럼다운 곁가지다.\n\n이번 회차에서 가장 긴 말다툼은 밀란의 현재를 어디에 놓을 것인가였고, 아스널 팬들의 가장 구체적인 걱정은 이기는 경기의 뒷부분이었다. 그 옆에서는 감독에게 몇 주를 더 줄지 따지고, 부임 40주년을 돌아보고, 다섯 명짜리 저녁 예약이 막혔다고 아쉬워했다. 게시판에 머무는 시간에는 이 모든 일이 같은 날의 축구 생활로 이어져 있었다.\n\n<details><summary>범위와 근거<\/summary>\n\n- 실행 식별자: `2026-11-07_153938`. 제공된 13개 글타래, 새 글 55개의 발췌를 바탕으로 새로 작성했다. \n- 수집에 표시된 익명 작성 구분은 21종이며 가장 자주 등장한 표시의 글 비중은 14%다. 이를 실제 인원이나 BigSoccer 전체의 여론 비율로 해석하지 않았다. 이번 표본은 아스널·맨유 구단 판에 치우쳐 있다.\n- 팬의 경기 평가, 예상 선발, 예상 결과, 감독 및 구단주에 대한 평가는 게시물의 견해로 서술했다. 에버턴전 판정 의혹, 본머스의 연승·득실 수치와 다음 경기 전망, 여자팀 감독의 거취는 이 원고에서 독립적으로 확인된 사실로 취급하지 않았다.\n- 공식 자료로 대조한 핵심 내용은 밀란의 페렌츠바로시전 홈 0-2 패배, 밀란·아약스의 해당 챔피언스리그 준결승 기록, 레드버드의 인수 완료 시점, 퍼거슨의 부임 기념일, 호날두의 대표팀 은퇴다. 콘사·사카와 발레바의 상태는 각각 기자회견을 전한 AFP·로이터 보도로 대조했다. 링크는 관련 문단에 붙였다.\n- 사진·영상은 제공된 설명과 팬들의 반응 범위에서만 다뤘다. 정체가 드러나지 않은 사진의 인물이나 잘린 글의 결론을 추정해 보태지 않았다. 직접 인용은 제공된 원문의 의미를 옮겼으며, 이용자 닉네임과 계정은 싣지 않았다.\n\n<\/details>\n\n## Mediavida | 스페인\n\n이번에는 Mediavida 스포츠 판의 글타래 20개, 새 글 232개를 읽었다. 수집된 글의 시각은 주로 11월 5~7일이다. 바르사와 베티스 구단방의 대화가 가장 풍성했고, 대표팀 명단과 추모·모금 논쟁, 축구를 보고 소비하는 방식에 관한 불만이 여러 글타래를 오갔다.\n\n**개관**\n\n- **바르사:** 아틀레티코전을 앞두고 패배의 기억과 설욕의 기대가 맞섰다. 11월 8일 원정과 12월 2일 홈경기가 한 달 안에 잡힌 것은 공식 일정으로 확인했다. 가비의 기용과 거취에 관한 이야기는 팬들의 의견이다.\n- **베티스·스페인 대표팀:** 바예스와 마르크 로카의 발탁은 공식 발표로 확인됐다. 베티스 팬들은 축하하면서도 대표팀 기간에 치를 컵대회의 결원을 걱정했다. 대표팀 방에서는 골키퍼 네 명을 부른 이유를 두고 설전이 벌어졌다.\n- **헤수스 데 미겔 추모:** 테네리페의 사망 발표를 확인했다. 이번 수집분의 논쟁은 유족 모금과 선수의 경제적 처지에 집중됐다. 충돌의 의도와 법적·의료적 책임을 단정하는 댓글은 확인된 결론으로 취급하지 않았다.\n- **라리가와 유럽대항전:** 불법 중계 단속 보고서의 서명 사용 의혹은 최초 보도 매체의 주장으로 구분했다. 유로파리그의 실망스러운 결과와 풋살 대표팀의 결승 진출은 공식 대회 기록으로 확인했다.\n\n---\n\n### 아틀레티코를 만나기도 전에, 패배 사유부터 고르는 바르사 방\n\n바르사 방의 한 팬은 경기 예고를 객관식 문제처럼 써 놓았다. 또 판정 때문에 분노할 것인가. 훌리안이 갑자기 맹활약하고 팬들이 다시 그를 용서할 것인가. 원정팀이 정신을 놓은 30분 때문에 경기 전체가 망가질 것인가. 아니면 시메오네의 또 다른 격투기 흥행이 될 것인가. 마음에 드는 이유를 고르면 틀리지 않을 것이라는 투였다.\n\n아직 시작하지도 않은 경기를 이렇게 기다린다. 이 팬이 아틀레티코를 두고 쓴 표현은 ‘최근 3년간 우리의 처형자’였다. 이번 수집분에서 확인되는 것은 그 전적에 대한 통계보다, 상대 이름만으로 이미 몇 가지 불쾌한 장면을 떠올리는 팬의 기분이다. 경기장에 가기 전부터 판정, 상대 공격수, 자기 팀의 집중력 가운데 무엇 때문에 속이 터질지를 준비한다.\n\n곧바로 정반대의 답도 나왔다. 오히려 복수하고, 어려운 원정에서도 이길 수 있다는 것을 보여 주기에 가장 좋은 무대라는 것이다. 예상 스코어는 바르사의 3-1 승리. 베르날과 더 용을 뒤에 놓고 페드리를 앞세운 중원, 라민·하피냐·페르민의 공격 조합까지 직접 적었다. 같은 경기를 놓고 한쪽은 실패의 유형을, 다른 쪽은 승리할 선발 구성을 골랐다.\n\n공식 일정상 경기는 11월 8일 메트로폴리타노에서 열린다. 바르사 구단의 월간 일정 안내도 이를 2위 아틀레티코와 맞붙는 선두 경쟁의 중요한 경기로 소개한다. 팬들의 신경이 곤두서는 데에는 당장의 승점 경쟁도 걸려 있다. [바르사 공식 일정 안내](https://www.fcbarcelona.es/es/futbol/primer-equipo/noticias/4602385/challenging-november-ahead/featured)\n\n그런데 이 대화를 더 피곤하게 만든 소식은 다음 맞대결이었다. 누군가 날짜를 보고 “12월 2일이라고?” 하고 되묻자, 다른 팬이 수페르코파 때문에 2월에 치를 경기를 당긴 것이라고 설명했다. 라리가는 실제로 바르사–아틀레티코의 23라운드 경기를 12월 2일 수요일로 앞당겼다고 발표했다. [라리가 공식 발표](https://www.laliga.com/es-US/noticias/horarios-de-los-partidos-adelantados-de-la-jornada-23-de-laliga-ea-sports)\n\n한 팬의 불만에는 달력보다 생활감이 더 짙었다. 대표팀 휴식기가 사이에 끼어 있는데 한 달도 안 돼 같은 강팀을 두 번 만나고, 홈에서는 봄에 즐길 만한 경기를 12월의 추운 수요일에 보게 됐다는 것이다. 다른 팬은 수페르코파에서 안 만나면 국왕컵이나 챔피언스리그에서 만난다며, 해마다 아틀레티코를 네 번씩 상대하는 기분에 지쳤다고 했다. 실제 연간 횟수를 집계한 말이라기보다 같은 상대와의 긴장이 계속된다는 푸념이다.\n\n“그저 우연이겠지”라는 달 이모지 섞인 빈정거림에는 공감 6개가 붙었다. 그렇다고 모두가 일정에 분노한 것은 아니다. 조건이 불리할수록 이겼을 때 더 달콤할 것이라는 답도 있었다. 일정이 바뀌지 않는다면 그 불쾌함까지 승리의 맛에 넣겠다는 쪽이다.\n\n### 가비에게 필요한 것은 다른 팀인가, 여기서의 20분인가\n\n가비 이야기는 처음부터 방출론으로 시작하지 않았다. 한 팬이 실전 감각을 되찾도록 임대를 보내는 것이 어떻겠느냐고 물었다. 지금은 자리도, 출전 시간도 넉넉하지 않아 뛰지 못하는 모습을 보는 것이 안타깝다는 취지였다.\n\n이에 대한 첫 반응은 더 가까운 해결책이었다. 알라베스를 상대로 크게 앞서고 있을 때 플리크가 가비를 넣고, 로드리와 페드리를 계속 소모시키지 않으면 된다는 것이다. 다른 구단에서 리듬을 찾아야 한다는 의견과, 지금 팀 안에서도 줄 수 있는 시간이 있다는 의견이 갈렸다.\n\n그러다 감독 책임을 묻는 방향에 반론이 붙었다. 플리크가 벤치를 봤을 때 가비와 베르날이 바르사에서 뛸 수준이 아니라고 판단한다면, 주전이 계속 뛰는 것을 감독 탓으로만 돌릴 수 있겠느냐는 주장이다. 베르날에게는 성장 여지를 남겼지만 가비에게는 리키 푸치와 세르지 로베르토를 합쳐 놓았다는 가혹한 비교까지 붙였다.\n\n그 말에 돌아온 답은 아주 짧았다. 홈에서 알라베스를 상대로 6-0으로 앞선 상황에도 못 쓴다는 것이냐는 반문이었다. 이 대목의 점수는 댓글이 기용 논쟁을 위해 제시한 상황이다. 팬들이 다투는 핵심은 가비가 당장 큰 경기의 주전이어야 하느냐보다, 여유 있는 경기에서도 회복의 시간을 줄 수 없느냐였다.\n\n뒤로 갈수록 표현은 더 거칠어졌다. 예전부터 가비를 낮게 평가했다고 자기 판단을 재확인하는 글, 두 차례 부상 이후 정상급으로 돌아오기 어려울 것이라며 시즌 뒤 이별을 검토하자는 글이 나왔다. 다만 임대를 제안한 첫 글의 안타까움과 이런 거취 정리 주장은 구별할 필요가 있다. 같은 출전 시간 부족을 보고도 한쪽은 회복시킬 방법을, 다른 쪽은 대체할 시점을 찾고 있었다.\n\n하피냐를 향한 온도는 달랐다. 성격이 강하고 동료와 팀을 위해 싸우는 선수라는 칭찬에 공감 8개가 붙었다. 라이벌 팬에게도 호감을 얻는다는 점을 들어 그의 사람됨을 높이 샀다. 바로 옆에는 이번 대표팀 소집에서는 다치지 않고 돌아오기만 하면 된다는 걱정이 붙었다. 부상 복귀 횟수를 공식 집계하는 대화는 아니었다. 중요한 선수를 보낼 때마다 먼저 몸 상태부터 걱정하는 팬들의 반응이었다.\n\n에릭 가르시아와 크리스텐센이 일요일 명단에 들어올 수 있다는 글에도 곧바로 “그럼 뛰기는 하나?”라는 질문이 달렸다. 명단 복귀와 실제 전력 복귀 사이에 얼마나 거리가 있는지, 벤치에 이름을 올리는 것만으로는 마음이 놓이지 않는 분위기다. 이 복귀 전망 자체는 이번 원고에서 공식 확인한 소식이 아니다.\n\n### 감독에게 자유를 주자는 말은 왜 PSG의 이적료 계산으로 끝났나\n\n바르사 방에서는 루이스 엔리케와 과르디올라를 놓고 상당히 긴 옆길도 열렸다. 시작부터 인용 대상이 어긋났는지, 한쪽이 레알 마드리드와 돈, 심판 이야기를 꺼내자 상대가 자신은 그 어느 것도 말하지 않았다며 다른 글을 잘못 인용한 것 같다고 답했다.\n\n이후 논쟁은 조금 더 분명해졌다. 루이스 엔리케와 과르디올라에게 공통으로 있었던 것은 안정된 환경이라는 주장이다. 감독이 선수단을 바꿀 재량을 갖고, 매일 언론의 공격에 흔들리지 않는 곳에서 일했다는 것이다. 여기서 등장한 ‘central lechera’는 바르사 팬들이 친레알 성향이라고 여기는 언론을 비꼬는 현지 표현이다.\n\n반대쪽은 그 재량이라는 것이 결국 무한한 돈 아니냐고 받았다. 플리크도 자유는 있지만, 중동 자본 구단처럼 돈을 계속 넣을 수는 없다는 논리였다. 그러자 처음 주장을 편 쪽은 음바페 같은 선수라도 내보낼 수 있는 권한을 말한 것이라고 다시 선을 그었다. 돈을 쓸 능력과 선수보다 감독의 판단을 우선하는 환경 가운데 무엇이 성과를 설명하느냐는 싸움이 됐다.\n\n여기서부터는 총지출과 순지출 계산이 시작됐다. 한쪽은 PSG가 루이스 엔리케 아래서 예전과 다른 영입 정책을 썼다고 주장했다. 다른 쪽은 세 시즌 순지출이 4억2000만 유로, 총지출은 7억2000만 유로였다는 자기 계산을 내놓으며 그 정도면 감독이 일하기 쉽다고 했다. 이 숫자는 게시판 참여자가 제시한 집계이며, 이번에 공식 회계나 이적 자료로 검증한 수치는 아니다. 중요한 것은 서로 같은 종류의 지출을 말하고 있는지조차 다시 확인해야 할 만큼 논쟁이 길어졌다는 점이다.\n\n과거 바르사 이야기를 꺼내면서는 기억도 충돌했다. 메시와 루이스 엔리케의 갈등 뒤 감독이 떠났다는 설명에, 다른 팬이 그건 첫 시즌이었고 그해 트레블을 한 뒤에도 두 시즌 더 있었다고 바로잡았다. 루이스 엔리케의 바르사 재임이 2014~2017년이었고 첫 시즌 트레블을 이뤘다는 것은 구단 기록으로 확인된다. [바르사 공식 기록](https://www.fcbarcelona.es/es/futbol/primer-equipo/news/1660746/barca-managers-did-you-know/featured)\n\n그렇다고 과거 선수단에 대한 평가까지 정리되지는 않았다. 선수들이 지나치게 편해졌다는 주장에 라키티치까지 묶이자, 다른 팬은 경기력 비판과 성실성 평가는 다른 문제라며 이의를 제기했다. 감독에게 권한을 줘야 한다는 대화가, 누구를 내보냈어야 했는지와 누가 충분히 프로답게 행동했는지를 다시 심사하는 자리로 번진 셈이다. 합의된 결론보다 바르사를 운영하는 일이 왜 유난히 어렵다고 느끼는지가 길게 드러난 대화였다.\n\n### 베티스의 경사: 대표팀에 뽑혔는데, 우리 컵대회는 누가 뛰나\n\n베티스 방에서는 알바로 바예스의 이름 앞에 존칭과 성을 길게 붙여 부르는 글이 나왔다. 국가대표 발탁을 축하하면서 별 두 개가 달린 골키퍼 유니폼을 사고 싶게 만든다는 반응이었다. 작성자는 곧 글을 고쳤다. 마르크 로카도 뽑혔다는 것을 뒤늦게 봤기 때문이다.\n\n바예스의 발탁이 너무나 당연하다는 글과, 로카가 조금 더 놀랍지만 시즌 초반 활약은 그만큼 좋다는 글이 이어졌다. 로카를 두고는 “필요했던 수비형 미드필더 영입이었는데, 이미 우리에게 있는 줄 몰랐다”는 표현도 나왔다. 외부에서 데려와야 할 것 같던 답이 기존 선수에게서 나타났다는 만족이다. 두 선수의 발탁은 11월 6일 스페인축구협회 명단에서 확인된다. [RFEF 공식 명단](https://rfef.es/es/noticias/esta-es-la-lista-para-cerrar-la-fase-de-grupos-de-la-uefa-nations-lague)\n\n축하가 오래 단독으로 이어지지는 못했다. 로카가 빠지고 파쿤도 베르날의 징계까지 겹친다며 컵대회에서 피보테를 어떻게 구성하느냐는 걱정이 바로 나왔다. 세바요스에 유소년 선수를 붙일지, 포르날스를 쓸지 대안을 적었다. 이 결원·징계 설명은 글타래 참여자들의 전제이며, 확인된 선발 구상이 아니다.\n\n질문은 자연스럽게 일정으로 향했다. 대표팀 경기가 있는데 왜 국왕컵을 하느냐. 철도 사고 때문에 미뤄진 경기라는 답이 나오자, 질문한 팬은 그건 알지만 대표팀 경기조차 없는 날로 옮길 수는 없느냐고 다시 물었다. 돌아온 답은 그날이 바로 클럽 경기가 없는 유일한 틈이라는 것이었다. 베티스 공식 일정에도 나발카르네로 원정은 대표팀 기간인 11월 12일에 들어 있다. [베티스 공식 일정](https://realbetisbalompie.es/index.php/primer-equipo/agenda)\n\n연맹이 베티스만 손해 보게 한다는 뉘앙스의 농담도 있었지만, 이에 동조하는 말만 쌓이지는 않았다. 구단도 동의한 날짜이고 다른 시점에 끼워 넣으면 더 어려워졌을 것이라는 설명이 나왔다. 후보 선수들로도 이 상대를 이기지 못한다면 우리 책임이라는 말도 붙었다. 한 팬은 상대를 철물점 일을 마치고 경기하러 오는 사람들에 빗댔다. 상대의 실제 직업을 전한 정보가 아니라 전력 차를 강조하는 과장이다.\n\n이후에는 차출 선수를 세는 일이 웃음거리가 됐다. 데오사가 콜롬비아에 간다는 소식에 누가 직접 뛸 수 있느냐고 묻고, 아일랜드·멕시코·우루과이 대표팀으로 갈 선수들의 이름이 이어졌다. 나탕까지 브라질에 가는 것 아니냐는 말 다음에는 안토니까지 부를 수 있다는 농담이 붙었다. 실제 발탁 목록과 ‘이러다 전부 가겠다’는 상상이 섞여 속도가 붙은 것이다.\n\n마지막에는 호아킨과 아순상에게 몸을 풀라는 말까지 나왔다. 앞에서는 대표팀 유니폼을 살 기세였는데, 뒤에서는 옛 선수들을 불러야 할 만큼 사람이 없다는 농담으로 끝났다. 발탁은 선수에게 상이고 구단에는 결원이라는 두 감정이 같은 방 안에 편하게 공존했다.\n\n### 네 번째 골키퍼보다 더 시끄러웠던 것은 감독의 속마음\n\n대표팀 글타래의 새 글은 17개였다. 바예스, 하코보 라몬, 로카라는 새 얼굴을 반기는 반응도 있었지만, 대화의 상당 부분은 골키퍼 네 명을 부른 이유로 흘렀다. 공식 명단의 골키퍼는 우나이 시몬, 다비드 라야, 조안 가르시아, 바예스다.\n\n한 팬은 데 라 푸엔테가 조안 가르시아를 마음에 들어 하지 않지만 언론의 압박 때문에 데려간다고 해석했다. 바예스의 좋은 시즌을 보상하면서 논란도 피하려는 선택이라는 것이다. 다른 팬은 조안에게 실력이 있는데 왜 발탁을 언론 압력으로 설명하느냐고 반문했다.\n\n흥미로운 점은 첫 주장을 편 쪽도 조안의 실력을 부정하지 않았다는 것이다. 오히려 다른 경쟁자보다 낫다고 생각하지만, 감독은 시몬과 라야를 중심으로 특정 선수들을 오래 신뢰하는 사람이라는 설명을 붙였다. 조안의 수준을 인정하느냐를 놓고 싸우는 듯하다가, 실제로는 감독이 그를 얼마나 좋아하는지 추정하는 논쟁이 됐다.\n\n여기에 다른 팬이 훨씬 구체적인 이유를 가져왔다. 라야가 잉글랜드에서 개인적인 사정이 있어 제때 합류할지 알 수 없다는 것이다. 데 라 푸엔테도 발표 당일 같은 취지로 설명했다. 바예스를 추가로 부른 데에는 확인 가능한 합류 불확실성이 있었다. [감독 기자회견을 전한 보도](https://elpais.com/deportes/futbol/2026-11-06/alvaro-valles-jacobo-ramon-y-marc-roca-novedades-en-la-lista-de-espana-para-los-duelos-ante-chequia-e-inglaterra.html)\n\n그래도 감독의 호불호를 확신하던 팬은 물러서지 않았다. 이전에도 네 명을 불렀다며 자기 해석을 지켰고, 바르사와 레알의 유치한 싸움에는 끼지 않겠다고 하면서 감독이 조안을 좋아하지 않는 것은 ‘사실’이라고 끝냈다. 마지막 답글은 그 ‘사실’에 뮤지컬 제목 같은 꼬리를 붙여 비꼬았다. 발탁 명단은 공개돼 있어도 감독의 마음까지 공개되는 것은 아닌데, 그 빈칸을 둘러싼 확신은 명단보다 단단했다.\n\n### 유족을 돕는 돈 앞에서, ‘축구선수’라는 말의 크기가 달라졌다\n\n헤수스 데 미겔의 사망을 다룬 글타래는 이번에 새 글 26개가 들어왔다. 테네리페는 11월 3일 그의 사망을 공식 발표했다. 이번 수집분에서 길게 이어진 것은 유족을 위한 모금이 적절한가라는 논쟁이었다. [테네리페 공식 발표](https://www.clubdeportivotenerife.es/noticias/comunicado-oficial-fallecimiento-de-jesus-de-miguel)\n\n모금에 의문을 제기한 팬의 출발점은 축구선수라면 일반인보다 경제적 여유가 있지 않느냐는 생각이었다. 스페인에서는 병원비가 미국처럼 청구되는 것도 아닌데, 왜 크라우드펀딩이 필요한지 모르겠다는 것이다. 다른 팬은 마음이 복잡하지만 자발적 모금이니 돕고 싶은 사람이 도우면 된다고 했다.\n\n이에 맞선 쪽은 ‘축구선수’를 떠올릴 때 누구의 삶을 기준으로 삼느냐고 문제를 제기했다. 데 미겔은 오랫동안 하부리그를 거쳤고 높은 소득을 누릴 수 있는 시간도 길지 않다는 주장이다. 댓글에서는 연봉 15만~20만 유로 정도라는 추산이 오갔지만 확인된 계약 자료는 아니었다. 그 추산을 받아들이더라도, 한쪽은 충분히 특권적인 수입이라고 봤고 다른 쪽은 짧고 불안정한 경력 전체를 보아야 한다고 했다.\n\n같은 숫자에 서로 다른 시간을 대입한 셈이다. 반대하는 쪽은 한 해에 평범한 노동자보다 얼마나 많이 버는지를 봤다. 옹호하는 쪽은 그런 수입을 몇 년이나 유지할 수 있으며 갑작스럽게 끊겼을 때 가족에게 무엇이 남는지를 봤다. 선수의 배우자가 이동을 따라가느라 자기 경력을 희생했을 가능성을 말하는 글도 있었다. 이 역시 해당 가족의 사정을 확인한 정보라기보다, 선수 가족의 불안정을 설명하려는 논거였다.\n\n논쟁은 다른 직업의 죽음으로 넓어졌다. 트럭 운전사나 건설 노동자가 사망했을 때는 이런 관심과 지원이 없다는 반론에 공감 4개가 붙었다. 축구가 축구계 사람을 추모하는 것이라며, 다른 분야의 지원 부재를 이유로 이쪽의 추모를 줄일 일은 아니라는 답에도 공감 4개가 붙었다. 표본 안에서는 양쪽 문제의식 모두 눈에 띄는 호응을 얻었다.\n\n한쪽은 사회적 관심의 불균형에 화가 났고, 다른 쪽은 이미 생긴 연대에까지 자격 심사가 따라붙는 데 화가 났다. 그래서 “당신들 돈을 걷어 가는 것도 아닌데 왜 그러느냐”는 짧은 답까지 나왔다. 자발성만으로 논쟁을 끝내고 싶은 반응이었지만, 누구에게 얼마만큼의 관심이 쏠리는가를 따지던 사람들에게는 충분한 답이 되지 않았다.\n\n충돌 장면을 둘러싼 글들은 이보다 더 격했다. 경기 안에서 감수하는 위험의 범위가 어디까지인지, 무거운 징계와 형사책임을 어떻게 나눠야 하는지를 놓고 다퉜다. 일부는 의료 대응의 책임까지 단정했다. 이번 자료로는 그런 의도나 책임을 확정할 수 없다. 끝에는 허위 계정의 내용을 퍼 나르지 말라는 지적도 나왔다. 애도의 글타래가 모금, 노동, 경기의 위험, 출처의 신뢰성까지 한꺼번에 떠안고 있었다.\n\n### 추모를 위해 멈추는 일과, 이미 출발한 원정 팬\n\n2부리그 글타래의 새 글은 다섯 개뿐이었지만 불만은 구체적이었다. 한 팬은 경기를 연기하는 것 자체에는 동의했다. 문제는 카스테욘–에이바르전을 전날 미루는 식이면 이미 이동한 사람들이 생긴다는 것이었다. 일주일 내내 결정할 시간이 있었는데 왜 늘 마지막 순간이냐는 항의였다.\n\n다른 팬도 데 미겔의 장례식에 구단 사람들이 참석했다는 점을 들며, 관계자들은 더 일찍 상황을 알고 있었을 것이라고 추정했다. 그 추정의 진위를 떠나 두 글이 공통으로 짚은 대상은 돈과 시간을 들여 움직이는 관중이었다. 추모에 반대해서가 아니라, 멈추기로 한다면 원정 버스와 숙박을 예약한 사람도 생각해 달라는 요구였다.\n\n그 사이에는 이제 경기를 한다고 발표됐다는 짧은 답도 끼어 있다. 이 수집분만으로 각 경기의 최종 처리 과정을 복원할 수는 없다. 다만 팬이 느낀 혼선은 또렷하다. 경기의 존중을 말하는 결정에서 정작 관중에게 알리는 시간은 자꾸 뒤로 밀린다는 것이다.\n\n### 테바스를 향한 분노는 결국 ‘내 팀 경기만 사고 싶다’로 돌아왔다\n\n라리가의 불법 중계 단속을 둘러싼 새 글타래에는 21개 글이 달렸다. 출발점은 엘 에스파뇰이 제기한 의혹이었다. 단속 보고서를 작성하는 과정에서 세 조사 인력의 서명이 허가 없이 1,352건의 보고서에 사용됐다는 내용이다. 해당 매체는 후속 보도에서도 당사자들이 보고서 최종본에 직접 서명하지 않았다는 이메일 내용을 제시했다. 이는 보도의 주장으로 소개하는 것이며 법원에서 확정된 서명 위조 사실로 쓰는 것은 아니다. [엘 에스파뇰 후속 보도](https://www.elespanol.com/deportes/futbol/20261106/correo-tebas-falseo-firmas-detectives-antipirateo-laliga-no-firmabamos/1003744447111_0.html)\n\n게시판 반응은 의혹의 절차적 세부보다 테바스에 대한 반감 쪽으로 빨리 달렸다. 이름과 “텔레그램으로 가라”를 겹친 말장난이 공감 19개를 받았다. 불법 시청을 자랑하거나 단속을 조롱하는 글도 여러 개였다. 이번 표본에서 가장 쉽게 호응을 얻은 것은 법적 분석보다 축구 중계권 운영자를 비웃는 한 줄이었다.\n\n그렇다고 기사에 대한 의심이 없었던 것은 아니다. 보도 매체를 믿기 어렵고 테바스와 적대적인 이해관계가 작용하는 것 아니냐는 반응, 증거를 묻는 반응도 있었다. 다만 매체의 배후에 관한 댓글의 주장까지 이번에 확인된 소유·관계 정보로 옮길 근거는 없다.\n\n읽을 만한 대화는 가격 이야기에서 나왔다. 유튜브에서 리그를 월 10유로, 유럽대항전을 5유로, 국왕컵을 1유로 정도에 볼 수 있다면 어떻겠느냐는 상상이 올라왔다. 다른 팬은 유럽대항전은 라리가 소관이 아니라고 짚었다. 이것은 실제 판매 상품 안내가 아니라 지금과 다른 구매 방식을 바라는 제안이었다.\n\n더 호응을 얻은 요구는 자기 팀 경기만 살 수 있게 해 달라는 것이었다. 전체 380경기 가운데 대부분에는 관심이 없는데 왜 전부 묶어 사야 하느냐는 말이다. 바지 하나와 티셔츠 몇 장을 사러 갔더니 원하지 않는 옷 수십 벌까지 떠안기는 가게에 비유한 글에는 공감 5개가 붙었다. 테바스에 대한 욕설이 길게 이어진 방에서, 소비자가 원하는 상품의 모양은 오히려 아주 구체적으로 나왔다.\n\n### 목요일 유럽축구가 멀어진 이유\n\n유로파리그 방에서는 레알 소시에다드가 이겨야 순위 싸움이 꼬이지 않는다는 기대가 먼저 나왔다. 결과 뒤에는 유럽에서 왜 이렇게 초라하냐는 탄식, 그래도 늘 그랬듯 마지막 순간에 지지는 않았다는 자조가 이어졌다.\n\nUEFA 기록상 소시에다드는 홈에서 리옹과 1-1로 비겼고, 셀타는 홈에서 위니옹 생질루아즈에 1-2로 졌다. 글타래에서 두 팀 모두 홈에서 기회를 놓쳤다는 실망이 나온 배경이다. 셀타를 향해서는 크게 무너졌다는 표현이, 마르코스 알론소를 향해서는 또 평소 같은 하루라는 비꼼이 붙었다. [UEFA 경기 결과](https://es.uefa.com/uefaeuropaleague/news/02ab-220046b5e815-1f3eb827fcfa-1000--resumen-y-videos-de-la-jornada-4-de-la-europa-league-uni/)\n\n그 사이에 결과와는 다른 종류의 상실감을 적은 글이 있었다. 오랫동안 목요일마다 보던 ‘디렉토 골’ 프로그램이 좋았다는 회고다. 유로파리그와 콘퍼런스리그를 한 시간쯤 다뤘고, 일주일 가운데 유일하게 바르사와 레알 이야기에서 벗어나는 시간이었다고 했다. 그런데 채널이 사라지고 새 채널에서는 목요일에 볼 것이 없어졌다는 것이다.\n\n방송 개편 전체를 이번에 확인한 것은 아니지만, 이 팬의 시청 경험은 분명하다. 자신이 유럽축구에서 이렇게 멀어진 적이 없었다는 말이다. 좋아하던 프로그램 하나가 없어진 자리에 경기 결과를 찾아 읽는 수고만 남았다. 라리가 글타래에서 필요 없는 경기까지 묶어 사는 것이 불만이었다면, 여기서는 찾아보고 싶은 다른 축구로 데려가 주던 시간이 없어진 것이 불만이었다.\n\n콘퍼런스리그 방의 경기 전 자신감은 짧고 선명했다. 우승 배당에서는 브라이턴이 앞서지만, 그 사람들은 보르달라스를 모른다는 말. “오늘은 이긴다”는 선언으로 끝났다. 수집된 뒤쪽 글은 영상과 사진에 기대는 부분이 많아 그 장면들을 재구성할 수 없지만, 배당표보다 자기 감독의 까다로움을 믿는 한 줄만큼은 그대로 살아 있다.\n\n### 2030년 결승전을 놓치느니, 차라리 개최를 포기하자는 사람들\n\n2030 월드컵 글타래에서는 스페인이 결승전을 맡지 못할 경우 공동개최에서 빠져야 한다는 주장과 그 비용을 누가 내느냐는 반론이 맞붙었다. 이 시기 실제 공개 논쟁에서도 결승이 모로코로 가면 개최에서 철수해야 한다는 정치권의 주장이 나왔다. [철수론을 전한 보도](https://www.europapress.es/deportes/noticia-feijoo-defiende-espana-debe-retirarse-organizacion-mundial-2030-si-final-marruecos-20261106081429.html)\n\n댓글에서는 철수 비용이 최소 15억 유로라는 수치가 제시됐다. 중계권과 후원 계약 등을 배상해야 한다는 설명도 붙었지만, 이번에 계약 원문으로 확인된 금액은 아니다. 그 수치를 내세운 팬이 반복해서 묻는 것은 더 단순했다. 결국 일반 시민의 세금으로 내는 것 아니냐는 질문이었다.\n\n반대편에서는 굴욕을 감수하느니 그 돈을 내겠다는 답이 나왔다. 어떤 팬은 결승 개최 여부보다 모로코와 함께하지 않는 것 자체가 중요하다고 했다. 또 다른 팬은 실제 철수보다 결승을 스페인으로 가져오기 위한 압박이라는 의미를 부여했다. 같은 강경 발언을 두고도 정말 나가자는 사람, 협상에 쓰자는 사람, 청구서부터 보는 사람이 나뉘었다.\n\n### 짧은 이적시장 소식, 그리고 풋살의 긴 승부차기\n\n이적시장 방의 새 글은 세 개였다. 해리 케인이 바이에른과 2029년까지 재계약했다는 소식이 올라왔고, 연봉 수준을 다룬 보도 이야기가 짧게 붙었다. 재계약 기간은 바이에른 공식 발표로 확인된다. 연봉 순위를 비교한 댓글까지 확정 정보로 보탤 필요는 없다. 이번 표본에서 이 소식은 새 논쟁보다 소식 전달에 가까웠다. [바이에른 공식 발표](https://fcbayern.com/en/news/2026/11/harry-kane-extends-with-fc-bayern-until-2029)\n\n풋살 파이널리시마 방은 일곱 개 글 안에 기다림과 불만, 환호가 모두 있었다. 먼저 스페인–포르투갈 준결승 시간을 알려 주는 글이 올라왔다. 공중파, 특히 TVE에서 보여 주지 않는 것이 의외라며 스트리밍을 찾아야겠다는 반응도 나왔다. 협회는 이 경기를 FutsalRFEF 유튜브로 중계한다고 안내했다. [RFEF 대회 안내](https://rfef.es/es/noticias/toda-la-informacion-de-la-finalissima-de-futbol-sala-en-nuestro-dosier)\n\n끝의 흐름은 빠르다. 응원 한마디, 2-2로 승부차기에 간다는 알림, 그리고 헤수스 에레로의 강한 손을 칭찬하며 결승 진출을 외치는 글이다. 공식 결과도 2-2 뒤 스페인의 승부차기 8-7 승리다. UEFA 기록에서는 에레로가 마지막 상대 슛을 막아 승부를 끝냈다. [UEFA 경기 기록](https://es.uefa.com/futsalfinalissima/news/02ab-22027c1dee0f-e9e0409d9ced-1000--finalissima-de-futbol-sala-2026-espana-se-clasifica-para-la/)\n\n### 어두운 산속, 전차 안에서도 바르사를 본다는 것\n\n바르사 방에는 다른 논쟁과 결이 전혀 다른 글도 하나 있었다. 오랫동안 축구가 있는지도 모를 만큼 관심 없는 동료들과 지냈는데, 한 달 뒤 임무에는 축구를 좋아하는 데다 바르사 팬이기까지 한 동료 세 명과 함께 간다는 이야기였다.\n\n작성자는 어두운 산속 전차 안에서 휴대전화를 최고급 영화관 화면이라도 되는 양 켜 놓고 경기를 보던 모습을 적었다. 휴대전화에 붙인 과장된 ‘울트라 프로 4K’ 표현과 웃음 표시가 길게 이어졌다. 끝에는 올해는 기쁨을 달라는 응원, 그리고 마드리드전 때는 거기서도 고생했다는 덧붙임이 있었다.\n\n이 글에는 공감 13개가 붙었다. 가비의 수준을 따지거나 PSG 지출을 계산한 글들과 같은 공간에서, 동료 셋과 같은 팀을 응원할 수 있게 됐다는 개인적인 기쁨도 눈에 띄는 호응을 얻었다. 다음 경기를 비관하는 이유는 이미 여러 개였지만, 이 팬에게는 함께 볼 사람이 세 명 더 생겼다.\n\n<details><summary>범위와 근거<\/summary>\n\n- 실행은 `2026-11-07_153938`. 제공된 20개 글타래의 새 글 232개와 수집문만 대화의 근거로 삼았다. \n- 익명 작성표시 96종은 실제 인원수가 아니다. 공감 수는 해당 글의 수집 시점 표시이며, 커뮤니티 전체의 찬반 비율로 해석하지 않았다. 바르사 56개, 베티스 29개, 데 미겔 관련 26개 등 대화가 충분한 글타래에 비중을 뒀다.\n- 본문의 링크는 일정·발탁·결과·재계약·공식 사망 발표를 확인한 자료와 의혹의 최초 보도 계열이다. 외부 자료는 수집된 화제의 사실 확인에 사용했다. 법적 책임, 선수의 확인되지 않은 연봉, 이적료 합산, 감독의 속마음과 선수 거취 전망은 팬의 주장으로 구분했다.\n- 영상·사진만 있어 내용을 알 수 없는 게시물은 장면을 추정하지 않았다. 프리미어리그의 영상 반응, 월드컵 결승 글타래의 대상 발언 등 구체적인 맥락이 부족한 대목은 별도 이야기로 늘리지 않았다. 직접 인용은 제공된 스페인어 문구의 뜻을 옮겼으며 이용자 식별정보는 싣지 않았다.\n\n<\/details>\n\n## ForoRealMadrid | 스페인\n\n이번에는 11월 5~7일 수집된 ForoRealMadrid의 글타래 8개, 새 글 87개를 읽었다. 리그 중단과 추모를 논한 글이 29개, 발렌시아 원정 글이 19개로 가장 많았다. 아래 반응의 크기는 이 수집분 안에서의 비중이다.\n\n**개관**\n\n- **추모와 경기 진행**: 테네리페 공격수 헤수스 데 미겔의 사망 뒤, 주말 리그를 멈추는 것이 맞는지를 두고 의견이 갈렸다. 사망 발표와 경기 전 추모·9분 이후 일시 중단 방침은 공식 자료로 확인했다.\n- **메스타야 원정**: 발렌시아전을 앞두고 반복된 걱정은 선제 실점과 밀집 수비였다. 비니시우스가 빠진 구성을 반기는 반응도 여러 글에 걸쳐 나왔다. 경기는 스페인 현지 11월 7일 토요일 21시 예정이며, 공식 소집 명단에 비니시우스는 없다.\n- **찾았다는 베스트 11, 남아 있는 선수층 문제**: 베르나르두 실바와 아르다 귈레르를 함께 쓰고 발베르데를 오른쪽 수비수로 돌리자는 구상이 경기 예상과 선수단 평가 양쪽에서 겹쳤다. 그 조합이 쉬는 날의 대안은 훨씬 불안하게 봤다.\n- **구단 안팎의 신경전**: 아나스 라그라리를 둘러싼 경영 능력 논쟁은 바르셀로나의 재정 조달을 도운 거래로 번졌다. 구단 매각설 등은 확인된 계획이 아닌 게시글의 주장이다. 베르나베우 글타래에서는 미국인들의 반응 영상이 가벼운 웃음을 보탰다.\n\n---\n\n### “바르사가 또 운이 좋네”에서 “지금 그 얘기가 아니다”까지\n\n리그 글타래의 처음 몇 줄은 익숙한 라이벌 계산으로 시작한다. 스페인 선수노조 AFE가 경기 중단을 요구한다는 소식이 올라오자, 한 팬은 이번 주말은 어차피 열리지 않을 것이라며 셀타전까지 기다려야겠다고 했다. 다른 팬들은 바르셀로나의 부상자가 많은 때에 까다로운 경기가 밀리면 그쪽만 이득을 보는 것 아니냐고 반응했다. 연기된 경기를 나중에 치를 때면 상대는 전력을 회복했을 것이고, 심하면 순위에 별 의미가 없는 시점에 배치될 것이라는 불만까지 붙었다.\n\n그 흐름에 한 댓글이 제동을 걸었다.\n\n> “바르사가 부상자를 피하느냐, 우리가 비니시우스의 복귀를 조금 더 늦출 수 있느냐의 문제가 아니다.”\n\n이어지는 말은 비극과 연대, 그리고 감정적으로 충격을 받은 축구인들에 관한 것이었다. 누구에게든 일어날 수 있었다는 생각 때문에라도 이번에는 경기를 하지 않는 편이 맞겠다는 의견이다. 여기에 다른 팬이 불가항력적인 사유라는 동의를 달았다. 며칠 뒤 유불리를 따지는 평소의 리그 대화와, 바로 앞에서 일어난 죽음을 받아들이는 대화가 같은 글타래에서 부딪힌 순간이었다.\n\n사건의 바탕은 확인된다. 테네리페는 헤수스 데 미겔이 11월 3일 오전 사망했다고 발표했다. 마드리드축구협회도 전날 테네리페–안도라전 막판 충돌 이후 심폐정지를 겪은 선수가 회복하지 못했다고 전했다. 게시판이 마주한 것은 단순한 일정 변경 소문이 아니라, 동료 선수를 잃은 직후의 주말이었다. [테네리페 공식 발표](https://www.clubdeportivotenerife.es/noticias/comunicado-oficial-fallecimiento-de-jesus-de-miguel), [마드리드축구협회 발표](https://www.rffm.es/noticias/el-futbol-de-madrid-se-viste-de-luto-con-el-fallecimiento-de-jesus-de-miguel)\n\n경기를 하자는 쪽도 하나의 이유로 모이지는 않았다. 누군가는 경기장마다 묵념하고 골을 바치며 고인을 기억하는 것이 일상을 되찾는 데 도움이 될 것이라고 봤다. 또 다른 팬은 이번 주말을 통째로 비워 버리면 국가대표 휴식기가 오고, 다시 리그가 시작될 무렵에는 기억이 흐려질 것이라고 했다. 그에게는 관중이 모인 경기장에서 사진과 응원, 추모를 남기는 편이 더 오래가는 방식이었다.\n\n일정의 일관성을 따지는 의견도 여러 차례 등장했다. 이미 챔피언스리그를 치렀고 유로파리그와 콘퍼런스리그도 진행되는데, 사고에서 더 멀어진 주말 리그만 중단하는 것이 맞느냐는 것이다. 중단할 생각이었다면 화요일에 결정했어야 했다는 댓글은, 목요일 늦게까지 결론을 기다리는 상황 자체를 문제 삼았다. 다음 날부터 경기가 있는데 언제까지 기다려야 하느냐는 짧은 재촉도 있었다.\n\n반대편은 그 시간 계산을 다르게 받아들였다. “오늘이 장례식이었다”는 답글이 돌아왔다. 주말이면 사고로부터 며칠이 지났는지를 세는 사람과, 아직 장례를 치르는 중이라고 느끼는 사람 사이에는 같은 날짜표로 좁히기 어려운 거리가 있었다. 일반 회사에서도 동료가 사망했다고 일주일간 문을 닫지는 않는다는 비교가 나오자, 논쟁은 축구의 일정에서 일터의 애도 방식으로까지 넓어졌다.\n\n조금 더 절충적인 의견은 가장 직접적으로 영향을 받은 2부리그, 또는 해당 구단들만 쉬게 하자는 것이었다. 전체 중단에 동의하지 않는 팬도 테네리페와 안도라, 고인과 인연이 있는 팀들이 받았을 충격은 따로 봐야 한다고 생각했다. 실제로 수집분에는 전면 중단, 관련 경기 중단, 경기 진행이라는 선택지가 모두 나타난다. 서로가 애도의 필요성을 부정해서 갈렸다기보다, 애도를 어떤 행동으로 보여 줄지에서 갈린 대화에 가깝다.\n\n### 9분에 멈추기로 한 뒤에도 남은 이야기\n\n글타래에 경기 진행과 9분 추모 소식이 들어오자, 이후 수집된 댓글에서는 그 방식을 받아들이는 반응이 여럿 나왔다. 경기장마다 고인의 이름을 부르고 박수를 보내는 편이 적절하다는 설명, 선수 사진과 대형 응원 연출이 나왔으면 좋겠다는 기대가 이어졌다. 중단을 예상했던 팬은 결정에 놀랐다면서도, 곧바로 발렌시아–레알 마드리드와 아틀레티코–바르셀로나라는 주말 대진으로 시선을 옮겼다.\n\n공식 공동 발표는 경기 전 추모와 함께, 등번호를 기리는 의미로 **9분 이후 처음 경기가 끊길 때** 경기를 잠시 멈추도록 했다. 게시판에서 짧게 전달된 “9분에 멈춘다”는 소식의 실제 운영 방식이다. 이 추모는 11월 6~9일 해당 대회들에서 진행하도록 발표됐다. [스페인축구협회·라리가·리가 F 공동 발표](https://rfef.es/es/noticias/siempre-en-nuestro-recuerdo-el-futbol-espanol-se-une-en-homenaje-jesus-de-miguel)\n\n결론이 나온 뒤 대화의 무게중심은 유가족 지원으로도 옮겨 갔다. 어느 선택이든 존중할 만했다는 팬은 경기 수입 일부를 가족에게 전할 수 없겠느냐고 했다. 다른 댓글은 더 거칠었다. 가족에게 실질적으로 필요한 것은 대회가 멈췄다는 사실보다 앞으로의 걱정을 덜어 줄 돈일 것이라는 주장이다. 마지막 무렵에는 모금액과 구단 관계자들의 기부를 전하는 글도 올라왔다. 수집 자료에 적힌 모금 수치와 개별 기부액은 별도로 확인되지 않았으므로 여기서 확정 금액으로 옮기지는 않는다.\n\n반복된 것은 “경기를 할까, 말까”를 넘어 무엇이 남아야 하느냐는 질문이었다. 응급 의료 대응 절차를 점검하자는 의견이 있었고, 위험한 골키퍼의 돌진을 줄일 제도가 필요하다는 제안도 있었다. 한 팬은 경기 중 옐로카드만 받았거나 파울조차 불리지 않은 거친 플레이라도 사후 검토를 통해 여러 경기 출전 정지를 줘야 한다고 했다. 위험한 도전으로 잃을 것이 분명해야 행동이 달라진다는 논리였다.\n\n반면 충돌 상대의 의도를 단정하고 강한 처분을 요구하는 댓글도 있었다. 그 대목은 사건의 확인된 경위와 구분해야 한다. 이번 수집분이 보여 주는 것은 징계 판단의 근거라기보다, 비극을 본 팬의 분노가 어느 방향으로 향했는지다. 경기 중단 여부에서는 갈렸던 사람들이 추모, 유가족 지원, 재발 방지라는 서로 다른 후속 행동을 꺼냈다는 점이 이 긴 대화에 남았다.\n\n### 메스타야에서 두려운 것은 이름값보다 먼저 내주는 한 골\n\n발렌시아 원정 글타래로 옮겨 가면 말투는 다시 거칠어진다. 상대를 바르셀로나의 위성 구단처럼 부르며 이겨서 더 아래로 밀어 넣자는 도발이 먼저 나온다. 그러나 막상 경기 이야기가 시작되면 손쉬운 승리를 장담하는 분위기와는 거리가 있다. “아주 어려운 경기”라는 표현이 여러 번 반복되고, 3점만 얻으면 경기력은 크게 따지지 않겠다는 댓글도 두 차례 등장한다.\n\n팬들이 떠올린 핵심 인물은 하비에르 아기레였다. 수집된 글들은 그의 팀이 마요르카 시절 레알을 괴롭혔던 기억을 메스타야에 겹쳐 놓는다. 상대 감독이 관중을 달아오르게 할 줄 알고, 메스타야는 작은 계기만 있어도 분위기가 확 바뀌는 곳이라는 경계다. 발렌시아의 현재 전력이 얼마나 강하냐보다, 레알을 만났을 때 경기의 성격이 어떻게 변하느냐를 걱정하고 있었다.\n\n전술적으로 가장 구체적인 두려움은 선제 실점이었다. 발렌시아가 먼저 골을 넣으면 더 깊이 내려앉을 것이고, 레알은 또 밀집 수비 앞에서 각자 벽에 부딪히는 공격을 반복할 수 있다는 것이다. 한 댓글은 이번 경기를 수비가 닫힌 상대를 공략하는 법을 배웠는지 확인할 기회로 봤다. 상대가 많이 뛰고, 경기를 끊고, 무승부를 노릴 것이라는 예상도 같은 흐름이다.\n\n이 경계심과 병행해 “제대로 된 선수들이 나오면 충분히 이겨야 한다”는 기대가 있었다. 여기서 제대로 된 선수란 단순히 유명한 이름을 모두 늘어놓는다는 뜻이 아니다. 게시글들이 구체적으로 요구하는 배치는 상당히 비슷했다. 왼쪽에는 디오망데, 오른쪽 수비수는 발베르데, 중원에는 베르나르두와 귈레르다. 추아메니와 벨링엄을 더한 구성을 적은 예상 선발도 있었다.\n\n이 조합으로 4-1 승리를 예측한 글이 있는가 하면, 같은 선수들을 고르면서도 마지막 공격수 자리에는 “음바페든 에스피든 엔드리크든 누구나”라고 적은 글도 있다. 한쪽은 새 조합의 공격력을 믿고, 다른 쪽은 선수 배치의 기본 틀이 맞으면 최전방 이름에는 덜 집착하겠다는 태도다. 수집분에서 보이는 공통점은 스타를 몇 명 넣느냐보다 공이 돌아갈 구조를 먼저 세우려는 기대였다.\n\n공식 소집 명단에는 귈레르, 추아메니, 베르나르두, 디오망데, 에스피 등이 포함됐고 비니시우스는 없다. 다만 팬들이 적은 선발은 어디까지나 희망안이다. 메스타야에서 현지 토요일 21시에 치르는 12라운드라는 일정과 소집 명단까지가 구단 발표로 확인되는 범위다. [레알 마드리드 발렌시아전 공식 소집 명단](https://www.realmadrid.com/es-ES/noticias/futbol/primer-equipo/convocatorias/convocatoria-del-real-madrid-ante-el-valencia-06-11-2026)\n\n휴식 시간에 대한 불만도 이 예상에 붙었다. 레알은 수요일 유럽대항전을 치르고 토요일에 뛰는데 다른 스페인 참가 팀들은 일요일에 경기한다는 게시글이 올라왔고, 바르셀로나와 아틀레티코는 화요일에 뛰었다는 답글이 뒤따랐다. 이 비교는 곧 대회 운영을 향한 의심으로 번졌다. 제시된 자료만으로 일정 편성의 의도를 판단할 수는 없지만, 팬들에게는 메스타야의 밀집 수비를 풀 체력과 준비 시간이 충분하냐는 걱정이 먼저 깔려 있었다.\n\n### 비니시우스의 빈자리가 반갑다는 말이 여러 곳에서 나왔다\n\n이번 표본에서 가장 날카롭게 반복된 선수 평가는 비니시우스를 향했다. 발렌시아전 글타래에는 그의 부재를 이점으로 꼽는 댓글이 여럿 있었고, 선수단을 평가하는 별도 글에서도 현재의 비니시우스가 팀 전체의 균형을 흔든다는 주장이 나왔다. 한두 개의 눈에 띄는 악평만으로 끝난 소재는 아니다. 그렇다고 이것을 레알 팬 전체의 결론으로 확대할 수는 없다. 이번에 읽은 두 글타래에서 같은 방향의 불만이 반복됐다는 정도가 맞다.\n\n그 불만은 대체로 공을 다루는 방식과 연결됐다. 비니시우스 대신 귈레르가 들어가면 볼을 더 판단력 있게 쓸 수 있을 것이라는 기대, 디오망데를 왼쪽에 고정해야 한다는 요구가 있었다. “없어서 행복하다”는 노골적인 한 줄도 나왔지만, 더 길게 쓴 팬들은 그가 돌아왔을 때 무리뉴가 어떻게 선발과 균형을 관리할지 어려운 문제가 될 것이라고 봤다.\n\n기대가 과감한 상상으로 넘어간 댓글도 있다. 비니시우스 없이 좋아졌다면 음바페 없이도 같은 일이 벌어질 수 있지 않겠느냐는 것이다. 그 팬은 에스피를 대신 넣었다가 8-0으로 이기고 그가 네 골을 넣는 장면을 상상했다. 두 스타 없이 그런 결과가 나오면 플로렌티노의 표정이 볼만하겠다는 농담까지 붙였다. 실제 결과나 현실적인 예측이라기보다, 이름값 때문에 건드리기 어렵다고 느끼는 선발 질서가 한 번 뒤집히기를 바라는 과장이다.\n\n반대로 이 수집분에는 비니시우스의 복귀를 적극적으로 옹호하는 답글이나, 그를 빼면 잃게 되는 장점을 길게 설명한 반론이 담겨 있지 않다. 그래서 이번 대화는 찬반의 균형 잡힌 토론보다는, 최근 선택지에 만족한 팬들이 그 만족을 점점 더 센 말로 확인하는 모습에 가깝다. 발렌시아전의 결과를 아직 보지 않은 시점이라는 점도 중요하다. 이들이 반기는 것은 메스타야에서 검증을 마친 해답이 아니라, 이제 그곳에 들고 갈 해답 후보였다.\n\n### “우리 팀 정말 좋다”는 제목 아래, 열한 명 다음을 걱정하다\n\n‘우리는 대단한 팀을 갖고 있다’는 제목의 글타래에는 작은 엇박자가 있었다. 첫 반응 중 하나가 “아, 1군 얘기였나. 유소년 팀 얘기인 줄 알았다”는 농담이었다. 유소년 경기 스코어를 덧붙인 뒤, 어차피 무리뉴가 그 선수들을 쓰지는 않을 것이라고 했다. 제목이 약속하는 자신감과 실제 댓글의 불신이 첫머리부터 함께 놓인다.\n\n그 뒤 한 팬이 제시한 평가는 꽤 분명했다. 현재 경쟁력 있는 베스트 11은 있으며, 발베르데는 반드시 오른쪽 수비수, 추아메니는 균형을 잡는 피벗, 귈레르와 베르나르두는 창조성을 맡는 선수, 디오망데는 음바페 옆 왼쪽이라는 구성이다. 수비진과 벨링엄까지 채우면 강팀을 상대로도 특별한 경기에서 이길 수 있다는 낙관이었다. 다른 팬도 지금으로서는 그 구성이 최선인 것 같다고 동의했다.\n\n곧이어 나온 반론은 선발의 질보다 가동 시간에 관한 것이었다. 베르나르두와 귈레르를 함께 써야 경기에 맥락이 생기는 것은 알겠는데, 둘이 모든 경기를 뛸 수는 없다는 것이다. 중원에서 판단력 있게 공을 쓸 수 있는 선수가 사실상 두 명뿐이라는 거친 표현도 나왔다. 최적의 열한 명을 찾았다는 안도와, 그 열한 명이 매번 나와야만 한다는 불안이 붙어 있었다.\n\n대안으로 거론된 이름은 티아고였다. 계속 뛰고, 터치가 좋으며, 두 선수에게 휴식을 줄 수 있다는 평가다. 베르나르두의 이상적인 대체자라고 부른 댓글도 있었다. 그런데 그 칭찬은 거의 곧바로 “그래도 거의 뛰지 못하고 한 해를 보낼 것”이라는 예상으로 이어졌다. 좋은 유망주가 있느냐는 질문과, 그 선수가 실제로 1군 시간을 받느냐는 질문을 팬들이 별개로 보고 있는 것이다.\n\n유소년 활용에 대한 답답함은 바르셀로나와의 비교로 번졌다. 그쪽은 어린 선수들이 계속 나오는데 우리는 왜 안 되느냐는 불만이다. 댓글은 안첼로티, 사비 알론소, 무리뉴라는 이름을 차례로 거론하며 특정 감독 한 명의 문제로 끝내지 않았다. 상대적으로 아르벨로아는 조금이라도 시도한 감독으로 기억됐다. 이어 바르셀로나 유망주와 유소년 경기 결과, 레알의 과거 컵대회 패배까지 소환됐지만, 여기서 핵심은 그 각각의 결과보다 “큰 이름을 내보내고도 지는데 어린 선수에게는 왜 기회가 없느냐”는 누적된 불만이었다.\n\n선수단 구상 글타래의 새 글은 하나뿐이었지만, 그 짧은 글도 같은 관심사를 비췄다. 귈레르는 조금 더 아래에서, 니코 파스는 오른쪽에서 쓰자는 위치 조정 뒤에 루닌부터 에스피까지 후보 명단을 적었다. 1군의 유명한 이름을 나열하는 데서 멈추지 않고, 교체 선수들이 어떤 역할을 이어받을지를 상상하는 대화다. 이번 표본의 선수단 낙관은 두꺼운 선수층에 대한 만족이라기보다, 잘 맞는 조합을 발견했다는 기쁨에 더 가까웠다.\n\n### 유럽의 최상층인가, 그 아래에서 가장 위험한 팀인가\n\n챔피언스리그 글타래의 네 글에는 레알의 위치를 둘러싼 온도 차가 압축돼 있다. 누군가는 파리 생제르맹을 가장 위에, 아스널을 그 아래에 두고 레알과 바이에른을 다음 층에 놓은 기존 평가에 반응했다. 전날 경기를 이기는 데도 고생했다며, 지금 레알은 바이에른급이 아니라 인테르 정도와 비교해야 하지 않겠느냐는 답이다.\n\n바이에른은 늘 과대평가된다는 반박도 돌아왔다. 그 팬은 지난 맞대결에 대한 자신의 기억을 근거로, 레알이 형편없던 때에도 충분히 승부할 수 있었다고 주장했다. 아스널 역시 대단한 초강팀이라기보다 레알이 특히 상대하기 어려운 유형이라는 해석이었다. 우승 가능성의 순위를 매기는 이야기 속에서 ‘누가 더 강한가’와 ‘누가 우리에게 더 까다로운가’가 갈라진다.\n\n다른 댓글은 PSG가 세 계단쯤 위에 있고 아스널, 바이에른도 앞선다고 봤다. 수비가 좋아진 바르셀로나까지 조건부로 더했다. 그러면서도 베르나르두와 귈레르가 큰 경기에서 좋은 상태라면, 레알은 유럽의 5~8위권으로 묶이는 팀들 가운데 가장 앞설 수 있다고 했다. 베스트 11에 대한 기대가 유럽 무대의 자평에서도 다시 같은 두 이름으로 돌아온 셈이다.\n\n오히려 우승 후보로 크게 불리지 않는 편이 낫다는 말도 붙었다. 이번 수집분의 자신감은 모든 상대보다 강하다는 확신과 다르다. 더 좋은 팀이 있다는 사실을 인정하면서도, 필요한 날 좋은 선수들이 제 역할을 하면 충분히 위험한 팀이 될 수 있다는 기대다.\n\n그 진지한 서열 논쟁 옆에는 하피냐가 크리스티아누 호날두의 챔피언스리그 득점에 도달하기까지 ‘겨우’ 118골 남았다는 게시물이 놓였다. ‘미스터 챔피언스’라는 호칭과 긴급 속보 이모지를 잔뜩 붙인 라이벌 조롱이다. 숫자는 이 게시물의 농담 장치이며, 이번 원고에서 현재 득점 기록으로 검증해 제시하는 통계는 아니다. 네 글짜리 표본 안에서도 유럽의 현실적인 위치를 재다가 바르셀로나 선수를 놀리는 평소의 리듬으로 금세 돌아간다.\n\n### 라그라리는 유능한 재정가인가, 왜 라이벌을 도왔는가\n\n아나스 라그라리 글타래는 그를 옹호하는 글에서 불이 붙었다. 구단 재정을 다루는 최고 수준의 경영자이며, 스포츠 쪽은 다른 담당자들이 맡고 있으니 역할을 구분해야 한다는 내용이다. 본인은 회장이 되고 싶어 하지 않고 장차 나달에게 도움이 될 수 있다는 전망도 덧붙였다. 이는 공식 직책과 승계 구도를 확인한 설명이 아니라 해당 팬의 인물 평가와 예상이다.\n\n반대 댓글은 훨씬 멀리 나갔다. 레알을 SAD, 즉 스포츠 주식회사 형태로 바꾸고 외부에 팔려는 인물이라는 주장이었다. 여기에 “출처?”라는 답이 붙었고, “마이애미가 확인해 줬다”는 식의 빈정거림이 이어졌다. 이 장면만 봐도 그 주장이 글타래 안에서 사실로 합의된 것은 아니다. 회원 소유 구단의 미래를 걱정하는 감정과, 그 걱정을 떠받칠 근거를 요구하는 반응이 함께 있었다.\n\n논쟁이 조금 더 구체적인 거래로 옮겨 간 계기는 언론 기사 인용이었다. 라그라리와 관련된 키 캐피털이 2022년 바르셀로나의 중계권 거래를 중개하고 1,050만 유로가 넘는 수수료를 받았다는 내용이다. 수집문에 인용된 보도는 실제 엘 콘피덴시알 기사에서 확인되지만, 그 수수료는 해당 매체가 취재원들을 근거로 보도한 금액이다. 공개된 거래 당사자의 발표로 확인되는 것은 바르셀로나가 식스 스트리트와 중계권 투자 계약을 체결했다는 사실이다. [엘 콘피덴시알의 수수료 보도](https://www.elconfidencial.com/empresas/2026-06-04/mano-derecha-florentino-cobro-comision-salvar-barcelona-laporta_4366904/), [식스 스트리트의 2022년 첫 계약 발표](https://sixthstreet.com/investment_announce/fc-barcelona-and-sixth-street-reach-an-agreement-for-the-acquisition-of-a-10-share-of-the-clubs-laliga-tv-rights/)\n\n팬들의 쟁점은 수수료 액수만이 아니었다. 레알 회장과 가까운 금융가가 왜 바르셀로나에 숨통을 틔워 줬느냐는 것이다. 옹호하는 쪽은 바르셀로나가 어차피 다른 경로로 돈을 받았을 것이고, 이 거래는 테바스에게 돌아갈 이익을 막은 선택이었다고 주장했다. 여기에 베르나베우 공연 문제와 레알이 받는 돈에 관한 설명까지 엮었다. 그 연결고리들은 이번 확인에서 입증된 사실로 다루지 않는다.\n\n반박은 짧고 차가웠다. “머릿속에서는 대단하게 들리겠지. 말로 꺼내니 힘이 빠지네.” 다른 댓글은 그렇게 재정적 숨통을 얻은 바르셀로나가 리그에서 레알을 앞선 결과를 문제 삼았다. 거래가 다른 선택보다 나았다는 설명과, 그 거래 이후 라이벌이 강해졌다는 불쾌감은 서로 다른 답을 요구하고 있었다.\n\n그래서 이 글타래에서 라그라리를 둘러싼 평가는 끝내 만나지 못한다. 한쪽은 금융 거래와 구단 경영의 효율을 말하고, 다른 쪽은 레알과 가까운 사람이 라이벌의 생존을 도운 일을 받아들일 수 없다고 한다. 수집된 11개 글은 레알의 미래 소유 구조를 확정할 자료는 아니지만, 구단을 위한 유능함이 무엇인지 팬들이 서로 다른 기준으로 따지고 있다는 점은 선명하게 보여 준다.\n\n별도의 ‘축구의 부패’ 글타래 네 글은 훨씬 압축적이었다. 테바스의 거취에 관한 영상 소개 하나 뒤로, 축구계와 스페인 정치를 함께 겨냥한 반어와 냉소가 이어졌다. 새로 검증할 만한 구체적인 증거가 제시된 토론이라기보다 제도를 믿지 못한다는 감정의 확인에 가까웠다. 발렌시아전 일정에서 시작된 의심, 라그라리 거래를 둘러싼 불신과 나란히 읽히지만, 각각의 주장이 서로를 입증하는 것은 아니다.\n\n### 미국인은 고교 라커룸 같다고 하고, 직접 들어간 팬은 감탄했다\n\n베르나베우 글타래에서는 훨씬 가벼운 대화가 오갔다. 영상에 달린 미국인들의 답글이 라커룸을 고등학교 시설 같다고 놀린다는 소개에, “원정팀 라커룸인가 보지”라는 농담이 붙었다. 다른 영상에도 미국인들의 반응이 웃기다는 말이 나왔다. 원본 영상의 전체 맥락은 수집문에 없으므로, 이들이 실제로 어느 공간을 보고 무엇과 비교했는지까지 넓혀 말할 수는 없다.\n\n이 짧은 웃음 사이에서 경기장 자체에 대한 자부심은 분명했다. “우리가 가진 것을 좀 알아봐 달라”는 댓글에 내부는 정말 대단하다는 동의가 돌아왔다. 몇 차례 직접 가 봤다는 팬은 입장할 때 받는 인상이 강하고 아름다운 경기장이라고 했다. 미국의 경기장들과 비교해도 뒤질 것이 없다는 평가였지만, 최근 새로 단장한 미국 구장들은 가 보지 않았다는 단서도 스스로 달았다.\n\n흥미로운 부분은 바로 다음 말이었다. 건물은 훌륭한데 요즘은 유럽 축구장 특유의 분위기가 조금 부족하다는 것이다. 언젠가 클래식코에 가면 더 축구다운 분위기를 느낄 수 있지 않겠느냐는 기대가 이어졌다. 시설을 자랑하는 마음과 관중석의 열기를 아쉬워하는 마음이 한 댓글 안에 공존했다.\n\n이번 수집분의 레알 팬들은 경기장 안팎에서 비슷한 것을 따지고 있었다. 잘 지은 경기장이 실제로 어떤 분위기를 만드는지, 훌륭한 선수들이 함께 뛰면 공이 어떻게 흐르는지, 경기를 계속하는 일이 어떤 기억을 남기는지다. 베르나베우를 칭찬한 팬의 마지막 관심도 건축물의 외형에서 다음에 그 안에서 경험할 경기로 돌아왔다.\n\n<details><summary>범위와 근거<\/summary>\n\n- 실행 구분은 2026-11-07_153938. 제공된 수집문은 11월 5~7일 게시글을 담고 있다. 게시 시각의 시간대는 자료에 명시되지 않아 임의로 환산하지 않았다.\n- 글타래별 새 글은 리그 29개, 발렌시아전 19개, 라그라리 11개, 선수단 평가 9개, 베르나베우 6개, 부패 논쟁 4개, 챔피언스리그 4개, 희망 선수단 1개다. 합계 83개로, 수집문 머리의 총계 87개와 차이가 있다. 본문 반응의 크기는 실제 제공된 글과 글타래별 표시를 기준으로 서술했다.\n- 수집문은 약 24,847자를 싣는다고 안내하며, 익명 작성표시 34종은 실제 사람 수를 뜻하지 않는다. 글타래 간 작성표시를 연결하지 않았다. \n- 사망 사실은 테네리페와 마드리드축구협회 발표, 추모 방식은 스페인축구협회 공동 발표, 발렌시아전 일정과 소집 선수는 레알 마드리드 발표로 확인했다. 확인 출처는 해당 문단에 연결했다. 외부 확인은 사건의 배경과 확인 상태를 정하는 데 사용했으며, 수집되지 않은 팬 반응을 보태지 않았다.\n- 라그라리 관련 수수료는 언론 보도로 귀속했다. 바르셀로나–식스 스트리트의 거래 자체는 당사자 발표로 확인했다. 구단 매각설, 대안 거래의 수익 배분 주장, 영상 속 정치·축구계 의혹, 모금액, 게시글이 회고한 개별 경기 결과는 확인된 사실로 제시하지 않았다.\n- 예상 선발·예상 스코어·유럽 전력 순위는 모두 팬의 의견이다. 번역 인용은 제공된 스페인어의 의미를 따랐고, 이용자 닉네임은 싣지 않았다.\n\n<\/details>\n\n## MilanWorld | 이탈리아\n\n11월 5~7일 수집된 MilanWorld의 16개 글타래, 새 글 105개를 읽었다. 더비 승리 뒤 페렌츠바로시전 패배를 받아들이는 대화가 중심이다. 아래의 반응은 이번에 수집된 글의 범위이며, 포럼 전체의 의견 분포를 뜻하지 않는다.\n\n**개관**\n\n- **더비 다음의 0–2**: 밀란의 페렌츠바로시전 홈 패배와 유로파리그 4경기 승점 3은 구단 공식 기록으로 확인됐다. 팬들은 선수층 부족, 로테이션, 대회를 대하는 태도 가운데 어디에 원인을 둘지를 놓고 갈렸다.\n- **앞으로 가지 않는 공**: 수비에서 중원을 거쳐 공격으로 연결하지 못한다는 전술 글이 별도로 열렸다. 야샤리에게 비판이 집중됐지만, 공격수의 지원 움직임과 풀백의 소극성도 쟁점이었다.\n- **더비가 시즌의 트로피인가**: 인테르 쪽 매체의 ‘밀라노의 토리노’라는 도발에 일부는 동의하고, 일부는 더비 승리를 즐기는 것까지 문제 삼느냐며 반발했다.\n- **시세와 새 유니폼**: 시세의 이탈리아 성인대표팀 첫 발탁은 공식 확인됐다. 2027/28 홈 유니폼 이미지는 정식 발표가 아닌 유출 예상도이며, 해당 글타래에서는 호평이 두드러졌다.\n\n---\n\n### “페렌츠바로시가 지금 우리보다 약한가”\n\n경기 종료 직후 올라온 짧은 “축하합니다…”에는 축하할 일이 없었다. 며칠 전 더비에서 이긴 밀란이 이번에는 산시로에서 페렌츠바로시에 졌다. 패배 글타래의 대화는 상대를 깎아내리는 분풀이와, 이제는 그런 말부터 접어야 한다는 체념 사이를 빠르게 오갔다.\n\n결과는 0–2였다. 구단 공식 보고서에 따르면 조지프가 후반 52분과 66분에 두 골을 넣었다. 첫 골은 더빈터의 백패스를 받은 토리아니가 자카리아센의 압박에 공을 빼앗긴 뒤 나왔고, 두 번째는 역습에서 나왔다. 페렌츠바로시는 77분 유수프의 퇴장으로 열 명이 됐지만 밀란은 득점하지 못했다. 네 경기 뒤 승점은 여전히 3점이다. [AC 밀란 공식 경기 보고서](https://www.acmilan.com/en/news/articles/europa_league/2026-11-05/rossoneri-lose-on-uel-matchday-four)\n\n이날의 분노를 잘 드러내는 것은 “또 졌다”보다 다음 문장이었다.\n\n> “지금 페렌츠바로시가 밀란보다 약한 팀은 아니다. 이런 것도 받아들여야 한다.”\n\n곧바로 반론이 붙었다. 주전으로 나가고 제대로 축구를 하려는 의지만 있었다면 충분히 이길 수 있다는 것이다. 그 반론에서 문제는 상대의 수준이 아니라 밀란의 관심과 후보 선수들의 수준이었다. 같은 경기를 두고 한쪽은 현재의 전력을 인정하자고 했고, 다른 쪽은 그날 내보낸 팀을 밀란의 전력 전부로 받아들이기를 거부했다.\n\n상대를 대하는 말투에도 이 차이가 나타났다. 어떤 댓글은 또 다른 아마추어들에게 잔칫날을 만들어 줬다는 식으로 패배를 비꼬았다. 반면 상대가 지금의 밀란에 뒤지지 않는다는 댓글은 바로 그 전제를 뒤집었다. 이름값으로 먼저 승패를 정해 놓고 결과에 모욕감을 느낄 것인가, 실제로 나온 경기력을 기준으로 상대를 볼 것인가의 충돌이었다.\n\n유로파리그를 작은 컵대회라는 뉘앙스의 ‘코페타’로 부른 댓글도 있었다. 상대는 밀란보다 훨씬 더 원하고 관심을 갖고 뛰는데, 이런 결과가 나오는 것은 당연하다는 말이었다. 여기서 대회를 낮춰 부르는 표현은 마음 편히 버려도 된다는 선언으로 끝나지 않았다. 여름에 구단이 내린 선택의 결과라는 책임 추궁이 바로 따라왔다.\n\n그 옆에서는 차라리 참가하지 않았으면 이런 꼴을 전 세계에 보이지는 않았겠다는 탄식이 나왔다. 다음 그리스 원정에서는 더 크게 당할 수 있다는 비관도 있었다. 유럽은 이미 끝났다고 단정한 댓글은, 그렇다면 리그에서라도 정상권 경쟁을 해야 하며 그렇지 못하면 자신의 기준에서는 시즌 실패라고 선을 그었다. 실제 탈락 확정 소식이 아니라, 패배 직후 한 팬이 남은 시즌에 새로 매긴 조건이었다.\n\n더비 승리도 이 글타래에서는 방패가 되지 못했다. 한 댓글은 이제 더비는 관성으로 이기는 경기라 큰 참고가 되지 않는다고 잘라 말했다. 며칠 전의 기쁨을 없던 일로 만들기보다, 그 한 경기로 팀의 수준을 판정할 수 없다는 불신이 훨씬 커진 밤이었다.\n\n### 백패스의 밤에 열린 ‘1–2’ 토론\n\n패배 직후 따로 열린 전술 글의 제목은 ‘1–2: 밀란은 이것을 할 줄 모른다’였다. 여기서 작성자가 설명한 ‘1–2’는 흔히 떠올리는 짧은 벽 패스 자체보다, 수비수가 중원에 공을 전달하고 그 중원이 공격수에게 이어 주는 연결 과정이었다. 그의 불만은 복잡한 공격 패턴을 못 만든다는 수준에 있지 않았다. 공을 중원까지 운반하는 일부터 되지 않는다는 것이었다.\n\n첫 반론은 맨 앞에서 나왔다. 공격 지역에 자신 있게 공을 받으러 내려오는 선수가 없고, 공을 지켜 주는 동안 동료들이 다음 패스 방향을 만들어 주지도 않는데 뒤쪽만 탓할 수 있느냐는 지적이었다. 특히 라모스의 움직임이 도마에 올랐다. 그 댓글이 요구한 공격수의 일은 마무리에 앞서, 압박받는 동료에게 공을 줄 곳을 만들어 주는 일이었다.\n\n글을 연 쪽은 라모스가 더 내려올 수 있었다는 점은 인정하면서도 초점을 유지했다. 그렇다고 공격수가 무사와 야샤리의 발밑까지 가서 공을 직접 가져와야 하느냐는 반문이었다. 그가 이날 가장 나쁘게 본 것은 점유 상황의 수비수와 미드필더였다. 공격수가 도와주지 않았다는 설명으로는, 뒤에서 중원으로 공을 보내는 첫 단계의 실패까지 설명할 수 없다는 입장이었다.\n\n흥미롭게도 이 둘은 끝까지 서로 다른 경기를 본 사람처럼 다투지는 않았다. 공격수의 지원 부족을 지적했던 쪽도, 출전한 선수들이 경기의 다음 장면을 잘 보지 못하고 상대가 제대로 압박하면 뻔한 안전 패스를 뒤로 보낸다고 답했다. 어디서 문제가 시작되는지를 놓고 갈렸지만, 압박을 받는 순간 선택지가 사라진다는 진단에는 가까워졌다.\n\n이 과정에서 반복된 현지 표현이 ‘페르소날리타’였다. 단순히 성격이 강하다거나 투지가 좋다는 뜻으로만 쓰이지 않았다. 이 대화에서는 상대가 붙어도 공을 받겠다고 나서고, 받은 뒤 다음 플레이를 선택하는 배짱까지 포함했다. 기술이 없어서 못 하는 것인지, 할 수 있는 선수가 책임을 피하는 것인지가 섞여 있었다.\n\n다른 댓글은 후방 전개의 미학 자체에 불만을 터뜨렸다. 실점을 잔뜩 해도 빌드업은 추앙받고, 이기는 수비 축구는 천대받는다는 것이다. 자신은 차라리 길게 걷어 내고 세컨드볼을 놓고 싸우는 편을 택하겠다고 했다. 작성자는 이 말에 동의하면서, 상대의 거센 압박 때문에 공격 측면 선수들이 편하게 전방을 향해 플레이할 공을 한 번도 받지 못했고 점유가 깔때기처럼 좁아졌다고 설명했다.\n\n따라서 이 글타래를 ‘빌드업 찬반’만으로 읽으면 가장 구체적인 불만을 놓친다. 팬들이 묻는 것은 후방에서 출발하느냐의 취향보다, 압박에 막혔을 때 다른 출구가 있느냐였다. 중원을 통과하지도 못하고, 앞에서 받아 주지도 못하고, 그렇다고 두 번째 공을 겨냥하는 방식으로 바꾸지도 못하는 답답함이었다.\n\n마지막으로 이 문제를 중앙 미드필더 영입에 연결한 댓글이 나왔다. 여름 내내 그 자리에 한 명이 아니라 두 명이 필요하다고 주장했다는 팬이었다. 반드시 특급 선수여야 하는 것도 아니었다. 나이와 무관하게 공수 양쪽을 수행하고 책임 있게 공을 다룰 선수가 필요했다는 말이었다. 이날의 백패스는 그에게 한 경기의 졸전이 아니라, 여름에 채우지 않은 자리가 다시 드러난 증거였다.\n\n### “후보가 아니라 3순위가 뛰고 있다”\n\n로테이션 비판 글에서 가장 빠른 처방은 단호했다. 이제는 선수를 돌릴 수 없다는 사실을 감독이 이해해야 한다는 것이다. 주전부터 모두 내보낸 뒤 필요하면 교체하고, 적어도 1월까지는 그렇게 버텨야 한다는 주문이었다.\n\n그 댓글은 이날 출전한 선수들을 ‘세컨드 라인’, 즉 후보군이라고 부르는 것부터 부정했다. 가비아, 살레마커르스, 추쿠에제가 부상으로 빠져 있다는 게시판의 설명을 전제로, 실제로는 3순위 선수들이 뛰고 있다는 주장이었다. 로테이션할 수 있는 폭이 줄어든 상태에서 평소의 교체 폭을 적용하면, 이름만 같은 밀란일 뿐 다른 팀이 된다는 불만이었다. 이 부상 현황은 해당 대화가 제시한 배경이며, 여기서 별도로 확정한 의무 보고는 아니다.\n\n그러나 “주전을 계속 쓰자”는 처방에는 바로 반대가 붙었다.\n\n> “그 방법도 통할 것 같지 않다. 어제는 주전들이 들어온 뒤에 졌다.”\n\n공식 교체 기록을 보면 아모링은 하프타임에 모레이라, 힐라, 풀리식을 투입했고, 모드리치는 63분에 들어갔다. 두 실점은 그 후반에 나왔다. 댓글은 이 시간 순서를 근거로 선발 명단만의 문제라는 설명을 거부했다. [AC 밀란 공식 경기·교체 기록](https://www.acmilan.com/en/news/articles/europa_league/2026-11-05/rossoneri-lose-on-uel-matchday-four)\n\n물론 그 시간 순서만으로 교체가 패배의 원인이 되는 것은 아니다. 해당 팬의 주장은 목요일과 일요일 사이에 팀의 몸과 정신 상태가 눈에 띄게 달라진다는 것이었다. 목요일에 유럽대항전을 치르는 부담, 두 대회를 소화하기에 부족한 선수단은 시즌 시작부터 알고 있던 문제라는 말도 덧붙였다. 한쪽은 좋은 선수를 먼저 쓰면 된다고 했고, 다른 쪽은 그 좋은 선수들을 주중과 주말에 모두 같은 상태로 쓸 수 있느냐고 물었다.\n\n조금 의외의 낙관론도 이 글타래에 있었다. 진단이 이렇게 분명하다는 것은 오히려 전망 면에서 긍정적이라는 댓글이었다. 전술의 신비로운 해답을 발명할 필요 없이, 1월에 믿고 쓸 수 있는 선수 네 명을 데려오면 된다는 논리였다. 다른 댓글이 포지션마다 적어도 한 명의 보강을 요구한 것과도 통했다. 이들이 말한 겨울시장은 이미 완성된 팀에 장식을 더하는 시간이 아니라, 두 대회를 뛰려면 필요한 인원을 갖추는 시간이었다.\n\n그중 한 팬은 선수단을 주전과 후보 두 칸으로 나누지도 않았다. 메냥, 힐라, 모드리치, 라비오, 풀리식을 자신의 기준에서 중심축으로 꼽고, 그 아래에 어느 정도 믿을 수 있는 선수층을 따로 놓았다. 그 중간층에서 몇 명만 빠져도 문제가 터진다는 분석이었다. 모레이라에게는 추가 확인이 필요하다고 봤고, 파블로비치도 아직 중심축에 완전히 넣지는 못했다. 개별 명단에 동의하느냐와 별개로, 이 댓글이 보여 준 걱정은 후보 열한 명의 수준보다 주전 뒤를 받쳐 줄 몇 명의 부재였다.\n\n과거의 이름도 등장했다. 자신을 10번으로 여겼던 세이도르프가 피를로, 후이 코스타, 히바우두, 이후 카카 같은 재능과 함께 뛰기 위해 메찰라 역할도 받아들였다는 회상이었다. 옛 밀란의 포지션 조합을 끌어온 대목에는, 선수를 다른 위치에 넣는 일도 결국 함께 맞물릴 재능이 있어야 가능하다는 시선이 담겼다. 이번 자료에 실린 댓글은 그 뒤가 잘려 있어, 현재 선수에 관한 결론까지 보태지는 않는다.\n\n로테이션 논쟁은 이렇게 감독의 선발 책임과 구단의 선수단 구성 책임 사이를 오갔다. 같은 ‘선수층이 얇다’는 진단에서 누군가는 당장 돌리지 말라고 하고, 누군가는 안 돌려도 버틸 수 없다고 했다. 처방이 정반대인 이유는 결함을 몰라서가 아니라, 남은 자원으로 무엇을 먼저 지켜야 하는지 다르게 보기 때문이었다.\n\n### 야샤리에게는 시간이 지나지 않는 것처럼 보인다\n\n야샤리만을 다룬 글타래는 이번에 실린 댓글 열 개 안에서 비판이 뚜렷하게 우세했다. 당장 정리하자는 말, 무엇을 잘하는 선수인지 모르겠다는 말, 다른 곳에서는 나아질 수 있어도 밀란에서 뛸 기질은 보여 주지 못했다는 말이 이어졌다. 팀 전체의 연결 문제를 논하던 대화가 한 선수의 미래로 좁혀진 곳이었다.\n\n그중 비교적 구체적인 구분은 “레지스타가 아니라 메찰라”라는 댓글이었다. 중원의 전개를 지휘하는 역할을 못 하는 선수에게 그 일을 맡기고 있다는 주장이다. 그러나 이 댓글도 그러니 역할을 바꿔 기다려 보자는 방향으로 끝나지 않았다. 임대든 매각이든 보내야 한다는 결론이었다. 역할이 맞지 않는다는 설명조차 잔류를 옹호하는 근거로 작동하지 않을 만큼 인내가 줄어 있었다.\n\n관리 방식의 책임을 지적한 댓글도 있었다. 입단 이후 줄곧 최악의 방식으로 다뤄졌다는 평가였다. 하지만 그 뒤에는 선수 자신도 기회를 얻고 싶은 모습을 거의 보여 주지 못했다는 비판이 붙었다. 가장 인상적인 표현은 야샤리가 여전히 먼 나라에서 엊그제 막 도착해 프리시즌도 못 치른 신입생처럼 보인다는 것이었다. 실제 입단 시점을 설명하는 문장이 아니라, 시간이 흘러도 팀 안에서 익숙해지는 모습이 보이지 않는다는 답답함이었다.\n\n이 팬은 라커룸에서 누군가 그와 이야기를 하는지까지 궁금해했다. 이는 내부 사정을 전하는 제보가 아니다. 경기장 안의 이질감을 인간관계에까지 투영한 질문이었다. 부진한 선수가 팀에 녹아들지 못하는 것처럼 보일 때, 팬의 추측이 어디까지 뻗는지를 보여 주는 대목이다.\n\n돈 이야기가 나오자 화살은 브뤼허로 향했다. 더케텔라러와 야샤리를 묶어 브뤼허에 거액을 줬다는 불만 뒤에, 다음에는 트레솔디일 것이라는 빈정거림이 붙었다. 밀란 팬이고 인테르 상대로 골을 넣었으니 또 큰돈을 내겠다는 식이었다. 이 대목은 새 이적 정보를 공유하는 장면이 아니라, 팬들이 상상한 익숙한 영입 경로를 조롱하는 농담이었다.\n\n현재 가치는 최대 1,500만 유로라는 댓글도 나왔다. 이것 역시 확인된 시장 평가나 제안액이 아니라 팬 개인의 가격표다. 이 글타래에서 숫자는 협상 소식을 전하기보다, 영입 당시 기대와 지금 느끼는 효용 사이의 거리를 과격하게 표시했다.\n\n야샤리를 믿고 영입을 지지했으며 다른 환경에서는 훨씬 잘할 수 있다고 여전히 생각한다는 댓글까지, 밀란에서 보여 준 모습에는 실망을 감추지 않았다. 무조건적인 옹호와 무조건적인 비난이 팽팽히 맞선 날은 아니었다. 관리와 역할을 설명하려는 목소리도 선수의 현재 경기력을 방어하는 데까지는 나아가지 못했다.\n\n### 시세는 보호받았고, 토리아니는 나뉘어 평가받았다\n\n메디아셋 보도를 옮겼다는 글은 야샤리, 시세, 아모링을 낙제 대상으로 묶었다. 시세에게 붙은 설명은 재능은 의심하지 않지만 의욕과 허기가 부족했고, 밀란 유니폼의 무게가 크다는 것이었다. 댓글에서는 이 정신력 진단이 그대로 통과하지 않았다.\n\n한 팬은 시세가 대체 무엇을 해야 했는지 모르겠다고 했다. 수비를 지원하는 미드필더처럼 움직였고, 그 역할 안에서 길을 잃었다는 관찰이었다. 다른 팬은 이제 시세에게까지 못했다고 책임을 돌릴 차례냐며, 그마저 꽃피우지 못하게 만들 셈이냐고 반발했다. 야샤리 글타래에서 기다림의 근거가 약해졌다면, 시세를 둘러싼 대화에서는 아직 선수보다 사용법을 먼저 묻는 목소리가 분명했다.\n\n이 보호는 아무도 그를 비판하지 않았다는 뜻은 아니다. 다만 한 번의 부진을 의욕 부족이나 유니폼을 감당할 자격으로 연결하는 기사식 판정에 댓글들이 제동을 걸었다. 같은 패배의 책임을 묻더라도, 성장 중인 공격수에게 어떤 일을 시켰는지부터 보자는 반응이었다.\n\n그 시세에게는 대표팀 첫 발탁이라는 좋은 소식도 있었다. 이탈리아축구협회 발표로 만치니 감독의 성인대표팀 명단 포함이 확인된다. 수집된 사전 기사에는 13일과 16일의 친선경기로 소개됐지만, 공식 일정은 11월 12일 프랑스전과 15일 벨기에전이며 네이션스리그 경기다. [FIGC 공식 소집 발표](https://www.figc.it/it/nazionali/news/litalia-a-caccia-del-pass-per-i-quarti-di-nations-league-31-convocati-per-i-match-con-francia-e-belgio-prima-chiamata-per-cassano-lontani-cisse-e-liberali-ax902bda)\n\n정작 발탁 소식 글타래에서 수집된 실질적인 답글은 두 개뿐이었다. 하나는 또 대표팀 휴식기냐는 투덜거림, 다른 하나는 다쳐서 돌아오지만 않으면 된다는 바람이었다. 발탁의 의미를 길게 논하는 축하 대화는 이 표본에서 확인되지 않는다. 클럽 팬의 눈은 대표팀 명단을 보면서도 다음 밀란 경기의 가용 인원에 머물렀다.\n\n토리아니에게는 다른 종류의 분리가 일어났다. 낙제 대상 명단을 논하던 댓글에서 한 팬은 오히려 그가 골문 안에서는 매우 뛰어나며, 문제의 장면을 제외하면 대단한 경기를 했다고 평가했다. 그러자 다른 댓글은 골라인 위의 능력에는 동의하면서도 전진과 공중볼 처리에서는 많이 성장해야 한다고 답했다. 또 다른 팬도 골라인 밖으로 한 발만 나오면 아직 한참 부족하다고 썼다.\n\n이 평가는 결정적 실수를 지우지도, 그 실수로 모든 능력을 덮지도 않았다. 선방과 골문을 떠나 하는 일을 구분한 것이다. 실제 경기 보고서에도 전반 토리아니의 여러 선방과 후반 첫 실점 과정이 함께 기록돼 있다. [AC 밀란 공식 경기 보고서](https://www.acmilan.com/en/news/articles/europa_league/2026-11-05/rossoneri-lose-on-uel-matchday-four)\n\n최악의 선수를 고르는 기준도 제각각이었다. 바르테사기와 테라차노가 앞으로 가는 대신 계속 뒤로 돌아 팀의 공격을 막았다는 댓글이 있었고, 라비오는 선수 가치에 비해 보여 준 것을 따지면 가장 나쁜 축에 들어간다는 평가도 있었다. 언론이 내놓은 세 명의 낙제 명단이 댓글의 평가표로 그대로 옮겨지지는 않았다.\n\n### 인테르의 도발에 밀란 팬들이 먼저 고개를 끄덕였다\n\n‘밀란은 밀라노의 토리노인가?’라는 제목은 상대 팬 쪽 매체에서 건너왔다. 토리노가 유벤투스를 상대하는 관계에 빗대, 밀란도 이제 더비를 별도의 시즌 목표처럼 여기고 나머지를 놓치는 것 아니냐는 도발이었다. 유럽대항전 패배 직후였기에 더 날카롭게 꽂혔다.\n\n뜻밖에도 이 글타래 앞부분에서는 반박보다 동의가 연속해서 나왔다. 일부 팬에게 더비가 시즌의 트로피가 됐다는 댓글, 4위와 더비 승리를 꿈꾸는 것으로 만족하게 됐다는 댓글이었다. 상대의 조롱을 받아들이는 이유는 인테르를 높게 평가해서가 아니라, 자기 구단 주변의 기대치가 내려갔다고 느끼기 때문이었다.\n\n그 불만을 압축한 말이 ‘카르디날레화됐다’였다. 구단주 카르디날레의 이름에 변화를 뜻하는 어형을 붙여, 우승을 기대하던 팬들이 이제 더 낮은 목표를 당연하게 받아들인다는 뜻으로 썼다. 이것은 그 댓글 작성자의 공격적인 규정이다. 모든 밀란 팬의 실제 목표가 그렇게 바뀌었다는 조사 결과는 아니다.\n\n더비 승리의 기쁨을 둘러싼 논쟁은 신문 모음 글에도 나타났다. 기사들이 유럽 패배를 설명하면서 계속 더비를 소환하자, 한 팬은 이제 정말 그것만 중요해진 것 같다고 불평했다. 다른 댓글은 자신은 스쿠데토 때문에 울었지 핼러윈 무렵 더비 하나 이겼다고 운 것은 아니라며 반응했다. 선수와 구단주의 발언·감정에 관한 주장을 섞어 비판했지만, 그 일화들은 이번 확인 범위에서 독립적으로 검증된 사실로 다루지 않는다.\n\n이 문장의 날은 더비가 즐겁지 않았다는 데 있지 않다. 무엇을 얻었을 때 시즌의 성취처럼 말할 것인가에 있었다. 더비의 기쁨이 유럽에서의 초라함을 덮는 언어로 쓰일 때, 그 기쁨 자체가 낮아진 야망의 증거로 돌아왔다.\n\n반대편도 가만있지 않았다. 밀라노 도심에서 더비 승리를 축하하는 차량 행렬이라도 있었느냐는 반문이 나왔다. 과하게 들떴다는 주장을 하려면 무엇을 보고 하는 말인지부터 대라는 반응이었다. 토리노는 더비를 아주 드물게 이기지만 밀란과 인테르의 관계는 그 비유에 들어맞지 않는다는 반박도 붙었다.\n\n다른 댓글들은 인테르 쪽의 패배와 과거 성취에 대한 집착을 되받아쳤다. 상대가 밀란을 더비에만 매달리는 팀으로 부를 자격이 있느냐는 식이었다. 이쪽에서 더비는 구단의 야망이 낮아졌다는 증거가 아니라, 라이벌에게 당당히 내밀 수 있는 최근의 결과였다.\n\n수집된 열 개 글 안에서 초반의 자기비판과 후반의 반격이 모두 보인다. 한편을 성숙한 팬, 다른 편을 현실을 모르는 팬으로 나눌 필요는 없다. 앞쪽 댓글들은 더비를 시즌 평가의 기준으로 삼는 분위기를 싫어했고, 뒤쪽 댓글들은 더비에서 이긴 뒤 라이벌에게까지 기쁨의 적정량을 심사받는 것을 거부했다. 같은 승리를 지키려는 마음과, 그 승리만으로 만족하고 싶지 않은 마음이 부딪쳤다.\n\n### 순위표에서 찾은 위안, 순위표로 돌아온 반박\n\n유로파리그 순위 글에는 작은 항변이 있었다. 밀란을 이긴 세 팀이 모두 전승으로 전체 1~3위에 있다는 것이다. 그 댓글은 이것이 변명은 아니라고 전제하면서도 추첨이 썩 운 좋지는 않았다고 했다. 적어도 아무에게나 진 것은 아니라는 설명이었다.\n\n답은 짧고 정확하게 그 논리를 거슬러 올라갔다. 밀란이 그 세 팀을 이겼다면 그들이 지금 그 자리에 있지도 않았을 것이라는 것이다. 상대들도 추첨 당시 밀란을 만난다고 마냥 기뻐하지는 않았을 테고, 적어도 이름은 여전히 밀란 아니냐는 말이 이어졌다. 상대의 높은 순위를 일정 난도의 증거로 볼 것인가, 밀란이 그 순위를 만드는 데 보탠 몫까지 볼 것인가의 차이였다.\n\n다른 팬은 패배 횟수보다 패배 방식이 문제라고 했다. 문자 그대로 밀려 버렸다는 표현이었다. 이 댓글의 기준에서는 상대들이 좋은 팀이라는 사실이 밀란의 무기력함을 덜어 주지 못했다. 강팀을 만나 졌다는 설명과, 강팀을 상대로 경쟁하는 모습을 보여 줬다는 평가는 별개의 일이었다.\n\n순위 숫자는 수집본 안에서도 경기 직후 요약의 26위와 별도 순위표 글의 28위가 섞여 있다. UEFA 순위 페이지에서는 이번 확인에 필요한 표 본문을 확보하지 못했으므로 어느 숫자를 공식 확정값으로 택하지 않는다. 확인되는 것은 구단이 발표한 4경기 승점 3이며, 1~8위가 16강에 직행하고 9~24위가 플레이오프에 진출한다는 대회 방식이다. [UEFA 대회 진행 방식 안내](https://www.uefa.com/uefachampionsleague/news/02a8-216eb10b789e-0768c05cf31b-1000--champions-league-europa-league-and-conference-league-leag/)\n\n그래서 ‘16강 직행이 멀어졌다’는 신문 제목 옆에서 팬들이 벌써 조기 탈락을 걱정하는 것은 다른 이야기를 하는 게 아니다. 이 표본에서는 목표선에 대한 감각이 빠르게 아래로 움직이고 있었다. 좋은 자리를 놓쳤다는 아쉬움과, 다음 단계에라도 갈 수 있느냐는 불안이 동시에 나왔다.\n\n한 댓글은 구단의 이미지 사업을 이 순위표에 연결했다. 이미지를 팔 생각을 하면서 정작 진짜 ‘엽서’는 이런 경기와 순위라는 사실을 모르는 것 아니냐는 비판이었다. 브랜드를 말하는 구단에 팬이 들이민 홍보물은 화려한 사진이 아니라 유럽대항전 성적이었다. 이날 여러 글타래에서 구단 운영 비판이 반복됐지만, 이 문장은 그 불만을 가장 구체적인 물건 하나로 바꿔 놓았다.\n\n### 줄무늬 너비를 이야기할 때는 잠깐 평화로웠다\n\n축구가 이렇게 답답한 날에도 새 유니폼 글에는 다른 종류의 대화가 있었다. 2027/28 홈 유니폼이라는 이미지가 올라오자 “아주 예쁘다”, “지금 것보다 훨씬 낫다”는 반응이 붙었다. 수집된 일곱 글 가운데 게시글을 제외한 여섯 반응 중 네 개가 디자인에 직접 호감을 드러냈다.\n\n좋아하는 지점도 막연하지 않았다. 한 팬은 줄무늬의 크기가 좋다고 했고, 다른 팬은 조금만 더 넓었으면 가장 영광스러웠던 시절의 유니폼과 같았을 것이라고 했다. 같은 이미지를 보고 한쪽은 현재 너비에 만족하고 다른 쪽은 과거의 비율에 조금 더 가까워지기를 바랐다. 이 글타래에서 의견 차이는 선수 처분이나 구단주의 야망이 아니라 몇 줄의 폭에 머물렀다.\n\n이미지가 불러낸 기억은 전성기만이 아니었다. 파소네와 미라벨리 시절, 루카스 비글리아가 소환됐다. 여기에 다른 팬은 자신이 예전에 피옹테크의 유니폼을 산 실수를 했다고 보탰다. 새 시즌 셔츠를 보다가 과거 자신이 샀던 선수 이름으로 이야기가 옮겨 간 것이다. 팀 성적을 두고 길게 다투던 글들과 달리, 여기서는 구매의 기억 하나면 대화가 이어졌다.\n\n한 팬은 상의만 보고 결론 내리지 않겠다고 했다. 유니폼은 전체를 봐야 하며, 전날 경기에서 본 굵은 가로줄 양말은 마음에 들지 않았다는 이유였다. 다음 시즌 예상 이미지를 칭찬하는 댓글 사이에 바로 전날 착장의 양말이 끼어들었다. 패배 뒤에도 팬들은 공의 진행 방향과 줄무늬 방향을 각각 따로 보고 있었다.\n\n이미지의 확인 상태는 짚어 둘 만하다. 원출처인 Footy Headlines는 11월 6일 갱신에서 이를 자사 표현으로 ‘85% 예상도’라고 소개했다. 게시판에서는 다음 유니폼 사진처럼 전해졌지만, 공식 공개된 완성품은 아니다. ‘푸마의 마지막 시즌’이라는 설명 역시 해당 매체가 전한 내용으로 남겨 둔다. [Footy Headlines의 원문과 예상도 설명](https://www.footyheadlines.com/2837541687/milan-27-28-home-kit-design-leaked-100-classic-for-puma-s-last-season.html)\n\n### 다음 경기 소식은 올라왔지만, 답글은 아직이었다\n\n제노아전 예상 선발 글은 주전 복귀와 왼쪽의 디아와라를 핵심으로 전했다. 스카이 보도를 옮겼다는 명단에는 힐라, 더빈터, 회복할 경우의 파블로비치, 디아와라가 수비진에 놓였다. 이는 게시판에 전해진 예상안이며 확정 선발은 아니다.\n\n이 글에는 새 글이 네 개 잡혔지만, 나머지 세 개는 모두 같은 익명 표시가 남긴 ‘up’이었다. 따라서 주전 복귀 소식에 팬들이 안도했다거나 디아와라의 왼쪽 기용을 놓고 논쟁했다고 말할 자료는 없다. 이날의 가장 큰 처방이 ‘주전을 써라’였다고 해서, 예상 명단 글에 그 처방을 지지하는 대화까지 생긴 것은 아니었다.\n\n‘적대적인 분위기’를 예고한다는 제노아 응원석 관련 글도 올라왔다. 그러나 인용문 자체에는 자신도 다른 사람과 다를 바 없는 팬이며 누구에게 무엇을 강요할 생각은 없다는 설명이 들어 있었다. 이를 제노아 울트라 전체의 공식 선언으로 단정할 근거는 부족하다. 수집된 밀란 쪽 답글 세 개는 내용이 불분명하다는 반응과 거친 반감이었고, 경기 전망으로 발전하지는 않았다.\n\n다음 경기를 앞둔 게시판에 남은 더 선명한 질문은 다른 곳에 있었다. 라모스가 내려오면 풀릴 것인가. 야샤리를 바꾸면 나아질 것인가. 주전들을 처음부터 내보내면 목요일의 팀도 달라질 것인가. 이번에 읽은 대화에서는 어느 답도 합의에 이르지 못했다. 다만 여러 글에서 팬들이 되풀이해 가리킨 장면은 같았다. 앞을 향해 보내야 할 공이 다시 뒤로 돌아가던 밤이었다.\n\n<details><summary>범위와 근거<\/summary>\n\n이번 실행 2026-11-07_153938에 제공된 MilanWorld 수집본만 팬 대화의 근거로 사용했다. 범위는 11월 5~7일의 16개 글타래, 새 글 105개이며 수집 설명상 약 30,412자다. 익명 작성표시 43종은 실제 이용자 수가 아니다. 신문 모음 글은 새 글 10개가 작성표시 2종에 집중됐고, 제노아전 예상 선발·시세 발탁 전망 글에는 동일 표시의 끌어올리기가 포함돼 있어 글 수를 독립적인 의견 수로 취급하지 않았다.\n\n경기 결과·득점·교체·승점은 본문에 연결한 AC 밀란 공식 경기 보고서, 시세의 발탁과 대표팀 일정은 FIGC 발표, 유로파리그 진출 구간은 UEFA 안내로 확인했다. UEFA 순위 페이지에서 표 본문을 확보하지 못해 수집본에 혼재한 26위·28위는 확정하지 않았다. 유니폼은 유출 보도의 원출처가 명시한 예상도 수준으로 다뤘다.\n\n선수 가치, 처분·보강 요구, 팀의 의욕과 내부 관계에 대한 말은 팬의 평가·추측이다. 제노아전 예상 명단과 댓글이 언급한 부상 현황도 독립적으로 확정한 사실로 제시하지 않았다. 원문이 잘린 대목의 뒷내용이나 제공되지 않은 사진의 세부는 보충하지 않았다. 팬 반응의 번역 인용은 제공된 원문의 의미에 맞췄으며 이용자 식별정보는 싣지 않았다.\n\n<\/details>\n\n## VecchiaSignora | 이탈리아\n\n이번에는 VecchiaSignora의 글타래 27개에서 수집된 새 글 434개 가운데, 제공된 발췌를 읽었다. 게시물 표시일 기준 11월 5~7일의 대화다. AZ 원정 승리 직후의 경기 평가가 중심이며, 수비진과 부상자 복귀, 유로파리그 전망, 구단 운영과 옛 선수 이야기가 이어진다.\n\n**개관**\n\n- **승리는 확인, 안도에는 시차.** 유벤투스는 AZ를 2–1로 꺾고 유로파리그 4경기에서 승점 10을 쌓았다. 게시판에서는 좋은 전반과 불안한 막판 중 어디에 무게를 둘지가 갈렸다.\n- **공격의 발견과 남은 의문.** 콜로 무아니를 오른쪽에서 살리자는 반응이 여러 글타래에 걸쳐 나왔다. 코프메이너르스의 호전에는 재신임과 매각 기대가 함께 붙었다.\n- **수비는 자리까지 논쟁 중.** 칼룰루의 왼쪽 이동, 카발에게 줄 기회, 브레메르 대신 가티를 쓸지를 놓고 의견이 엇갈렸다. 선수 평가와 전술 처방은 팬들의 판단이다.\n- **복귀와 유럽의 봄은 아직 전망.** 일디즈의 수술은 공식 발표로 확인된다. 특정 경기 복귀일과 유로파리그 우승 후보·진출 예상은 확정 사실과 구분해 읽어야 한다.\n\n---\n\n### 이겼는데, 어느 20분부터 이야기할 것인가\n\n하이라이트 글타래에는 승리한 날의 기분을 아주 간단하게 정리한 글이 있었다. 유벤투스가 이기면 기쁘고, 지면 화가 난다. 이날은 이겼으니 축하하겠다는 것이다. 그리고 한 줄을 보탰다. 어떤 팬들은 이제 더 높은 경지에 올라, 이긴 뒤에도 실망할 수 있게 된 것 같다고.\n\n이 말에 담긴 짜증은 경기 후 본 글타래를 읽으면 금방 이해된다. 승점 3을 가져온 밤에도 첫 반응부터 “아직 팀이라고 부르기에는 한참 멀었다”는 평가가 나왔다. 늘 그렇듯 마지막이 아슬아슬했고, 상대가 누구든 위험해지며, 경기를 관리할 줄 모른다는 불만이 뒤따랐다. 반대편에서는 좋은 75분을 두고 왜 위험했던 마지막 20분만 붙잡느냐고 되물었다. 지금 유벤투스가 강팀이 아니라는 사실을 새로 발견한 것도 아닌데, 이긴 날까지 계속 흠을 찾아야 하느냐는 항변이었다.\n\n경기의 뼈대는 분명하다. 11월 5일 원정에서 코프메이너르스와 콜로 무아니가 전반에 득점했고, AZ는 88분 메이르딩크의 골로 따라붙었다. 유벤투스는 2–1로 이겨 유로파리그 첫 네 경기에서 승점 10을 확보했다. [유벤투스 공식 경기 기록](https://www.juventus.com/it/news/articoli/uefa-europa-league-az-alkmaar-juventus-la-partita)\n\n팬들이 서로 다르게 기억한 것은 그 사이의 시간이었다. 긍정적으로 본 글들은 전반에 세 번째 골까지 넣었어야 했고, 후반에도 한동안 통제력을 유지했으며, 끝내 버텨낸 승리는 정당했다고 평가했다. 비판적인 글들은 추가 득점 기회에서 반복된 마지막 패스 실수와 교체 뒤의 흔들림을 먼저 꺼냈다. 하이라이트 댓글에서도 수적 우위 상황의 선택만 제대로 했으면 경기를 일찍 끝낼 수 있었다는 아쉬움이 나왔다. 한쪽이 즐거웠던 장면이 다른 쪽에는 마지막 공포를 미리 막지 못한 장면으로 남았다.\n\n결장자를 받아들이는 방식도 흥미롭다. 주전 상당수가 빠졌으니 이 정도면 잘했다는 말에, 한 팬은 오히려 그 사실이 선수단을 거의 통째로 버릴 수준은 아니라는 증거라고 답했다. 같은 결장 명단이 기대치를 낮추는 근거이면서, 남은 선수들의 가능성을 인정하는 근거가 됐다.\n\n그래도 이 대화가 끝까지 비난으로만 흐르지는 않았다. 유벤투스라는 이름만으로 승리를 당연시하지 말고 현실을 받아들이자는 의견에, 다른 팬은 높은 요구가 언제나 오만에서 나오는 것은 아니며 자신에게는 사랑의 방식이라고 설명했다. 답은 상대적으로 차분했다. 서로 다른 관점이고, 열정을 살아가는 방식이 다르다는 것이다. 승리를 즐기는 마음과 더 나아지기를 요구하는 마음이 잠시 같은 자리에 앉은 대목이었다.\n\n### 콜로 무아니가 오른쪽으로 가자, 공격수 이야기가 달라졌다\n\n이번 자료에서 콜로 무아니를 둘러싼 대화는 경기 후 평가, 하이라이트, 인터뷰, 전술과 이적 이야기까지 넓게 퍼졌다. 반복된 질문은 간단했다. 오른쪽에서 저렇게 잘하는 선수를 왜 중앙 공격수 문제의 답으로만 다루느냐는 것이다.\n\n팬들이 좋아한 첫 골 장면은 공을 되찾고 연계에 참여한 뒤, 상대를 넘기는 동작과 오른쪽 돌파를 거쳐 코프메이너르스에게 연결한 과정이었다. 두 번째 골에서는 다시 공을 따내고 볼테마데와 주고받은 뒤 마무리한 집요함이 칭찬받았다. 구단 기록 역시 오른쪽 돌파에 이은 첫 골 도움과, 볼테마데와의 연계에서 나온 두 번째 골을 확인한다. [유벤투스 공식 경기 보고](https://www.juventus.com/en/news/articles/koopmeiners-scores-as-the-bianconeri-beat-az-alkmaar)\n\n그래서 “콜로 무아니–볼테마데–일디즈”를 복귀 후의 주전 공격 조합으로 삼자는 제안이 나왔다. 현재 가용 자원으로는 알라이베고비치를 왼쪽, 콜로 무아니를 오른쪽에 두고 볼테마데를 가운데 세우자는 구상도 있었다. 볼테마데를 장신에 빗대어 부르는 투박한 농담 속에서도 역할 분담은 또렷했다. 중앙에서 연결해 줄 선수와, 그 주변의 공간을 공격할 선수를 함께 쓰자는 생각이다.\n\n여기에도 합의는 없었다. 유럽에서는 공간과 속도를 살릴 수 있지만 세리에A의 내려앉은 수비 앞에서는 다시 답답해질 것이라는 반론이 붙었다. 이에 맞선 팬은 이탈리아에서도 깊이를 공략할 방법을 마련하는 것이 감독의 일이며, 콜로 무아니가 과거 유벤투스에서 골을 넣었던 경험을 잊지 말자고 했다. 선수의 한계를 어디까지로 볼지, 활용법의 한계를 어디부터로 볼지가 갈렸다.\n\n다른 공격 자원과의 관계도 민감하다. 한 글은 제그로바는 좁은 공간, 콜로 무아니는 역습, 콘세이상은 후반 투입에 맞는다는 식으로 용도를 나눴다. 어디에나 끼울 수 있는 선수들처럼 다루지 말자는 주장이다. 또 다른 글은 콘세이상을 오른쪽에 넣기 위해 지금 좋은 콜로 무아니를 빼면 공격의 화력을 스스로 낮추는 셈이라고 봤다. 부상자가 돌아오면 무조건 좋아진다는 기대 옆에, 어렵게 찾은 조합을 다시 흐트러뜨릴까 하는 걱정이 붙기 시작했다.\n\n그러면서도 정통 9번의 부재를 말하는 목소리는 사라지지 않았다. 볼테마데가 팀을 전진시키고 공을 지켜줬다는 평가에, 그런 장점을 거의 보지 못했다는 반박이 있었다. 제공된 이적 기사 발췌도 상대 박스 안에 사람이 없는 장면을 문제 삼았다. 콜로 무아니의 좋은 밤은 공격의 가능성을 넓혔지만, 그동안 비어 있다고 느꼈던 자리까지 모두 채워주지는 못했다.\n\n### 코프메이너르스가 잘하면, 남겨야 하나 팔아야 하나\n\n코프메이너르스의 호전은 환영받았다. 문제는 그다음 문장이었다. 어떤 팬에게는 드디어 쓸 수 있는 선수가 돌아온 신호였고, 다른 팬에게는 이제 시장에서 받아줄 팀을 찾을 기회였다.\n\n관련 기사 글타래에서는 최근 두 경기 또는 여러 경기에서 좋은 모습을 보였다는 평가가 나왔다. 중원 셋을 유지하고 지금의 위치에서 계속 써야 한다는 제안도 있었다. 아탈란타 시절의 득점력을 조금만 되찾으면 골이 부족한 팀에 큰 도움이 된다는 기대다. 경기 후 인터뷰 댓글에는 처음 기대했던 수준과는 거리가 있어도 꾸준히 준수한 활약을 해주면 좋겠다는, 한층 낮아진 소망이 담겼다.\n\n반대편의 기억은 길었다. 괜찮은 경기 한 번 뒤에 다시 무기력한 경기들이 이어지는 일을 이미 여러 차례 봤다는 것이다. 신뢰를 회복하려면 시즌의 4분의 3 정도는 이렇게 해야 한다는 글에는, 혹시 숫자 ‘34’를 쓰려던 것 아니냐는 답이 달렸다. 재계약하자는 짧은 댓글도 이어졌지만, 주변의 긴 계약 농담과 함께 읽으면 축하보다 빈정거림에 가까웠다.\n\n좋은 경기 안에서도 불신을 건드린 장면이 있었다. 상대 골키퍼의 잘못된 연결을 받은 뒤 직접 슈팅하지 않고 알라이베고비치에게 넘긴 선택이다. 한 팬은 그 순간 “쏴!”라고 외쳤는데 듣지 못했다고 썼다. 다른 글은 패스의 방향까지 마음에 들지 않았다고 했다. 코프메이너르스에게 기대하는 것이 단순히 공을 안전하게 이어주는 일은 아니라는 반응이었다. 자신 있게 침투하고 득점하던 선수를 기다리는 사람들에게, 망설임처럼 보이는 선택은 여전히 크게 남는다.\n\n선수 자체를 어떻게 기억하느냐도 달랐다. 아탈란타에서도 본래 압도적인 수비력이나 빌드업보다는 침투와 득점이 강점이었는데, 구단이 다른 능력까지 기대한 것이 문제였다는 분석이 있었다. 유벤투스에서는 상대를 달고 플레이해야 하는 압박을 견디지 못한다는 해석도 나왔다. 반대로 선수의 기량보다 잦은 변화와 일관성 없는 운영을 먼저 봐야 한다는 글은, 좋은 선수들을 사놓고도 이기지 못하던 옛 인테르와 비교했다.\n\n이 논쟁이 라비오의 첫 몇 시즌으로 옮겨간 것도 자연스럽다. 적응이 늦었던 다른 미드필더를 더 기다렸으면 어땠느냐는 기억과, 라비오는 원래 더 완성된 선수였다는 평가가 부딪쳤다. 코프메이너르스를 기다릴지 말지는 지난 선수에게 얼마나 인내했고, 그 인내가 보상받았다고 기억하는지와도 연결돼 있었다.\n\n형제 대결을 둘러싼 반응은 조금 가벼웠다. 한 팬은 잘한 이유가 동생 페이르에게 형 노릇을 하려던 것 아니냐고 농담했다. 따뜻한 형제 이야기를 즐기는 댓글도, 이제 그 이야기는 그만 듣고 싶다는 댓글도 있었다. 인터뷰 글타래 마지막에는 제목 속 ‘동생이 골 때문에 몹시 화났다’는 말을 실제로 누가 했는지 따지는 글까지 붙었다. 방송 진행자가 농담을 했고 선수는 고개를 끄덕였다는 이용자의 지적이다. 제공된 자료만으로 발화 주체를 확정할 수는 없지만, 좋은 이야기를 즐기던 자리에서도 인용문의 정확성을 챙기는 모습은 남았다.\n\n### 가티에게 모인 점수, 브레메르에게 돌아간 질문\n\n평점 글타래의 14개 새 글은 이번 경기에서 비교적 선명한 공통점을 보여준다. 가티의 점수는 제시된 평가에서 6.5~7.5점 사이였다. 콜로 무아니와 함께 최우수 선수로 꼽히거나 단독으로 선택됐고, 비카리오도 대체로 6.5~7점을 받았다. 켈리와 브레메르, 교체 선수들에게는 훨씬 넓은 점수 차가 나타났다. 이것은 해당 평점 글타래의 작은 표본이지만, 가티의 활약을 좋게 본 반응이 그 안에서 반복됐다는 점은 분명하다.\n\n가티를 칭찬한 글들은 기술보다 집중력과 투지에 자주 머물렀다. 거칠고 흥분하기 쉽고 기술에 제약이 있다는 단서를 붙이면서도, 이기고 싶어 하는 기색이 가장 잘 보였다는 평가였다. 하이라이트 글타래에서는 가티가 있을 때 다른 수비수들도 더 안정적으로 보였다는 의견이 나왔다. 이름이 이탈리아어로 고양이들을 뜻한다는 데 기대어, 요즘은 개들보다 고양이들이 낫다는 말장난도 붙었다.\n\n그렇다고 가티를 향한 요구가 사라진 것은 아니다. 경기 후 인터뷰 글타래에 붙은 두 새 글 가운데 하나는 유벤투스다운 선수라는 칭찬이었고, 다른 하나는 그 장면에서는 슈팅했어야 한다는 타박이었다. 잘한 수비수에게도 공격 기회를 놓친 기억은 따라왔다.\n\n브레메르 글타래의 질문은 더 무거웠다. 부상 뒤에도 주전 자격이 있느냐는 제목 아래, 이전의 선수가 아니라는 평가와 그래도 현재 팀에서는 가장 좋은 수비수라는 주장이 나란히 등장했다. “유일한 챔피언”이라는 짧은 옹호도 있었고, 지금의 가티가 훨씬 낫다는 반응도 있었다.\n\n하락의 원인을 설명하는 말은 체력, 부상 이후의 자신감, 동기와 집중력으로 흩어졌다. 이 가운데 정신 상태나 의욕에 관한 설명은 경기 모습을 보고 붙인 팬들의 해석이다. 또 일부는 부상 전의 평가까지 되짚으며 원래 세계 정상급은 아니었다고 주장했다. 현재의 부진이 과거의 좋은 기억까지 다시 심사하게 만든 셈이다.\n\n브레메르만 바꾸면 해결되느냐는 질문에는 루쿠미와 켈리 이야기가 끼어들었다. 루쿠미의 선발 기용을 이해하지 못하는 쪽은 켈리가 지난 시즌 꾸준했다고 회고했다. 반대편에서는 루쿠미를 지금 가장 나은 수비수로 보는 글도 있었다. 모두를 팔았어야 했다는 식의 대화가 길어지자, 그러면 다음에는 당신이 수비하러 들어가면 되겠다는 답이 나왔다. 교체할 이름을 고르는 일은 쉬워도, 남겨놓을 수비진을 합의하는 일은 훨씬 어려웠다.\n\n### 왼쪽 풀백을 찾다가 배우까지 불러왔다\n\n“칼룰루를 왼쪽 풀백으로?”라는 글타래는 새 글 48개에 익명 작성표시 41종이 잡혔다. 경기 후 본 글타래와 비슷한 새 글 수에 더 다양한 표시가 등장한 주제였다. 왼쪽 수비의 불만이 여러 사람을 짧게라도 끌어들였다는 정도로 읽을 수 있다.\n\n출발은 카발과 캄비아소를 믿기 어려우니 칼룰루를 왼쪽에 두고, 오른쪽에 매케니를 세운 깔끔한 4–4–2를 해보자는 제안이었다. 그런데 매케니의 이름이 ‘매켄지’로 적히면서 전술보다 먼저 다른 사람이 소환됐다. 드라마 《The O.C.》에 출연한 벤 매켄지가 축구 선수로도 경력을 쌓은 줄 몰랐다는 답이었다. 코프메이너르스의 철자까지 함께 비틀어지자 새 감독이 데려온 신입 선수들이냐는 농담도 나왔다.\n\n전술적 답변의 상당수는 부정적이었다. 오른쪽에서도 힘들어 보이는 선수를 왜 왼쪽으로 옮기느냐는 것이다. 칼룰루는 오른쪽 풀백이나 스리백의 오른쪽 센터백으로 써야 한다는 의견이 여러 차례 나왔다. 여기서 반복되는 ‘브라체토’는 스리백의 바깥쪽 센터백을 가리킨다. 팬들은 윙백으로 넓은 측면 전체를 맡길 때와, 그 뒤에서 수비하고 전진할 때의 부담을 나눠 보고 있었다.\n\n대안으로 자주 등장한 이름은 첼리크였다. 복귀하면 왼쪽을 맡기자는 말과, 그 역시 오른쪽이 더 맞으며 비상 대책을 상시 해법으로 삼아서는 안 된다는 말이 함께 있었다. 니코 곤살레스를 왼쪽 윙백으로 내려 잠브로타처럼 활용하자는 제안도 눈에 띄었다. 활동량과 투쟁심, 수비 가담을 근거로 든 구상이었지만, 제공된 발췌에서 널리 반복된 처방은 아니다.\n\n반복성이 더 뚜렷한 요구는 1월에 제대로 된 왼쪽 풀백을 데려오라는 것이었다. 여름부터 필요했던 자리인데 아직도 다른 선수의 위치를 바꿔 해결하려 한다는 불만이다. 양쪽 주전이 모두 필요하다는 주장도 있었고, 왼쪽이 우선이라는 답도 있었다. 칼룰루와 첼리크를 좋은 후보 자원으로는 인정하면서도 주전 기준에는 못 미친다고 보는 글도 나왔다.\n\n카발을 향한 혹평 속에는 다른 목소리도 남았다. 몇 경기 연속으로 선발 출전시켜 성장할 시간을 줬느냐는 질문이다. 나폴리전의 좋은 모습을 기억하는 팬들은 팀 전체가 교체 뒤에 흔들린 경기에서 한 선수에게 공개적으로 화를 내는 방식까지 문제 삼았다. 반면 칼룰루를 옹호하는 쪽은 계속 90분씩 뛰어온 선수에게 하락 구간이 올 수 있다는 점을 들었다. 누구에게 시간이 필요하고, 누구에게는 이미 충분한 시간이 주어졌는지를 놓고 같은 수비진 안에서도 판단이 달랐다.\n\n### 전술 카페에서 싸운 것은 수비선의 높이만이 아니었다\n\n전술 글타래 ‘VS 카페’의 대화는 경기 후의 감정을 조금 더 오래 붙들었다. 낮게 내려앉으면 위험하다는 주장에, 높은 위치에서도 켈리의 실수가 나왔다는 반박이 붙었다. 제공된 설명을 따라가면, 공을 끊어낸 위치에서는 수비선이 높았고 그 뒤 처리와 복귀에서 문제가 생겼다는 분석이었다. 높이 자체보다 선수들의 집중력 저하가 반복된다는 쪽이다.\n\n이에 맞선 설명은 낮은 수비가 실수를 없애주지 않는다는 것이었다. 수비수들이 자주 주의를 놓친다면, 박스 근처에 오래 머무르며 슈팅과 굴절, 세컨드볼에 계속 노출되는 방식이 오히려 위험할 수 있다는 주장이다. 예전 BBC 수비진이 소환된 이유도 여기 있었다. 보누치·바르찰리·키엘리니처럼 낮은 지역을 잘 지키던 선수들의 방식을 지금 선수들에게 그대로 적용할 수 있느냐는 질문이었다.\n\n이 대화에서 ‘더 나은 경기력’을 요구하는 쪽이 꼭 화려한 공격 축구만을 원한 것은 아니다. 한 글은 제만처럼 하자는 뜻이 아니라, 90분 동안 전술적인 의미와 일관된 의도를 보여달라는 요구라고 설명했다. 이겨도 다음 경기에 가져갈 만한 것이 쌓여야 한다는 생각이다.\n\n현실을 먼저 보자는 쪽 역시 경기 내용이 좋았다고 우기지는 않았다. 나폴리전도 AZ전도 마음에 들지 않았지만, 지금 가용 선수들에게 갑자기 압도적인 경기력까지 요구할 수 있느냐고 했다. 우선 팀을 다시 묶고, 결과를 얻고, 자신감을 쌓고, 부상자들을 기다리는 것이 지금 가능한 작업이라는 주장이다.\n\n그래서 실제 쟁점은 낮게 설지 높게 설지에서 한 단계 더 깊어졌다. 지금의 결과가 회복을 시작할 시간을 벌고 있는가, 아니면 이미 오래 기다린 팀이 다시 출발선으로 돌아왔다고 말하는 것인가. 스팔레티가 맡은 지 이미 1년인데도 다시 팀을 만드는 단계라면 곤란하다는 반응은 그 시간 감각의 차이를 드러냈다.\n\nPSG를 언급한 글도 스타의 질만 부러워한 것은 아니었다. 함께 뛰고 함께 힘든 일을 하는 모습을 유벤투스에서도 보고 싶다는 요구였다. 반대로 그런 비교가 현재 자원의 한계를 충분히 반영하느냐는 의문도 남았다. 그 와중에 의견이 다른 긴 글을 두고, 소리만 지르지 않고 논거로 대화해줘 고맙다는 인사가 오갔다. 적어도 이 카페에서는 논쟁을 계속할 수 있는 방식 자체도 중요하게 여겨졌다.\n\n### 돌아온다는 소식에도, 누가 다시 빠질지부터 생각했다\n\n매케니와 첼리크, 콘세이상의 피오렌티나전 복귀 가능성을 다룬 기사에는 숨통이 트인다는 반응이 달렸다. 특히 측면 수비에 대한 불만이 큰 상황에서 첼리크를 반기는 글이 눈에 띄었다. 카푸 같은 선수를 기대하는 것이 아니라 양쪽 역할을 믿고 맡길 수 있으면 된다는 기대였다.\n\n그런데 다른 댓글은 지금 공격 조합이 이 선수들이 빠진 사이에 만들어졌다는 사실을 먼저 짚었다. 선택지가 늘어나는 것은 좋지만, 복귀가 곧바로 기존 조합의 해체로 이어지지 않았으면 한다는 것이다. 경기력의 작은 확신을 얻자마자 그것을 잃을 가능성부터 경계하는 모습이었다.\n\n일디즈의 복귀 날짜를 두고는 기억부터 엇갈렸다. 11월 대표팀 휴식기 뒤로 알고 있었다는 팬, 처음부터 12월 초 이야기였다는 팬, 기사 제목의 12월 14일 몬차전 목표를 보고 예상보다 늦어졌다고 받아들이는 팬이 한데 있었다. ‘긍정적인 소식’이라는 표현을 읽고, 대체 어느 부분이 긍정적이냐고 되묻는 반응도 나왔다.\n\n확인되는 출발점은 8월 31일 구단의 의료 발표다. 일디즈는 왼발 제5중족골 기저부 골절 고정 수술을 받았고, 수술은 성공적이었다. 이 공식 발표에는 특정 경기 복귀일이 적혀 있지 않다. 따라서 이번 글타래의 11월 말·12월 초·몬차전은 확정된 복귀 일정으로 합칠 수 없다. [유벤투스 공식 의료 발표](https://www.juventus.com/en/news/articles/medical-update-yildiz-ekhator31-08-26)\n\n그를 기다리는 마음은 미래의 공격진으로도 뻗었다. 일디즈–알라이베고비치–리치나 뒤에 좋은 스트라이커를 더하면 오랫동안 걱정 없겠다는 꿈이다. 곧바로 알라이베고비치도 성장 과정을 지켜봐야 하고, 리치나는 아직 경험이 적으니 한 시즌을 보내게 두자는 답이 붙었다. 돌아올 선수를 기다리는 일과 아직 완성되지 않은 선수를 기다리는 일이 같은 글타래에 겹쳐 있었다.\n\n### 유로파리그 결승을 꿈꾸는데, 밀란은 만나고 싶지 않다\n\n유로파리그 전망 글타래는 비관과 야심이 가장 빠르게 교대하는 자리였다. 8강이면 최대치이며 그 이상은 놀라운 일이라는 글이 있는가 하면, 지금 유벤투스 수준으로도 결승은 충분히 노려야 한다는 주장도 있었다. 자신들의 팀을 낮춰 부르는 표현을 쓰면서도 대회 전체에서 압도적으로 위에 있는 팀이 보이지 않는다고 판단한 것이다.\n\n다가올 상대를 놓고는 오모니아와 하포엘 베르셰바를 상대로 승점 6을 챙겨야 한다는 요구가 반복됐다. 이후 페렌츠바로시와 레알 소시에다드를 만난다는 일정은 구단 발표와 맞는다. 다만 승점 17이면 사실상 8위 안이 확실하다는 계산은 게시물 작성자의 전망이다. 현재 순위표와 남은 결과를 대신하는 확정선은 아니다. [유벤투스 공식 리그 페이즈 상대 안내](https://www.juventus.com/en/news/articles/ucl-draw-juventus-league-phase-opponents-28-08-26?appview=true)\n\n경계 대상으로는 벤피카가 여러 번 등장했다. 최근 상대했던 기억 때문에 무섭다는 말에, 차라리 만나기 전에 떨어졌으면 좋겠다는 답이 달렸다. 본머스와 레버쿠젠도 우승 후보 이야기의 단골이었지만, 누구에게 이겼는지까지 따져봐야 한다는 반론이 있었다. 이름이나 현재 승점만으로 강도를 정할 수는 없다는 뜻이다.\n\n여기서 누군가 꺼낸 것은 벤피카의 ‘구트만의 저주’였다. 우승은 아직 멀었다는 농담에, 유벤투스야말로 그 유명한 저주를 풀어주기 딱 좋은 팀이라는 자조가 붙었다. 유벤투스와 벤피카가 결승에서 만나면 베팅하는 사람들과 북메이커들이 모두 혼란에 빠질 것이라는 말도 나왔다. 두 팀을 둘러싼 유럽 결승의 기억을 팬들끼리는 길게 설명할 필요가 없었다.\n\n밀란과의 결승은 원하지 않는다는 한마디에는 답이 여럿 달렸다. 그런 일이 일어날 위험은 없다는 냉소, 밀란도 결승에 못 갈 것이라는 맞장구, 이미 결승에서 온갖 팀에 져봤으니 이번에는 설욕할 수도 있지 않느냐는 반응이었다. 한 팬은 밀란을 상대로 연장 막판 5–4로 이기는 챔피언스리그 결승 꿈까지 털어놓았다. 유벤투스 선수들은 낯선 얼굴들이었고, 결승골을 넣은 선수만 테베스를 닮았으며, 관중석은 대부분 밀란 팬이었다고 했다. 미래 같은 경기인데 경기장은 카디프의 기억을 닮아 있었다는, 승리하는 꿈에도 불안이 남은 이야기였다.\n\n대회 운영을 놓고는 현실적인 이견이 이어졌다. 봄에도 리그 4위를 다투고 있다면 목요일에는 결국 후보 선수들을 쓰게 될 것이라는 예상과, 8강이나 4강까지 가면 유로파리그를 최우선으로 바꿔야 한다는 주장이 맞섰다. 지금 결승 진출을 믿느냐보다, 정말 가까워졌을 때 무엇을 우선할 수 있느냐가 더 어려운 질문이었다.\n\n### 계획을 말하는 구단, 교체를 말하는 팬들\n\n카르네발리의 주주총회 발언을 다룬 글타래에서 가장 오래 이어진 문제는 돈을 얼마나 쓸 수 있느냐보다, 왜 써도 필요한 자리가 채워지지 않느냐였다. 과거 지출의 대가로 지금 선택이 제한됐다는 해석과, 돈이 없었던 것이 아니라 아이디어가 부족했다는 비판이 함께 나왔다. 코모를 보라는 글은 자금과 구상이 같이 움직이는 팀을 부러워했다.\n\n사수올로 경력도 서로 정반대의 증거가 됐다. 그곳 출신이라는 이유로 유벤투스를 맡을 능력이 입증되지는 않는다는 비판에, 작은 구단에서 오래 세리에A에 머물고 높은 순위를 낸 경험을 왜 무시하느냐는 반박이 붙었다. 선수 영입 방식의 재정 부담이 낮다는 점을 좋게 보는 댓글도 있었다. 여기에 등장한 이적 지출액이나 향후 비용 부담은 팬들의 설명이며, 이번 원고에서 확인된 회계 수치로 쓰지는 않는다.\n\n감독 교체 글타래의 구도도 닮았다. 콘테라면 충격을 줄 수 있다는 기대가 있었고, 더 좋은 선수와 비어 있는 포지션부터 채워야 한다는 반론이 있었다. 지금 반등 중이니 연승과 복귀가 이어지면 이 논쟁이 곧 낡아 보일 것이라는 글에는, 바로 피오렌티나전부터 불안하다는 답이 달렸다.\n\n‘연속성’이라는 말조차 같은 뜻으로 쓰이지 않았다. 계속 믿어야 한다는 쪽에 맞서, 최근의 변화는 기존 방식을 유지해서가 아니라 투톱과 그동안 덜 쓰던 선수들을 받아들였기 때문에 생겼다는 해석이 나왔다. 유지해야 할 것이 감독인지, 최근의 조합인지, 구단의 큰 방향인지가 서로 달랐다.\n\n분위기를 잠깐 바꾼 것은 ‘다시 이기고자 하는 야심’이라는 말에 대한 농담이었다. 자신도 앤 해서웨이와 저녁에 데이트할 야심은 있다는 댓글에, 아직 물어보지도 않았으면서 어떻게 안 된다고 아느냐는 답이 달렸다. 그러면 희망이 있겠다는 반응과 포기하지 말라는 격려가 이어졌다. 구단의 야심에는 냉정하던 사람들이 그 작은 대화에서는 제법 너그러웠다.\n\n### 일곱 명을 고르라니, 먼저 무엇을 셀지부터 다퉜다\n\n역대 최고의 외국인 선수 일곱 명을 고르는 글타래에는 플라티니, 지단, 네드베드, 트레제게, 테베스가 여러 목록에 등장했다. 호날두, 시보리, 존 찰스, 다비즈, 브래디, 이과인, 포그바, 디발라 등으로 자리가 갈렸다. 일곱 자리가 너무 적다는 탄식부터 나오는 주제다.\n\n길게 이어진 논쟁은 라우드루프였다. 선수 경력 전체의 위대함과 유벤투스에서 남긴 기여를 어느 정도 나눠야 하느냐는 문제였다. 한쪽은 토리노에서 인상적인 몇 경기와 전체 재임 기간의 평가를 구별해야 하며, 당시 팀에는 다른 재건이 필요했다고 봤다. 다른 쪽은 젊은 나이에 보낸 것이 큰 실수였고, 이후 스페인에서 보여준 능력은 그 판단을 되돌아보게 한다고 주장했다. 발췌에서 거론된 외부 선정 결과나 유명 인물의 평가는 여기서 검증된 권위로 인용하지 않는다. 대화의 핵심은 그 평가를 유벤투스의 일곱 자리에 얼마나 가져올 수 있느냐였다.\n\n곧 질문은 자신이 보지 못한 선수를 순위에 넣어도 되느냐로 넓어졌다. 직접 본 선수만 고르겠다는 목록에, 시대가 오래됐다고 오르시나 시보리를 지워서는 안 된다는 의견이 맞섰다. 자료를 찾아보면 된다는 말에는 몇 장면과 한 경기 전체를 보는 경험은 다르다는 답이 붙었다. 누군가는 자신이 직접 보지 못한 플라티니와 지단도 위대한 선수인 줄 알고 포함했다며, 출생연도가 평가 자격을 정하는 데 반대했다.\n\n현재 수비수들을 예전 선수들과 비교하던 다른 글타래와 나란히 놓으면, 이곳 팬들이 과거를 단순히 피난처로만 쓰는 것은 아니라는 점이 보인다. 누군가의 기억은 생생한 기준이고, 다른 누군가에게는 찾아 읽고 배워야 하는 역사다. 다만 같은 이름을 적어도 어떤 경기를 기억하는지, 무엇을 유벤투스에서의 공헌으로 세는지는 끝내 같지 않았다.\n\n### 이름 세 개를 외우던 시절의 작별\n\n잔피에트로 마르케티의 부고 글타래에서는 긴 논쟁이 멎었다. 아탈란타는 11월 5일 공식 추모문을 냈으며, 그가 1969년 유벤투스로 옮겼다가 5년 뒤 베르가모로 돌아왔다고 기록했다. [아탈란타 공식 추모문](https://www.atalanta.it/news/il-cordoglio-per-la-scomparsa-di-gian-pietro-marchetti)\n\n제공된 새 글 12개는 대부분 짧은 애도였다. 나이 때문에 직접 본 적 없다는 팬도 있었고, 어린 시절의 기억이라는 하트도 있었다. 업무로 만났던 한 팬은 조용하고 단정하고 친절한 사람이었다고 회고했다.\n\n마지막 댓글에는 처음 외웠던 유벤투스 선발 명단이 남았다. “카르미냐니, 스피노시, 마르케티…” 이름을 순서대로 적고, 평안한 여행을 빌었다. 이날 게시판의 다른 곳에서는 누가 유벤투스에 어울리는지 한창 다투고 있었다. 이곳에서는 오래전에 외운 이름 하나를 그 순서에 그대로 남겨두었다.\n\n<details><summary>범위와 근거<\/summary>\n\n- 실행 식별자: 2026-11-07_153938. 제공된 수집 안내는 글타래 27개, 새 글 434개, 익명 작성표시 229종이다. 원고는 이번에 제공된 발췌만을 팬 반응의 근거로 삼았다. 작성표시를 실제 인원으로 환산하거나 글타래 사이에서 연결하지 않았다.\n- 중심 자료는 AZ전 경기 후·하이라이트·평점, 칼룰루의 왼쪽 기용, 코프메이너
