<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해외축구 팬 매거진</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 읽는 칼럼 하나 위에 탭 띠가 붙어 있다. 탭 하나가 커뮤니티 하나의 보고다. 틀은 원본의 축구 시험 보고에서 왔다 */
:root {
  --bg: #f5f7f3;
  --paper: #ffffff;
  --ink: #1c231e;
  --muted: #5c675f;
  --rule: #dde3dc;
  --accent: #2c6b3f;
  --accent-soft: #e1eee4;
  --quote: #eff2ee;
  --warn: #9a5b12;
  --warn-soft: #f6ecdc;
  --f-display: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Gowun Batang", "AppleMyungjo", "Batang", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131815; --paper: #1a201c; --ink: #e3e9e4; --muted: #98a59c; --rule: #2d3630;
    --accent: #7cc893; --accent-soft: #1f3325; --quote: #212923; --warn: #e0a85a; --warn-soft: #33291b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131815; --paper: #1a201c; --ink: #e3e9e4; --muted: #98a59c; --rule: #2d3630;
  --accent: #7cc893; --accent-soft: #1f3325; --quote: #212923; --warn: #e0a85a; --warn-soft: #33291b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.8; margin: 0; }
.wrap { max-width: 46rem; margin: 0 auto; padding-inline: 16px; }
header.top { padding-block: 2.2rem 1.2rem; }
.eyebrow { font-family: var(--f-mono); font-size: 0.75rem; letter-spacing: 0.08em; color: var(--muted); }
h1.name { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.7rem, 4.5vw, 2.3rem); line-height: 1.25; margin: 0.3rem 0 0.4rem; text-wrap: balance; }
.lede { color: var(--muted); font-size: 0.98rem; margin: 0; }
.dates { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; margin-top: 0.9rem; }
.dates select, .dates button { font-family: var(--f-mono); font-size: 0.8rem; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 0.25rem 0.55rem; }
.dates button { cursor: pointer; }
.dates button:disabled { opacity: 0.4; cursor: default; }
nav.tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--rule); }
nav.tabs .wrap { position: relative; display: flex; gap: 0.25rem; overflow-x: auto; padding-block: 0.5rem; scrollbar-width: thin; }
nav.tabs button {
  font-family: var(--f-display); font-size: 0.9rem; font-weight: 600; white-space: nowrap;
  border: 1px solid transparent; background: none; color: var(--muted); padding: 0.4rem 0.75rem; border-radius: 999px; cursor: pointer;
  display: inline-flex; align-items: baseline; gap: 0.4rem;
}
nav.tabs button .where { font-family: var(--f-mono); font-size: 0.7rem; font-weight: 400; }
nav.tabs button[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-soft); }
nav.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { padding-block: 1.5rem 4rem; }
article { min-width: 0; }
article h1 { font-family: var(--f-display); font-size: 1.55rem; line-height: 1.35; margin: 0 0 0.2rem; text-wrap: balance; }
article h1 + p { font-family: var(--f-mono); font-size: 0.82rem; color: var(--muted); margin-top: 0; }
article h3 { font-family: var(--f-display); font-size: 1.18rem; margin: 2.4rem 0 0.6rem; text-wrap: balance; }
article h4 { font-family: var(--f-display); font-size: 1rem; margin: 1.4rem 0 0.4rem; }
article p { margin: 0 0 1.05rem; }
article ul { padding-left: 1.2rem; margin: 0 0 1.2rem; }
article li { margin: 0 0 0.45rem; }
article strong { font-family: var(--f-display); font-weight: 600; }
article hr { border: 0; border-top: 1px solid var(--rule); margin: 2rem 0; }
article a { color: var(--accent); overflow-wrap: anywhere; }
article blockquote { margin: 0 0 1.05rem; padding: 0.6rem 1rem; background: var(--quote); border-radius: 6px; }
article blockquote p { margin: 0; }
article code { font-family: var(--f-mono); font-size: 0.85em; background: var(--quote); padding: 0.05rem 0.3rem; border-radius: 4px; overflow-wrap: anywhere; }
article details { margin-top: 1.5rem; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); padding: 0.4rem 1rem; font-size: 0.92rem; }
article details summary { font-family: var(--f-display); font-weight: 600; cursor: pointer; padding: 0.4rem 0; color: var(--muted); }
article details[open] summary { margin-bottom: 0.5rem; }
.scope { font-size: 0.95rem; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 0.9rem 1.1rem; margin-bottom: 1.6rem; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; font-family: var(--f-display); }
.tbl { overflow-x: auto; margin: 0 0 1.4rem; }
th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 0.8rem; letter-spacing: 0.03em; }
td.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip { display: inline-block; font-family: var(--f-mono); font-size: 0.72rem; line-height: 1.5; padding: 0.1rem 0.5rem; border-radius: 999px; white-space: nowrap; }
.chip.ok { background: var(--accent-soft); color: var(--accent); }
.chip.stop { background: var(--warn-soft); color: var(--warn); }
.intro h2 { font-family: var(--f-display); font-size: 1.15rem; margin: 2rem 0 0.6rem; }
.empty { color: var(--muted); }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="eyebrow" id="when"></div>
    <h1 class="name">해외축구 팬 매거진</h1>
    <p class="lede">여러 나라 축구 커뮤니티를 대신 읽고 곳마다 탭 하나씩 한국어로 들려줍니다.</p>
    <div class="dates">
      <button id="prev" type="button" aria-label="이전 보고">‹ 이전</button>
      <select id="pick" aria-label="보고일"></select>
      <button id="next" type="button" aria-label="다음 보고">다음 ›</button>
    </div>
  </div>
</header>

<nav class="tabs" aria-label="커뮤니티">
  <div class="wrap" role="tablist" id="tabs"></div>
</nav>

<main>
  <div class="wrap"><article id="doc"><p class="empty">아직 보고가 없어요.</p></article></div>
</main>

const REPORTS = [{"id": "2026-11-07_153938", "label": "2026년 11월 7일 · 15:39", "md": "# 해외축구 팬 매거진 · 2026년 11월 7일\n\n11월 5~7일 대화가 중심인 16개 커뮤니티의 개관을 따라간다. 경기 결과보다 눈길을 끄는 건 그다음 말들이다. 대승을 거두고도 압박에 버틸 수 있느냐고 묻고, 대표팀에 뽑힌 선수를 축하하다가 당장 우리 팀의 빈자리를 계산한다.\n\n**오늘의 큰 줄기**\n\n- **승리 뒤의 온도 차를 읽고 싶다면 독일·이탈리아·포르투갈로.** Transfermarkt의 바이에른 팬들은 케인 재계약을 반기면서 연봉과 노쇠화까지 계산한다. BVB-Forum에서는 베티스를 이긴 도르트문트의 유럽 무대 기대치를 가늠한다. VecchiaSignora의 유벤투스 팬들은 AZ전의 좋은 전반과 불안한 막판 사이에서 갈리고, Portal dos Dragões에서는 나폴리를 4–1로 꺾은 포르투가 강한 압박에도 버틸 수 있을지를 다툰다. FórumSCP는 새 감독 폰세카의 첫 경기를 앞둔 기용 구상에 집중한다.\n- **대표팀 명단의 뒷맛은 폴란드와 일본, 벨기에에서 선명하다.** Wykop에서는 빠진 이름을 부르는 요구가 반복됐는데, 그중 추바크는 모토르 경기에서 추가시간 7분 결승골까지 넣었다. 5ch의 잉글랜드 구단 팬들은 대표팀 휴식의 이득과 줄어든 대표 선수의 씁쓸함을 함께 이야기한다. BeyondGaming에서는 더빈터의 소집 거절 사유를 놓고 해석이 갈렸다.\n- **직접 축구를 보러 다니는 생활감은 영국 게시판에 있다.** FootballForums에서는 더비–볼턴전의 후반 역전만큼 중계 시간에 맞춰 바꿔야 하는 휴가와 이동, 술자리 계획이 구체적이다. Not606의 종합 경기 수다에는 코너킥 직접 득점과 더비의 반등이 들어온다. BigSoccer에는 아스널의 승리 뒤 운영 논쟁 사이로 런던 식당 예약과 카솔라의 뉴욕 방문 이야기가 섞인다.\n\n## 같은 일, 여러 판\n\n**페네르바흐체의 리버풀전 3–2 승리에는 서로 다른 되감기가 있다.** Forum FB 팬들은 골과 캉테의 축하 동작, 관중석 화면을 다시 본다. Not606의 리버풀 팬들이 되짚는 것은 세트피스 세 차례 실점이다. 이쪽 글타래의 여러 댓글은 외부 SNS의 감독 경질 요구에도 반발했다.\n\n**밀란의 페렌츠바로시전 홈 0–2 패배는 구단 안팎에서 다른 논쟁을 낳았다.** MilanWorld에서는 선수층·로테이션·대회를 대하는 태도 중 무엇이 문제였는지 갈렸다. BigSoccer에서는 밀란을 아약스에 빗댄 말이 역사적 위상과 최근 유럽 성적, 구단주 책임 논쟁으로 번졌다. 5ch의 밀란 대화에서는 유럽대항전을 포기하자는 말조차 쉽게 나오지 않았다.\n\n**헤수스 데 미겔의 사망 뒤, 스페인 두 게시판이 붙든 질문도 달랐다.** Mediavida의 수집분은 유족 모금과 선수의 경제적 처지에, ForoRealMadrid는 주말 리그 중단과 추모 방식에 무게가 실렸다. 사망 발표와 추모 방침은 확인됐으며, 책임을 단정하는 댓글은 확인된 결론과 구분한다.\n\n오시멘의 부상은 GSCimbom의 종합 수다 분위기를 바꿨고, 라이벌 Forum FB에도 별도의 감정선으로 등장했다. 수술 계획과 아메드전 제외는 구단 발표로 확인됐지만, 게시판의 ‘3주’나 특정 경기 복귀 예상은 공식 일정이 아니다.\n\n이 안내는 제공된 개관에 한정한다. Wykop은 수집 1,166개 중 990개분, Forum FB는 집계 281개 중 한 글타래의 273개가 실제 제공 범위이며, 다른 곳도 발췌 여부와 표본 크기가 다르다. 반응의 크기는 각 제공분 안에서 읽는다. jeuxvideo Football과 SerBenfiquista는 robots.txt 규칙을 확인하지 못해 이번 읽을거리에서 빠졌다.\n\n## 읽은 곳과 읽은 양\n\n| 곳 | 나라 | 글타래 | 새 글 | 결과 |\n|---|---|---|---|---|\n| Not606 | 영국 | 10 | 147 | 읽음 |\n| FootballForums | 영국 | 10 | 144 | 읽음 |\n| transfermarkt | 독일 | 46 | 263 | 읽음 |\n| BVB-Forum | 독일 | 7 | 147 | 읽음 |\n| 5ch 해외축구 | 일본 | 52 | 920 | 읽음 |\n| Wykop #mecz | 폴란드 | 1 | 1,166 | 읽음 |\n| BigSoccer | 미국 | 13 | 55 | 읽음 |\n| Mediavida | 스페인 | 20 | 232 | 읽음 |\n| ForoRealMadrid | 스페인 | 8 | 87 | 읽음 |\n| MilanWorld | 이탈리아 | 16 | 105 | 읽음 |\n| VecchiaSignora | 이탈리아 | 27 | 434 | 읽음 |\n| GSCimbom | 튀르키예 | 4 | 96 | 읽음 |\n| Forum FB | 튀르키예 | 2 | 281 | 읽음 |\n| Portal dos Dragões | 포르투갈 | 23 | 580 | 읽음 |\n| FórumSCP | 포르투갈 | 22 | 189 | 읽음 |\n| BeyondGaming | 벨기에 | 5 | 58 | 읽음 |\n| jeuxvideo Football | 프랑스 | 0 | 0 | 못 읽음 |\n| SerBenfiquista | 포르투갈 | 0 | 0 | 못 읽음 |\n\n## Not606 | 영국\n\n이번에는 Not606의 10개 글타래에서 수집한 새 글을 읽었다. 수집 집계는 147개이며, 대화는 한국 시각 11월 5일 저녁부터 7일 아침까지 걸쳐 있다. 중심은 여러 구단 팬이 함께 경기를 보는 ‘General matchday thread’와 리버풀·아스널의 경기 뒤풀이였다.\n\n**개관**\n\n- 리버풀 팬들은 페네르바흐체전의 실험보다 세트피스 세 차례 실점을 더 큰 문제로 짚었다. 외부 SNS의 감독 경질 요구에는 이번 글타래의 여러 댓글이 반발했다.\n- 아스널에서는 요케레스의 좋은 장면을 반기면서도 상대 수준을 따졌고, 라이스의 출전 관리와 1월 공격수 영입을 놓고 서로 다른 계산이 나왔다. 부상 위장과 이적 이야기는 팬의 추측이다.\n- 금요일 밤에는 옥스퍼드 시티의 코너킥 직접 득점과 더비의 반등이 종합 수다에 들어왔다. 레스터의 4–2 승리와 더비의 3–1 승리는 구단 공식 보고로 확인했다.\n- 코모의 랑스 원정 9–1 승리와 케인의 바이에른 재계약도 공식 자료에서 확인했다. 원정 일정과 중계 채널에 관한 불평은 경기 못지않게 구체적이었다.\n\n---\n\n### 축구의 신이 차려 준 금요일, 문제는 장모님 댁의 채널이었다\n\n“축구의 신들이 에버턴 대 코번트리, 옥스퍼드 시티 대 레스터를 내려 주셨다.”\n\n종합 경기 글타래의 금요일 저녁 예고는 이렇게 시작됐다. 레스터 쪽에서 “고를 건 하나뿐”이라는 답이 돌아오자, 처음 글을 쓴 사람은 축구의 신들이 킥오프 시간까지 엇갈리게 해 놓았다고 덧붙였다. 한 경기만 고르기 아까운 사람과 애초에 자기 팀 말고는 선택지가 없는 사람이 같은 편성표를 보고 있었다.\n\n하지만 다음 불평은 경기 내용이 아니라 시청권에서 나왔다. 한 사람은 FA컵 상당수가 TNT에 있는 것이 성가시다며, 옥스퍼드 시티전을 보고 싶었지만 더비 대 볼턴으로 만족해야겠다고 했다. 집에 TNT가 있는 레스터 팬도 사정이 나을 게 없었다. 사우스웨일스의 장모님 댁에 와 있고, 집으로 돌아가는 날은 토요일인데, 그 집에는 스포츠 채널이 없었다.\n\n이쯤 되면 경기 글타래가 잠시 집안의 TV 문제를 해결하는 곳이 된다. 다른 사람이 기기 연결 방법을 알려 주자, 당사자는 자주 오는 집도 아니라 별도 기기를 살 정도는 아니라고 답했다. 친척 집을 통하거나 자기 휴대전화의 통신사 앱으로 볼 수 있을지 알아보겠다는 쪽으로 이야기가 흘렀다. 중계권의 큰 흐름보다, 이미 돈을 내고도 오늘 저녁 자기 팀 경기를 볼 수 없다는 답답함이 훨씬 선명했다.\n\n그렇게 기다리던 경기에서 실제로 글타래를 움직인 장면은 옥스퍼드 시티의 동점골이었다.\n\n“옥스퍼드가 코너킥으로 바로 넣어서 레스터와 동점.”\n\n여기의 옥스퍼드는 유나이티드가 아니라 옥스퍼드 시티다. 스콧 폴록의 코너킥이 그대로 골이 됐고, 레스터는 결국 4–2로 다음 라운드에 진출했다. 레스터 공식 보고에도 코너킥 직접 득점과 최종 결과가 확인된다. [레스터 공식 경기 보고](https://www.lcfc.com/media-article/match-report-oxford-city-leicester-city-emirates-fa-cup-first-round)\n\n수집된 대화에는 경기 전체를 따라가는 긴 실황이 없다. 대신 동점골 한 줄이 끼어들고, 다른 화면의 더비 이야기가 올라오고, 에버턴 경기에는 “좋은 경기네”라는 짧은 평가가 붙는다. 경기 셋을 꼼꼼히 복기하는 방보다는, 각자 다른 화면을 켜 둔 사람들이 눈에 띄는 순간에 고개를 돌려 옆자리 사람을 부르는 모습에 가깝다.\n\n밤의 끝에는 레스터 팬의 여유가 돌아왔다. “주말 출발이 축구적으로 아주 좋다”며, 이제 앞으로 이틀 동안 남들의 고통과 비참함을 편히 지켜보겠다는 말이었다. 한국에서는 토요일 아침이지만 영국에서는 금요일 밤이다. 자기 팀 경기를 먼저 무사히 마친 사람이 토·일요일의 다른 구단들을 기다리는, 경기 일정이 선사하는 작은 특권이었다.\n\n### 두 골을 넣고도 진 리버풀, 공격수 자리보다 먼저 볼 것\n\n페네르바흐체 원정 뒤 리버풀 글타래에는 칭찬할 대상을 찾는 문장부터 나왔다. 니오니는 다시 좋은 평가를 받았다. 무뇨스와 리오가 간간이 보여 준 장면도 언급됐다. 그런데 그 뒤에 붙은 질문이 공격진 배치에 대한 논의를 열었다.\n\n“바르콜라가 왜 센터포워드로 뛰었는지 모르겠다.”\n\n답변자는 바르콜라가 원래 중앙 공격수로 뛰다가 PSG에서 측면으로 옮겼다는 설명을 꺼냈다. 그 자리를 맡을 수는 있지만 어느 수준까지 가능한지는 별개의 문제라는 의견이었다. 여기서 누구도 배치 하나만으로 경기를 다 설명하지는 않았다. 마지막에 올라온 긴 댓글은 오히려 논의의 우선순위를 바꿨다.\n\n“우리는 두 골을 넣었다. 대부분의 상대에게는 이기기에 충분해야 하는 숫자인데, 세트피스에서 세 골을 내줬다.”\n\n이 댓글의 작성자도 그날 바르콜라의 중앙 기용이 잘됐다고 보지는 않았다. 그래도 감독이 어딘가에서는 실험을 해야 하며, 자신의 판단으로는 리그보다 부담이 덜한 챔피언스리그에서 시도하는 편이 낫다고 했다. 공격 조합이 마음에 들지 않는 것과 그 조합이 패배의 주된 원인이었는지는 분리해서 보고 있었다.\n\n리버풀은 실제로 2–3으로 패했고, 세 실점 모두 세트피스에서 나왔다. 구단 인터뷰에서 판데이크도 첫 공과 세컨드볼에 준비하지 못했다는 점을 짚었다. 팬의 불만이 막연한 ‘수비가 불안하다’에 그치지 않고, 두 번 앞서고도 리드를 지키지 못한 구체적인 방식으로 모인 셈이다. [리버풀 공식 판데이크 인터뷰](https://stadion-edge.liverpoolfc.com/news/virgil-van-dijk-everyone-is-disappointed-we-cannot-lose-in-that-manner)\n\n젊은 공격 자원에 대한 기대에도 비슷한 구분이 있었다. 리오가 흥미로운 선수라는 데 동의한 댓글 하나는, 코칭스태프가 언제 간단히 내주고 패스 뒤 움직여야 하는지도 이야기해 주길 바랐다. 자기 진영에서 두 명을 제치려다가 언젠가 실점으로 이어질 수 있다는 걱정이었다. 화려한 드리블을 보지 말자는 반응은 아니다. 그 재능을 좋아하기 때문에 어느 구역에서 얼마나 위험을 감수할지까지 신경이 쓰이는 쪽이다.\n\n그보다 더 날카로운 반응을 부른 것은 경기장 밖의 감독 경질론이었다. 한 사람이 다른 SNS에서 이라올라를 벌써 내보내자는 말을 본다며 분통을 터뜨렸다. 그는 곧바로 “여기 말고”라고 덧붙였다. 이 구분은 이번 대화를 읽는 데 필요하다. 수집된 글타래에서 경질 찬반이 맞붙은 것이 아니라, 밖에서 본 경질 요구를 안으로 가져와 성토하고 있었다.\n\n그 뒤로 여러 댓글이 호응했다. 어떤 사람은 반응이 과격한 SNS 이용자들을 탓했고, 다른 사람은 타 구단 팬이 일부러 팬인 척하며 불을 지피는 경우도 있다고 봤다. 처음 문제를 제기한 사람은 그런 경우를 안다면서도, 실제로 그런 말을 꽤 많이 보고 있어 싫다고 했다. 상대의 설명을 받아들이면서 자기 관찰까지 철회하지는 않았다.\n\n가장 길게 이어진 답변에서는 판단 기준으로 경기장에 가는 팬들이 등장했다. 온라인에는 무엇이든 쓰는 사람이 있지만, 자신이 보기에는 현장 팬들에게서 감독의 입지가 흔들린다는 신호가 없다는 이야기였다. 이것은 그 댓글 작성자의 관찰이지 현장 팬 전체를 조사한 결과는 아니다. 그래도 이 대화에서 감독을 지지하는 방식이 무엇인지는 잘 보인다. 경기 내용은 비판하되, 몇 달의 시간을 순식간에 소진해 버리는 온라인의 속도에는 동의하지 않는 것이다.\n\n한 댓글은 이를 “열두 살에 집중력도 12초인 애들, 반년이 평생처럼 느껴지는 애들일 것”이라고 비꼬았다. 실제 작성자의 나이를 안다는 뜻은 물론 아니다. 좋은 감독을 기다린다고 말하면서 한 번의 패배 뒤 곧바로 기다림을 끝내 버리는 태도에 대한 조롱이었다.\n\n### 더비가 이기길 바라는 이유도 제각각\n\n같은 감독 이야기라도 종합 경기 글타래에서는 계산이 훨씬 짧고 짓궂었다.\n\n“더비가 이렇게 살아날 줄은 몰랐다.”\n\n“정말 갑자기네. 우리가 다음에 만나니까, 이겨서 감독을 안 자르는 편이 좋겠어.”\n\n더비가 좋아져서 반가운 사람이 아니라, 다음 상대를 생각하며 감독 교체 효과를 피하고 싶은 사람이 끼어든 것이다. 상대 팀의 승리를 응원하는데 그 속에는 여전히 상대가 약했으면 좋겠다는 바람이 들어 있다. 이 댓글의 ‘우리’가 어느 구단인지는 제공된 대목에 나오지 않는다.\n\n더비는 볼턴에 먼저 실점하고도 후반에 뒤집었고, 추가시간 세 번째 골로 3–1 승리를 확정했다. 공식 경기 보고 본문과 결과표에서 확인되는 점수다. [더비 공식 경기 보고](https://www.dcfc.co.uk/news/2026/11/report-derby-county-vs-bolton-wanderers)\n\n승리 뒤에는 처음 놀라움을 표시했던 사람이 다시 돌아와, 등을 돌렸던 충성파 팬들이 아마 충격에 빠졌을 것이라고 농담했다. 수집된 것은 두 사람이 주고받은 세 댓글이다. 더비 팬들 사이에서 실제로 누가 얼마나 감독에게 등을 돌렸는지는 알 수 없다. 이 짧은 대화의 재미는 그보다, 반등 하나를 놓고도 누군가는 놀라고 누군가는 다음 경기의 유불리를 따진다는 데 있다.\n\n금요일 밤의 에버턴에는 더 짧은 낙관이 붙었다. 좋은 경기라는 평가에 이어, 한 사람이 이번 시즌 리그에서 에버턴이 리버풀을 적어도 한 번은 이길 것 같다고 했다. 끝에는 개인 의견을 뜻하는 ‘imo’가 있었다. 이번 자료에서 확인되는 것은 한 사람의 전망이다. 리버풀 쪽에서 세트피스 실점과 인내심을 논하던 때, 종합 수다의 다른 자리에서는 벌써 다음 머지사이드 맞대결을 상상하고 있었다.\n\n### 요케레스의 골에는 박수, 라이스의 90분에는 걱정\n\n아스널의 슬라비아 프라하전 글타래에는 새 댓글이 두 개뿐이지만, 두 사람이 보고 있던 것은 달랐다.\n\n한 사람은 요케레스의 골이 아스널 유니폼을 입고 넣은 골 중 최고였을지도 모른다고 평가했다. 마두에케에게 건넨 영리한 패스도 거의 도움으로 이어질 뻔했다며, 이제 컨디션이 올라오는 신호이기를 바랐다. 골 하나만 떼어 칭찬하지 않고 연결 플레이까지 함께 짚은 반응이었다.\n\n그런데 같은 댓글의 괄호 안에는 걱정이 남았다. 요케레스가 약한 상대를 만났을 때만 잘하는 것처럼 보인다는 것이다. 좋은 골을 반기면서도 그 장면을 곧바로 완전한 부활의 증거로 삼지는 못한다. 이번 경기가 반등의 시작일지, 이미 알고 있던 장점이 잘 드러난 경기일지를 아직 구분하고 싶은 마음이다.\n\n다른 댓글은 라이스에게 가 있었다. 인용된 앞선 글은 아르테타가 왜 그를 90분 내내 뛰게 했느냐고 불만을 표시했다. 답변자는 헐시티전에는 아예 출전하지 않거나, ‘부상 예방’ 명목으로 전반만 뛰고 나간 뒤 대표팀 일정을 건너뛸 수 있다고 내다봤다. 그리고 대표팀 휴식기가 끝나면 기적처럼 돌아올 것이라는 냉소를 덧붙였다.\n\n이것은 실제 부상 정보나 구단 계획이 아니라 팬이 상상한 시나리오다. 말의 출발점은 피로 관리였다. 클럽에서 많이 뛴 선수를 보며, 이제 대표팀 경기까지 소화해야 하느냐는 불만이 가상의 결장 각본으로 이어졌다. 요케레스에게는 다음 좋은 경기를 기다리면서, 라이스에게는 다음 경기를 쉬게 해 주길 바라는 셈이다.\n\n헐시티전 새 글타래는 아직 대화라기보다 경기 안내판이었다. 장소, 킥오프 시각, 역대 전적과 최근 맞대결 결과가 올라왔을 뿐 추가 논쟁은 없었다. 11월 7일 토요일 에미레이츠에서 오후 3시에 시작한다는 안내는 아스널 공식 일정 자료와 일치한다. 수집 시점에는 아직 치르지 않은 경기였다. [아스널 공식 경기 일정 안내](https://help.arsenal.com/support/solutions/articles/101000594163-fixture-and-event-timings-for-local-residents)\n\n### 1월의 공격수 쇼핑, 마지막 댓글은 판매자 생각을 했다\n\n아스널 이적 글타래의 세 댓글은 작은 대화 하나로 완결됐다. 첫 사람이 엘리 주니오르 크루피와의 1월 이적설을 가져왔다. 아주 높은 수준까지 성장할 잠재력이 있다고 평가했고, 왼쪽과 중앙 공격수를 모두 맡을 수 있어 필요한 두 자리를 채운다는 점을 매력으로 들었다.\n\n다음 사람도 적극적이었다. 재능이 풍부하고 아스널에 딱 맞을 것이라며 영입을 바랐다. 여기까지는 선수가 얼마나 좋은지, 우리 팀에 무엇을 줄 수 있는지를 보는 대화다.\n\n세 번째 사람은 본머스 쪽을 봤다. 시즌 중간에 내줄 것 같지 않고, 터무니없는 이적료를 제시해야 가능할 텐데 아스널이 그렇게 할 것 같지도 않다는 반응이었다. 이어 라이프치히의 안토니오 누사와도 연결되고 있다며 재능은 인정했지만, 그쪽 역시 1월에는 웃돈 없이는 팔지 않을 것이라고 봤다.\n\n누가 더 좋은 선수인지를 놓고 취향이 갈린 것이 아니다. 원하는 선수에 대한 호감은 공유하면서도, 마지막 댓글은 겨울 시장에서 상대 구단이 선수를 내놓을 이유가 무엇인지를 물었다. 두 포지션을 해결한다는 기대와 시즌 도중 핵심 자원을 잃는 판매자의 사정이 세 댓글 안에서 만났다.\n\n제공된 글에는 영입설의 보도 출처나 구체적인 협상 근거가 붙어 있지 않다. 따라서 관심설은 게시판에서 오간 이야기로 읽으면 된다. 첫 댓글이 내세운 과거 득점 수치도 별도 공식 확인을 마치지 못해 여기서는 판단의 근거로 옮기지 않았다. 이번 대화에서 또렷한 것은 영입이 임박했다는 신호보다, 좋아하는 선수를 겨울에 데려올 수 있느냐는 현실적인 문턱이다.\n\n### 코모가 아홉 골을 넣자, 니코 파스는 재즈 연주자가 됐다\n\n종합 경기 글타래의 유럽대항전 화제 가운데 가장 큰 숫자는 코모의 랑스 원정 9–1이었다. UEFA도 이 경기를 챔피언스리그 역대 최다 점수 차 승리와 어깨를 나란히 한 결과로 정리했다. [UEFA 경기 정리](https://www.uefa.com/uefachampionsleague/news/02ab-21fe508a035b-5eed0199e0b2-1000--champions-league-highlights-and-round-up-como-equal-bigges/)\n\n그 엄청난 결과에서 한 팬의 시선은 니코 파스에게 갔다. 정말 좋은 선수로 보인다며, 여름이면 큰 구단들이 달려들 것이라고 했다. 이적이 결정됐다는 정보가 아니라, 이런 경기를 본 뒤 나오는 선수 가치에 대한 기대였다.\n\n“처음 듣는데, 잘하나?”라는 짧은 답이 붙자 또 다른 사람은 런던의 재즈 클럽 로니 스콧에서 한 번 봤다며, 거기서는 ‘니코 재즈’라고 불렀다고 받아쳤다. 선수 소개를 요청했더니 이름을 비튼 공연 목격담이 돌아온 것이다.\n\n한편 다른 댓글은 자기 팀이 그를 샀다면 벌써 부상으로 빠졌을 것이고 지금 보고 있는 선수와는 달랐을 거라며 자조했다. 같은 유망주를 두고 한쪽은 빅클럽행을 예상하고, 다른 쪽은 자기 구단에 오자마자 벌어질 불운부터 떠올렸다. 대단한 활약 앞에서도 각자 응원하는 팀의 경험이 먼저 끼어든다.\n\n레스터 팬에게 아홉 골은 또 다른 입구였다. 원정에서 아홉 골을 넣으며 기록을 세우는 일이 누구에게나 가능한 것은 아니라며 자기 팀의 기억을 슬쩍 들이밀었다. 누군가 “그 경기 말하는 거지?”라고 묻자, 다른 줄무늬 팀 이야기라면서도 그때는 골대와 그물이 있었지 스웨터를 쌓아 골대를 만든 시대는 아니었다고 응수했다.\n\n9–1이라는 결과가 통계 이야기에서 유망주 이야기로, 다시 오래된 경기 기억을 자랑하는 말싸움으로 넘어갔다. 이번 자료에서 코모의 전술을 깊이 분석하는 대화는 없었다. 놀라운 경기를 함께 봤다는 흥분이 각자의 농담을 불러내는 쪽이었다.\n\n### ‘새로운 축구’라는 설명을 듣고, 누군가는 워커와 로즈를 떠올렸다\n\n전술 이야기가 아예 없었던 것은 아니다. 종합 글타래에 인용된 설명에는 공격적인 높은 압박, 4-2-3-1, 경기 방식을 바꿔 놓는 듯한 독특함이 등장했다. 다만 인용문이 잘려 있어 누구를 설명하는지는 확정할 수 없다.\n\n이에 답한 사람은 포체티노 시절 토트넘과 똑같아 보인다고 했다. 다이어나 완야마가 내려와 뒤의 세 명을 만들고, 워커와 로즈가 높이 올라가 폭을 제공하면서 중앙에 여분의 선수를 확보하던 방식이라는 것이다.\n\n그는 그 축구가 나쁘다고 하지 않았다. 설명이 흥미롭다고 시작한 뒤, 자기가 직접 보아 온 팀의 움직임을 대응시켰다. ‘독특하다’는 평가를 추상적인 반대말로 받지 않고, 누가 내려가고 누가 올라갔는지를 선수 이름으로 되돌려 준 댓글이었다. 새로운 축구에 대한 감탄 옆에서 오래 경기를 본 팬의 기억이 작동하는 장면이다.\n\n### “우리 선수에게 욕도 못 하나”라는 불만의 구체적인 배경\n\n‘Modern football woke nonsense’라는 제목의 글타래에서는 두 사람이 팬의 거친 표현을 옹호하는 쪽으로 이야기를 주고받았다. 제목만 보면 큰 문화 논쟁처럼 보이지만, 이번 새 댓글의 내용은 성적과 경기 운영에 대한 짜증에 가까웠다.\n\n한 사람은 높은 보수를 받는 프로 윙어가 코너킥으로 첫 수비수도 넘기지 못했을 때 욕이 나오는 것은 축구장에서 자연스러운 일이라는 입장이었다. 다른 사람은 14경기에서 승점 5점인 데다 선수들이 신경 쓰는 것처럼 보이지도 않는데, 팬들에게 거친 말을 하지 말라고 한다며 불만을 보탰다. 여기서 급여나 성적은 댓글 작성자가 제시한 맥락이며, 잘린 자료만으로 대상 구단을 확정하지는 않았다.\n\n그다음 답글의 경기 기억은 더 구체적이었다. 상대가 30초 만에 앞서고 전반을 2–0으로 마쳤으며 수적 우위까지 있었는데, 후반 내내 자기 골문 앞에 웅크리다가 겨우 무승부를 지켰다는 것이다. 작성자는 그런 경기를 본 적이 없다고 했다. 단순히 못해서 화났다는 말보다, 유리한 상황에서 스스로 뒷걸음질 치는 운영을 견디지 못했다는 설명이었다.\n\n마지막 댓글은 홈 0–4 패배 뒤, 너무 많은 팬이 70분 무렵에 나가려 하면 문제가 생길 수 있다고 경고하는 일이 팀과 감독에 대한 신뢰를 보여 주지는 못한다고 비꼬았다. 이 사람에게 조기 퇴장은 관람 태도 이전에 경기력에 대한 반응이었다.\n\n이번에 들어온 다섯 댓글에는 반대편의 충분한 논거가 없다. 선수에 대한 인신공격의 경계를 둘러싼 전체 토론으로 정리하기는 어렵다. 여기서 보이는 것은 두 사람이 무기력한 플레이, 지나치게 소극적인 운영, 팬 행동을 향한 경고를 한데 묶어 불만을 쌓아 가는 모습이다.\n\n### 금요일 밤 링컨 원정, 경기는 끝나도 기차가 없다\n\n중계 편성에 대한 불평은 TV 앞에서 끝나지 않았다. 1월 경기의 점심 킥오프 변경을 알리는 댓글에, 다른 팬이 자기 팀의 방송 일정을 나열하며 질색했다. 홈경기 여러 개가 12시 30분으로 잡혔고, 주중 번리 원정 다음에는 금요일 밤 링컨 원정이 놓였다는 것이다.\n\n답변자는 금요일 밤 링컨이라니 정말 고되겠다고 했다. 자신들 쪽은 비교적 운이 좋았다며, 바뀐 다른 경기는 브리스틀 시티 원정의 점심 킥오프 정도라고 덧붙였다. 그것도 FA컵 4라운드 주말이라 다시 움직일 가능성이 있다는 계산이었다. 팬들은 방송 일정이 발표된 순간부터 컵대회 진출 여부까지 넣어 교통편과 주말 계획을 다시 짠다.\n\n링컨 원정을 고민하던 사람에게는 돈과 귀가편이 동시에 문제였다. 1월 말이면 다들 지갑이 얇아져 표를 구하기는 쉬울 수 있지만, 자신은 이미 가 본 구장이라 망설여진다고 했다. 매번 비슷한 팀들을 상대하는 지루함 속에서 사람들이 그나마 기대하던 원정인데, 집이 있는 동네까지 돌아오는 기차가 없다는 것이다.\n\n그래도 완전히 접지는 않았다. 그때까지 팀이 좀 나아진다면 차를 몰고 올라가고, 다른 사람도 적어도 한 명쯤 설득할 수 있지 않을까 했다. 이 원정의 참석 여부는 열정 하나로 결정되지 않는다. 이미 방문한 구장인지, 월말 통장에 여유가 있는지, 밤에 돌아올 수 있는지, 무엇보다 팀이 그 수고를 하고 싶게 만드는지까지 함께 작용한다.\n\n이 대목에서 ‘중계에 맞춘 일정 변경’은 추상적인 불만이 아니다. 주중 원정의 피로가 금요일까지 이어지고, 재미있을 줄 알았던 새 상대와의 경기가 운전자를 구해야 하는 일정으로 바뀌는 일이다. 댓글은 자신이 결국 갈지 말지 결론 내리지 않은 채 멈췄다. 팀이 반등하면 다시 마음이 움직일 여지를 남겨 둔 것이 더 현실적이었다.\n\n### 재계약 소식에는 냉소, 돌아온 사람에게는 인사\n\n케인의 바이에른 재계약 소식은 종합 글타래에서 토트넘 복귀 가능성이 사라졌다는 문장으로 전해졌다. 계약은 실제로 2029년 6월까지 연장됐다. 바이에른이 11월 5일 발표한 내용이다. [바이에른 공식 재계약 발표](https://fcbayern.com/en/news/2026/11/harry-kane-extends-with-fc-bayern-until-2029)\n\n돌아온 답은 케이티 페리와 전남편이 재결합하지 않겠다고 하는 것만큼 놀라운 소식이라는 비꼼이었다. 별도의 연예 뉴스가 아니라, 이미 기대하지 않았다는 뜻으로 끌어온 비교다. 이 두 댓글만으로 토트넘 팬들이 얼마나 실망했는지는 말할 수 없다. 복귀설에 더는 설렐 마음이 없는 반응 하나가 남았을 뿐이다.\n\n그보다 훨씬 오래 자리를 차지한 것은 한 에버턴 팬의 복귀였다. 오랫동안 보이지 않던 사람이 새 계정으로 돌아오자, 종합 경기 글타래의 흐름이 한동안 환영 인사로 바뀌었다. 그동안 죽은 줄 알았다는 과장된 농담이 이어졌고, 사후 세계가 어떠냐는 질문까지 붙었다. 당사자는 아이들이 있어서 죽음이라면 끊임없는 질문에서 잠시 쉬는 시간이겠다고 받아쳤다.\n\n환영은 끝까지 점잖지만은 않았다. “돌아오길 골랐을 에버턴 팬은 아니지만 그래도 좋은 소식”이라는 말이 나오고, 아이가 아버지에게 왜 존재하는 것 말고 아무것도 하지 않는 팀을 응원하느냐고 묻는 가상의 대사도 붙었다. 그래도 그 말들 사이에는 여러 사람의 짧은 안부와 환영이 들어 있었다.\n\n다른 이들은 뉴캐슬을 상대로 잘된 일이 그를 돌아오게 한 것 아니냐며 구단 간 놀림으로 대화를 돌렸다. 이어서는 함께 이야기하던 부재중인 팬들과 새 구장에 대한 기억이 잠시 나왔다. 전에는 서로 잘 맞지 않았던 사람도 그곳을 좋아했을 것이라는 말이 붙으면서, 소란스럽던 분위기가 잠깐 가라앉았다. 개인의 사정이나 신원보다, 함께 경기를 보던 자리가 비었다는 감각이 드러나는 대목이었다.\n\n신입 아스널 팬에게도 비슷한 방식의 환영이 돌아갔다. 1990년대 초부터 응원했다며 축구 이야기를 나누고 싶다는 자기소개에, 평범한 환영 인사가 먼저 붙었다. 곧이어 옛 이용자의 아들이 아니냐며 운영진에게 조사를 요청하는 농담이 나왔다. 신입을 둘러싼 실제 의혹이 아니라, 새 사람이 들어오자마자 오래된 내부 농담에 끌어들이는 반응이었다.\n\n이번 종합 수다에서는 기록적인 아홉 골도, 금요일의 반등도, 새 공격수를 향한 기대도 오래 독점권을 갖지 못했다. 다음 경기 이야기 사이로 기차편과 장모님 댁의 TV가 들어오고, 누군가 돌아오면 여러 구단 팬이 잠시 경기를 멈추고 말을 건넸다. 금요일 밤 자기 팀의 일을 끝낸 사람은 이제 남의 경기에서 벌어질 고통을 기다렸다. 다음 차례가 누구일지는 아직 토요일과 일요일에 남아 있었다.\n\n<details><summary>범위와 근거<\/summary>\n\n이번 실행에 제공된 Not606 10개 글타래만 팬 반응의 근거로 사용했다. 수집 표기상 새 글은 147개, 익명 작성표시는 26종이며 실제 이용자 수를 뜻하지 않는다. 종합 경기 글타래 80개와 범죄 관련 잡담 36개가 대부분을 차지한다. 원고는 축구 대화와 관련 생활·교류 장면을 중심으로 구성했으며, 범죄 사건 잡담은 별도 기사로 확장하지 않았다.\n\n경기 결과·득점 장면·계약·일정은 본문에 연결한 구단 및 UEFA 자료로 확인했다. 공식 자료는 게시판 반응의 사실관계를 보충하는 데 사용했고, 별도로 찾은 팬 반응을 섞지 않았다. 이적설, 라이스의 대표팀 결장 예상, 다음 상대 감독에 대한 계산은 각각 게시판의 소문·추측·의견이다. 전술 설명의 대상과 일부 경기 불만의 대상 구단은 문맥이 부족해 특정하지 않았다.\n\n‘PGMOL apology league’의 새 글은 표현을 고칠 수 있었다는 말에 다시 해 보라고 답한 한 건뿐이어서 판정 논쟁으로 확대하지 않았다. 종합 글타래 마지막의 ‘Pretty impressive…’도 대상이 잘려 있어 앞선 경기의 평가로 연결하지 않았다. 수집에 등장한 대표팀 은퇴와 감독 사임 등의 소식은 이번 원고에서 별도 화제로 다루지 않았다.\n\n한국 시각 11월 7일 새벽·아침의 금요일 경기 대화는 영국 현지 11월 6일 저녁·밤에 해당한다. 본문의 반응 규모는 제공된 댓글 범위에 한정하며 Not606 전체 여론으로 환산하지 않았다.\n\n<\/details>\n\n## FootballForums | 영국\n\n이번에는 제공된 11월 5~7일 표기 글타래 10개를 읽었다. 수집 집계는 새 글 144개다. 대화의 중심은 챔피언십 15라운드, 특히 더비–볼턴전 전후의 급격한 기류 변화와 TV 중계 때문에 다시 짜야 하는 원정 계획이었다.\n\n**개관**\n\n- **더비 3–1 볼턴:** 공식 결과가 확인된 경기. 전반에는 더비의 무기력이 도마에 올랐지만, 후반 초반 역전 뒤에는 볼턴의 수비와 팬들의 자존심을 둘러싼 말싸움으로 번졌다.\n- **중계 시간 변경:** 여러 구단 팬이 이동 시간과 휴가, 술자리 계획을 놓고 불평했다. 금요일 밤 경기를 반기는 반응도 있어, 같은 변경의 손익이 선명하게 갈렸다.\n- **원정석과 경기장 맥주:** 매진인데 빈자리가 생기는 이유를 충성도 제도에서 찾는 이야기, 플라스틱 컵과 경기장 안의 진짜 펍을 비교하는 이야기가 이어졌다.\n- **맨체스터 시티와 이적설:** 재정 사건을 둘러싼 분노가 홀란의 장기 계약 의혹으로 확장됐다. 공식 발표로 확인되는 계약 기간과 팬들이 추측하는 별도 지급·이탈 조건은 구분했다. 뉴캐슬의 윌 랭크셔 관심설은 이번에도 게시글 하나뿐이다.\n\n---\n\n### 전반에 더비를 비웃었다가, 후반에는 볼턴이 웃음거리가 됐다\n\n더비 원정을 앞둔 볼턴 쪽 첫마디부터 낙관적이지 않았다. 더비에 가면 늘 진다는 푸념에, 이번 시즌 임대 선수들이 만족스럽지 않다는 불평이 붙었다. 사무엘 일링주니어와 ‘동’으로 불린 선수를 빼면 조금 나아질 것 같다는 식이었다. 상대의 약점을 찾기 전에 자기 팀 선발 명단부터 걱정하는 원정이었다.\n\n반대편에도 여유는 없었다. 별도의 감독 거취 글타래에서는 더비가 결단을 미룰수록 강등 자리가 사실상 두 개나 정해지는 것 아니냐는 말이 나왔다. 그래도 더비에는 빠져나올 선수단이 있다는 반론에, 더비 쪽은 부상자들이 돌아와야 가능한 이야기라며 수비진의 공백을 열거했다. 게시판에 올라온 부상 기간을 그대로 확정할 수는 없지만, 경기를 기다리는 팬이 어떤 상태였는지는 분명하다. 정상적인 수비 조합을 꾸리는 일부터 막혀 있다고 느꼈다.\n\n경기가 시작되자 그 불안은 곧 조롱의 재료가 됐다. 더비가 선수가 없다고 하더니 몸 푸는 사람은 50명쯤 된다는 과장, 셰인 더피가 공만 만지지 않으면 수비를 잘 붙들고 있다는 비꼼이 올라왔다. 수비 부상은 이해하겠는데 공격까지 이토록 무기력할 수 있느냐는 반응도 있었다. 전반만 보면, 더비를 걱정하던 사람들이 괜한 걱정을 한 듯한 분위기였다.\n\n볼턴이 먼저 득점했다. 그러나 후반이 시작되자 대화의 방향이 거의 실시간으로 뒤집혔다.\n\n“말이 너무 빨랐네. 전반을 지배해 놓고 후반 첫 1분에 실점하다니.”\n\n곧바로 다른 댓글이 붙었다.\n\n“그리고 후반 4분에도.”\n\n공식 경기 기록에서도 이 짧은 간격이 확인된다. 더비는 후반 시작 43초 만에 라이언 니암베의 골로 동점을 만들었고, 이어 잭 로빈슨이 역전했다. 추가시간에는 리안 브루스터가 쐐기를 박았다. 3–1 승리로 더비의 리그 10경기 무승이 끝났다. 니암베에게는 성인 무대 311경기를 기다린 첫 골이었다. [EFL 경기 보고](https://www.efl.com/news/2026/november/06/derby-county-fight-back-to-beat-bolton-wanderers-and-end-winless-run/)\n\n이날 더비 팬이 승리를 묘사한 방식에도 그 절박함이 묻었다. 이겼다는 것만으로도 드문데, 뒤집어서 이겼고, 세 골이나 넣었으며, 심지어 니암베까지 골을 넣었다는 나열이었다. 상대를 놀리는 문장으로 시작했지만 끝은 달랐다. 경기력이 좋지는 않았어도 자신감이 바닥인 지금은 무엇이든 받아야 한다는 반응이었다. 하프타임에는 겁이 났지만 선수들이 버텨 줬고, 홈에서 이겼다는 사실이 좋았다.\n\n볼턴 쪽은 같은 경기를 받아들이기 훨씬 어려웠다. 더비에서 결과를 가져올 이보다 좋은 기회가 또 있겠느냐는 탄식이 나왔다. 상대 골키퍼의 선방을 원망하자, 후반만 봤다는 다른 팬은 볼턴 골키퍼도 추가 실점을 막는 좋은 선방을 했다고 짚었다. 한쪽에는 놓친 기회가, 다른 쪽에는 이미 더 벌어질 수도 있었던 점수가 보였다.\n\n경기 뒤 볼턴 팬 한 명은 점유율 72%, 슈팅 18 대 7이라는 수치를 꺼냈다. 이 숫자는 게시글이 제시한 값이지만, 그가 하고 싶은 말은 명료했다. 그렇게 공을 갖고 그렇게 슈팅하고도 크게 졌다는 허탈함이다. 상대 팬에게는 그 숫자가 위안이 되지 않았다. 더비가 대부분의 시간 형편없었어도 결국 이겼다는 한마디가 돌아왔다.\n\n### “강등될 것 같다”는 말과, 그래도 돌아가기 싫은 축구\n\n볼턴을 두고 “내려간다”는 단정이 나오자 곧장 근거를 묻는 반응이 붙었다. 이번 경기의 무엇을 보고 그렇게 확신하느냐는 질문이었다. 돌아온 답은 분석보다 감정에 가까웠다. 그냥 그런 느낌이 들고, 이 게시판에서 그걸 바라는 사람도 많을 것 같다는 말이었다. 옆에서는 “아주 강력한 논거네”라는 빈정거림이 나왔다.\n\n그보다 구체적인 지적도 있었다. 볼턴은 가까스로 살아남을 것 같지만 수비가 너무 나쁘고, 선수 개개인의 기량에서 앞서는 팀들을 매주 상대하면서 지금처럼 경기하는 건 무모하다는 의견이다. 공격적인 방식에 장점이 있어도 크게 얻어맞는 날이 계속 나올 것이며, 자신이 응원하는 팀과 더비 같은 상대에게도 세 골씩 내준다면 조정해야 한다는 주장이었다.\n\n볼턴 쪽 답변은 수비가 괜찮다는 항변이 아니었다. 이날은 따라가야 했으니 밀어붙일 수밖에 없었고, 결국 3–1로 지거나 2–2가 되는 경기였다는 설명이었다. 그리고 필 파킨슨 시절의 축구를 46경기 내내 보는 것보다는 이쪽이 낫다고 했다. ‘파키’라는 애칭으로 불리는 옛 감독을 거론하면서도, 그 시절 경기 방식에는 아주 거친 표현을 붙였다.\n\n이 대목에서 의견이 갈리는 지점이 드러난다. 상대 팬은 현재 방식으로 감당할 실점의 크기를 본다. 볼턴 팬은 그 위험을 줄이겠다고 되돌아갈 축구가 무엇인지부터 생각한다. 한 번의 역전패가 수비 전술에 대한 토론이면서 동시에, 어떤 축구를 견디며 한 시즌을 보낼 것인가에 대한 선택이 됐다.\n\n다만 그 대화는 오래 유지되지 못했다. 볼턴이 질 때마다 다른 구단 팬들이 유난히 즐거워한다는 불만이 터졌고, 찰턴과 브리스톨 시티를 깎아내리는 말이 붙었다. 상대는 볼턴 팬들의 자존심이 너무 쉽게 상한다고 받아쳤다. 곧 프로필 사진을 실제 작성자의 모습으로 오인한 외모 공격까지 이어졌다. 뒤늦게 그 사진이 앨런 커비슐리가 등장하는 패디파워의 패러디 광고 장면이라는 설명이 나오면서, 공격한 쪽이 오히려 놀림을 받았다.\n\n그 와중에 오래전 볼턴 원정에서 상대 팬에게 강등 조롱을 당한 기억을 꺼내는 사람도 있었다. 지금 볼턴의 패배가 좋은 이유를 설명하며 과거의 한 장면을 소환한 것이다. 수집된 댓글만으로 게시판 전체가 볼턴을 싫어한다고 할 수는 없다. 다만 이날 말싸움에는 방금 끝난 경기만 들어 있지 않았다. 이전 경기장에서 받은 약, 구단의 위상에 대한 자부심, 누가 먼저 놀렸는지에 대한 기억이 함께 올라왔다.\n\n“볼턴이 꼭 잔류했으면 좋겠다. 이런 훌륭한 말싸움을 몇 시즌은 더 봐야 하니까.”\n\n경기를 마무리한 축하보다 이 농담이 이날 게시판의 끝맛에 가까웠다. 더비에는 기다리던 승리가, 볼턴에는 놓친 승점과 또 하나의 시끄러운 밤이 남았다.\n\n### 토요일 오후 3시가 사라지면, 누구의 주말이 움직이나\n\n챔피언십 일반 대화에서는 경기 시간 변경이 큰 덩어리를 차지했다. 어떤 팬은 이번 중계 선정 구간에 일곱 경기가 옮겨졌다고 했고, 다른 팬은 두 경기만 토요일 이른 시간으로 바뀌었다며 대성공이라고 반겼다. 네 경기, 다섯 경기라는 보고도 뒤따랐다. 각자가 자기 구단 일정을 놓고 셈한 숫자들이다.\n\n중계로 일정이 움직이는 것 자체는 현재 계약의 일부다. EFL의 안내에는 토요일 12시 30분과 금요일 밤을 비롯한 여러 정규 편성 시간이 명시돼 있다. 이번 시즌에는 11월 6일까지 이듬해 3월 2~3일 주중 경기까지의 방송 선정을 발표하도록 예고돼 있었다. 한 번에 겨울 일정 여러 개를 받아든 팬들이 동시에 달력을 다시 펼친 배경이다. [EFL 중계 안내](https://www.efl.com/how-to-watch/sky-sports-q-and-a/), [2026/27 방송 선정 일정](https://www.efl.com/news/2026/april/10/efl-fixture-release-day-confirmed-for-2026-27-season/)\n\n불만은 “우리 경기를 왜 굳이 보여 주느냐”는 자학으로 시작했다. 노리치 원정이 일요일 정오, 미들즈브러전이 금요일 밤으로 잡혔고 2월의 토요일 오후 3시 경기가 전부 옮겨졌다는 팬은, 중립 시청자 중 누가 자기 팀을 보고 싶어 하겠느냐고 물었다. 자기 팬들도 경기 보기를 꺼리는 형편이라는 것이다.\n\n비슷한 처지의 다른 팬은 반대로 말했다. 중립 팬들이 지금 우리 팀이라는 진귀한 구경거리를 놓쳐서는 안 되니 이해한다, 우리는 보는 즐거움이 있는 팀이라는 비꼼이었다. 그러자 방송사가 시즌 막판에 자기 팀을 틀지 않아도 되도록 의무 편성분을 미리 소진하는 것 아니냐는 추측까지 나왔다. 실제 편성 의도에 대한 정보는 아니지만, 팬들이 자기 팀의 부진과 방송 노출을 한꺼번에 소화하는 방식이었다.\n\n그 뒤에는 훨씬 현실적인 손익 계산이 있었다. 브리스톨에서 주말을 보내려던 계획은 금요일 경기 뒤 토요일 아침에 일어나야 하는 일정이 되자 매력을 잃었다. 금요일 오후 원정은 퇴근 시간 교통과 겹치고 휴가도 필요하다. QPR 원정과 스완지 원정이 12시 30분, 미들즈브러 원정이 금요일 밤이라는 목록에는 항목마다 실패를 뜻하는 이모티콘이 붙었다. 경기 시간 세 줄이 곧 이동의 난도 세 줄이었다.\n\n반면 홈 팬에게 금요일 밤은 괜찮은 선택이 될 수 있었다. 애슈턴 게이트의 요즘 토요일 오후 분위기는 좋지 않으니, 실제 현장 경험으로는 금요일 밤이 더 낫다는 의견이 나왔다. 승격 경쟁 상대와 붙는 날이면 관중도 더 달아오를 것이라는 기대가 이어졌다. 미들즈브러 경기를 앞두고 일찍 퇴근해 술을 마시겠다는 말에는, 근처에 사는 다른 팬이 나중에 연락하면 경기 전에 만나자고 답했다.\n\n누군가는 QPR전이 금요일로 가서 토요일 아이스하키를 보러 갈 수 있게 됐다. 어차피 가지 않을 원정 세 경기가 움직이는 것은 자신에게 별문제가 아니었다. 다른 사람은 이른 토요일보다 수요일 경기가 더 큰 문제라고 했다. 특히 주중 경기 뒤 토요일 이른 킥오프까지 이어지면 부담이 커진다는 반응이었다.\n\n그래서 토요일 오후 3시를 지켜 냈다는 기쁨도 구체적이었다. 한 팬에게 볼턴 원정은 이번 시즌 리그에서 유일하게 아직 가 보지 못한 구장이었다. 다른 팬은 볼턴에 간 지 너무 오래돼 그 사이 ‘새’ 경기장으로 옮겨 갔다며 웃었다. 오래 기다린 방문을 정상적인 시간에 할 수 있다는 것만으로 중계 선정 결과가 만족스러웠다.\n\n울브스 원정을 기대하는 팬은 수십 년 만의 방문이라는 감회보다 먼저 직통 열차와 역에서 구장까지의 짧은 도보 거리를 챙겼다. 주변에서 경기 전 술 마시기 어렵다는 이야기를 들은 다른 팬은 차라리 킥오프 직전에 도착하고, 경기 뒤 버밍엄에서 마시면 된다고 계획을 세웠다. 중계 시간 논쟁은 결국 축구가 있는 하루를 어디서 시작하고 어디서 끝낼지에 대한 대화였다.\n\n### 매진인데 왜 비어 있나: 원정 충성도를 유지하는 표\n\n원정 관중 집계 글타래에서는 판매량과 실제 입장객 수가 부딪쳤다. 표는 그만큼 팔렸더라도 현장에는 850~900명 정도였을 수 있다는 말에, 한 팬이 반문했다. 그렇다면 250명가량은 찰턴에 돈만 주려고 원정표를 샀다는 뜻이냐, 직접 세기라도 했느냐는 것이다.\n\n이에 다른 구단 팬이 그런 일은 자기 팀에서도 흔하고 자신도 해 본 적 있다고 답했다. 몇 주 뒤 수요일 밤 번리 원정이 ‘매진’이지만 실제 원정석은 꽉 차지 않을 것이라는 예상도 붙였다. 그가 지목한 것은 원정 티켓 구매 이력에 따라 우선권을 유지하는 제도였다. 다음에도 표를 구할 순서를 지키려고, 가지 못할 경기의 표까지 사는 일이 생긴다는 설명이다.\n\n여기서 공방은 원정 열정의 크기를 겨루는 익숙한 숫자 싸움에서 조금 벗어났다. 판매 집계가 틀리지 않아도 좌석은 빌 수 있다. ‘매진’은 구단이 가진 표가 소진됐다는 뜻이지만, 팬이 눈으로 확인하는 것은 그날 그 자리에 앉은 사람이다. 표를 산 이유까지 같다고 볼 수도 없다.\n\n노리치 원정표 배분을 두고도 비슷한 마찰이 있었다. 상대 구단이 2,000석을 약속했다는 이야기가 돌자, 홈 쪽 팬은 해당 스탠드 전체도 그만한 규모가 아니라며 강하게 반박했다. 이번 자료만으로 약속이나 정확한 배정량을 확정할 수는 없다. 확인되는 것은 우선권 제도에서 생긴 불만이 상대 구단의 배정 설명에 대한 의심으로 번졌다는 점이다.\n\n같은 글타래 한쪽에는 주말 원정석의 판매 현황이 계속 올라왔다. 매진 여부 옆에 종이표인지 디지털 표인지, 당일 현장 판매가 있는지 없는지가 나란히 적혔다. 숫자를 자랑하는 판인 동시에, 다음 날 실제로 출발할 사람에게 필요한 실무 게시판이기도 했다.\n\n### 렉섬을 벌주려면 맥주부터? 전술 이야기가 바에서 끝난 밤\n\n앞선 라운드 대화는 렉섬의 경기력을 두고 출발했다. 이번 시즌 별로 좋아 보이지 않았는데도 사우샘프턴과 미들즈브러를 잡았다니 이상한 리그라는 반응이었다. 여름에 그만큼 돈을 썼으면 가끔은 이기겠지 하는 빈정거림도 붙었다. 현장에서 미들즈브러 경기를 본 팬은 렉섬의 대인 압박에 자기 팀이 공을 제대로 돌리지 못했고, 첫 터치도 좋지 않았다고 복기했다.\n\n그런데 답글 하나가 흐름을 완전히 바꿨다.\n\n“렉섬 라거는 마셔 봤어? 그걸 판다는 이유로 승점 삭감을 받아야 할 맛이던데.”\n\n징계 주장이 아니라 맥주 맛을 혹평하는 농담이다. 여기서부터 공을 어떻게 돌렸느냐보다 경기장에서 제대로 된 한 잔을 마실 수 있느냐가 더 오래 논의됐다. 정작 질문을 받은 현장 관람자는 운전해야 했고 줄도 너무 길어서 마시지 않았다고 답했다.\n\n다른 팬은 렉섬의 해당 구역에서 주문하기도 어렵고 전자 주문 설비도 제대로 작동하지 않는다며, 경기 전에 시내에서 몇 잔 마시는 편이 훨씬 쉽다고 했다. 곧 경기장 맥주 전반의 문제로 커졌다. 플라스틱 컵에 담긴 라거를 맛있게 마신 기억이 없다는 사람, 토트넘 원정의 비버타운과 플리머스의 샤프스는 괜찮았다는 사람이 나왔다. 최근 지은 구장에서는 대체로 나아졌다는 평가도 있었다.\n\n애슈턴 게이트 주변 펍 이야기에는 선택지가 더 좁아졌다. 한 팬의 설명으로는 경기 날 가까운 펍들도 경찰 요구 때문에 플라스틱 컵을 써서, 유리잔을 원하면 더 멀리 가야 한다는 것이다. 반대로 구장 바깥 새 판매 차량에서 기네스를 괜찮게 마셨다는 경험도 나왔다. 같은 경기장을 다녀와도 어디서 주문했는지에 따라 평가가 갈렸다.\n\n그러다 한 팬이 자기 구역의 환경을 자랑했다. 제대로 된 기네스 생맥주가 있고, 자신은 하프타임에 브랜디 더블을 마시곤 한다는 말이었다. 플라스틱 컵의 스타우트라니 끔찍하겠다는 답글에 그는 바로 반문했다. 누가 플라스틱이라고 했느냐고.\n\n그의 설명 속 구장에는 실제 펍이 세 곳 있었다. 자신이 이용하는 곳은 관중석 뒤편, 일반 통로 위쪽으로 길게 자리했고, 아이들을 위한 인터랙티브 다트와 게임 기기뿐 아니라 술이 갖춰진 바와 유리잔도 있었다. 반대쪽에서는 컨테이너 형태의 바와 플라스틱 컵을 쓴다며 은근한 좌석 구역 자랑까지 곁들였다. 구단 이름이 명확히 드러나지 않는 대목이라 특정 구장의 공식 시설 안내로 옮길 수는 없지만, 그가 누리는 하프타임의 우월감만큼은 잘 전달됐다.\n\n사진이 보이지 않는다는 팬은 그게 정말 일반 통로 안이냐고 물었다. 답은 통로와 구분된 펍이라는 것이었다. 큰 화면이 있고, 문을 닫을 수 있으며, 관중석으로 향하는 쪽은 유리를 불투명하게 처리해 경기장이 보이지 않는다고 설명했다. 법적 허용 조건을 확인한 답변은 아니지만, 대화 상대가 궁금해한 ‘경기장 안에서 어떻게 그런 공간이 가능하냐’에 대한 그의 이해였다.\n\n애슈턴 게이트 팬은 자기 구장에도 그런 곳이 있고 경기를 화면으로 틀어 준다면, 하프타임이 끝나도 자리로 돌아가지 않을 것 같다고 했다. 맥주 때문에 승점을 깎아야 한다던 이야기는, 후반전 관중석 복귀를 방해할 만큼 좋은 바가 부럽다는 고백으로 끝났다.\n\n### 선수의 값보다 먼저 따지는 것, 그 선수를 어디에 쓸 건데\n\n여름 이적설 글타래에는 새 거래 소식보다 지난 여름의 판단을 다시 따지는 글이 올라왔다. 좋은 시즌을 보낸 하부리그 선수들 중 누가 상위 무대에서도 통할지, 누가 이적료를 남길 수 있을지를 두고 공방이 이어졌다.\n\n애덤 리치를 유망한 자산처럼 묶어 언급한 듯한 발언에는 나이를 확인하라는 반박이 붙었다. 다른 선수들을 한데 비교하는 대목에서는 공격수와 공격형 미드필더를 같은 득점 기준으로 재단해도 되느냐는 문제가 나왔다. 처음에는 누가 선수를 더 잘 알아봤는지 다투는 전형적인 논쟁처럼 보였다.\n\n하지만 잭 모일런 이야기에서 질문이 조금 구체적으로 바뀌었다. 그가 카디프의 경기 방식 덕을 보고 있다는 의견, 해당 구단에는 이미 스콧 트와인이 그 자리에 있다는 지적이 나왔다. 선수를 데려왔다고 같은 성적이 따라오는 것은 아니라는 이야기다. 잘하는 선수라는 평가와 우리 팀에 필요한 선수라는 판단 사이에 선발 자리가 놓였다.\n\n감독 평가도 비슷한 방향으로 흘렀다. 마이클 스쿠발라가 링컨에서 만든 성과는 인정하면서도, 그 방식이 더 높은 수준에서도 통할지에는 회의적인 반응이 있었다. 한 팬은 브라이언 배리머피의 방식이 상위 무대로 옮기기 더 쉽다고 봤다. 다른 팬은 스쿠발라의 축구가 너무 지루하다며 브리스톨 시티가 더 흥미로운 선택을 해야 한다고 주장했다. 어디까지나 이 글타래 참여자들의 평가이지, 감독의 향후 경로를 입증하는 자료는 아니다.\n\n링컨을 이야기하는 쪽에서는 오히려 구단 환경을 강조했다. 지난 10년 동안 팀을 떠난 선수 중 높은 이적료를 남기거나 이후 크게 도약한 경우가 많지 않았다는 회고였다. 브렌트퍼드·본머스·브라이턴을 예로 들면서, 선수나 감독을 평가할 때 안정된 구단 운영이 만드는 차이도 봐야 한다고 했다. 감독 한 명을 떼어 놓고 성공과 실패를 비교하던 대화가, 그 성과를 가능하게 한 구단까지 넓어졌다.\n\n일반 대화에 올라온 렉섬 경영진 교체 소식도 같은 문제를 다른 쪽에서 건드렸다. 마이클 윌리엄슨의 퇴임과 숀 하비의 최고경영자 대행 복귀는 구단 성명을 인용한 보도로 확인된다. [City AM의 구단 성명 보도](https://www.cityam.com/goodbye-to-wrexham-ceo-williamson-replaced-by-non-nonsense-harvey/)\n\n게시글 두 개는 이적 정책과 선수 등록, 티켓·멤버십 문제, 지역사회와 멀어진 느낌을 함께 거론했다. 이 항목들이 공식적인 퇴임 사유로 발표됐다는 뜻은 아니다. 팬들은 인사 소식을 자신들이 겪은 불편과 연결해 읽었다. 한쪽에서는 최근 구단과 거리감이 생겼다고 했고, 다른 쪽에서는 구단주들이 여전히 팬의 말을 듣고 짧은 시간 안에도 큰 결정을 한다는 신뢰를 표시했다. 같은 교체 소식에 운영에 대한 불만과 소유주에 대한 기대가 함께 담겼다.\n\n### 시티의 장기 계약, 누구에게는 잔류 의지이고 누구에게는 의혹이다\n\n맨체스터 시티 글타래는 제목부터 ‘특별 대우’를 문제 삼는 곳이다. 이번 새 글 14개도 시티에 대한 강한 불신이 바탕이었다. 리그에서 내보내라는 요구 뒤로 선수들이 이중 계약의 의미를 몰랐을 리 없다는 주장, 전성기의 세계적인 선수들을 지키면서 어떻게 공개된 급여 총액은 그 정도였겠느냐는 의문이 이어졌다.\n\n사건의 공식적인 바탕은 있다. 프리미어리그는 9월 29일 독립위원회가 2009/10~2017/18시즌의 중대한 재정 규정 위반 등을 인정했다고 발표했고, 제재는 별도 심리에서 다루도록 설명했다. 시티는 10월 2일 구단 성명을 통해 항소를 제기했다고 밝혔다. 이 확인이 곧 게시글에 나온 개별 선수의 별도 보수 의혹까지 입증하는 것은 아니다. [프리미어리그 발표](https://www.premierleague.com/en/news/4727779/premier-league-statement-manchester-city-fc), [구단 항소 성명을 전한 AP](https://apnews.com/article/305a9d48b57458433efb578ed1a6103f)\n\n홀란은 그 불신을 설명하는 대표 사례로 소환됐다. 도르트문트의 바이아웃보다 훨씬 싸게 데려온 것이 수수께끼라는 글이 올라오자, 다른 팬은 애초에 그렇지 않았다며 정면으로 반박했다. 이 글타래 안에서도 의혹의 전제가 그대로 받아들여진 것은 아니다.\n\n장기 재계약을 보는 눈도 갈렸다. 한쪽은 세계 최고급 공격수가 전성기로 들어가면서 그렇게 긴 계약을 순순히 맺는 일을 수상하게 봤다. 계약을 끝까지 끌고 가거나 1~2년만 연장하면서 선택지를 볼 수도 있었는데, 사실상 선수 경력을 맡긴 결정이라는 주장이다. 여기에 사우디 수준의 돈을 장부 밖에서 받는 것 아니냐는 추정까지 붙었다. 이번에 확인한 자료에는 그 추정을 뒷받침하는 근거가 없다.\n\n다른 쪽은 갈 곳의 문제를 꺼냈다. 파리 생제르맹에는 잘 맞지 않을 것 같고, 레알 마드리드에는 음바페가 있으며, 바르셀로나가 홀란을 후불결제 서비스로 살 수는 없다는 농담이었다. 클리어페이와 클라르나를 거론한 문장은 바르셀로나의 구매력을 비꼰 말이지 실제 협상 방식에 관한 정보가 아니다. 논쟁 중에는 2022년 최초 영입을 말하는지, 이후 재계약을 말하는지부터 서로 어긋나기도 했다.\n\n확인되는 계약의 끝은 2034년 여름이다. 시티의 공식 재계약 발표에 명시돼 있다. [맨체스터 시티 계약 발표](https://www.mancity.com/news/mens/erling-haaland-10-year-manchester-city-contract-63872694)\n\n여기서 대화가 익숙한 가정으로 넘어갔다. 시티가 프리미어리그나 챔피언스리그에 나가지 못할 정도의 징계를 받으면 바르셀로나도 감당할 만한 금액으로 홀란을 데려올 수 있지 않겠느냐는 말이었다. 긴 계약을 잔류 의지로 읽는 반응에는 이탈 조항이 있을 수도 있고 시티도 큰 이적료를 받을 것이라는 추측이 맞섰다. 이번 자료에서 그런 불참이나 낮은 이적료, 탈출 조항은 확정된 사실이 아니다.\n\n마지막 댓글은 계약의 세부에서 팬으로 시선을 돌렸다. 선수와 에이전트가 손해 보는 경우는 드물고, 어느 구단이든 잃는 사람은 팬이라는 말이었다. 시티가 무엇을 받아야 하는지로 출발한 글타래가, 어떤 결말이 나도 선수에게는 다음 계약이 있지만 팬에게는 자기 구단이 남는다는 감정으로 닫혔다.\n\n### 경기를 기다리는 사람들의 작고 뒤틀린 자신감\n\n주말 경기 전 대화에도 패배를 미리 다루는 여러 방식이 있었다. 사우샘프턴을 상대하는 쪽에서는 자기 팀이 얼마나 나쁜지 직접 보면 알 거라며 상대 승리에 돈을 걸겠다는 반응이 나왔다. 적어도 팀이 못하는 동안 수익은 난다는 자학이었다. 득점자로 루이스 도빈까지 고르자, 선발은 다른 선수가 될 수 있다며 즉시 축구적인 반론이 붙었다. 패배를 예상하는 마음과 선발을 따지는 습관은 별개로 작동했다.\n\n사우샘프턴 쪽 대화에서는 플린 다운스와 라이언 매닝이 경고 누적에 가까워졌다는 팬들의 계산이 나왔다. 더 까다로운 상대를 앞두고 빠지느니 자신들이 만만하게 보는 경기에서 한 번 쉬는 게 낫다는 식이었다. 선수가 고의로 경고를 받기로 했다는 정보가 아니라, 팬들이 앞으로의 대진을 놓고 굴리는 시나리오였다.\n\n스완지를 홈으로 맞는 팬은 부상 여파와 얇은 대체 자원을 걱정하면서 대표팀 휴식기가 빨리 왔으면 했다. 그러면서 최근 자기 예측이 틀리는 덕을 보고 있다며 이번에는 1–3으로 질 것 같다고 적었다. 예상을 내놓는 형식을 빌려 반대 결과를 비는 미신이다. 다른 곳에서는 정오 무렵 킥오프가 분위기를 죽인다며, 직전 경기만 한 강도로 또 강팀을 상대할 힘이 있을지 모르니 무승부면 당장 받겠다는 반응도 나왔다.\n\n이적시장 글타래의 하루치 새 글은 단 하나였다. 더 선이 뉴캐슬의 1월 윌 랭크셔 영입 관심을 보도했다는 전달에, 작성자는 자기도 문워크를 하고 싶지만 인생이 그렇게 호락호락하지 않다는 농담을 붙였다. 관심이 있다는 것과 실제로 성사된다는 것 사이를 한 문장으로 벌려 놓았다.\n\n랭크셔는 7월 22일 토트넘이 미들즈브러와 이적 합의를 발표한 선수다. 이번에 확인한 공식 자료로 뉴캐슬의 제안이나 협상을 말할 수는 없다. 관심설을 전한 글 하나에 달린 냉소로 남겨 두는 것이 이 소식의 크기에 맞는다. [토트넘의 미들즈브러 이적 발표](https://www.tottenhamhotspur.com/news/1079320/lankshear-on-the-move-to-boro)\n\n<details><summary>범위와 근거<\/summary>\n\n이번 원고는 제공된 FootballForums 글타래 10개의 발췌만으로 팬 대화를 구성했다. 제공 집계는 새 글 144개, 발췌 약 37,670자이며, 익명 작성표시 42종은 실제 이용자 수가 아니다. 글타래별 누적 답글 수는 이번 회차 반응의 규모로 사용하지 않았다. 표기 시각은 제공 자료를 따랐고, 더비–볼턴전은 영국 현지 11월 6일 경기로 구분했다.\n\n중심 자료는 ‘Matchday 15’, ‘General Championship chat’, ‘Matchday 13 + 14’다. 원정표, 여름 이적 논쟁, 감독 거취, 시티 사건, 다음 이적시장 글타래를 함께 읽었다. 짧은 강등 논쟁과 베팅 글도 범위에 포함되지만 별도 이야기를 만들 만큼 확장하지 않았다. 본문에 내용이 제공되지 않은 사진·영상은 장면을 추정해 묘사하지 않았다. \n\n경기 결과와 득점 경위는 본문에 연결한 EFL 기록으로 확인했다. 더비 구단 경기 보고는 제목에 2–1, 본문에 3–1이 혼재해 결과 판단에는 EFL 기록을 사용했다. 중계 편성의 일반 배경은 EFL 공식 안내로 확인했으며, 팬들이 열거한 개별 변경 경기 전체를 공식 일정으로 재검증한 것은 아니다. 원정표 구매 동기, 경기장 주류 시설, 구단 운영에 대한 평가는 게시글의 경험·주장으로 전했다.\n\n시티 사건은 9월 29일 리그 발표와 10월 2일 항소 성명 보도를 날짜에 귀속해 사용했다. 현재의 최종 제재나 항소 결론을 확정하지 않았다. 홀란의 계약 기간과 랭크셔의 여름 이적은 각 구단 공식 발표로 확인했다. 공개 출처는 제공 자료의 사실 확인에만 사용했으며, 그곳의 추가 팬 반응을 원고에 섞지 않았다.\n\n<\/details>\n\n## transfermarkt | 독일\n\n이번에는 11월 5~7일 수집된 독일어 Transfermarkt 포럼 46개 글타래, 새 글 263개의 제공 발췌를 읽었다. 바이에른과 도르트문트 구단 판의 비중이 크며, 아래 이야기는 이 범위에서 포착한 대화다. 11월 7일 리그 경기를 앞둔 시점의 기대와 논쟁을 담았다.\n\n**개관**\n\n- **바이에른의 축하 자리에는 계산기도 올라왔다.** 케인의 2029년까지 재계약은 공식 확인됐다. 팬들은 잔류를 반기면서도 연봉 비교, 노쇠화, 챔피언스리그 우승이라는 다음 목표를 놓고 말을 주고받았다.\n- **같은 승리의 주역인데, 칼과 라이머의 게시판은 달랐다.** 아틀레티코 원정 2–0 승리에서 두 선수가 득점한 것은 확인됐다. 칼에게는 겸손과 개성의 경계가, 라이머에게는 기술·활동량·수비 통계의 가치가 논쟁거리였다.\n- **도르트문트는 이기고도 평가 기준을 다투고 있다.** 기라시의 엘버스베르크전 결장은 공식 발표됐다. 경기 전 대화에는 대승 기대와 피로 우려가 함께 있었고, 다른 글타래에서는 포백의 폭과 ‘껄끄러운 상대’의 의미까지 따졌다.\n- **복귀와 이적은 서로 다른 속도로 읽어야 한다.** 무시알라의 팀 훈련 복귀는 확인됐지만 구단은 마인츠전 출전이 이르다고 밝혔다. 윙어 영입 금액과 후보군, 다음 시즌 선수단 구상은 보도 인용 및 팬들의 제안이다.\n\n---\n\n### 특별 유니폼이 도착한 날, 케인의 연봉표도 펼쳐졌다\n\n케인 글타래에서 가장 간명하게 행복했던 사람은 재계약 소식을 접한 날 발롱도르 기념 특별 유니폼까지 배송받았다는 팬이었다. 좋은 소식과 택배 도착이 겹쳤다. 길게 설명할 것도 없이 “정말 멋진 날”이었다.\n\n축하의 근거는 분명하다. 바이에른은 11월 5일 케인과 2029년 6월 30일까지 계약을 연장했다고 발표했다. 구단 발표에는 발롱도르 수상도 명시돼 있다. 이번 글타래에서 팬들이 말하는 잔류와 수상은 확인된 소식이다. [바이에른 공식 발표](https://fcbayern.com/en/news/2026/11/harry-kane-extends-with-fc-bayern-until-2029)\n\n20개 새 글의 큰 흐름은 잔류를 반기는 쪽이었다. 재계약 자체가 논쟁 대상일 수 없다는 반응, 지금까지의 활약이라면 지급액 전부가 아깝지 않다는 반응이 이어졌다. 흥미로운 것은 개인상을 구단의 미래와 연결한 대목이다. 한 팬은 이제 올리세도 발롱도르를 받으려고 바이에른을 떠날 필요가 없다고 봤다. 케인의 수상을 ‘여기에서도 세계 최고의 선수가 될 수 있다’는 증거로 받아들인 것이다.\n\n그러나 곧 계약 종료 시점의 나이가 등장했다. 2029년 여름이면 케인은 서른여섯 번째 생일을 앞둔다. 속도에 의존하지 않는 유형이니 오래 갈 것이라는 기대에, 토마스 뮐러도 비슷한 설명을 들었다는 반론이 붙었다. 공간 감각과 독특한 움직임은 나이를 먹어도 남을 것이라 믿었지만, 실제 경기력 저하는 예상보다 급할 수 있었다는 기억이다.\n\n이에 케인의 긴 전진 패스와 대각선 전환까지 뮐러와 같은 범주에 넣을 수 있느냐는 답이 나왔다. 같은 ‘영리한 공격수’여도 공격에 보태는 차원이 다르다는 주장이다. 어느 쪽도 잔류를 싫어하는 것은 아니다. 지금의 케인을 더 오래 믿을 수 있다는 기대와, 좋아하는 선수에게도 노쇠화의 예외 증명서를 써 줄 수는 없다는 경험이 부딪혔다.\n\n연봉 이야기는 더 복잡했다. 글 속에서는 2,500만·3,000만·3,500만 유로가 오갔고, 다른 스타와 비교하려면 기본급 외에 보너스와 계약금을 넣어야 한다는 지적이 이어졌다. 이 액수들은 공식 발표로 확인된 계약 조건이 아니다. 팬들 사이에서도 무엇을 합산한 숫자인지부터 합의되지 않았다.\n\n그런데 바로 그 불일치가 이 포럼다운 장면이다. 한쪽은 구단이 감당 가능성을 계산했을 테니 팬으로서는 활약을 즐기면 된다고 한다. 다른 쪽은 레알 마드리드나 파리와 비교할 때 보너스 구조를 왜 자기에게 편리한 방식으로 가정하느냐고 묻는다. 케인이 돈값을 하느냐보다, 서로 다른 장부에서 꺼낸 숫자로 누가 더 많이 받는다고 말할 수 있느냐가 쟁점이 됐다.\n\n### 세 경기 무득점이 걱정이라는 팬에게 돌아온 패스 한 장면\n\n재계약의 장기 전망과 별개로, 지금의 슈팅을 걱정하는 목소리도 있었다. 최근 슛의 질이 떨어졌고 패스할 때만 부담이 적어 보인다는 평가다. 이에 다른 팬은 마드리드에서 라이머의 추가골을 만든 패스를 끌어와, 이런 일이 계속될까 봐 자신도 걱정이라는 식으로 받아쳤다.\n\n그 장면은 실제로 있었다. 바이에른은 11월 3일 아틀레티코 원정에서 칼과 라이머의 골로 2–0 승리를 거뒀고, 케인은 두 번째 골에 앞서 라이머에게 패스를 연결했다. 골을 못 넣는 공격수라는 불안과 공격 전체를 움직이는 선수라는 신뢰가 같은 경기 안에서 만나는 지점이다. [바이에른 공식 경기 보고서](https://fcbayern.com/de/news/spielberichte/2026/11/spielbericht-champions-league-atletico-madrid-fc-bayern)\n\n마인츠전 글타래에서는 한 팬이 케인이 세 경기째 득점하지 못했다는 사실을 보고 놀랐다고 썼다. 다른 팬은 도르트문트전 페널티킥 실축이 예정에 없던 일이었다며 웃음을 보탰다. 여기서는 팬들이 세어 본 무득점 기간에 대한 대화다. 골이 너무 익숙해지면 잠깐의 공백도 별도 사건처럼 느껴지는 기대 수준이 드러난다.\n\n그렇다고 케인의 임무가 이미 완성됐다는 분위기는 아니다. 발롱도르는 훌륭하지만 챔피언스리그 우승과 같을 수 없다는 글이 있었다. 개인상은 기자들이 선정하고, 선수는 결국 그라운드에서 따내는 우승을 위해 뛴다는 구분이다. 재계약을 반기는 말과 아직 큰 목표가 남았다는 말이 자연스럽게 붙었다.\n\n이 지점에서 디트마어 하만 이야기가 끼어들었다. 팬들은 그가 예전에 케인의 득점력을 낮춰 봤다가 이제는 챔피언스리그 우승 여부로 평가 기준을 옮긴다고 불평했다. 과거 발언의 세부 내용은 이번 확인 범위에서 검증하지 않았지만, 제공된 글에서 반복된 감정은 선명하다. 선수가 무엇을 해도 다음 불합격 조건이 생긴다는 피로감이다.\n\n코치 애런 댕크스 글타래의 두 글도 같은 피로를 다뤘다. 논쟁적인 발언이 나오고, 기자회견에서 당사자에게 반응을 묻고, 그 답변이 다시 기사가 되는 순환이다. 한 팬은 관심을 주지 말자는 생각과 별개로 케인 글타래에서 이미 그 말을 봐 버렸다고 했다. 무시하려는 사람도 반박하면서 유통에 참여한다. 이번 수집본에서는 케인에 관한 축하가 잠시 축구 논평 산업에 대한 짜증으로 흘러갔다.\n\n### 분홍색 옷은 어디까지 축구 이야기가 되는가\n\n칼 글타래는 17개 새 글로, 케인 다음으로 활발했던 선수 개인 글타래다. 출발점은 옷차림과 골 세리머니, 그리고 언젠가 레알 마드리드에서 뛰고 싶다는 발언을 팬들이 어떻게 받아들이느냐였다.\n\n한 팬은 분홍색 람보르기니를 타고 온다고 해도 그게 선수의 문제인지, 그것을 못 견디는 관찰자의 문제인지 되물었다. 이 문장은 논쟁을 밀어붙이기 위한 가정이다. 칼이 실제로 그 차를 몰고 왔다는 장면으로 읽을 필요는 없다. 반면 분홍색 의상과 마드리드전 세리머니는 여러 답글이 함께 거론한 구체적인 대상이었다.\n\n비판하는 쪽이 중요하게 본 말은 ‘Demut’, 겸손이었다. 성공하고 돈을 많이 벌 때도 몸가짐을 낮추는 선수를 좋아하고, 그런 선수에게 구단과의 정체성을 느낀다는 설명이다. 뮐러와 람, 제프 마이어 같은 이름이 그 감정의 배경으로 나왔다. 이제 선수단에 자신과 문화적으로 가깝게 느끼는 인물들이 줄었다는 아쉬움까지 섞였다.\n\n이 반응을 단순히 옷 색깔에 대한 불평으로만 읽으면 논쟁의 절반이 빠진다. 이 팬들에게는 바이에른 선수가 어떤 태도로 성공을 보여 주느냐가 구단을 좋아하는 이유의 일부다. 한 글은 열여덟 살이고 좋은 경기를 치른 경험도 아직 많지 않은 선수가 지나치게 과시한다고 봤다. 다른 글은 레알에 대한 소망이 있어도 입 밖으로 꺼내지 않는 편이 낫다며, 논쟁 자체가 주변을 시끄럽게 만든다고 했다.\n\n반대편은 그 기준이 지나치다고 느꼈다. 옷은 취향이고, 세리머니는 이 정도로 화낼 일이 아니며, 열여덟 살 선수에게 조금 튀는 성격이 있어도 된다는 것이다. 한 팬은 람 같은 유형들 사이에 가끔 여과되지 않은 개성이 있는 것도 좋았다고 썼다. 다른 팬은 아틀레티코 원정에서 선제골을 넣고 한 세리머니와 분홍색 재킷 때문에 이렇게 격해진다면, 바이에른 팬들은 지금 꽤 잘 지내고 있는 셈이라고 받아쳤다.\n\n여기서 ‘겸손한 스타를 본받으라’는 주장은 곧장 다른 선수들의 흠을 열거하는 방향으로 번졌다. 제공된 자료에는 개인사에 관한 확인되지 않은 주장과 그 반박도 섞여 있다. 그 내용을 옮기지 않아도 대화의 변화는 보인다. 칼에게 요구할 기준을 이야기하던 자리가, 모범으로 든 선수에게 정말 결점이 없느냐를 따지는 자리로 이동했다.\n\n구단 쪽 입장도 한쪽으로만 기울지는 않았다. 크리스토프 프로인트는 칼 같은 개성 있는 선수도 원한다면서, 중요한 것은 경기와 훈련에서 보여 주는 일이라고 말했다. 해당 발언을 전한 dpa 기사에서도 개성을 인정하는 말과 성실한 훈련을 강조하는 말이 함께 실렸다. [프로인트 발언을 전한 dpa 보도](https://www.idowa.de/bayern/freunds-plaedoyer-fuer-karl-wir-wollen-ja-typen-haben-art-424374)\n\n이번 발췌만으로 어느 편이 더 큰지 확정할 수는 없다. 분명한 것은 지켜 주고 싶은 대상이 다르다는 점이다. 한쪽은 자신이 사랑해 온 바이에른의 태도를 지키려 하고, 다른 쪽은 막 올라온 선수가 자기 모습으로 뛰어도 되는 여지를 지키려 한다.\n\n### 라이머에게 붙은 칭찬, “예술가는 아니지만”에서 멈추지 않았다\n\n라이머 글타래의 첫 칭찬은 익숙한 형태였다. 기술적으로 가장 재능 있는 선수는 아닐 수 있어도 불과 에너지, 열정, 승리 의지를 거의 매 경기 가져오는 선수. 한 팬은 그를 최고급 정신력을 지닌 선수로 부르면서 “예술가는 아니지만” 팀에는 이런 선수가 필요하다고 했다.\n\n그러자 칭찬의 전제부터 다시 묻는 글이 나왔다. ‘능력이 떨어진다’고 할 때 어떤 능력을 말하느냐는 것이다. 체력인가, 몸싸움인가, 정신력인가, 경기 이해도인가, 팀에 끼치는 영향인가. 결국 기술을 뜻하는 것이라면 경기력을 그것 하나로 줄여서는 안 된다는 주장이었다. 다른 능력도 배우기 어렵고 중요하다는 말이다.\n\n이 질문 하나로 글타래가 제법 깊어졌다. ‘열심히 뛰어서 재능의 부족을 메운다’는 칭찬에 만족하지 않고, 계속 강한 압박을 걸고 큰 경기에서 역할을 수행하는 것 자체를 높은 능력으로 평가해 달라는 요구가 됐다.\n\n수집된 14개 글 가운데 여러 글은 ‘람 이후 최고의 오른쪽 수비수’라는 평가에 동의했다. 파바르와 비교하는 글, 잠시 임대로 뛰었던 칸셀루와 오드리오솔라를 명단에 보태는 글도 있었다. 누가 빠졌는지부터 바로잡는 모습이 이 게시판답다.\n\n그 칭찬에 제동을 건 것은 숫자였다. 한 팬은 키미히의 월드컵 경합 승률 55%와 라이머의 분데스리가 25%를 들고 와, 왜 수비가 더 좋다고 하는지 물었다. 이 수치는 게시자가 가져온 비교이며 이번 원고에서 원자료의 정의와 집계 범위를 확인한 통계는 아니다. 실제 답글들도 숫자를 그대로 받아들이기보다 비교의 조건을 문제 삼았다. 국가대표와 바이에른은 환경이 다르고, 두 선수가 해석하는 역할도 다르다는 것이다.\n\n라이머를 옹호하는 팬은 직접 일대일 경합에서 지는 장면이 더 있을 수는 있어도 수비는 그것보다 넓다고 말했다. 키미히가 공을 받으러 여러 곳으로 움직인 뒤 원래 위치로 돌아오는 문제와, 라이머의 주력과 회복 능력을 함께 봐야 한다는 설명이다. 반대편도 활동량과 전술적 쓸모를 인정하면서, 그것이 곧 뛰어난 수비수라는 결론으로 이어지는지는 별개라고 버텼다.\n\n대체자를 고르는 기준도 그만큼 높아졌다. 기술과 전술에서 더 좋으면서 라이머와 같은 강도를 내야 진짜 보강이라는 글이 있었고, 하키미 외에 누가 확실히 더 나으며 실제로 데려올 수 있느냐는 질문도 나왔다. 쿤데와 알렉산더아놀드가 답으로 제시됐다.\n\n마지막에는 재미있는 두 문장이 붙었다. 자신도 새 오른쪽 수비수를 요구해 왔지만 마드리드전 라이머에게는 모자를 벗겠다는 팬이 있었다. 이어진 답은 칭찬에 동의하면서도 은디아예를 그 자리에서 시험해 보고 싶다는 것이었다. 최고의 경기를 본 날에도 실험 희망 명단까지 접을 필요는 없었다.\n\n### 무시알라의 복귀 소식과, 이미 기다리고 있는 역할 문제\n\n무시알라 글타래는 팀 훈련 복귀를 반기면서 시작했다. 공격진에 결원이 있는 지금이라면 짧은 출전만으로도 부담을 나눠 줄 수 있다는 기대, 어느 정도 상태만 올라오면 여전히 확실한 주전이라는 믿음이 나왔다.\n\n공식 발표가 그어 놓은 선은 그보다 조금 뒤였다. 바이에른은 근육 부상 뒤 무시알라가 팀 훈련에 돌아왔다고 확인하면서도 마인츠전 출전에는 이르다고 밝혔다. 따라서 발췌 속 마인츠전 몇 분 출전 가능성은 당시 팬들의 기대이고, 확인된 복귀 일정은 아니다. [바이에른의 훈련 복귀 소식](https://fcbayern.com/de/news/2026/11/jamal-musiala-zurueck-im-teamtraining)\n\n이 열 개 글이 흥미로운 이유는 몸 상태 다음에 곧바로 자리가 등장하기 때문이다. 디아스·케인·올리세와 함께 모두 건강하게 뛰면 엄청난 공격진이라는 기대가 있는 동시에, 지금 팀의 공격이 측면과 케인의 마무리에 맞춰 잘 돌아간다면 무시알라가 그 사이에 어떻게 들어가느냐는 질문이 붙었다.\n\n한쪽은 중앙 공격수 뒤에서 뛰는 일이 원래 쉽지 않다고 봤다. 상대가 내려앉고, 공격은 바깥 공간으로 흐르는 환경에서 그나브리나 브라운, 칼도 중앙에서는 고전했다는 관찰이다. 무시알라 한 사람의 폼만 볼 일이 아니라는 뜻이다. 왼쪽에서 보고 싶다는 제안도 나왔다.\n\n다른 쪽은 어린 선수에게 기대하듯 가능성만 말하는 시기는 지났다고 했다. 높은 연봉을 받는 핵심이라면 좋은 수준에 ‘다가가는’ 데서 그치지 말고 꾸준히 보여 줘야 한다는 요구다. 반박은 의외로 실무적이었다. 폼이 안 올라오면 팔기도 어렵고, 올라오면 남기고 싶을 텐데, 비싸다는 말을 계속 반복해서 무엇을 바꿀 수 있느냐는 것이다.\n\n그래서 복귀를 기다리는 이유도 조금씩 달랐다. 누군가에게는 공격진에 더할 중요한 힘이고, 누군가에게는 달라진 공격 구조 안에서 자신의 자리를 다시 증명해야 하는 선수다. 마지막의 낙관적인 글은 마인츠냐 쾰른이냐보다 향후 몇 달의 출전 시간을 조절하는 것이 중요하다고 봤다. 당장 시험하고 싶은 마음과 충분히 회복된 모습을 오래 보고 싶은 마음이 함께 남았다.\n\n### “내년 선수단이 거의 완성됐다”는 말에 붙은 긴 단서\n\n막스 에베를 글타래는 칭찬 한 줄의 범위를 두고 열한 개 글이 오갔다. 11월인데 다음 시즌 선수단이 거의 정해져 있어 그의 방향이 보인다는 주장이다. 그런데 그 뒤에 골키퍼 두 자리, 정리할 선수들, 센터백의 발전 가능성, 공격진 백업 이야기가 줄줄이 붙었다.\n\n답글은 바로 그 목록을 집었다. 거의 완성됐다면서 꽤 많은 일이 남았다는 웃음 섞인 지적이다. 원래 글의 취지는 주전 구성이 서 있고 남은 것은 두 번째·세 번째 골키퍼와 공격 백업 등이라는 쪽이었다. 예전처럼 열 자리가 넘게 불확실한 상황과는 다르다는 설명도 이어졌다.\n\n반대편이 요구한 것은 더 구체적인 내용이었다. 에베를의 ‘색깔’이 보인다면 그것이 무엇인지 말해 달라는 것이다. 나이 구성을 손볼 센터백, 오른쪽 수비, 디아스와 케인의 대체 자원까지 생각하면 단순한 마무리 작업으로 부르기 어렵다는 견해다. 무시알라가 원하는 수준으로 돌아오는지도 아직 열려 있다는 의견이 붙었다.\n\n중간에서 비교적 잘 맞아떨어진 표현은 ‘기본 골격은 섰다’였다. 축구에서 다음 여름의 모든 문제가 없어지는 시점은 없고, 부상과 계약·폼·시장의 변화에 따라 새 과제가 생긴다는 것이다. 이 대화는 보강이 필요하냐보다, 지금 남은 일을 얼마나 큰 공사로 느끼느냐의 차이에 가까웠다.\n\n그 와중에 맨체스터 시티가 강등되면 홀란을 데려와 케인과 함께 쓰고, 케인은 더 아래에서 긴 공을 보내면 된다는 농담이 나왔다. 실제 강등이나 영입 소식이 아니라 가정에 웃는 얼굴을 붙인 글이다. 그런데 다음 답글은 홀란이 바이에른을 원하겠느냐, 팀의 느린 공격에서 공을 지키고 연결하는 역할에 맞겠느냐를 진지하게 따졌다. 농담으로 시작한 이름도 올라오는 순간 전술 검토를 피하기 어려웠다.\n\n### 왼쪽 윙어를 일찍 살 것인가, 더 보고 비싸게 살 것인가\n\n일반 이적 토론에서는 리오 응구모하에 관한 크리스티안 팔크의 보도 인용이 눈길을 끌었다. 바이에른이 사이바리를 영입하기 전 최대 7,000만 유로를 지불할 의향이 있었고 가족 측과 접촉했지만 리버풀이 판매 의사를 보이지 않았다는 내용이다. 이번 자료에서는 기자의 주장으로 유통된 소식이며, 구단이 확인한 제안이나 협상 결과로 다루지 않는다.\n\n실제 대화는 그 이름에만 머물지 않았다. 포르투의 오스카르 피에투셰프스키를 얼마나 일찍 판단해야 하느냐가 뒤를 이었다. 한 팬은 그를 오랫동안 나온 폴란드 최고 수준의 재능으로 평가하며 바이에른 유소년 카르도주와 같은 선상에서 비교하는 것에 반발했다. 다른 팬은 글에서 거론된 6,000만 유로 바이아웃에 아직 그만한 가치를 보지는 않았다. 액수와 전망 모두 팬들이 토론에 올린 전제다.\n\n관심을 가진 쪽의 계산은 명료했다. 정말 확신한다면 먼저 움직여야 한다. 부상 전 모습을 계속 보여 주면 구단은 더 비싸게 부를 수 있고 경쟁자도 붙는다. 반대로 더 기다려 검증을 얻으면 위험은 줄지만 가격은 높아진다.\n\n한 팬은 왼쪽 윙 시장에서는 다섯, 여섯 경기만 잘해도 가격이 뛴다고 불평했다. 그 말 뒤에는 다른 포지션의 예산까지 줄어들 수 있다는 걱정이 있었다. 이적료가 싸서 좋은 선수를 고르자는 이야기를 넘어, 한 자리에 큰돈을 썼을 때 센터백이나 오른쪽 수비에 손댈 여유가 남느냐는 계산이다.\n\n그러자 별다른 이탈이 없다면 대체 어느 자리가 피해를 보느냐는 질문이 나왔다. 앞선 에베를 글타래와 같은 차이가 여기서도 반복됐다. 현재 선수단을 사실상 완성된 것으로 보는 팬에게 윙어는 집중 투자할 수 있는 자리다. 추가로 바꾸고 싶은 자리가 여럿인 팬에게는 같은 지출이 기회비용이 된다.\n\n묀헨글라트바흐의 모히아를 디아스 백업으로 보자는 제안도 있었다. 강한 팀의 점유율 속에서 더 잘 드러날 능력을 가진 선수라는 관찰이었다. 이번 이적 토론은 새 이름을 많이 늘어놓는 데서 그치지 않고, 팀이 공을 오래 가졌을 때 어떤 장점이 살아날지와 영입 시점을 함께 따지고 있었다.\n\n### 도르트문트의 주말: 5–1을 꿈꾸는 사람과 1골이면 된다는 사람\n\n도르트문트의 엘버스베르크전 글타래에는 여덟 개 새 글이 실렸다. 한 팬은 바이에른 원정에서 얻은 승점을 이번 경기의 승리로 더 빛내고 싶다고 했다. 4-4-2로 나가면 5–1, 평소의 3-5-2면 2–0이라는 예상까지 붙였다. 포메이션 선택에 따라 공격의 모양이 얼마나 달라질지에 대한 기대가 점수로 나왔다.\n\n다른 팬은 상당히 자신만만하다며 엘버스베르크가 불편한 상대가 될 수 있다고 봤다. 도르트문트가 또 어떻게든 이길 것 같지만 기라시 없이 파괴력이 줄어들 수 있다는 반응이었다. 여기에 “나는 우리가 왜 이기는지 거의 매번 안다”는 답이 붙었다. 상대에게 별로 내주지 않고 앞에서는 적어도 한 골을 넣을 실력이 있다는 설명이다.\n\n도르트문트 축구에 대한 평가 차이가 짧은 문답에 들어 있다. 이겨도 과정이 불안하게 남는 사람에게는 결과가 설명보다 앞선다. 수비 통제와 공격수의 질을 신뢰하는 사람에게는 그 결과를 만드는 방식이 이미 보인다.\n\n결장 변수는 확인됐다. 도르트문트는 기라시가 베티스전에서 오른쪽 허벅지에 부상을 입어 엘버스베르크전에 나서지 못한다고 발표했다. 대표팀 합류도 어려울 가능성이 있지만 당시에는 협회와 논의할 사안이었고, 전체 결장 기간은 정해지지 않았다. 팬들은 파비우 실바라는 대안이 있어 다행이라고 반응했다. [도르트문트 공식 부상 발표](https://www.bvb.de/de/de/aktuelles/news/news.html/2026/11/6/Einsatz-gegen-Elversberg-Kovac-schafft-Klarheit-bei-Guirassy.html)\n\n사비처가 곧장 돌아올지, 은와네리와 추쿠에메카 가운데 누가 실바 뒤에 설지도 예상 명단에 올랐다. 한편에서는 마네와 이나시우에게 기회를 주자는 목소리가 나왔다. 특히 마네는 이제 꾸준히 버틸 몸과 도르트문트에서 뛸 실력을 확인해야 할 나이라는 주장이다. 다른 팬은 1군 벤치보다 U23에서 90분을 뛰는 선택을 예상했다. 출전 기회를 준다는 말도 어디서 얼마나 뛰게 하느냐에 따라 달랐다.\n\n우승 예측만큼 큰 목표를 적지 않은 글도 있었다. 승점 3점과 부상 없는 경기. 주중 경기가 계속된 뒤 선수들이 지쳐 보인다는 이유였다.\n\n흥미롭게도 별도의 두 승부 예측 글타래는 훨씬 한쪽으로 모였다. ‘1부’와 ‘2부’로 나뉜 예측 게임에서 이번에 제공된 19개 제출은 모두 도르트문트 승리를 골랐다. 2–0부터 4–2까지 점수는 달랐다. 이것은 그 19개 예측의 공통점이지 포럼 전체의 자신감 지수는 아니다. 그래도 토론방에서 걱정을 쏟아낸 뒤 예측표에는 승리를 적는 팬 생활의 익숙한 간극을 보여 준다.\n\n### 스벤손의 문제인가, 그 앞에 설 선수의 문제인가\n\n엘버스베르크전의 포메이션 기대를 이해하려면 스벤손 글타래가 좋은 길잡이가 된다. 일곱 개 글의 핵심 질문은 그와 뤼에르손이 포백의 풀백으로 뛸 수 있느냐에서 한 걸음 더 나아가 있었다. 그렇게 뛴다면 그 앞에서 누가 폭을 주느냐는 것이다.\n\n클래식한 윙어가 많지 않은 선수단에서 스벤손 앞의 선수가 계속 중앙으로 들어오면, 왼쪽 측면을 누가 채워야 하느냐. 수비 부담을 덜어 주려고 포백으로 바꿔도 공격의 폭까지 그에게 맡기면 역할은 다시 어려워질 수 있다는 관찰이다.\n\n반대로 한쪽 풀백은 수비를 안정시키고 다른 쪽은 더 공격적으로 쓰는 비대칭 구성을 기대하는 글도 있었다. 슈멜처 시절을 떠올리며 오른쪽에 피슈체크 같은 유형이 더 필요하다는 식이다. 옛 이름을 가져왔지만 관심은 지금 선수단의 역할 배분에 있었다.\n\n중앙에 한 명이 더 생기면서 경기력이 좋아졌다는 평가에는 위치에 관한 정정도 붙었다. 은메차가 처음부터 중앙에 있었고, 폭을 주러 움직인 쪽은 추쿠에메카라는 설명이다. 포백이 좋았다는 결론만 공유해도, 누가 어디를 채웠기 때문에 좋았는지는 다시 따진다.\n\n스벤손을 디아스나 코스티치와 비교하지 말자는 글도 같은 맥락이다. 아예 다른 유형과 포지션의 선수를 기준으로 공격 기여를 요구하면 평가가 어긋난다는 것이다. 비교 대상으로는 고젠스가 더 가깝다는 제안이 나왔다.\n\n이 논의는 임대 중인 얀 쿠투 이야기와도 이어졌다. 쿠투의 코모 임대는 도르트문트 공식 연차보고서에서 확인된다. [도르트문트 연차보고서](https://report.bvb.de/annual-report/2025-2026/consolidated-financial-statements/notes-to-the-consolidated-financial-statements/other-disclosures/events-after-the-end-of-the-reporting-period.html)\n\n팬들의 해석은 셋으로 갈렸다. 뤼에르손의 좋은 폼 때문에 생긴 호화로운 경쟁이었다는 쪽, 분데스리가의 강한 전환과 경합 환경이 쿠투와 잘 맞지 않는다는 쪽, 다른 공격 자원을 데려오기 위해 선수단에 자리를 만들어야 했을 것이라는 쪽이다. 마지막 설명은 팬의 추정이다.\n\n코모에서의 공격 포인트를 놓고도 작은 문답이 있었다. 팀이 여러 골을 넣는데 공격적인 풀백인 쿠투에게 도움이 없다는 의문에, 실제로 거기서도 그렇게 공격적인 역할을 맡고 있느냐는 질문이 돌아왔다. 몇 경기를 본 팬은 오히려 낮은 위치에 머물렀다고 했다. 도르트문트에서 기억한 선수 유형을 다른 팀의 역할에 그대로 대입해도 되는지, 팬들이 서로 확인하는 장면이었다.\n\n### ‘껄끄러운 상대’는 통계에 넣을 수 있는가\n\n도르트문트의 현재 경기력을 논한 글타래에서는 ‘Angstgegner’가 중심에 섰다. 자꾸 만나면 좋지 않은 기억이 떠오르는 상대, 한국식으로 옮기면 천적이나 유독 껄끄러운 팀에 가까운 말이다.\n\n상대의 전력을 옛 명성과 지난 시즌 순위만으로 판단하지 말자는 주장에, 그렇다면 특정 팀을 천적으로 부르는 것은 왜 가능하냐는 반문이 붙었다. 현재 폼과 순위가 중요하다고 하면서 어떤 팀에는 갑자기 과거 15년의 상대 전적을 적용하면 기준이 바뀐다는 지적이다.\n\n이에 지난 몇 년간 자꾸 좋지 않은 결과를 겪으면 경기 전에 불편한 감정을 갖는 것이 인간적으로 자연스럽다는 답이 나왔다. 경기의 구성원과 조건이 바뀌었어도 이전 경험이 남을 수 있다는 설명이다. 다른 글은 도르트문트와 오스나브뤼크의 오래된 상대 전적을 가져와, 그렇다면 여기도 천적 목록에 넣느냐고 장난스럽게 물었다. 그 전적의 수치 자체보다 기준을 어디까지 넓힐 수 있느냐를 찌른 말이다.\n\n논쟁의 바닥에는 코바치와 팀의 성과를 어떻게 평가할지가 있었다. 결과를 비교하려면 홈과 원정, 상대의 현재 상태, 과거의 상성 가운데 무엇에 얼마의 무게를 둘 것인가. 어떤 팬은 자신의 비교 틀이 충분히 실용적이라고 봤고, 다른 팬은 그 틀에 주관적인 선택이 들어 있다고 했다.\n\n베티스전 글타래의 작은 논쟁도 비슷했다. 공격수가 상대 센터백에게 공을 빼앗기는 것과 수비형 미드필더가 전진 중인 팀의 자기 진영에서 패스를 끊기는 것은 같은 실수로 묶을 수 없다는 지적이다. 몇 번 잃었느냐보다 어디서 어떤 위험을 만들었느냐를 보자는 말이다.\n\n동시에 대화의 온도 자체를 걱정하는 글도 있었다. 비판이 선수와 운영진 전부를 깎아내리는 분위기로 번진다는 불만이다. 제공된 발췌에는 상대를 향한 빈정거림도 보이지만, 그 감정이 곧 도르트문트 팬 전체의 상태는 아니다. 이번에 읽힌 것은 결과를 긍정할 기준과 경기력을 의심할 기준이 아직 잘 맞물리지 않는 몇 개 글타래였다.\n\n### 남의 경기에서 발견한 중거리 슛, 유럽 원정에서 놓친 승점\n\n다른 경기를 보던 도르트문트 팬은 함부르크의 무하임이 때린 슛을 보고 자기 팀에도 저런 발이 있으면 좋겠다고 했다. 답은 바로 나왔다. 은메차도 몇 번 보여 주지 않았느냐는 것이다. 처음 글을 쓴 팬은 그런 거리와 위력의 슛을 언제 봤느냐고 되물었다.\n\n곧 더 전술적인 반응이 붙었다. 함부르크가 도르트문트를 상대할 때도 저만큼 열려 있겠느냐는 것이다. 슛을 잘 때리는 선수의 존재와 그 선수 앞에 슈팅 경로가 열리는 조건은 별개라는 말이다. 실시간 글에서 팬들이 묘사한 장거리 슛의 거리는 별도로 확정하지 않았지만, 마지막에 남은 요구는 뚜렷했다. 통계로 반박받았더라도 도르트문트가 박스 밖에서 좀 더 시도해 봤으면 좋겠다는 주관적인 답답함이었다.\n\n바이에른 팬들의 타 구단 경기방에서는 독일 팀의 유럽 성적이 화제였다. 호펜하임의 크리스털 팰리스 원정 1–1은 경기 전 기대를 생각하면 얻은 승점이라는 반응과, 막판 동점골 때문에 큰 기회를 놓쳤다는 반응이 함께 나왔다. DFB 기록상 호펜하임은 전반 7분 앞서갔고 후반 추가시간에 동점을 허용했다. 프라이부르크의 트라브존스포르 원정 1–0 승리도 확인된다. [호펜하임 경기 기록](https://datencenter.dfb.de/datencenter/europa-league/2026-2027/4/crystal-palace-tsg-hoffenheim-2429813), [프라이부르크 경기 기록](https://datencenter.dfb.de/datencenter/conference-league/2026-2027/3/trabzonspor-sc-freiburg-2429869)\n\n레버쿠젠에 대해서는 자료 속 마르세유전 패배를 두고 불필요한 손실이라는 실망과, 아직 상위권 통과를 기대할 수 있다는 반응이 갈렸다. 여기서는 해당 결과를 전제로 대화한 팬들의 평가로 전한다. 한 글이 경기의 중요성을 낮춰 보자, 그런 태도로 무엇을 우승하겠느냐며 차라리 호펜하임이 유로파리그를 따겠다는 답까지 나왔다.\n\n리그 전체를 보는 글타래는 훨씬 덜 비관적이었다. 독일 팀의 내용이 수수하다는 비판에, 이탈리아와 스페인 팀들이 더 고전하는데 무엇이 그렇게 나쁘냐는 반응이 나왔다. 추가 챔피언스리그 출전권을 계산한 표와 예측 확률도 공유됐다. 그 수치는 팬들이 가져온 외부 모델의 전망으로, 이번 원고에서 UEFA 공식 확정 수치처럼 사용하지 않았다.\n\n이번 대화에서 독일 팀을 응원하는 이유는 소속감만이 아니었다. 다른 나라와 비교하는 계수 경쟁이 있었고, 그러다 보니 평소 경쟁 구단의 후반 추가시간 실점에도 자기 팀 일처럼 아쉬워하는 장면이 생겼다.\n\n### 자정 1분 열차와, 나눠 보고 싶은 영화 144편\n\n경기장 밖의 대화에는 경기 결과와 다른 종류의 긴장이 있었다. 밤 8시 30분에 시작하는 알리안츠 아레나 경기를 보고 중앙역의 자정 1분 열차를 탈 수 있느냐는 문제다.\n\n수십 번 다녀 본 경험상 충분하다는 팬은 종료 휘슬과 함께 빠르게 움직여 지하철 첫 물결에 들어가야 한다고 했다. 다른 팬은 좌석 위치에 따라 다르고, 시내까지 45~60분이라는 예상은 상당히 빠듯하다고 봤다. 대표팀 경기를 보고 이동했다가 자정 무렵에야 오데온스플라츠에 도착했다는 경험도 나왔다. 모두 개인의 이동 경험이며 귀가 시간의 보장은 아니다.\n\n이 실용적인 문답 중간에 ‘P1’이 혼선을 만들었다. 경기장 주차장으로 생각하기 쉬웠는데, 글쓴이가 말한 곳은 시내의 클럽이었다. 상대가 그 뜻을 알아차리자 본인도 혼동할 만했다고 웃었다. 교통 조언을 읽던 사람이 갑자기 심야 외출 동선까지 상상하게 되는 작은 틈이다.\n\n티켓 글타래에는 금요일 밤 편성에 대한 실망이 쌓였다. 전반기에 토요일 오후 3시 30분 홈경기가 하나도 없다는 불평, 뮌헨에 머무는 주말에 맞춰 좋은 좌석을 구했는데 금요일 콘서트와 겹쳐 갈 수 없다는 사연이 있었다. 중계권 계약 때문에 이런 편성이 나왔을 것이라는 설명도 있었지만 그 규정 해석은 팬의 이해 수준으로 제시됐다. 이들에게 경기 시간은 방송표보다 먼저 이미 짜 둔 주말의 문제였다.\n\n한편 ‘윤리위원회’라는 이름의 잡담 글타래는 영화 이야기로 한동안 따뜻해졌다. 《와일드우드》를 보고 온 팬이 창의성과 공들인 제작에 감탄하자, 다른 팬은 최근 애니메이션에도 좋은 작품이 많았다고 맞섰다. 《플로우》와 《와일드 로봇》, 《클라우스》와 《레오》가 거론됐다. 이번 원고는 개봉 현황을 안내하는 대신 팬들이 주고받은 감상만 옮긴다.\n\n가장 오래 쓸모가 있을 소식은 따로 있었다. 한 달 전 이 방에서 받은 영화 추천을 스프레드시트로 정리했더니, 중복을 따로 빼지 않은 상태로 144편이 됐다는 것이다. 가을과 겨울을 넘기고도 볼 것이 남았다. 첫 작품으로 《미스터 노바디》를 봤다는 말에 곧 목록을 공유해 줄 수 없느냐는 답이 달렸다.\n\n선수의 연봉 계산 방식과 수비 경합의 의미를 놓고 날카로워지던 포럼에도, 누군가 정리해 둔 영화 목록을 기다리는 시간이 있었다.\n\n<details><summary>범위와 근거<\/summary>\n\n이번 실행 2026-11-07_153938에 제공된 수집 발췌만 팬 반응의 근거로 사용했다. 수집본 표기는 46개 글타래·새 글 263개·익명 작성표시 163종이며, 작성표시를 실제 사람 수나 서로 다른 글타래의 동일 인물로 간주하지 않았다. 원문이 생략된 대목은 보이는 내용의 범위에서만 서술했다.\n\n공식 확인에 사용한 자료는 본문에 연결한 바이에른의 케인 재계약 발표·아틀레티코전 경기 보고서·무시알라 훈련 복귀 소식, 도르트문트의 기라시 부상 발표·2025/26 연차보고서, DFB의 호펜하임·프라이부르크 경기 기록이다. 프로인트의 칼 관련 발언은 dpa 배포 기사를 대조했다. 외부 자료는 사실 대조에 사용했으며 다른 커뮤니티 반응을 보태지 않았다.\n\n계약 보수와 타 선수의 급여 비교, 이적료·바이아웃·영입 의향, 선수단 개편 전망, 통계 비교 및 유럽대항전 예측 확률은 공식 확인된 조건이나 확정 전망으로 사용하지 않았다. 경기 전 희망 명단과 점수 예상은 당시 팬들의 선택으로 다뤘다. 개인 이용자의 신원과 닉네임, 확인되지 않은 개인사 주장은 옮기지 않았다.\n\n<\/details>\n\n## BVB-Forum | 독일\n\n이번에는 수집본 표기상 11월 5~7일의 BVB-Forum 글타래 7개, 새 글 147개의 제공 발췌를 읽었다. 베티스전 뒤의 평가와 엘버스베르크전 전야가 중심이다. 11월 7일 뉴스 글타래는 아직 기사 전달 위주여서, 대화의 무게는 5~6일 글타래에 실려 있다.\n\n**개관**\n\n- **가장 길게 이어진 선수 이야기:** 욥 벨링엄의 잉글랜드 성인대표팀 첫 발탁. 공식 발표로 확인됐다. 축하와 함께 볼 손실·슈팅을 둘러싼 평가가 갈렸다.\n- **이겼지만 아직 들뜨지는 않는다:** 베티스전 2–1 승리는 공식 기록으로 확인했다. 팬들은 경기력의 상승세를 이야기하면서도 챔피언스리그에서 어디까지 기대해야 하는지 계산하고 있었다.\n- **쿠토의 이적료를 벌써 쓰고 싶은 마음:** 코모 임대는 확인된 사실이다. 완전이적 금액과 겨울 조기 지급은 게시판에 옮겨진 보도와 팬들의 제안이다. 여기서 윙백 보강 방식에 관한 논쟁으로 번졌다.\n- **경기장 밖의 화제:** 중계 구독료를 아끼는 달력, SPORTFIVE 계약 연장과 수수료, 승격팀 퀴즈에서 불려 나온 1970년대의 기억. 퀴즈 글타래는 10개 글의 작은 곁가지지만 유난히 표정이 풍부했다.\n\n---\n\n### 대표팀에 뽑혔다. 그런데 그 슛은 들어갔어야 했다\n\n욥 벨링엄의 대표팀 발탁 소식에 가장 먼저 붙은 반응은 기쁨과 약간의 놀라움이었다. 경기력이 안정되는 것 같아 축하한다는 말, 베티스전에서 엄청나게 뛰어다녔다는 칭찬, 바이에른전에서는 더 좋았다는 평가가 이어졌다. 현재 맡은 역할에서는 이제 선발 명단에서 빼기 어렵다는 댓글도 있었다.\n\n발탁 자체는 풍문이 아니다. 잉글랜드축구협회는 11월 6일 욥이 형 주드와 함께 성인대표팀 명단에 들어갔다고 발표했다. 토마스 투헬은 도르트문트에서 리듬을 찾고 주전으로 자리 잡은 점을 발탁 이유로 들었다. 형제라는 사연에 앞서, 욥 자신의 경기력을 인정한 선발이라는 설명이었다. [잉글랜드축구협회 발표](https://www.englandfootball.com/articles/2026/Nov/06/thomas-tuchel-interview-november-squad-announcement-20260611)\n\n포럼에는 니코 코바치의 기자회견을 본 팬의 전언도 올라왔다. 훈련장에 가장 먼저 오는 선수들 가운데 하나이며 마지막까지 남는다는 칭찬, 대표팀에서 형과 함께하게 된 특별한 기회에 대한 축하가 있었다고 한다. 이 댓글이 전달한 기자회견의 분위기는 거의 욥을 위한 찬사였다.\n\n하지만 뉴스 글타래의 대화는 축하 인사로만 끝나지 않았다. 한 팬이 베티스전의 어리석은 중원 볼 손실 두 차례를 꺼냈고, 그중 하나는 상대의 오프사이드 득점으로 이어졌다고 지적했다. 그러자 다른 팬이 오프사이드가 아니었고 실수한 선수도 벨링엄이 아니라 안톤이었다고 반박했다.\n\n곧 두 사람이 서로 다른 장면을 이야기했다는 사실이 드러났다. 한쪽은 전반의 취소된 골, 다른 쪽은 후반의 정식 동점골을 떠올린 것이다. “아, 그거! 이제 알겠다”는 답으로 작은 혼선은 정리됐다. 공식 경기 보고서에도 전반 안토니의 오프사이드 득점과 후반 베티스의 동점골이 구분돼 있다. BVB는 결국 2–1로 이겼다. [BVB 공식 경기 보고서](https://www.bvb.de/de/de/aktuelles/news/news.html/2026/11/4/BVB-feiert-hart-erkaempften-Sieg-gegen-Betis.html)\n\n이 장면을 바로잡고도 벨링엄의 경기 내용에 관한 이견은 남았다. 칭찬했던 팬도 볼 손실이 있었다는 지적은 받아들이면서, 안톤뿐 아니라 페이르만과 은메차 역시 빌드업에서 비슷한 큰 실수를 했다고 덧붙였다. 그날 욥에게만 붙일 흠인지, 팀 전체가 함께 되짚어야 할 문제인지가 달랐다.\n\n가장 선명한 구분은 경기장을 세 구역으로 나눈 평가였다. 벨링엄은 중앙선과 상대 페널티지역 사이에서 강점이 크지만, 그보다 뒤와 앞에서는 발전할 여지가 많다는 것이다. 좋은 위치로 공을 운반하고 공격에 연결하는 능력을 인정하면서도, 자기 진영에서의 판단과 마지막 슈팅까지 같은 점수를 주지는 않았다.\n\n반대로 성장의 연속성을 보는 팬은 지난 시즌을 떠올렸다. 당시에는 어느 면에서나 무난하되 특별히 뛰어난 부분은 잘 보이지 않았는데, 지금은 여러 항목이 함께 나아지고 있다는 평가였다. 올해 스물한 살이 된 중앙 미드필더라는 점도 강조했다. 지금의 미완성된 장면을 보면서도, 그것이 계속 같은 모양으로 남을 선수는 아니라는 기대다.\n\n가장 날카롭게 부딪친 대목은 역시 골문 앞이었다. 발탁이 상당히 의외라는 팬은 여전히 잦은 볼 손실과 잘못된 선택을 본다고 했다. 특히 뮌헨에서 공을 빼앗은 뒤 중앙선 부근부터 혼자 전진해, 골문 정면 약 17m에서 방해 없이 슈팅할 수 있었던 장면을 불만의 근거로 꺼냈다. 좋은 상황을 만들고도 마지막에 충분히 얻어내지 못한다는 이야기였다.\n\n여기에 “투헬이 득점력 때문에 뽑은 게 아니다”라는 반론이 붙었다. 배운 포지션부터 생각해야 한다는 취지였지만, 끝에는 ‘누구에게 축구를 설명하고 있느냐’는 식의 날 선 말도 달렸다. 발탁을 축하하던 대화가 잠시 상대의 축구 이해를 겨누는 쪽으로 달아오른 순간이다.\n\n다음 답변은 역할론보다 눈앞의 기회를 붙잡았다. 지금 맡은 자리에서 실제로 좋은 슈팅 위치에 들어가고 있지 않느냐는 것이다. 베티스전에서 약 8m 거리의 발 슈팅과 헤더를 떠올리며, 상대 골키퍼의 반사신경이 좋았더라도 너무 중앙으로 보낸 슈팅은 개선해야 한다고 했다. 대표팀에 뽑힐 만한 미드필더인지와, 그 기회를 골로 바꿔야 하는지는 함께 이야기할 수 있다는 입장이었다.\n\n그 사이에는 훨씬 느긋한 시선도 있었다. 얼마 전까지는 골문 근처에서 좀처럼 보이지 않았는데 이제는 꾸준히 좋은 위치에 도착한다는 것이다. 공이 발에 걸리거나 골키퍼가 막아내는 장면이 매번 아쉽지만, 한두 개만 깔끔하게 들어가면 풀릴 것이라는 기대가 뒤따랐다. 같은 무득점을 보면서 누군가는 마무리의 결함을, 누군가는 공격 가담의 진전을 먼저 읽었다.\n\n밤이 깊어지자 이야기는 익숙한 도르트문트식 이적 농담으로 넘어갔다. 맨체스터 유나이티드의 대단한 스카우팅 조직이 이제야 놀라서 올드 트래퍼드 금고 열쇠를 찾으러 갔을 것이라는 댓글이 등장했다. 다른 팬은 욥이 골까지 넣으면 8천만~1억 유로 이야기를 하게 될 거라고 보탰다. 이것은 관심 구단이나 이적료에 관한 취재 정보가 아니라, 발탁 소식에 붙인 과장이었다.\n\n그런데 돈이 ‘맨체스터로 흘러간다’고 적힌 문장에 엉뚱한 방향의 답글이 붙었다. 왜 우리가 골 하나 때문에 그렇게 많은 돈을 내야 하며, 왜 하필 맨체스터냐는 것이다. 곧 “케흘 시절에 맺은 거래가 아직 남았나 보지”라는 농담이 이어졌다. 이적료 계산이 문장 하나 때문에 구단의 수상한 청구서로 바뀌었다.\n\n이 대화의 마지막 쪽에는 다른 바람도 남았다. 대표팀 발탁이 자신감을 더해 주되, 여름에 5천만~6천만 유로를 받고 다시 파는 대신 좋은 미드필더를 오래 보유했으면 한다는 댓글이다. 한 선수가 좋아질 때 곧바로 가격표부터 떠오르는 익숙함, 그리고 이번에는 좀 더 오래 함께 보고 싶다는 마음이 같은 글타래에 있었다.\n\n### 승점 계산기는 켰지만, 8강의 기준에는 합의하지 못했다\n\n베티스전 리뷰를 소개한 글의 요지는 명료했다. 승리는 충분히 정당했고 경기 내용도 상당히 좋았는데, 그래도 열광은 아직 오지 않는다는 것이었다. 다만 이 리뷰 글타래 자체에는 소개 글 한 개만 수집됐다. 여기에 공감하는 댓글이 줄줄이 달렸다고 읽을 수는 없다. 실제 논쟁은 다음 날 뉴스 글타래의 챔피언스리그 계산에서 펼쳐졌다.\n\n한 팬은 장난삼아 순위 계산기를 돌렸다. 다른 경기에서는 대체로 강팀이 이긴다고 가정하고, BVB의 남은 결과를 바꾸는 방식이었다. 남은 경기를 모두 져도 아슬아슬하게 24위, 아테네에 홈에서 이기면 17위, 인테르와 추가로 비기면 14위, 인테르까지 잡으면 10위가 나온다고 했다. 잉글랜드 원정에서 승점을 딸 것 같지는 않아서 8위 안 직행은 비현실적으로 봤다.\n\n이 숫자는 그 팬이 선택한 다른 경기 결과에 종속된 모의 순위다. 포럼이 확보한 진출 확률도, 실제 최종 순위 예측 모델도 아니다. 다만 어디까지는 안심하고 어디부터 욕심을 낼지, 대화를 시작하기에는 아주 좋은 계산표였다.\n\n공식 대진상 남은 상대는 아스널·인테르·애스턴 빌라·AEK 아테네이며, 인테르와 아테네는 홈, 두 잉글랜드 구단은 원정이다. 그래서 아테네전은 반드시 가져가야 한다는 반응과, 나머지 세 경기에서 정말 아무것도 못 얻겠느냐는 반응이 갈렸다. [BVB 공식 챔피언스리그 대진 안내](https://www.bvb.de/de/de/aktuelles/news/news.html/2026/8/27/Auslosung-BVB-Gegner-und-Tickets-in-der-Champions-League.html)\n\n조금 더 낙관적인 팬은 아스널·빌라·인테르를 모두 이길 것 같지는 않지만, 셋을 상대로 승점이 전혀 없을 것 같지도 않다며 4점을 예상했다. 또 다른 팬에게 인테르와 빌라는 좋은 팀이되 넘을 수 없는 팀은 아니었다. 당일 경기력에 따라 달라질 상대라는 평가였다. 아테네 원정이었다면 까다로워도 홈에서는 이겨야 한다는 쪽에는 제공된 몇 댓글의 무게가 모였다.\n\n도중에는 상대 팀을 잘못 짚은 해프닝도 있었다. 최근 흐름을 보면 빌라보다 아스널 원정에서 승점을 얻기 쉽겠다는 댓글에, 프리미어리그를 자세히 보지는 않지만 기록상으로는 다르게 보인다는 질문이 붙었다. 처음 쓴 팬은 아스널을 리버풀과 혼동했다고 인정했다. 처음의 자신감 있는 전망도 이 정정을 거쳐 읽어야 한다.\n\n더 길게 남은 문제는 한 경기의 승점이 아니라 BVB의 기대 수준이었다. 어떤 팬은 지난 시즌 챔피언스리그와 분데스리가의 실점 양상을 비교하며, 두 대회에서 전혀 다른 팀이 뛴 것처럼 유럽 무대의 안정성이 떨어졌다고 비판했다. 이에 다른 팬은 그렇게 꼬인 시즌을 보낸 뒤 우리가 무엇을 요구할 수 있느냐고 물었다. BVB 같은 구단도 유럽에서 8강 이전에 떨어지는 일은 반복해서 겪을 수 있다는 것이다.\n\n맞은편에는 구단의 자원을 기준으로 기대를 세우는 시선이 있었다. 한 팬은 BVB가 챔피언스리그 참가 구단의 재정 순위에서 12위쯤 된다는 자신의 전제를 놓고, 그렇다면 2~3년에 한 번 정도는 8강을 기대할 수 있다고 주장했다. 여기서 재정 순위 숫자는 확인된 순위표로 제시된 것이 아니라 그 댓글의 논거다. 핵심은 매년 8강을 당연시하자는 것보다, 반복해서 도달할 목표로는 삼아야 하지 않느냐는 데 있었다.\n\n또 다른 답글은 토너먼트의 변동성을 들었다. 바이에른도 매년 독일컵을 우승하지는 않는다는 비교였다. 테르지치 시기의 초과 성과와 코바치 시기의 기대 이하 성과를 거론하며, 어느 한 대회의 성공과 실패로 평가가 크게 흔들리는 상황을 이야기했다.\n\n승리 뒤에도 쉽게 들뜨지 않는 이유가 여기서는 조금 구체적이었다. 좋은 경기였다는 평가와 별개로, 다음 강팀과도 경쟁할 수 있는지, 유럽에서 어느 단계까지 가야 만족할지에 관한 기준은 아직 서로 달랐다. 순위 계산기는 모두에게 같은 숫자를 보여 줄 수 있어도, 그 숫자를 보고 안도할지 아쉬워할지까지 정해 주지는 못했다.\n\n### 쿠토가 잘 풀려서 기쁘다. 그 돈을 겨울에 받을 수는 없을까\n\n얀 쿠토 이야기의 첫 온도는 비교적 따뜻했다. 코모에서 시스템에 맞고 감독의 인정을 받는 것 같아 기쁘며, 도르트문트도 재정적으로 괜찮게 정리할 수 있다면 모두에게 좋겠다는 반응이었다. 한때 더 나쁜 결말을 걱정했다는 말도 있었다. 실패한 영입을 두고 선수를 나무라는 대화보다, 서로 맞는 자리를 찾을 수 있다는 안도가 앞섰다.\n\n확인된 바탕은 2026/27시즌 코모 임대다. 분데스리가 공식 발표는 쿠토가 도르트문트에서 율리안 뤼에르손을 넘어서기 어려웠던 상황도 함께 설명했다. 게시판에서 거론된 여름 완전이적 금액 2천만~2천2백만 유로와 코모의 매입 의향은 팬들이 전달한 보도 내용으로, 이번 원고에서 확정된 거래로 취급하지 않았다. [분데스리가의 쿠토 임대 발표](https://www.bundesliga.com/en/bundesliga/news/yan-couto-leaves-borussia-dortmund-como-loan-transfer-38156)\n\n그런데 좋은 결말을 기다리는 마음은 곧 겨울 이적시장으로 달려갔다. “이탈리아 쪽에서 2천만 유로를 겨울에 미리 보내 주면 안 될까?” 그러면 우리도 측면 수비 자리를 보강할 수 있지 않겠느냐는 것이다. 이 팬은 현재의 두 윙백을 ‘바이킹’이라 부르며 애정을 표시하면서도, 공격에서는 때때로 너무 빈약하다고 했다. 문맥상 다니엘 스벤손과 뤼에르손을 가리킨다.\n\n바로 현실적인 답변이 붙었다. 코모가 왜 그래야 하느냐, 여름에 쓸 수 있는 매입 선택권을 가졌다면 일찍 확정할 이득이 없다는 것이다. 그러자 3백만 유로 정도 할인해 주면 어떻겠느냐는 제안이 나왔다. 다른 댓글은 매입 시점을 앞당기고 싶은 회계상 사정이 있을 수 있다고 봤고, 또 다른 팬은 어차피 축구계 거래가 외상으로 돌아가니 코모가 살 의사만 있으면 그것을 바탕으로 움직일 수 있지 않겠느냐고 했다.\n\n누군가의 소식통이 전한 협상 경과가 아니라, 팬들이 이적료의 액수와 들어오는 시기를 만지작거린 대화다. 여름의 좋은 매각보다 겨울의 새 윙백이 당장 더 절실한 사람에게는 몇 달의 차이가 크게 느껴졌다.\n\n보강 논쟁은 곧 ‘누구를 사느냐’보다 ‘어떤 선수를 만드느냐’로 옮겨 갔다. 한 팬은 레자니의 이적 여부와 측면 보강이 연결돼 있다는 취지의 설명을 전했다. 다만 제공된 발췌만으로 그 구단 내부 사정을 확정할 수는 없다. 이어지는 대화에서 분명히 드러나는 것은 공격적인 선수를 데려와 수비 역할로 전환할 수 있느냐는 쟁점이다.\n\n그 전환을 설명하는 이름은 피슈체크였다. “피슈체크처럼 바꾸려는 계획이라는 글을 읽었다”는 댓글에, 피슈체크 2.0이라면 환영하지만 그게 아니라면 원래 그 자리를 하던 선수가 좋겠다는 답이 붙었다. 과거의 성공 사례를 좋아하면서도, 같은 수준의 전환이 다시 가능하리라고 쉽게 믿지는 않았다.\n\n다른 팬도 왜 공격수를 수비수로 바꾸려 하느냐, 처음부터 전문 선수를 데려오면 되지 않느냐고 물었다. 반론은 시장 가격이었다. 그 포지션의 전문가는 비싸고, 구단은 비교적 감당할 수 있는 금액으로 데려와 성장시킬 잠재력을 보는 것 아니냐는 설명이다.\n\n여기서 역할의 정의부터 달리하는 답이 나왔다. 전통적인 풀백을 찾는 것이라면 스벤손과 뤼에르손을 계속 쓰면 된다는 것이다. 필요한 것은 기술적으로 더 좋고 전진했을 때 힘을 보탤 수 있는 선수이며, 활동량을 갖춘다면 뒤의 센터백 세 명이 나머지를 처리할 수 있다는 주장이었다. 기존 선수들의 수비 능력보다 공격에서 다른 선택지를 원한 셈이다.\n\n또 한쪽에서는 전용 측면 수비수를 더 데려오면 스리백에 더욱 묶일 수 있다는 걱정을 했다. 나중에 포백으로 돌아가고 싶어질 때 선수 구성은 어떻게 되느냐는 질문이었다. 당장의 윙백 자원 부족을 해결하는 일이 몇 달 뒤의 전술 선택까지 좁히지는 않는지 살폈다.\n\n이만큼 돌아온 대화에 짧은 답글 하나가 들어왔다. “그러면 그냥 쿠토를 남기면 되잖아.” 공격적인 측면 자원을 찾느라 임대 보낸 선수를 다시 떠올리게 되는 구단 사정이 한 줄에 걸렸다. 마지막에는 본인 뜻에 반해 붙잡아 봐야 도움이 되지 않는다는 의견이 붙었다. 선수의 실제 의사를 새로 확인해 준 댓글은 아니지만, 대화는 다시 처음의 ‘서로 잘 맞는 곳에서 풀리면 좋겠다’는 마음으로 돌아갔다.\n\n### 토요일 3시 반이 반갑다가, 구독 달력에서 다시 헷갈렸다\n\n새 경기 일정에는 토요일 오후 3시 30분 홈경기가 많아 반갑다는 댓글이 붙었다. 그 자체로 충분히 기분 좋은 소식이었다. 하지만 같은 일정표를 놓고도 눈에 들어오는 항목은 제각각이었다.\n\n한 팬은 구단 생일에 홈에서 뛰고 싶다고 하지 않았느냐며, 하필 라이프치히 원정으로 잡힌 점을 아쉬워했다. 상대를 부르는 말은 레드불을 빗댄 ‘캔들’이었다. 다른 팬에게는 새해 첫 경기가 금요일이라는 것이 중요했다. 곧바로 주중 경기가 이어지는 구간이라 하루 더 쉴 수 있다는 계산이었다.\n\n그 아래에는 바이에른과 비교하면 오히려 이틀 덜 쉰다는 불만도 달렸다. 같은 금요일 편성이 다음 경기 전에는 하루를 벌어 주고, 겨울 휴식기 전체를 놓고는 준비 시간을 빼앗는 셈이다. 이 팬은 현지 보도를 인용해 마르베야 전지훈련도 어려워졌다고 전했다. 다음 날 뉴스 전달 글에도 겨울 전지훈련을 하지 않는다는 보도 요약이 실렸다. 이 부분은 수집본에 소개된 보도로 남겨 두며, 구단의 별도 공식 확정 발표로 바꾸어 쓰지는 않는다.\n\n중계 이야기는 더 세밀했다. 토요일 오후 경기와 저녁 경기, 일요일 경기의 선택권을 방송사가 어떤 순서로 행사하는지 묻고 답하는 대화가 이어졌다. 왜 더비를 토요일 오후에 편성할 수 없었느냐는 질문에서 시작해, 그 시간에 열리면 여러 경기를 함께 보여 주는 ‘콘퍼런츠’ 중계 속으로 묻히는 것 아니냐는 의견도 나왔다.\n\n그러자 그 콘퍼런츠를 어느 방송사가 내보내느냐는 문제가 다시 붙었다. 중계권을 가진 서비스가 갈라져 있으니, 예전의 익숙한 시간대만 보고 시청 경험을 짐작하기 어려운 것이다. 여러 경기를 화면에 나눠 보여 주는 멀티뷰가 그 빈자리를 충분히 메우는지에 대해서도 불만이 있었다.\n\n한 팬의 설명은 아주 구체적이었다. 작은 화면의 경기에서도 골을 놓쳤고, 큰 화면을 보느라 다른 쪽 득점을 놓치기도 했다는 것이다. 스코어를 확인하고 화면 사이로 눈을 옮겨도, 결국 한 경기에 시선이 고정됐다. 사방에서 움직임이 일어나니 오히려 혼란스럽고, 이렇게 볼 거면 단일 경기를 보는 편이 낫겠다는 반응이었다.\n\n그 와중에 누군가는 아테네전까지 DAZN이 필요 없겠다며 길게 기뻐했다. 곧 “더비가 일요일인데?”라는 답글이 붙었다. 경기장에 가니까 필요 없다는 뜻이냐는 질문도 나왔다. 빌라 원정을 아마존 프라임이 중계하는지는 확정됐느냐는 확인까지 이어졌다.\n\n결국 처음 쓴 팬이 계산을 풀어 놓았다. 더비·레버쿠젠·인테르가 들어 있는 12월은 이미 DAZN 한 달 구독에 넣어 두었다는 것이다. 나머지 기간에 몇 달을 추가로 결제해야 하는지가 관심사였다. 일정 발표를 읽고 있던 사람들 사이에, 자기 팀의 다음 상대보다 결제 시작일과 종료일을 먼저 맞추는 사람이 있었다. 게시판 속 중계 배정은 당시 팬들의 정보 교환이며, 여기서 현재의 시청 안내표로 다시 제시하지는 않는다.\n\n### 좋은 실적 옆에 붙은 수수료 질문\n\n분기 실적 발표에서 팬의 눈을 잡은 숫자는 인건비였다. 전년 같은 분기 6,610만 유로에서 5,270만 유로로, 1,340만 유로 줄었다. 연결 매출은 1억740만 유로로 전년의 1억700만 유로와 비슷했다. 구단은 전년 분기에 클럽월드컵 관련 특별 매출이 포함돼 있었다고 설명했다. [BVB의 2026/27시즌 1분기 잠정 실적](https://aktie.bvb.de/news/borussia-dortmund-meldet-vorlaeufige-zahlen-fuer-das-erste-quartal-q1-20262027/70965ea9-e97b-43b3-85fa-a02a481060a6)\n\n“되긴 되네”라는 반가운 반응 뒤에는, 작년 클럽월드컵 보너스가 인건비 차이에 영향을 줬을 수도 있다는 추측이 붙었다. 여기서 대화는 곧 몬테레이전을 보던 새벽으로 샜다. 진짜 팬이라면 새벽 3시에 일어났던 것을 기억할 거라는 말에, 진짜 팬은 그때 일어난 게 아니라 아예 안 잤다는 답이 달렸다.\n\n누군가 현장에 갔던 사람들도 있지 않았느냐고 묻자, 그쪽은 ‘이벤트 팬’이었다는 농담이 돌아왔다. 재무제표의 인건비 항목 아래서 갑자기 누가 더 열심히 응원했는지 장난스러운 자격시험이 열린 셈이다. 어느 쪽이 옳은 팬인지 가르는 논쟁으로 길어지지는 않았다.\n\n반면 SPORTFIVE와의 계약 연장은 더 진지하게 물고 늘어질 주제였다. 공식 발표상 협력은 2034년 6월 말까지 조기 연장됐다. 스폰서 유치와 관리, 새로운 마케팅 사업, 경기장 접객 상품 판매 등이 협력 범위에 들어간다. [BVB의 SPORTFIVE 계약 연장 발표](https://aktie.bvb.de/news/borussia-dortmund-und-sportfive-verlaengern-zusammenarbeit-bis-2034/5e45e928-19ac-41db-9830-fab9130edc02)\n\n팬들은 기존 계약도 아직 한참 남았는데 왜 벌써 연장했는지부터 궁금해했다. 또 한 번 현금이 들어온 것 아니냐는 추측, 대행사 입장에서는 자신들이 수수료를 받을 수 있는 기간이 충분히 보장돼야 먼 미래의 계약도 적극적으로 따올 수 있겠다는 추론이 나왔다. 둘 다 이번 계약의 공개된 대가를 확인한 설명은 아니다.\n\n한 팬은 유럽의 큰 구단 가운데 우리만 외부 마케팅 업체를 쓰고 거액의 수수료를 내는 것 같아 이상하다고 했다. 즉시 PSG와 레알 마드리드도 SPORTFIVE와 일하지 않느냐는 반박이 붙었다. 처음 문제를 제기한 팬은 자기 검색이 잘못됐을 수 있으며 AI가 또 틀린 것 같다고 물러섰다.\n\n흥미롭게도 다른 댓글에서도 과거 계약금과 약 20%라는 수수료 수준을 이야기하다가, 구글 AI로 조금 찾아본 것이니 보장할 수 없다는 단서가 붙었다. 계약을 비판하는 근거를 찾는 과정 자체에 불확실한 검색 결과가 끼어 있었고, 일부는 그 사실을 대화 안에서 드러냈다. 이 수수료 수치나 이번 연장에 따른 선지급금은 확인된 조건으로 받아들일 수 없다.\n\n그보다 구체적인 구분을 제시한 팬도 있었다. 스폰서를 새로 데려오는 일에 대가를 지급하는 것은 의미가 있지만, 대행사가 협상하지 않은 수입까지 수수료 대상으로 삼는다면 문제라는 것이다. 그는 옛 계약에서 방송 중계권 수입도 포함됐던 것으로 기억한다고 했다. 그 기억의 사실 여부와 별개로, 이 댓글이 따진 것은 외주 자체의 선악보다 어떤 수입에 어떤 대가를 내느냐였다.\n\n공식 발표의 장기 파트너십과 팬들의 불신은 서로 다른 지점을 보고 있었다. 구단 발표가 지속성과 사업 확대를 강조하는 동안, 이 대화의 팬들은 기간을 일찍 늘려 준 대가가 무엇이며 앞으로 벌 돈 중 얼마를 나누게 되는지 묻고 있었다.\n\n### 아홉 문제를 풀다가, 2부의 네 해를 다시 세었다\n\n엘버스베르크전을 앞두고 사이트가 올린 퀴즈는 아홉 문제였다. BVB가 분데스리가에서 처음 만나는 승격팀을 홈으로 맞는 것이 55번째라는 소개와 함께, 쓸모없는 술집 상식을 시험해 보라는 초대가 붙었다. 경기 전망을 진지하게 논하기 전 가볍게 풀어 볼 만한 곁가지였다.\n\n그런데 댓글에서는 곧 꽤 무게 있는 숫자 하나가 바로잡혔다. 분데스리가 창설 뒤 도르트문트가 2부 수준에서 보낸 시간은 세 해가 아니라 네 해라는 지적이었다. 1972년에 내려갔고 1976년에 올라왔으니, 레기오날리가 서부에서 두 시즌, 북부 2.분데스리가에서 두 시즌이다. 구단의 역사 자료도 네 해 뒤의 복귀를 확인해 준다. [BVB의 1976년 승격 회고](https://www.bvb.de/de/de/aktuelles/news/news.html/News/Uebersicht/Die-Rueckkehr-in-die-Bundesliga.html)\n\n정정을 요청한 팬의 문장은 건조한 연도 계산과 달랐다. “네 해. 세 해가 아니다. 안타깝게도.” 길고 때로는 쓰라린 시간이었지만, 자기에게는 구단 역사에서 가장 아름다운 결말을 가진 중요한 시기였다고 했다. 한 해라도 덜 겪었으면 모든 BVB 팬이 좋았겠지만, 그렇다고 기억에서 한 해를 빼 버릴 수는 없었다.\n\n퀴즈 작성자는 실수를 인정하고 수정했다고 답했다. 다른 참가자가 보기의 순서를 바꾼 뒤 해설의 선택지 표시가 맞지 않는 부분을 찾아냈을 때도 곧바로 고쳤다. 작은 글타래지만, 문제를 내는 사람과 푸는 사람이 함께 퀴즈를 완성하는 과정이 보였다.\n\n성적표에는 축구식 변명이 붙었다. 9문제 중 5개를 맞힌 팬은 5번까지는 잘 가다가 이후 ‘페터 보스식 붕괴’가 왔다고 했다. 4개를 맞힌 팬에게는 두 번의 50 대 50 선택에서 모두 틀렸다는 사정이 있었다. 전자는 잘 나가다 무너진 경기의 이름을 빌렸고, 후자는 사실상 두 번의 동전 던지기 패배를 호소했다.\n\n엘버스베르크라는 이름은 뜻밖에 당구로도 연결됐다. 한 팬이 토요일 스포츠쇼에서 축구보다 먼저 레몽 클루망의 스리쿠션을 보여 주던 때를 기억한다면 나이가 꽤 든 것일 거라고 했다. 클루망의 손자와 엘버스베르크 당구 클럽의 관계를 언급하면서 시작된 곁가지였다. 다른 팬은 캐롬의 다른 종목인 카드르도 방송했다며 기억을 보탰다.\n\n또 다른 댓글은 당시 방송도 엘버스베르크도 기억나지 않지만 클루망이라는 이름을 들으면 귀에서 뭔가 울린다고 했다. 이명은 아니지만 분명 나이 탓인 것 같다는 농담이었다. 승격팀을 공부하러 들어온 퀴즈에서 오래된 축구 팬들이 옛 스포츠 방송 편성표까지 꺼내 들었다.\n\n### 심판의 말투와 원정팀의 식탁\n\n뉴스 글타래의 또 다른 옆길은 경기장 안의 소리를 담은 영상이었다. 영상을 올린 팬은 경기 분석 글타래를 찾지 못했다며 뉴스 사이에 끼워 넣었다. 키미히에 대해서는 성가시다는 반응이 나왔고, 심판 앞에 서 있지 않았던 3분만 골라 편집한 것 아니냐는 농담도 붙었다.\n\n하지만 영상에서 속도와 공간을 본 팬도 있었다. TV나 관중석에서는 늘 그렇게 느껴지지 않지만, 실제로는 시간이 너무 적고 움직임이나 몸 방향이 조금만 어긋나도 공을 잃는다는 것이다. 그는 파브르가 패스의 세기와 어느 발로 보내는지를 중시했던 이유를 연결했다. 벨링엄의 볼 손실을 두고 다투던 같은 뉴스 글타래에, 그 볼 손실이 생기는 시간의 압박을 새삼 체감한 감상도 들어 있었다.\n\n심판들의 대화법에 대한 인상은 조금 더 호의적이었다. 한 팬은 다른 영상에서 본, 2–0으로 앞서는 선수를 향한 직설적인 질책을 떠올리며 심판들이 예상보다 덜 거만하고 선수들과 자연스럽게 이야기한다고 했다. 다른 댓글은 지금도 권위적인 심판은 있지만 예전보다 줄었다는 자신의 인상을 보태고, 판정을 설명해 수용을 얻는 능력도 중요해졌다고 봤다.\n\n그 사이 “팬들의 감사를 받는 일이니 좋겠다. 심판 판정이 비판받은 게 마지막으로 언제였는지 기억도 안 난다”는 반어도 놓치지 않았다. 영상 속 소통에는 호감을 느껴도, 심판을 향한 축구 팬의 평소 말버릇까지 갑자기 사라지지는 않았다.\n\n다음 날 아침에는 보되·베를린·바쿠 원정을 다룬 구단 다큐멘터리를 봤다는 글이 올라왔다. 소개한 팬에 따르면 약 70분짜리 영상에서 90분의 경기를 준비하기 위한 물류가 인상적이었다. 특히 노르웨이와 아제르바이잔으로 식재료 일부까지 가져간 대목에 놀랐다고 했다.\n\n답글을 쓴 팬은 다른 데 눈이 갔다. 선수들이 먹는 음식이 예상보다 평범하다는 것이다. 더 엄격한 식단일 줄 알았지만, 그러면 선수들이 충분히 먹지 않을지도 모르겠다고 했다. 세 원정을 모두 함께한 사람들에게 메달을 준 장면도 좋았다고 덧붙였다. 이 부분은 영상을 직접 검토한 서술이 아니라 수집된 두 감상 글이 전하는 내용이다.\n\n대표팀에 뽑힌 미드필더의 슈팅과 구단의 수수료를 따지던 게시판은, 아침이 되자 원정 짐 속 식재료와 지원 인력의 메달을 이야기하고 있었다. 그 뒤 11월 7일 뉴스 글타래에는 다시 기사 링크들이 차곡차곡 올라왔다. 이번에 읽은 대화는 엘버스베르크전의 결과까지 가지 않는다. 그 경기를 기다리는 팬들의 마지막 풍경은, 좋은 소식에도 계산할 것은 계산하고 작은 뒷이야기에는 잠깐 시선을 주는 쪽에 가까웠다.\n\n<details><summary>범위와 근거<\/summary>\n\n이 원고는 실행 2026-11-07_153938에 제공된 수집본만을 팬 반응의 근거로 삼았다. 대상은 11월 5·6·7일 뉴스 글타래, 엘버스베르크전 퀴즈, 경기 중계 안내, U19 소식 소개, 베티스전 리뷰 소개 등 7개 글타래다. 수집 집계는 새 글 147개, 익명 작성표시 62종이며, 가장 많이 나타난 표시의 글 비중은 20%다. 작성표시는 실제 사람 수를 확정하지 않으며, 뉴스 전달 글과 인용이 반복된 답글도 포함된다. 따라서 글 수를 찬반 득표나 커뮤니티 전체 여론으로 환산하지 않았다.\n\n일부 발췌는 문장 중간에서 잘려 있어 확인되는 부분까지만 사용했다. U19 글타래는 기사 소개 한 개여서 별도의 현지 반응으로 확장하지 않았다. 중계 안내의 국가별 목록도 팬들의 감정이나 논쟁을 보여 주는 자료가 아니므로 옮겨 싣지 않았다. \n\n외부 검색은 수집본에 등장한 사실의 확인과 필요한 식별에 한정했다. 본문의 링크는 잉글랜드축구협회의 대표팀 발표, BVB의 베티스전 보고서·챔피언스리그 대진 안내·재무 및 계약 공시·구단 역사 자료, 분데스리가의 쿠토 임대 발표다. 확인되지 않은 이적 금액, 조기 지급안, 계약 수수료와 선지급금 추정, 전지훈련 관련 보도 및 영상 감상은 각각 팬이 전한 보도·추측·제안·감상으로 귀속했다. 인용한 팬 발언은 제공된 독일어의 의미를 옮겼으며 이용자 이름과 계정은 싣지 않았다.\n\n<\/details>\n\n## 5ch 해외축구 | 일본\n\n이번에는 11월 5~7일 수집된 일본 5ch 해외축구 게시판 52개 글타래, 새 글 920개의 제공분을 읽었다. 유럽 구단별 대화와 일본 해외파 선수 이야기를 함께 살폈다.\n\n**개관**\n\n- 구보의 리옹전 결장은 출전 경쟁을 둘러싼 논쟁을 겨울 이적 이야기로 옮겨 놓았다. 결장과 감독 발언은 확인되지만, 이적 합의나 구단의 배제 지시는 확인되지 않았다.\n- 브라이턴에서는 헤타페 원정 승리를 지켜본 전술 토론과 미토마의 복귀를 기다리는 조급함이 나란히 흘렀다. 같은 선수를 보고도 활동량과 공격 기여를 다르게 평가했다.\n- 맨유·첼시·아스널에서는 잉글랜드 대표팀 명단이 서로 다른 감정을 건드렸다. 휴식이 반가운가, 대표 선수가 줄어든 현실이 서글픈가.\n- 스즈키 자이온의 월간 선방상 후보 선정은 공식 발표로 확인됐다. 빅클럽 관심설은 게시판 안에서도 보도의 출발점을 다시 따져 보는 중이었다.\n- 레알의 비니시우스, 리버풀의 소보슬라이를 둘러싼 대화에는 예전에 좋아했던 플레이를 다시 보고 싶다는 마음이 짙었다. 밀란에서는 유럽대항전을 포기하자는 말조차 편하게 나오지 않았다.\n\n---\n\n### 구보가 뛰지 않은 경기에서, 가장 많이 이야기된 것은 구보였다\n\n레알 소시에다드와 리옹은 1-1로 비겼고 구보 다케후사는 출전하지 않았다. 경기 뒤 마타라초 감독은 구보의 재능을 인정하면서도, 주어진 시간의 기여가 더 많은 출전시간으로 이어져야 한다고 설명했다. 수비 때 다섯 명을 세우는 배치에도 구보가 가장 적합한 유형은 아니라는 취지였다. 이 결장과 발언이 이번 구보 관련 글타래들의 출발점이다. [소시에다드 공식 경기 보고](https://www.realsociedad.eus/fr/nouvelles/detail/match-nul-et-on-continue-d-avancer), [경기 후 기자회견 현장 보도](https://www.eldesmarque.com/futbol/europa-league/20261105/pellegrino-matarazzo-palo-take-kubo-tres-lesionados-covid-real-sociedad_18_020636653.html?amp=true)\n\n반응은 응원 글타래와 별도의 본스레에서 크게 갈렸다. 비판 쪽에서는 감독의 설명을 그동안 해 온 주장에 대한 확인으로 받아들였다. 공을 잡았을 때의 기술보다 압박 복귀, 뒷공간 침투, 다른 공격수가 움직일 공간을 만드는 일이 부족하다는 것이다. 파블로 마린이 득점하지 못해도 먼저 선택되는 이유를 여기서 찾았다. 오야르사발과 수치치가 편하게 뛰도록 하는 일까지 받아들여야 출전이 늘어난다는 글도 있었다.\n\n응원 글타래에서는 같은 설명이 선뜻 납득되지 않았다. 한 골이 필요한 경기에서 수비 배치의 적합성을 이유로 들고, 교체 카드도 남겼다는 데 불만이 모였다. 다른 측면 자원들이 구보보다 훨씬 많은 시간을 받을 만큼 잘했느냐는 비교도 이어졌다. 이들에게 문제는 구보에게 요구되는 조건 자체보다, 그 조건이 누구에게나 똑같이 적용되는지였다.\n\n그 불만을 가장 선명하게 드러낸 것은 한 글의 계산이었다. 구보는 출전한 경기에서 골이나 도움을 기록하지 못하면 다음 경기에 아예 못 나온다는 식이라면, 음바페도 이번 시즌 여러 경기를 벤치에서 보내야 한다는 주장이다. 실제 선발 원칙을 입증하는 계산은 아니지만, 응원하는 쪽이 느끼는 기회의 불균형은 잘 전해진다. 한 번의 기회에서 반드시 숫자를 남겨야 한다면, 경기력을 회복할 연속 출전은 어디서 얻느냐는 불만이다.\n\n이 와중에 기사에 등장한 ‘팀 내 18위’도 빠르게 번졌다. 비판 글에서는 곧바로 구보의 새 별명처럼 쓰였지만, 다른 글이 이것은 출전시간 순위라고 짚었다. 감독이 매긴 능력 순위나 포지션별 서열과 같은 숫자는 아니다. 그 설명이 나온 뒤에도 ‘18번째 선수’라는 표현은 조롱에 쓰였다. 짧고 강한 숫자 하나가 원래의 의미보다 먼저 돌아다니는 장면이었다.\n\n겨울 이적 이야기 역시 양쪽에서 나왔다. 응원 쪽은 이제 출전하려면 떠나야 한다는 방향으로 기울었고, 비판 쪽은 지금 상황에서 어떤 구단이 얼마를 내겠느냐고 물었다. 한쪽이 높은 이적료 때문에 움직이기 어렵다고 하면, 다른 쪽은 전력에서 밀어냈다면 가격을 낮춰서라도 팔아야 하는 것 아니냐고 맞받았다. 선수의 가치가 낮다는 말과 비싸서 못 판다는 말을 동시에 할 수 있느냐는 공방이다.\n\n리버풀의 과거 거액 제안설도 다시 등장했지만, 이번 확인에서는 구체적인 공식 제안으로 확정할 근거를 확보하지 못했다. 경영진이 출전을 막고 있다거나 계약상의 특수한 사정 때문에 겨울 이적이 예상된다는 설명도 글쓴이들의 추측이다. 다만 응원 글타래에서 ‘어디로 갈까’가 ‘왜 안 쓸까’를 밀어내기 시작한 변화는 분명했다. 새 글타래에는 최근 다른 SNS를 보니 온통 이적 이야기였다는 반응과, 리옹전을 계기로 관망하던 사람들도 떠나는 쪽으로 돌아섰다는 관찰이 연달아 올라왔다. 이것은 그 글쓴이들이 본 주변의 변화다.\n\n곁에서는 소시에다드의 일본 내 행사와 사업 이야기도 섞였다. 구보를 쓰지 않으면서 일본에서는 구보의 인기를 기대하느냐는 불만이다. ‘구보 없이도 소시에다드를 계속 응원할 것인가’라는 질문이 출전 문제 뒤에 붙어 있었다. 구단을 따라온 사람과 선수를 따라온 사람의 관계가, 벤치에 앉아 있는 시간만큼 더 예민해졌다.\n\n### 사토에게도 같은 말이 왔다. 그래서 더 억울하다는 사람들\n\n발렌시아의 사토 류노스케 글타래에서도 공이 없을 때의 플레이가 쟁점이었다. 아기레 감독은 공식 기자회견에서 사토가 볼을 가졌을 때 보여 주는 개성과 경쟁력을 볼이 없을 때도 더 보여 줘야 한다고 설명했다. 동시에 노력과 발전을 평가하며 기회를 주겠다고 했다. [발렌시아 공식 기자회견](https://www.valenciacf.com/javier-aguirre-espero-a-un-mestalla-que-de-miedo-y-apriete-nosotros-hemos-de-corresponderles-en-el-terreno-de-juego)\n\n글타래에서는 이 발언을 구보의 처지와 연결하는 반응이 나왔다. 공격 기술만으로는 자리를 얻기 어렵다는 해석이다. 반면 사토를 지켜본 쪽에서는 다른 공격수보다 수비에 더 애쓰는 모습을 봤는데 왜 사토에게 이런 주문이 나오느냐고 했다. 감독이 요구하는 적극성이 무엇인지, 팬이 눈으로 세는 성실함과 얼마나 겹치는지를 두고 시선이 어긋났다.\n\n여기에 코번트리의 사카모토 다쓰히로가 비교 대상으로 등장했다. 공격 때 박스에 들어가고 수비 때 끝까지 돌아오는 선수를 보라는 주장에, 다른 글이 나이부터 고려해 달라고 했다. 서른 살 사카모토, 스물다섯 구보, 올해 스무 살 사토를 한 줄에 놓고 같은 완성도를 요구할 수 있느냐는 것이다. 답변은 다시 스페인 중하위권 팀의 몸싸움에 적응하지 못하면 어렵다는 쪽으로 돌아갔다.\n\n잔류해서 기회를 증명하자는 기대와, 겨울에 임대로라도 경기를 뛰어야 한다는 의견이 함께 있었다. 제공 자료에는 컵대회에 남아 뛰려 한다는 현지 보도 소개도 있었지만 날짜와 상대 안내가 서로 엇갈렸다. 이 글타래가 기다리는 것은 달력의 확정보다 단순했다. 감독이 예고한 기회가 실제 출전으로 이어지는 순간이다.\n\n### 새벽 다섯 시의 브라이턴, 누가 어디서 뛰는지부터 맞춰 보자\n\n브라이턴 글타래는 경기 전부터 분주했다. 헤타페 원정을 앞두고 여러 포지션을 소화하는 선수가 많다 보니 선발 명단만으로 배치를 읽기 어렵다는 말이 나왔다. 한 글이 선수들을 줄별로 놓아 예상 대형을 만들고, 다른 글들은 힌셜우드가 왼쪽인지, 하잠이 더 높은 위치인지 짚었다. ‘다들 은근히 여러 군데를 할 수 있다’는 감탄에는 편리함과 혼란이 같이 들어 있었다.\n\n브라이턴은 얄쿠예의 골로 1-0 승리를 거뒀다. [브라이턴 공식 경기 기록](https://staging.brightonandhovealbion.com/match-centre?gameId=2685863)\n\n그 골의 주인공을 보는 눈은 일치하지 않았다. 경기 뒤 한 글은 얄쿠예가 90분 내내 뛰어다녀 든든했다고 평가했다. 다른 글은 거의 보이지 않았던 것 아니냐고 되물었다. 오른쪽 공격이 살아 있지 않았고, 측면에 선 얄쿠예가 윙어다운 공격을 만들지 못했다는 관찰이었다. 이어진 답변에서는 오른쪽에 오스만 대신 얄쿠예를 둔 이유를 빌드업과 안정성으로 해석하면서도, 역시 중앙에 있는 편이 좋겠다고 정리했다.\n\n이 대화는 단순히 득점자를 칭찬할지 말지의 문제가 아니었다. 넓게 움직여 팀을 받쳐 준 것을 먼저 본 사람과, 그 자리에서 나와야 할 공격이 빠진 것을 먼저 본 사람이 있었다. ‘열심히 뛰었다’와 ‘측면 공격이 잘 돌아갔다’는 평가가 같은 뜻으로 쓰이지 않았다.\n\n보스칼리에게는 몇 개의 다른 작성표시에서 불안하다는 반응이 반복됐다. 반대로 페르브뤼헌은 그가 없으면 팀이 위험하겠다는 식의 신뢰를 받았다. 교체로 들어간 오스만을 두고는 기회를 더 주라는 바람에서 시작해, 마무리와 왼발 사용에 대한 아쉬움으로 끝났다. 승리한 날에도 팬들의 눈은 다음 리그 경기에서 믿고 쓸 수 있는 선수에게 가 있었다.\n\n작은 해프닝도 있었다. 스보보다가 전반 뒤 교체된 줄 알았다는 글에, 끝까지 뛰었고 후반에 경고도 받았다는 답이 달렸다. 그러자 질문한 쪽이 중간부터 따라잡아 보던 영상을 실시간 중계로 착각했다고 털어놓았다. 교체 정보까지 검색하다 혼란스러워졌던 사정이 그제야 풀렸다. 새벽 경기를 보는 사람들끼리의 짧은 정정과 감사였다.\n\n오라일리가 경기 막판 압박을 위해 투입된 모습을 보고는 마음이 짠했다는 글이 올라왔다. 공식 기록상 투입은 89분이었다. 글쓴이는 전술 이해나 강도가 더 올라오면 기회가 늘겠지만, 제한된 시간만 받으면서 동기를 유지하기 쉽지 않을 것이라고 봤다. 선발을 바꾸라는 요구보다, 지금의 짧은 역할을 견디는 선수에게 시선이 머문 반응이었다.\n\n미토마 이야기가 나오자 온도는 다시 달라졌다. 복귀가 자꾸 늦어진다는 탄식에, 원래 알려진 시점이 그랬다는 반박이 붙었다. ‘반년 정도인데 훨씬 오래 못 본 느낌’이라는 글에는 시즌이 바뀌는 동안 팀과 선수들이 많이 달라져 더 그런 것 같다는 답이 돌아왔다. 기다리는 시간이 단순한 부상 기간보다 길게 느껴진다는 데는 공감이 있었다.\n\n당시 구단이 공개한 설명도 복귀를 기다리는 단계였으며, 확정된 복귀 경기로 받아들일 수는 없었다. [브라이턴 공식 부상 업데이트](https://www.brightonandhovealbion.com/media-article/mft-match-preview-bha-crystal-palace-pl-october-2026)\n\n유럽대항전에서 조금씩 적응하면 좋겠다는 기대에는 등록 문제가 끼어들었다. 글타래에서는 미토마가 리그 페이즈 명단에 없다는 지적이 나왔고, 이를 잊었다고 인정하는 답변도 있었다. 미나미노와 만나는 장면을 먼저 떠올린 사람과 출전 자격부터 생각한 사람이 같은 복귀를 기다리고 있었다.\n\n### 스즈키의 선방은 후보에 올랐고, 이적설은 출처를 거슬러 올라갔다\n\n스즈키 자이온 글타래에는 반가운 공식 소식이 있었다. 풀럼전 선방이 프리미어리그 10월 월간 선방상 후보에 오른 것이다. 구단 발표로 확인되는 내용이다. [애스턴 빌라 공식 발표](https://www.avfc.co.uk/news/2026/november/05/news-save-of-the-month-recognition-for-suzuki/)\n\n팬들의 반응에는 안도감이 섞였다. 최근 실수 때문에 아무것도 없을 줄 알았는데 좋은 장면도 봐 줬다는 말이었다. 투표할 수 있느냐는 질문에 다른 글이 구단의 안내를 찾아 줬고, 곧 일본에서 몰려가 투표하는 것은 부끄럽다는 반대가 나왔다. 다른 나라에서도 하는 일이라는 답도 붙었다. 누군가는 최근 실점과 실수 뒤 글타래가 조용해졌으니 몰표를 걱정할 상황도 아닐 것이라고 했다. 이 조용해졌다는 체감은 실제 방문자 통계가 아니라 참여자들의 관찰이다.\n\n경기 내용으로 들어가면, 짧은 패스의 위험을 어디에 귀속할지가 갈렸다. 스즈키가 발기술을 믿고 낮은 위치에서 위험을 과하게 감수한다는 평가가 있었다. 다른 쪽은 상대가 빌라의 빌드업 약속을 노린 것이므로 팀의 대응 문제로 봐야 한다고 했다. ‘이제 피드까지 통하지 않을 것’이라는 비관에는, 한 번 공략당한 방식과 선수의 배급 능력 전체를 왜 묶느냐는 반박이 나왔다.\n\n해결책을 길게 만들지 않는 글도 있었다. 앞에서 압박이 몰려오면 뒤쪽 어딘가에는 사람이 줄어드니, 연결할 때와 멀리 걷어낼 때를 더 잘 나누면 된다는 의견이다. 이 글타래에서는 발밑의 장점이 사라졌다는 진단보다, 그 장점을 얼마나 자주 위험에 노출할 것인가를 놓고 다투고 있었다.\n\n그리고 빅클럽 관심설이 도착했다. 처음에는 BBC에 레알·PSG·프리미어리그 구단들의 관심 기사가 떴다는 소개였다. 이후에는 보도의 출발점이 TEAMtalk였다는 설명과 함께 신뢰도를 낮춰 받아들이자는 글이 올라왔다. 일본 매체의 강한 제목이 더 붙었지만 공식 제안이나 협상 확인으로 넘어가지는 않았다.\n\n흥미로운 것은 기대가 커진 속도만큼, 같은 자리에서 출처를 되짚는 움직임도 보였다는 점이다. 후보 구단의 골키퍼 사정을 나열하며 가능성을 상상하는 사람과, 일단 어떤 매체에서 시작됐는지 확인하는 사람이 있었다. 월간 선방상 후보라는 확인된 칭찬과, 다음 유니폼에 대한 상상이 같은 글타래에서 다른 무게로 오갔다.\n\n### 대표팀에 아무도 안 가면 좋은 일인가\n\n맨유 글타래에 잉글랜드 대표팀 발탁 선수가 없다는 소식이 올라오자, 대표팀은 벌칙 같은 일정이니 이쪽에서 사양한다는 답이 달렸다. 곧 다른 글이 그걸 기뻐하고 있으면 정말 중위권 구단이 될 것 같다고 했다. 이번 공식 명단에는 맨유 선수가 없고, 벤 화이트는 포함돼 있다. 콜 파머는 명단에 없다. [잉글랜드 대표팀 공식 명단](https://www.englandfootball.com/articles/2026/Nov/06/england-senior-mens-squad-announcement-for-croatia-spain-games-20261106)\n\n같은 불참을 첼시 글타래에서는 비교적 실용적으로 받아들였다. 파머가 가지 않으면 부상 위험이 줄고 구단에는 도움이 된다는 것이다. 다만 선수 본인이 대표팀에 얼마나 미련을 갖는지는 모른다는 조건이 붙었다. 투헬 체제에서는 계속 어렵지 않겠느냐는 걱정도 있었다. 발탁되지 않은 이유가 감독의 감정 때문이라는 설명은 팬들의 추정으로 남았다.\n\n맨유의 짧은 충돌은 더 쓰렸다. 쉬어서 좋다는 말은 당장의 이익을 계산한다. 대표팀에 보낼 선수가 없다는 사실이 괴롭다는 말은 클럽의 위상을 생각한다. 둘 다 다음 경기에서 이기고 싶은 팬의 말이지만, 하나는 남은 선수의 몸을 보고 하나는 사라진 자부심을 봤다.\n\n이 자부심 문제는 감독과 유망주 이야기로 이어졌다. 여러 감독이 오지 않으려 한다는 보도 소개와 JJ 가브리엘을 잃을지 모른다는 불안이 돌자, 개별 선수의 잠재력보다 구단이 붙잡지 못한다는 사실 자체가 문제라는 반응이 나왔다. 이번 자료에서 거론된 감독 후보들의 거절이나 유망주의 이동은 확정 사실로 정리할 수 없다. 글타래의 핵심 감정은 누가 오느냐보다, 이제 맨유가 누구에게 매력적인 곳이냐는 의심이었다.\n\n그 와중에 ‘지금 맨유에서 트레블을 하면 틀림없이 발롱도르’라는 말에는 이견 없이 동의하는 답이 붙었다. 농담은 짧았지만, 팬들이 생각하는 과제의 난도는 충분히 전해졌다.\n\n아스널에서는 화이트가 대표팀에 갈 만큼 잘했느냐는 토론이 이어졌다. 부상도 잦아졌고 최근 경기력이 특별히 좋지는 않다는 평가에, 팀 내부의 요구 수준이 너무 높은 것 아니냐는 답이 나왔다. 공격에서의 기여와 복잡한 풀백 역할을 생각하면 충분히 잘하고 있다는 쪽이었다. 팀버를 언제나 먼저 쓰는 상황도 아니라는 관찰이 붙었다.\n\n화이트를 둘러싼 이 대화는 맨유와 다른 여유를 드러냈다. 한두 번의 수비 불안을 공격 기여와 함께 계산할 수 있었고, 상대에 따라 다른 선수를 쓰는 선택도 이야기할 수 있었다. 대표팀 발탁이 구단의 생존이나 몰락을 상징하는 데까지 가지 않았다.\n\n두 구단 글타래는 감독을 길러 내는 옛 선수들의 계보에서도 만났다. 맨유 쪽에서는 퍼거슨 밑에서 뛴 선수들이 왜 감독으로는 기대에 못 미치느냐는 불만이 나왔고, 아스널에서는 벵거를 거친 지도자들의 성과가 화제가 됐다. 하지만 아스널 안에서도 앙리·비에이라·아담스까지 모두 성공했다고 할 수는 없다는 반론이 있었다. 비에이라를 실패로 묶는 것은 과하다는 답도 나왔다.\n\n앙리의 선수 시절 능력이 오히려 지도에 걸림돌이 되는 것 아니냐는 이야기는 오래된 모나코 시절 일화로 흘렀다. 거기서 누군가 판 페르시도 벵거 문하에 넣어도 되느냐고 물었다. 맨유와 아스널 양쪽에 걸친 경력 하나가, 감독 육성의 우열을 겨루던 대화를 잠깐 느슨하게 만들었다.\n\n### 리버풀은 예전의 소보슬라이를 찾고 있었다\n\n리버풀 글타래에서 소보슬라이를 향한 불만은 거셌다. 중앙에서 경기를 지휘하려 하기보다, 원래의 운동량과 전진 능력을 살려야 한다는 주장이 여러 글에 나타났다. 코너킥을 둘러싼 불만 표출로 소개된 영상은 주장단 역할과 태도 이야기까지 불렀다. 그 장면만으로 선수의 성격이나 동료 관계를 확정할 수는 없지만, 글타래에서는 전술상의 불만이 쉽게 인물 평가로 번지고 있었다.\n\n그중 유독 구체적인 그리움이 있었다. 첫해에 측면을 빠르게 달리고, 90분이 지난 뒤에도 두 번 세 번 쫓아가며 압박하던 짧은 머리의 소보슬라이를 잊을 수 없다는 글이다. 그때는 발베르데 같은 선수가 될 수 있다고 생각했다는 말이 뒤따랐다. 지금 중앙에서 공을 오래 만지는 모습에 대한 불만은, 좋아했던 장면을 아직 선명하게 기억하기 때문에 더 컸다.\n\n전술 변경 속에서 선수가 어려움을 겪는다는 해석도 있었다. 원하지 않는 부서로 옮겨지면 당신들도 의욕이 떨어지지 않겠느냐는 비유가 답으로 붙었다. 오른쪽이나 풀백에서 장점을 살리자는 의견에는 그 역할의 요구가 높은데도 선수들이 선호하지 않는다는 이야기가 이어졌고, 뒤로 갈수록 급여가 낮아지기 때문 아니냐는 말에는 리버풀의 고액 연봉자는 센터백이라는 반박이 나왔다. 위치 하나를 바꾸자는 제안이 보상과 체면 문제까지 건드렸다.\n\n수비 불안의 해법도 갈렸다. 파비뉴처럼 중원에서 공을 빼앗아 줄 선수가 필요하다는 주장에, 요즘은 수비만 잘해서는 어렵다는 답이 붙었다. PSG의 중원을 예로 들며 몸싸움 능력 몇 가지보다 위치와 팀 전체 균형이 중요하다는 의견도 있었다. 곧 다른 글은 그 선수들의 수비력을 너무 낮게 보는 것 아니냐고 맞받았다.\n\n공격 실험을 보는 태도에도 차이가 났다. 바르콜라를 중앙에 쓰는 식의 시도 때문에 경기를 놓쳤다는 비판에, 다른 글은 오른쪽의 은구모하나 각포도 처음에는 예상 밖이었지만 다른 장점을 보였다고 했다. 실험은 허용해야 하고, 정말 예상 밖이었던 것은 수비진의 부실이었다는 설명이다. 같은 패배의 원인을 감독의 한 수에서 찾는 사람과, 새 역할이 자리 잡을 시간을 주려는 사람이 맞서 있었다.\n\n### 비니시우스를 기다리는 마음과, 기다림이 끝났다는 마음\n\n레알 마드리드 글타래에서는 비니시우스의 리그 복귀를 반기지 않는 반응이 눈에 띄었다. 출전정지 뒤 돌아오면 잘 돌아가는 팀을 다시 바꾸게 되는 것 아니냐는 걱정이었다. 반대로 이대로 끝날 선수는 아니라고 믿는 글도 있었다. 그 말에 이제 끝났으면 좋겠다는 답이 바로 달릴 만큼 온도 차가 컸다.\n\n무리뉴는 11월 6일 기자회견에서 비니시우스를 위해 팀에 손해를 줄 수는 없다는 입장을 밝혔다. 선수와 계속 일해야 한다는 설명도 함께였다. [유로파프레스 기자회견 보도](https://www.europapress.es/deportes/futbol-00162/noticia-mourinho-vinicius-nunca-voy-perjudicar-equipo-beneficiar-jugador-20261106111329.html)\n\n글타래의 흥미로운 갈림길은 비니시우스의 기술을 인정하느냐에 있지 않았다. 한 팬은 하드워크와 연계 같은 복잡한 요구를 개인 능력으로 눌러 버리는 마드리드가 좋다고 했다. 다른 팬은 최근 10년 중 가장 좋았던 기억으로 ‘마법의 밤’을 들면서, 모두가 수비하고 공격한 뒤 마지막에 개인기가 나왔던 팀을 떠올렸다. 같은 레알의 기억에서 한쪽은 개인의 압도적인 힘을, 다른 쪽은 그 힘에 도달하기까지의 공동 작업을 꺼냈다.\n\n비니시우스는 원래 공격만 하도록 자랐으니 이제 수비까지 요구받으면 균형을 잡기 어려울 것이라는 설명에도 반박이 붙었다. 벤제마가 있을 때는 부서질 것처럼 뛰었다는 기억이다. 벤제마의 득점 세리머니에서 비니시우스가 구두를 닦아 주던 모습까지 소환됐다. 지금 팬들이 찾는 것은 새로운 재능보다, 한때 그 재능과 함께 있었다고 기억하는 태도였다.\n\n그럼에도 ‘비니시우스가 공을 잡으면 설렌다’는 한 문장은 남았다. 곧 ‘예전에는’이라는 답이 붙었지만, 기다리는 이유 자체는 짧게 설명됐다. 최근 경기력에 실망하는 팬과 그 선수가 주던 재미를 놓기 싫은 팬은 때로 같은 사람일 수도 있겠다는 생각이 드는 대목이다.\n\n### 밀란, 유로파를 버렸다고 하기에도 개운하지 않다\n\n밀란은 홈에서 페렌츠바로시에 0-2로 졌다. 상대 구단 공식 자료에서도 확인되는 결과다. [페렌츠바로시 공식 경기 정리](https://www.fradi.hu/labdarugas/elso-csapat/hirek/a-ferencvaros-atviharzott-a-san-siron-lapszemle)\n\n글타래에는 유로파리그를 포기하고 리그의 챔피언스리그 출전권에 집중하자는 의견이 나왔다. 처음에는 리그 페이즈에서 바로 통과하기 어렵겠다고 생각했는데 이제 플레이오프도 걱정해야 하느냐는 탄식도 있었다. 기대치를 낮추는 속도에 팬 자신이 놀란 셈이다.\n\n하지만 로테이션 때문에 생긴 패배라고 정리하면 교체가 걸렸다. 주전을 아꼈다면서 하프타임과 후반 중간에 다시 주요 선수들을 넣었다면, 처음부터 무엇을 얻으려던 경기였느냐는 비판이다. 대회를 버린 것도, 체력을 온전히 아낀 것도 아니라는 불만이었다.\n\n후방에서 차근차근 연결하려는 방식도 도마에 올랐다. 그 수비진과 중원에 같은 빌드업을 시킨 것이 경기 리듬을 망쳤다는 주장, 야샤리를 오른쪽 중앙에서 레지스타처럼 쓰지 말라는 주문이 나왔다. 야샤리에게 긴 패스가 장점이라는 기대가 있었는데 이제 무엇이 강점인지 모르겠다는 반응도 있었다.\n\n마지막에는 밀란에서 기대에 못 미친 미드필더들의 이름이 줄줄이 나왔다. 야샤리, 리치, 빌리아, 베르톨라치, 폴리, 도라소. 제목은 ‘밀란의 3대, 너는 대체 뭘 할 수 있느냐 미드필더’였는데 명단은 여섯 명이었다. 세 자리로는 도저히 끝나지 않는 불만이었다.\n\n### 케인은 남았고, 코모에서는 돈을 잘 쓰는 법을 다퉜다\n\n바이에른에서는 케인의 2029년까지 재계약이 화제였다. 구단이 공식 발표한 계약이다. [바이에른 공식 발표](https://fcbayern.com/en/news/2026/11/harry-kane-extends-with-fc-bayern-until-2029)\n\n반응은 환영 일색으로만 흐르지 않았다. 최근 골이 잘 나오지 않는다는 체감과 나이를 생각하면 이 기간이 괜찮으냐는 질문이 있었다. 다른 쪽은 수비, 아래로 내려와 하는 전개, 긴 패스와 리더십을 들었다. 골이 잠시 멈춰도 팀에 남겨 주는 것이 많다는 평가다. 한 글은 드리블을 빼면 말년의 메시 같은 느낌이라고 표현했다. 케인에게 기대하는 일이 이미 마무리만은 아니라는 뜻이었다.\n\n유럽대항전에서는 PSG를 결승 전까지 만나지 않았으면 한다는 마음과, 이제 매년 만나서 지겹다는 반응이 함께 나왔다. 레알·아스널·PSG가 반대편 대진에서 서로 싸워 줬으면 좋겠다는 바람도 있었다. 강팀 팬의 계산이라고 해서 상대가 무섭지 않은 것은 아니었다.\n\n여섯 개 새 글이 올라온 코모 글타래의 논쟁은 훨씬 짧고 명료했다. 결국 돈이라는 말에, 돈을 쓰는 솜씨가 대단하다는 답이 왔다. 그러자 그 영입도 돈이 없었으면 불가능하지 않았느냐고 되물었다.\n\n옹호한 쪽은 개별 이적료를 들어, 다른 부자 구단도 쓸 수 있는 돈으로 좋은 선수를 고르는 능력이 중요하다고 설명했다. 그 수치들은 이번에 독립 확인한 영입 장부가 아니라 글쓴이가 제시한 논거다. 이어 브라이턴과 비슷한 영입 감각이라는 평가가 붙었다. 다툼 끝에도 ‘돈이 없으면 그 정도 선수도 못 산다는 뜻이라면 그건 그렇다’는 인정은 남았다. 돈의 필요성에는 합의하면서, 돈만으로 설명하면 빠지는 부분을 붙잡은 대화였다.\n\n### 호날두의 대표팀 은퇴 뒤, 다음에 좋아할 선수를 고르는 사람\n\n호날두의 포르투갈 대표팀 은퇴 발표는 여러 글타래로 번졌다. 11월 5일 발표 자체는 확인된다. 클럽을 포함한 선수 생활 전체의 은퇴와는 구분되는 소식이다. [AP의 은퇴 보도](https://apnews.com/article/155900d1438b4b2ca2d3a2d0843fb7f0)\n\n메시와 호날두를 비교하는 글타래에서는 마지막 인사도 기존 경쟁의 연장으로 소비됐다. 대표팀에서 밀려난 끝이라는 해석과 스스로 마무리한 것이라는 평가가 충돌했고, 팬들이 얼마나 빨리 반응했는지, 누가 어느 글타래에 먼저 썼는지까지 싸움거리가 됐다. 은퇴를 둘러싼 감정이 상대 팬의 반응을 확인하는 일로 옮겨간 것이다. 여기서 오간 퇴출·징계·사과 관련 세부 주장들을 모두 확인된 사실로 묶을 수는 없다.\n\n별도로 스타가 줄어든다는 글타래에서는 조금 다른 허전함이 보였다. 월드컵에서 늘 보던 얼굴들이 하나씩 사라진다는 말, 예전 스타들만큼의 실력이 없다는 불만, 실력만 놓고 보면 지금이 더 높다는 반박이 나왔다. 기억 속 스타의 크기와 현재 선수의 능력을 같은 자로 재기 어렵다는 논쟁이었다.\n\n그 사이 딸이 최근 해외축구에 빠졌는데 누구를 따라 보면 좋겠느냐는 글이 올라왔다. 음바페, 홀란, 야말, 케인, 벨링엄, 올리세, 하피냐 등 후보를 길게 적고, 유럽 큰 구단에서 뛰며 월드컵 토너먼트에서도 자주 볼 수 있는 선수를 찾았다. 답변은 잉글랜드의 두 스타, 케인과 벨링엄을 권하는 쪽이었다.\n\n스타가 없다는 글타래에 새로 축구를 좋아하게 된 사람이 등장한 셈이다. 누군가에게는 오래 보던 얼굴이 사라지는 시기이고, 누군가에게는 처음으로 응원할 얼굴을 고르는 시기였다.\n\n작은 글타래들에도 이런 시작의 기쁨은 있었다. 기타 이쓰키의 U-21 발탁에는 짧은 축하가 올라왔다. 다니카와 모모코 글타래에서는 영상을 본 팬들이 중앙을 세밀한 터치로 밀고 들어가는 움직임과 자연스럽게 나오는 왼발 패스를 반겼다. 해당 장면의 공식 도움 기록까지 이번 확인으로 확정한 것은 아니지만, 글쓴이들이 어디에서 즐거움을 느꼈는지는 구체적이었다. 복잡한 서열표 없이도 공을 옮기는 몇 번의 터치만으로 대화가 시작되는 자리였다.\n\n<details><summary>범위와 근거<\/summary>\n\n이번 실행 2026-11-07_153938의 제공 수집문만 팬 반응의 근거로 사용했다. 집계상 52개 글타래·새 글 920개이며 일부 글은 발췌 또는 생략돼 있다. \n\n익명 작성표시 569종은 실제 사람 수가 아니다. 같은 글타래의 반복 발언, 다른 게시판에서 가져온 인용, 템플릿이 포함돼 있으므로 글 수를 지지율이나 5ch 전체 여론으로 환산하지 않았다. 직접 인용한 팬 발언은 제공된 일본어의 의
